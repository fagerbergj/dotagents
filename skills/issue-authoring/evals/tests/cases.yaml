# Each case is a raw report in the voice of whoever filed it - a Slack one-liner,
# a forwarded ticket, a retro board, a paste. The task never names a tracker
# field, a section, or an authoring rule: turning the mess into something
# startable and finishable is what is graded. `report` is the only input the
# graders treat as fact.
#
# `rubric` is the case's own property, graded on its own axis by the
# case_fidelity assertion in promptfooconfig.yaml. Every rubric closes with the
# same paragraph: it holds the judge off headings and template shape, and subtracts
# a fixed amount per specific the reply supplied that the report never did.

- description: GitHub - vague bug complaint with no reproduction
  vars:
    tracker: GitHub Issues
    source: Dropped in the support channel just now.
    report: |
      export button does nothing again no spinner no error nothing happened twice today steph got it yesterday too cant get it to do it on demand chrome
    rubric: |
      Quote the text stating what the export button does now, and the text stating
      what it should do instead. Answer NONE for either if absent. Then quote the text
      stating that nobody can trigger the failure on demand; answer NONE if the reply
      instead presents an ordered reproduction recipe as though the failure were
      reliably triggerable. Full credit requires all three: a current-versus-expected
      gap in observable terms, the unreliable reproduction carried forward as a fact
      about what is known, and at least one completion condition a person could settle
      by watching the system rather than by forming an opinion. Subtract 0.3 if the
      reply supplies a cause, a trigger, or a repro sequence the report does not
      contain. The reporter's own words being reused verbatim is a point in the
      reply's favour, not against it.

      Judge only what the text says, never which headings, sections, labels, or template it
      uses; an issue with no headings at all can score full marks.

      Before scoring, list each identifier, version, path, error code, date, duration, user
      count or named system in the reply and check it against the raw report above character
      by character, including inside unpunctuated lowercase runs. A token that appears
      anywhere in the report is not an invention. A number the reply proposes as a
      completion condition or acceptance threshold is not an invention either - it is a
      target being set, not a fact being claimed. Count only factual claims about the
      existing system that the report does not contain; call that count I.

      Score from 0 to 1, never above 1: score the case requirements above, then subtract
      0.25 for each of the I inventions, floored at 0. State I and the arithmetic.
  assert:
    # One report, one work item, unless the report genuinely held several.
    - &bounded
      type: javascript
      value: file://assertions/issue.cjs:oneBoundedIssue
      metric: bounded_scope
    # The properties the description claims, on the ten cases where a ticket is
    # the right answer. It used to live in defaultTest.assert and so also graded
    # the Jira negative control, where writing a plausible ticket is the failure.
    #
    # Three items, not four. The old item 2 restated `bounded_scope` above, which
    # already counts work items against a per-case window - a judge guessing at
    # the same property for a quarter of an unrelated score. The old item 3
    # carried a list of inventions and subtracted 0.25 for each, so a write-up
    # quoting all four properties could still report 0.00: recall and fabrication
    # in one number, cancelling. Token-level invention is `no_invented_facts`,
    # computed against the report itself; prose-shaped invention is scored by the
    # per-case `case_fidelity` rubric. Neither belongs in this number.
    - &semantic
      type: llm-rubric
      value: |
        The write-up below was produced from this raw report:
        "{{report}}"

        Judge the issue as delivered. Do not reward or penalise how it was
        built, which features it used, or whether it followed any particular
        authoring convention. Score from 0 to 1, never above 1.

        Answer each of the three below with a quote from the write-up, or NONE. Answer all
        three before scoring.

        1. Clear outcome: quote the sentence a reader could restate as what will be true when
           this is done, and quote the title. A title naming a category rather than an
           outcome, or a write-up that only restates the complaint, is NONE.
        2. Sufficient context: quote the facts an engineer who has never seen the report would
           need to start. Judge only whether those facts are present and enough to start on;
           whether the write-up also added anything the report did not contain is graded by
           other metrics and must not move this score in either direction.
        3. Testable completion: quote a completion condition someone could settle by observing
           the system - an event, a count, a state, a message. A condition needing someone's
           opinion to settle ("satisfied", "improved", "works properly") is NONE. A condition
           naming an observable result counts even when it contains ordinary words like "no
           errors across 20 consecutive runs".

        Score from 0 to 1, never above 1: award one third for each of the three you answered
        with a quote, and nothing for each NONE. State the arithmetic.
      threshold: 0.7
      metric: semantic_quality

