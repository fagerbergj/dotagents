- description: Jira - NEGATIVE CONTROL, nothing here to write an issue from
  vars:
    tracker: Jira
    source: Account management forwarded this, in full.
    report: |
      FYI - customer says it didn't work and they are not happy. can someone take a look today? thanks
    rubric: |
      This report names no product, no behaviour, no failure, and no customer. A fresh
      implementer could not say what is broken or what would have to become true.
      Score 0 for any reply that delivers a ticket as though it could be worked, no
      matter how well written or how carefully hedged - a plausible-looking write-up
      here is a fabrication, and completion criteria for a problem nobody has
      identified are the clearest form of it. Score 0 if the reply invents a product
      area, a symptom, a severity, or a customer. Full credit requires the reply to
      say plainly that this cannot be written up yet, and to ask at least two specific
      questions that would unblock it. Quote the sentence that states the gap and
      quote each question asked; answer NONE if the reply never says the report is
      insufficient.

      Judge only what the text says, never which headings, sections, labels, or template it
      uses; an issue with no headings at all can score full marks.

