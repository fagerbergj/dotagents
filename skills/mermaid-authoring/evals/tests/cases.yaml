      I want that rendered for the exec deck.
    rubric: |
      Per NN/g journey mapping (nngroup.com/articles/journey-mapping-101): one actor in one scenario, actions grouped into named journey phases, every action carrying a value on one shared emotion scale, and the ups and downs reading as a trend rather than isolated numbers.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
