- description: venn-beta - overlapping user cohorts
  vars:
    task: |
      we keep arguing about whether our mobile users and our paying users are the same people. they're mostly not. three groups: people who use the mobile app, people who pay for a subscription, people who've invited a teammate. plenty sit in two of those, and there's a small core in all three - that core is the group i actually want everyone staring at.
    rubric: |
      Per Venn's construction (Venn, Philosophical Magazine, 1880): three sets drawn so all seven regions exist - three exclusive, three pairwise, one central - with the central region present and distinguishable whether or not it is labelled.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [venn-beta, venn] }
      metric: diagram_choice

- description: cynefin-beta - sorting incidents by decision domain
  vars:
    task: |
      Something for the incident-response training deck. Four incidents from last year, sorted by what each one actually took to get through, with the groupings named on the picture so people can argue about which one a new incident belongs in. The log volume filled a disk - we've done that one fifty times, the runbook is three lines. A checkout query went slow and Priya spent a day reading query plans before she found the missing index. The queue backed up and took three unrelated services with it, in a way nobody had seen or predicted, and we tried six things before one of them helped. And the Thursday outage during the breach, where we were pulling things offline by the minute and only reconstructed what happened the following week.
    rubric: |
      Per Snowden and Boone, "A Leader's Framework for Decision Making" (HBR, Nov 2007), whose four contexts are Simple, Complicated, Complex and Chaotic: the domains are named on the picture, and each incident sits in the domain matching how it was resolved - a three-line runbook belongs in the simple domain of best practice, a day of expert analysis in Complicated, six experiments against an unforeseen interaction in Complex, acting first during an unfolding breach in Chaotic. Which label that first domain carries is not graded; the renderer chooses it.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [cynefin-beta, cynefin, quadrantChart] }
      metric: diagram_choice

- description: ishikawa-beta - root causes of failed deploys
  vars:
    task: |
      Postmortem Friday on the deploys that keep failing. Before we sit down I'd like the candidate causes laid out feeding into that one problem, grouped by the kind of cause they are. What I've got so far: the release checklist lives in someone's head, two people have ever run a rollback, the build agents drift from each other, secrets get rotated without warning, nobody reads the pipeline output until it's red, and the staging cluster is a third the size of prod. Guesses are fine at this stage; the point is to walk in with something to argue with rather than a blank whiteboard.
    rubric: |
      Per Ishikawa's cause-and-effect method (Ishikawa, "Guide to Quality Control", Asian Productivity Organization, 1976): one stated effect at the head, causes grouped under named categories, and each specific cause still readable as the concrete thing reported rather than collapsed into its category name.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [ishikawa-beta, ishikawa, mindmap, flowchart, graph] }
      metric: diagram_choice

- description: eventmodeling - order fulfilment event flow
  vars:
    task: |
      New joiners keep asking how order fulfilment hangs together on the event-sourced side, so I'd like it drawn once and linked from the handbook. A customer's place-order action writes down an order-placed fact, and that fact updates the order-summary view the customer then reads. Later a warehouse pick action writes an items-picked fact, which updates the shipping view.
    rubric: |
      Per Event Modeling (Dymitruk, eventmodeling.org): a command, the event it records, and the read model it updates are three visually distinct kinds of thing; every event reads as a past-tense fact; and the picture runs along one time axis in the order the steps happen.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [eventmodeling, sequenceDiagram, flowchart, graph] }
      metric: diagram_choice

- description: swimlane-beta - cross-team expense approval
  vars:
    task: |
      Finance is fed up with expense claims bouncing around and nobody knowing whose desk a claim is sitting on. Can you document it so ownership is unmistakable? The employee submits the claim. Their manager either approves it or rejects it straight back. Approved, it goes to finance, who check the receipts and then either pay it or send it back to the employee to correct and resubmit. Three groups involved, and it's the handovers between them that people lose track of.
    rubric: |
      Per BPMN 2.0 (OMG formal/2011-01-03) pools and lanes: every activity sits inside exactly one lane named for its owner, each handover is visible as a flow crossing a lane boundary, and both rejection flows are drawn and labelled with the condition that takes them.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [swimlane-beta, swimlane, flowchart, graph] }
      metric: diagram_choice

- description: railroad-ebnf-beta - CLI grammar
  vars:
    task: |
      The manual page for our deploy command needs a picture of what it'll actually accept. It's the literal word deploy, then an environment name which you have to give, then zero or more flags where each flag is either --dry-run or --force, and optionally a target path at the end. A reader should see straight away what's mandatory, what can repeat, and what they're free to leave off.
    rubric: |
      Per Wirth's syntax-diagram convention (introduced in "The Programming Language Pascal", Berichte der Fachgruppe Computer-Wissenschaften Nr. 1, ETH Zürich, November 1970, and popularised by Jensen and Wirth, "PASCAL User Manual and Report", LNCS vol. 18, 1974): the mandatory sequence reads left to right along the main path, the optional target is a bypass around it, and the flag group is drawn as a loop so a reader sees it may repeat and may be omitted.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [railroad-ebnf-beta, railroad, flowchart, graph] }
      metric: diagram_choice

- description: zenuml - nested service call interaction
  vars:
    task: |
      trying to explain to the new team why a profile fetch touches four services. client hits the gateway, gateway asks the auth service to validate the token, and only if that comes back valid does it call the profile service. profile service checks its cache first and goes to the database on a miss, then everything returns back up the chain. the nesting is what i want visible - which call is inside which, and where each one returns.
    rubric: |
      Per UML 2.5.1 §17.5 (Occurrences, including ExecutionSpecification) and §17.6 (Fragments): each nested call is visibly inside the call that made it and its return is visible at the level it was made from; the database call sits under a condition a reader can identify as the cache miss.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [zenuml, sequenceDiagram] }
      metric: diagram_choice

# Version tolerance. The skill's description claims diagrams that "actually
# render on the target platform"; every case above renders on a current mermaid,
# so nothing tests it. Each of these two names an older or pinned target where
# the type a current renderer would make obvious is exactly the wrong pick, and
# `allowed` holds only what the stated version can draw.

