  vars:
    task: |
      Prep for Friday's postmortem on our flaky CI. This lives in a markdown file I'll be reading in my IDE's own preview pane, which is stuck on some mermaid 10 build - anything newer than that just shows up blank for me, so it has to be something that old will draw. Suspects so far: the shared runner box runs out of memory, plenty of tests assume they're alone on the machine, nobody owns the pipeline, the retry button quietly hides failures, and the staging database drifts from prod. Lay them out feeding into that one problem, grouped by the kind of cause they are.
