    rubric: |
      Every column holds its items with owners where stated, and it reads as current state rather than a process.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [flowchart, graph] }
      metric: diagram_choice

