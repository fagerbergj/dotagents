- description: sankey - signup funnel volumes
  vars:
    task: |
      funnel numbers for the growth review and i want the drop-off to look as bad as it is. 10,000 visitors a month. 3,000 start a signup, 7,000 just leave. of the 3,000 who start, 2,100 verify their email and 900 give up. of those 2,100, 1,400 finish onboarding and 700 stall out. i want the drop-off to be the thing you see first, not something you work out from the labels.
    rubric: |
      Per Sankey's flow convention (1898), band width is proportional to volume: the largest single loss is the widest band leaving its stage, so a reader sees where people are lost before reading a number.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [sankey, sankey-beta] }
      metric: diagram_choice

- description: requirementDiagram - auth requirements and verification
  vars:
    task: |
      The auditors are asking us to show our auth controls with traceability, so this needs to be precise rather than pretty. Two controls. Sessions must expire after 30 minutes - high risk, and we demonstrate it with an automated test. Credentials must be stored hashed - that one's a physical control and it gets verified by inspection. Each needs its id and both of those attributes visible on its face. Then show which components actually satisfy each one (the session service and the user store), and that the hashing control is derived from our password policy.
    rubric: |
      Per OMG SysML 1.6, where «requirement» carries id and text (§16.3.2.1) and risk and verifyMethod come from the informative «extendedRequirement» (Annex E, §E.3.2, Table E-3): each requirement shows its id, risk, and verification method on its own face; satisfy runs from the implementing element to the requirement; derive runs between the derived requirement and its parent.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [requirementDiagram] }
      metric: diagram_choice

- description: C4Context - system context for a review
  vars:
    task: |
      Design review Monday and I want to open with the widest possible picture of the internet banking platform - no internals at all, just what it sits between. The personal banking customer uses it. It reads account data out of the existing mainframe. It sends notifications through a third-party email provider. What matters most is that it's immediately obvious which of those boxes are ours and which ones we only talk to.
    rubric: |
      Per the C4 model's System Context level (c4model.com/diagrams/system-context): scope is exactly one software system with no internals shown, the person and both external systems appear around it, our system is visually distinguished from the ones we only talk to, and every relationship says what flows and why.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [C4Context, flowchart, graph] }
      metric: diagram_choice

- description: architecture-beta - grouped cloud deployment
  vars:
    task: |
      can you draw up our aws setup for the onboarding doc? public subnet has the load balancer and a couple of web boxes, then the app server and rds are locked away in the private one. s3 sits outside all of it. mainly want it obvious which stuff is in which subnet, and draw the hops too - lb to web, web to app, app to rds and to s3.
    rubric: |
      Each subnet is an enclosure holding exactly its stated members, object storage sits outside both, and all four hops are directed links between the right pairs.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [architecture-beta, flowchart, graph] }
      metric: diagram_choice

- description: block - dashboard layout arrangement
  vars:
    task: |
      Trying to describe the admin dashboard layout to you without opening Figma. Header runs the full width across the top. Under it, a narrow sidebar on the left; the rest is the main area, and that's split into a wide reporting panel plus a narrower stats panel beside it. Footer at the bottom, full width again. This is purely about where things sit and how wide they are relative to each other - nothing here is a process.
    rubric: |
      Header and footer each span full width; the sidebar is visibly narrower than the main area beside it; the reporting panel visibly wider than the stats panel; and nothing implies one region follows another.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [block, block-beta] }
      metric: diagram_choice

- description: packet - protocol header field layout
  vars:
    task: |
      For the protocol spec. Our message header is 32 bits wide. Version is bits 0-3, message type 4-7, flags 8-15, and payload length takes the rest, 16-31. Implementers need to see at a glance which bits belong to which field and how wide each field is next to the others.
    rubric: |
      Per the IETF packet-header convention (e.g. RFC 791 §3.1): the row is 32 bits wide and each field's drawn width is proportional to its bit count, so a reader sees payload length occupying half the header.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [packet, packet-beta] }
      metric: diagram_choice

