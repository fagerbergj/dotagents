# One case per diagram type in the skill's references/. The task never names a
# diagram type or a Mermaid keyword: choosing the form is part of what is graded.
# `allowed` lists every type a competent author could defend for that scenario.

- description: sequenceDiagram - streaming chat exchange
  vars:
    task: |
      need something for the design doc showing how one chat turn actually moves through our stack. user types a message, browser POSTs it to the api, api kicks off a worker job. the browser also opens a separate streaming connection - that's the bit people keep getting confused about. then the worker's tokens come back out through the api and keep landing in the browser until the reply is finished.
    rubric: |
      Per UML 2.5.1 (OMG formal/2017-12-05) §17.1 (basic trace model, partial ordering of occurrences) and §17.3 (Lifelines), an interaction reads as messages between lifelines in time order: the submission and the streaming channel are two arrows a reader can tell apart without being told which is which, and the token messages read as repeating or continuing rather than a single message.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [sequenceDiagram, zenuml] }
      metric: diagram_choice

- description: flowchart - release publishing decisions
  vars:
    task: |
      People keep asking what actually happens when they run the publish job, so I'd like a picture for the release runbook. The first thing it does is check the version - malformed version, it errors out and nothing else runs. Otherwise it runs the test suite, and a failure there also stops with an error. Only once both checks are clean does it push the package and cut the release tag.
    rubric: |
      Per ISO 5807:1985 (confirmed 2019): both decisions are drawn in the decision symbol, every branch leaving a decision carries the condition that takes it, both failure paths reach a terminal symbol, and publish and tag are reachable only through both pass branches.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [flowchart, graph] }
      metric: diagram_choice

# The exclusion between this case and the release-publishing flowchart above is
# deliberate: state-vs-process is the judgment under test. Cross-listing the two
# would make either answer right for both, leaving only syntax measured.
- description: stateDiagram - order lifecycle
  vars:
    task: |
      Support keeps escalating orders they think are stuck, and half the time they aren't. Can I get something showing the statuses an order can be in and what moves it between them? Orders start as draft; submitting puts them in pending payment. Charge goes through, they're paid - declined and they drop back to draft. Paid ones ship, then get delivered. Oh, and anything paid or still pending can be cancelled, and that's the end of the line, nothing comes back from there.
    rubric: |
      Per UML 2.5.1 §14: every transition is labelled with the trigger that fires it, an initial pseudostate marks where an order begins, and cancelled is a final state with no outgoing transition.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [stateDiagram-v2, stateDiagram] }
      metric: diagram_choice

- description: erDiagram - store schema and cardinality
  vars:
    task: |
      new backend hire starts monday and i'd like to hand her something better than the migrations folder. storefront data is basically: customers place orders, an order has a bunch of line items, each line item points at exactly one product, and every product sits in one category. include the important columns for each - ids, names, prices, that sort of thing.
    rubric: |
      Per Chen's entity-relationship model (Chen, ACM TODS 1(1), 1976), which marks multiplicity as 1/M/N on the connecting line, and the fork notation Everest introduced as the "inverted arrow" (Everest, Fifth Texas Conference on Computing Systems, 1976), later known as the crow's foot: every relationship line carries a maximum cardinality at both ends so a reader can state which side is "many", each entity lists at least its identifying attribute, and the line-item-to-product end reads as exactly one product.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [erDiagram, classDiagram] }
      metric: diagram_choice

- description: classDiagram - payment processor object model
  vars:
    task: |
      I'm writing up the payment library's internals for the wiki and want the shape of the code drawn out. There's an abstract PaymentMethod carrying an amount and a charge operation; CreditCard and BankTransfer both extend it and each add fields of their own (card number and expiry, account and routing numbers). PaymentProcessor owns a collection of payment methods and exposes process(). Put types and visibility on the members - the audience is engineers, they'll want them.
    rubric: |
      Per UML 2.5.1: generalisation from the abstract type to both subtypes reads as "is a" (§9.2.4, §9.9.7); the processor-to-methods relationship reads as ownership rather than a plain association (§11.5.4); and every member carries a visibility marker and a type (§9.5.4, with VisibilityKind at §7.8.24).
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [classDiagram] }
      metric: diagram_choice

- description: gantt - documentation release schedule
  vars:
    task: |
      docs release plan for the team channel please. drafting is 2026-08-03 through 2026-08-05, tech review eats the two days straight after that, corrections take one more day, and we publish on 2026-08-10. publishing isn't work though, it's just the day it goes live.
    rubric: |
      Per PMI's milestone list, where a milestone is a point in the schedule with zero duration (PMBOK Guide, 6th ed., 2017, §6.2.3.3), publication is drawn as a point on 2026-08-10 and not as a bar occupying working time; the three tasks occupy their stated spans in the stated order.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [gantt] }
      metric: diagram_choice

- description: timeline - project history by year
  vars:
    task: |
      For the README I'd like a short visual history of the project. It started in 2019, shipped its first stable release in 2021, and 2023 brought both the corporate sponsorship and the plugin system. This year, 2026, we finished the rewrite and hit 1.0. None of it depends on anything else and none of it has a duration - a reader should just glance and see what happened when.
    rubric: |
      Each year carries its events in chronological order, 2023 shows both at the same point, and nothing implies duration or dependency.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [timeline, gantt] }
      metric: diagram_choice

