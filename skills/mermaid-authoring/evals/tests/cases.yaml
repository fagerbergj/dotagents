- description: radar-beta - one candidate across skill dimensions
  vars:
    task: |
      Hiring debrief for a candidate. I'd rather the panel saw the profile at a glance than read another list of numbers, so: five assessment areas, all scored out of ten - coding 9, systems design 8, testing 7, communication 6, operations 5. Same scale on every area, and draw it as one closed shape so the strong and weak sides jump out. It's going in a GitHub issue, so anything current mermaid draws is fine.
    rubric: |
      All five areas are drawn against one shared scale with the same maximum, so the visual distance between coding and operations is proportional to the four-point gap, and the profile reads as one closed shape.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
