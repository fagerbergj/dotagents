    rubric: |
      Branch points, per-branch commits and each merge back into its parent are visible in order, and the tag sits on the commit that merged develop into main.
  assert:
    - type: javascript
      value: file://assertions/mermaid.cjs:usesDiagramType
      config: { allowed: [gitGraph, gitgraph] }
      metric: diagram_choice

- description: journey - checkout experience and satisfaction
