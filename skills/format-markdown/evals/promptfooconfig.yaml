# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Format Markdown skill effectiveness

# Two arms over the same tasks. Arm labels come from the skill's frontmatter
# version, so bumping metadata.version in SKILL.md relabels the comparison.
prompts:
  - id: file://prompts/arms.js:noSkill
    label: no-skill
  - id: file://prompts/arms.js:skillCurrent
    label: skill-current

providers:
  - id: openai:chat:deepseek/deepseek-v4-flash
    config:
      apiBaseUrl: https://openrouter.ai/api/v1
      max_tokens: 8192
      max_completion_tokens: 8192
      passthrough:
        reasoning:
          enabled: false
      apiKeyEnvar: OPENROUTER_API_KEY
      showThinking: false
      omitDefaults: true

defaultTest:
  options:
    # The llm-swap gateway returns reasoning as message content; strip it so the
    # graders see the document, not the leak. It removes the reasoning tells in
    # lib/strip-reasoning.js and unwraps a ```markdown fence around the whole
    # answer - nothing else. A "Here's a cleaned-up version:" preamble is NOT
    # removed and reaches the graders: harmless to `preserved`, which only fines
    # content that went MISSING, but it is an extra rendered block and
    # unchanged_when_clean counts additions against the ratio.
    transform: file://../../../evals/lib/strip-reasoning.js:stripAndUnwrap
    provider:
      id: openai:chat:deepseek/deepseek-v4-flash
      config:
        # Tested in isolation against llm-rubric and innocent of the extraction
        # failures it was once blamed for. It keeps the judge on one line, which
        # costs nothing and rules out one failure mode.
        response_format:
          type: json_object
        apiBaseUrl: https://openrouter.ai/api/v1
        max_tokens: 8192
        max_completion_tokens: 8192
        passthrough:
          reasoning:
            enabled: false
        apiKeyEnvar: OPENROUTER_API_KEY
        showThinking: false
        omitDefaults: true
  assert:
    # Format is this skill's subject, which looks like it collides with "never
    # assert on format". The line: does the property change the RENDERED
    # document, or only the source bytes? Everything asserted here is decided by
    # rendering the input and the output through markdown-it and comparing.
    # Bullet character, emphasis delimiter, `#` counts that render to the same
    # tag, blank lines, hard wrapping and fenced-code info strings are invisible
    # after rendering, and none of them are graded.

    # 1. "Preserves all content and links exactly." Link text paired with its
    #    target in order, code bodies byte-identical, rendered text contained,
    #    and every <details> still rendering what it holds.
    - type: javascript
      value: file://assertions/format.cjs:preserved
      metric: preserved

    # 2. "heading hierarchy" - levels descend one at a time. markdownlint MD001;
    #    not an accessibility rule.
    - type: javascript
      value: file://assertions/format.cjs:noHeadingSkips
      metric: heading_hierarchy

    # 3. readability lives in tests/cases.yaml, on the nine cases that hand over
    #    a messy document, not here. Its items pay for shortening prose runs and
    #    for moving prose into headings and lists - which is precisely what the
    #    three "already clean" controls are right NOT to do, and what
    #    unchanged_when_clean fines them for doing. Graded over all twelve it
    #    docked the skill arm 0.40 on the fenced-commands control for leaving a
    #    prose run it should have left alone, in the same row where
    #    unchanged_when_clean scored the identical behaviour 1.00. The items
    #    carry N/A escape hatches and the judge did not reliably reach for them,
    #    so the fix is scope, not wording: readability and unchanged_when_clean
    #    now partition the suite instead of grading the same behaviour with
    #    opposite signs.

tests:
  - file://tests/*.yaml
