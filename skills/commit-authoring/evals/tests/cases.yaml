- description: 'MIXED - a bidi sanitising gap beside an unrelated git regression test'
  vars:
    context: 'two unrelated things here. the sanitiser was passing three bidi controls straight through - U+200E, U+200F and U+061C - so 0xD8 joins the trigger table, sanitize_at gains an arm for the two-byte ALM sequence, and the e2 range widens to 0x8F; the tests cover the whole 12-codepoint Bidi_Control set and pin that ordinary Arabic sharing that lead byte still comes through untouched. the other one is a test in diff.rs pinning that get_git_diff returns None rather than panicking when core.repositoryformatversion is garbage.'
    ask: 'What should I do about committing this?'
    diff: |
      diff --git a/src/preprocessor.rs b/src/preprocessor.rs
      index 971ae3d4..a9b8e712 100644
      --- a/src/preprocessor.rs
      +++ b/src/preprocessor.rs
      @@ -168,7 +168,7 @@ pub fn sanitize(line: &str) -> String {
       #[inline]
       fn is_sanitize_trigger(b: u8) -> bool {
           // C0 controls minus \t \n \f; DEL; UTF-8 leads with dangerous codepoints.
      -    matches!(b, 0x00..=0x08 | 0x0B | 0x0D..=0x1F | 0x7F | 0xC2 | 0xE2 | 0xEF)
      +    matches!(b, 0x00..=0x08 | 0x0B | 0x0D..=0x1F | 0x7F | 0xC2 | 0xD8 | 0xE2 | 0xEF)
       }
       
       /// Substitutes the byte/sequence at `bytes[i]` (or passes it through on
      @@ -200,8 +200,14 @@ fn sanitize_at(
                   buffer.push('\u{FFFD}');
                   3
               }
      +        // 0xD8 0x9C = U+061C (Arabic letter mark, a bidi control). The rest of
      +        // the 0xD8 block is ordinary Arabic text.
      +        0xD8 if bytes.get(i + 1) == Some(&0x9C) => {
      +            buffer.push('\u{FFFD}');
      +            2
      +        }
               // False-alarm trigger: pass the full UTF-8 sequence through.
      -        lead @ (0xC2 | 0xE2 | 0xEF) => {
      +        lead @ (0xC2 | 0xD8 | 0xE2 | 0xEF) => {
                   let n = utf8_len_from_lead(lead);
                   buffer.push_str(&full[i..i + n]);
                   n
      @@ -217,10 +223,11 @@ fn sanitize_at(
       
       #[inline]
       fn is_dangerous_e2(bytes: &[u8], i: usize) -> bool {
      -    // U+200B..D (zero-width), U+202A..E (bidi controls), U+2066..9 (isolates).
      +    // U+200B..D (zero-width), U+200E..F (LRM/RLM), U+202A..E (bidi embedding
      +    // and override), U+2066..9 (bidi isolates).
           matches!(
               (bytes.get(i + 1), bytes.get(i + 2)),
      -        (Some(0x80), Some(0x8B..=0x8D | 0xAA..=0xAE)) | (Some(0x81), Some(0xA6..=0xA9))
      +        (Some(0x80), Some(0x8B..=0x8F | 0xAA..=0xAE)) | (Some(0x81), Some(0xA6..=0xA9))
           )
       }
       
      @@ -411,6 +418,34 @@ fn test_sanitize_substitutes_bidi_and_zero_width() {
           assert_eq!(sanitize("a\u{FEFF}b"), format!("a{r}b"));
       }
       
      +#[test]
      +fn test_sanitize_substitutes_every_bidi_control() {
      +    // Unicode Bidi_Control is exactly these 12 codepoints. Covering only some
      +    // of them leaves a reordering attack available through the rest.
      +    let r = '\u{FFFD}';
      +    for c in [
      +        '\u{061C}', '\u{200E}', '\u{200F}', '\u{202A}', '\u{202B}', '\u{202C}', '\u{202D}',
      +        '\u{202E}', '\u{2066}', '\u{2067}', '\u{2068}', '\u{2069}',
      +    ] {
      +        assert_eq!(
      +            sanitize(&format!("a{c}b")),
      +            format!("a{r}b"),
      +            "U+{:04X} was not substituted",
      +            c as u32
      +        );
      +    }
      +}
      +
      +#[test]
      +fn test_sanitize_preserves_arabic_sharing_the_alm_lead_byte() {
      +    // U+061C is reached via lead byte 0xD8, which also leads ordinary Arabic.
      +    assert_eq!(
      +        sanitize("\u{0600}\u{061F}\u{06FF}"),
      +        "\u{0600}\u{061F}\u{06FF}"
      +    );
      +    assert_eq!(sanitize("مرحبا بالعالم"), "مرحبا بالعالم");
      +}
      +
       #[test]
       fn test_sanitize_preserves_legitimate_bytes() {
           assert_eq!(sanitize("crlf\r\nline\r\n"), "crlf\r\nline\r\n");
      diff --git a/src/diff.rs b/src/diff.rs
      index 20dd6918..45678bb9 100644
      --- a/src/diff.rs
      +++ b/src/diff.rs
      @@ -178,4 +178,17 @@ mod tests {
               assert_eq!(changes.get(&1), Some(&LineChange::RemovedAbove));
               assert_eq!(changes.get(&2), Some(&LineChange::Added));
           }
      +
      +    #[test]
      +    fn faulty_git_version_does_not_panic() {
      +        let repo = setup_repo();
      +        let file = create_and_track_file(&repo, "file.txt");
      +        std::fs::write(&file, "line 1\nline 2 modified\n").expect("can write file");
      +        // changes are detected
      +        assert_eq!(get_git_diff(&file).expect("one change").len(), 2);
      +        // write invalid repositoryformatversion
      +        git(repo.path(), &["config", "core.repositoryformatversion", "one"]);
      +        // changes are no longer detected
      +        assert_eq!(get_git_diff(&file), None);
      +    }
       }
  assert:
    - *splits_mixed_change
- description: 'MIXED - a glob file-name fix beside unrelated install docs'
  vars:
    context: 'two things in the tree. globset''s file_name never matched what std::path::Path::file_name actually promises - a path ending in .. is supposed to give None, and a trailing . was being turned into the empty string, so a glob ending in a dot only ever matched nothing. it follows the standard library semantics now and there is a regression test for the issue that turned it up. the other thing is the README, where CentOS, RHEL and Rocky shared one install paragraph and now get a block each.'
    ask: 'What do I do with this?'
    diff: |
      diff --git a/crates/globset/src/pathutil.rs b/crates/globset/src/pathutil.rs
      index 8488e74f..861f61b8 100644
      --- a/crates/globset/src/pathutil.rs
      +++ b/crates/globset/src/pathutil.rs
      @@ -4,21 +4,25 @@ use bstr::{ByteSlice, ByteVec};
       
       /// The final component of the path, if it is a normal file.
       ///
      -/// If the path terminates in `.`, `..`, or consists solely of a root of
      -/// prefix, file_name will return None.
      +/// If the path terminates in `..`, or consists solely of a root of prefix,
      +/// file_name will return `None`.
       pub(crate) fn file_name<'a>(path: &Cow<'a, [u8]>) -> Option<Cow<'a, [u8]>> {
      -    if path.last_byte().map_or(true, |b| b == b'.') {
      +    if path.is_empty() {
               return None;
           }
           let last_slash = path.rfind_byte(b'/').map(|i| i + 1).unwrap_or(0);
      -    Some(match *path {
      +    let got = match *path {
               Cow::Borrowed(path) => Cow::Borrowed(&path[last_slash..]),
               Cow::Owned(ref path) => {
                   let mut path = path.clone();
                   path.drain_bytes(..last_slash);
                   Cow::Owned(path)
               }
      -    })
      +    };
      +    if got == &b".."[..] {
      +        return None;
      +    }
      +    Some(got)
       }
       
       /// Return a file extension given a path's file name.
      diff --git a/tests/regression.rs b/tests/regression.rs
      index 4fd3c0f8..ecc1205f 100644
      --- a/tests/regression.rs
      +++ b/tests/regression.rs
      @@ -1461,3 +1461,19 @@ rgtest!(r2944_incorrect_bytes_searched, |dir: Dir, mut cmd: TestCommand| {
           let got = cmd.args(&["--stats", "-m2", "foo", "."]).stdout();
           assert!(got.contains("10 bytes searched\n"));
       });
      +
      +// See: https://github.com/BurntSushi/ripgrep/issues/2990
      +#[cfg(unix)]
      +rgtest!(r2990_trip_over_trailing_dot, |dir: Dir, _cmd: TestCommand| {
      +    dir.create_dir("asdf");
      +    dir.create_dir("asdf.");
      +    dir.create("asdf/foo", "");
      +    dir.create("asdf./foo", "");
      +
      +    let got = dir.command().args(&["--files", "-g", "!asdf/"]).stdout();
      +    eqnice!("asdf./foo\n", got);
      +
      +    // This used to ignore the glob given and included `asdf./foo` in output.
      +    let got = dir.command().args(&["--files", "-g", "!asdf./"]).stdout();
      +    eqnice!("asdf/foo\n", got);
      +});
      diff --git a/README.md b/README.md
      index 3babb837..73868ac5 100644
      --- a/README.md
      +++ b/README.md
      @@ -302,15 +302,30 @@ and **openSUSE Leap** since 15.1.
       $ sudo zypper install ripgrep
       ```
       
