# One case per shape of change a commit has to describe. Every diff is a real
# commit from a working repository with its author's own message stripped out,
# so the model is authoring rather than copying. The developer's line of context
# never names a message format, a mood, or a rule.
#
# The ten MIXED cases carry two unrelated changes in one tree. The claimed right
# answer there is to say so, not to write one message that covers both, so each
# carries its own `ask` that leaves the number of commits undecided; the default
# ask says "the commit message", singular, which would foreclose the very choice
# being graded. A mixed case is built by concatenating two real commits' diffs
# from the same repository; no pair shares a file.
#
# The ten breaking cases are diffs whose breaking nature is a fact about the
# code, not a judgement: a deleted config field, a renamed or removed CLI flag,
# a name deleted from a published namespace or builder, and a loader that now
# rejects what it used to accept.
#
# PROVENANCE. Ten projects, five languages, and no project supplies more than a
# third of the suite. That spread is the point. Two revisions ago the suite was
# turnstone plus one immich-go case, which measures how well the model fits one
# codebase's idiom rather than whether the skill works.
#
#   turnstone 9   caddy 3   rclone 3   bat 2   ripgrep 2   cli/cli 2
#   click 2   jinja 2   immich-go 1   flask 1
#
# `fagerbergj/quack` was removed outright in the previous revision and must not
# come back: quack is an AI code-review bot that runs these very skills, so its
# commits and code may have been authored with the skill under test, and a diff
# from it risks the model describing its own idiom back to the grader.
#
# THE SEVENTEEN NEW CASES, in file order. Every one is trimmed to the paths
# named here; where a commit touches more, the rest is in the commit but not
# shown.
#
# SHAPES
#   - caddy 3b3d6787 Revert "caddyhttp: Use sync.Pool to reduce lengthReader
#     allocations (#5848)". Revert shape: the pool, `getLengthReader` and
#     `putLengthReader` are deleted and the plain per-request allocation comes
#     back. The why is not in the diff - PR #5924 records a nil dereference in
#     `lengthReader.Close` from x/net's http2 `cleanupWriteRequest`.
#   - rclone dfc2c98b "fs: refactor log statements to use common helper".
#     Pure-refactor shape: four wrappers drop a hand-rolled level check in
#     favour of `LogLevelPrintf`, which already performs it. Nothing behaves
#     differently.
#   - flask 5bba529d "document passthrough_errors". Docs-only shape: one hunk
#     of docs/debugging.rst, no code.
#   - bat d48bf240 "build(deps): bump shell-words from 1.1.0 to 1.1.1".
#     Dependency-bump shape: a Cargo.toml constraint and the matching lock
#     entry, no source touched.
#
# BREAKING
#   - caddy f5db41ce "encode: Drop `prefer` from Caddyfile (#4156)". Qualifies:
#     the `case "prefer":` arm is deleted from `Encode.UnmarshalCaddyfile` and
#     the grammar line goes with it, so a Caddyfile containing `prefer` stops
#     adapting. Trimmed to caddyfile.go; the adapt fixture is in the commit but
#     not shown.
#   - rclone bd61eb89 "serve http/webdav/restic/rc: rename --prefix flag to
#     --baseurl". Qualifies: the pflag registration changes from
#     `prefix+"prefix"` to `prefix+"baseurl"` and the exported
#     `httplib.Options.Prefix` field is renamed, so both the flag and the field
#     are gone under their old names. Trimmed to httplib.go and httpflags.go;
#     three one-line call-site updates are not shown.
#   - ripgrep 9d8016d1 "printer: finish removal of `max_matches`". Qualifies:
#     `SummaryBuilder::max_matches` and `Config::max_matches` are deleted from
#     the published grep-printer crate. Trimmed to summary.rs.
#   - cli/cli 371f1288 "remove idle timeout flag". Qualifies: the cobra
#     registration for `--idle-timeout` is deleted from `gh codespace edit`,
#     with no replacement flag. The flag shipped in v2.6.0 and was gone by
#     v2.8.0.
#   - click 51736b95 "remove deprecated Command autocompletion parameter".
#     Qualifies: the `autocompletion` keyword argument is deleted from
#     `Parameter.__init__` along with the shim that translated it, so a caller
#     passing it now gets a TypeError. Trimmed to core.py and its test; CHANGES
#     is excluded so the fixture does not hand over a written changelog entry.
#   - jinja 824b4d3e "remove deprecated Markup and escape aliases". Qualifies:
#     both names leave `jinja2/__init__.py` and both definitions are deleted,
#     so `from jinja2 import Markup` raises ImportError. Trimmed to
#     __init__.py and utils.py; CHANGES excluded for the same reason.
#
# MIXED - each is two unrelated commits' diffs laid into one tree.
#   - caddy db9d1673 "Added a null check to avoid segfault on rewrite query
#     ops" + 88d65967 "chore: Fix broken links in README.md".
#   - rclone e11e679e "serve sftp: fix loading of authorized keys file with
#     comment on last line" + ab58ae5b "docs: add docker volume plugin
#     troubleshooting steps".
#   - click 6f85d26d "Do not trigger a BytesWarning under python -bb" +
#     44531036 "Use click.echo everywhere in the docs, document exception".
#   - jinja 997f7f52 "Replacing os.path.sep with os.sep in loader" + ae68c961
#     "document SandboxedNativeEnvironment pattern".
#   - bat c2cc79da "Fix --sanitize passing through the bidi control characters
#     U+200E, U+200F and U+061C" + 98f09fd6 "Add test with fauly git repo
#     version".
#   - ripgrep 4df12981 "globset: fix bug where trailing `.` in file name was
#     incorrectly handled" (trimmed to pathutil.rs and the regression test, so
#     the CHANGELOG entry is not shown) + 9802945e "doc: update the CentOS,
#     RHEL and Rocky Linux installation instructions".
#   - cli/cli 51942569 "fix(issue list): reject pull request-only search
#     qualifiers" + f28eaa7c "Alphabetize Ubuntu section".
#
# THE TEN CASES KEPT, unchanged. turnstone: the one-line trace-correlation fix,
# the skill risk gate with its tests, the both-vocabulary title-peel test, the
# spawn-quota config removal (which defines `&marks_breaking`), the audio-sniff
# beside card-collapse mix (which defines `&splits_mixed_change`), the renamed
# `ws_id` return field, the newly-required `base_url`, the frontend formatter
# run beside the fence fix, and the deadline race beside the ARIA fix.
# immich-go: the renamed `--on-server-errors` flag. Both anchor-defining cases
# stay ahead of every alias, which is why the file order groups them together
# in the middle rather than by sub-population throughout.
#
# AI-AUTHORSHIP SCREEN. Two passes, and the second is per line rather than per
# commit. First, the candidate commit's own message, author and committer.
# Second, `git blame` over every post-image line the shown hunks cover at the
# commit AND every pre-image line at its parent, so context and removed lines
# are screened, not just added ones; every commit that turns up is put through
# the first check.
#
# The message check alone is not enough, and this is the pass that proved it.
# `copilot-swe-agent[bot]` authors commits whose own `Co-authored-by:` trailer
# names a human, so `co-authored-by:\s*(copilot|claude)` does not fire on them -
# bat 87e043b9 and 2a29802d were both shortlisted and both caught only by
# checking the author and committer idents for `copilot`, `claude` or
# `anthropic`. bat's true contaminated count is 11, not the 9 a trailer-only
# screen reports. Contamination at the time of writing: cli/cli 739, caddy 33,
# rclone 18, bat 11, ripgrep/click/jinja/flask 0.
#
# REJECTED, so a later pass does not re-derive them:
#   - rclone be3bfe2d "refactor: use slices.Contains to simplify code". Clean
#     message, rejected per line: the huaweidrive hunks blame to 18899a58,
#     which carries an AI co-author trailer.
#   - cli/cli 27aabfa8 and c1f3c1a1, both discussion-command fixes: their lines
#     blame to 57008e79 and 8b73951c, which are Copilot co-authored. The whole
#     `pkg/cmd/discussion/**` tree is unusable for the same reason - its
#     founding commits carry the trailer, so every later touch fails per line.
#   - cli/cli 55928c97, which removes the `--replies` flag: Copilot trailer.
#     It would otherwise have been the stronger breaking pick.
#   - cli/cli 3fd309bd, 960017a4, 06eeea07 and 002aac35: real flag renames and
#     removals, but the flag was introduced and removed inside the same
#     release, so nothing downstream could have depended on it. Breaking has to
#     be true of something that shipped.
#   - rclone b6cfcb97 and acda43a7: the removed options are duplicate
#     registrations, so nothing user-visible breaks.
#   - ripgrep 9d62eb99 "BREAKING: regex: finally remove CRLF hack" (288
#     deletions across 4 files, and the break is behavioural rather than a
#     deleted identifier), c10f151e and 11a8f0ea (behavioural only).
#   - jinja c6caa4c5, which removes the deprecated template-function
#     decorators: correct shape, but the evidence is spread over four files.
#
# NUNJUCKS GATE. promptfoo renders every case var through nunjucks, so a diff
# containing `{{` or `{%` empties the case in both arms while the run still
# reports success; `lib/check-case-vars.py` fails the suite on it. Every shown
# diff was scanned for both markers. It is a property of the TRIMMED diff, so
# re-trimming a fixture to different paths means re-running the scan - jinja in
# particular has template syntax in the files next to the ones shown here.
#
# Sub-population counts after the rebalance, unchanged: marks_breaking 10,
# splits_mixed_change 10, and the seven commit shapes (one-line fix, feature,
# revert, refactor, docs-only, dependency bump, test-only) are each still
# covered once.
# NOT RE-MEASURED. Every stored baseline for this suite describes a case set
# that no longer exists: the deltas on record for marks_breaking (+0.42) and
# splits_mixed_change (+0.58) came from a four-case population, and
# `conventional_header` (+0.31 in commit-authoring@1.0.json, 90 rows) was
# measured over fifteen cases of which three were quack. Seventeen of the
# twenty-seven cases here are new since any of that. All of it needs
# re-measuring.
- description: 'one-line fix - a debug trace line gains the fields that correlate it to its event'
  vars:
    context: 'ok tiny one. two sessions blew up inside a second of each other last week and the only way to tell which stack trace belonged to which fatal event was the timestamps. the debug line carries ws and error_type now so it lines up with session.fatal.recorded. still no exception text in it, that is deliberate. what do i put on the commit?'
    diff: |
      diff --git a/turnstone/core/session.py b/turnstone/core/session.py
      index 784d3c1f..9a642aad 100644
      --- a/turnstone/core/session.py
      +++ b/turnstone/core/session.py
      @@ -5304,10 +5304,14 @@ class ChatSession:
               # Frames only — ``exc_info=True`` would render the raw exception
               # message, which can carry credentials verbatim (the sanitize floor
               # the lines above exist to hold); format_tb renders the stack
      -        # without the message.
      +        # without the message.  ws + error_type mirror the ERROR line so a
      +        # trace correlates to its session.fatal.recorded event under
      +        # concurrent sessions.
               if exc.__traceback__ is not None:
                   log.debug(
                       "session.fatal.recorded.trace",
      +                ws=self._ws_id,
      +                error_type=type(exc).__name__,
                       trace="".join(traceback.format_tb(exc.__traceback__)),
                   )
               try:
- description: 'new feature - a risk tier gates which skills the model may load for itself'
  vars:
    context: 'new gate plus the tests for it. a skill the scanner rates high or critical can only be turned on by the operator now - the model reaching for one through the tools path gets refused and told to ask for /skill. the /skill path is untouched, it goes straight to set_skill and never sees this check. need a commit message.'
    diff: |
      diff --git a/tests/test_skills_tool.py b/tests/test_skills_tool.py
      index 379de8a5..d34af614 100644
      --- a/tests/test_skills_tool.py
      +++ b/tests/test_skills_tool.py
      @@ -1444,3 +1444,56 @@ class TestSkillCatalogDisclosure:
               # human-facing path); the tool-facing path is the new
               # ``skills(action='find')`` flow.
               assert "/skill" in content
      +
      +
      +# ---------------------------------------------------------------------------
      +# Tests — model-initiated load risk gate (design §5.5 / Principle 7)
      +# ---------------------------------------------------------------------------
      +
      +
      +class TestSkillsLoadRiskGate:
      +    """A high/critical-risk skill is PRINCIPAL-load-only: the model cannot
      +    activate it through skills(action='load') — that path is denied outright,
      +    forcing an explicit operator /skill.  Lower-risk skills load as before.
      +    The scanner-computed risk_level is the gate signal (it already escalates
      +    for the auto_approve + allowed_tools authority the create path warns about),
      +    so no new schema is needed.  The principal path (set_skill via /skill or
      +    cli --skill) is not routed through _prepare_skills_load and is not gated."""
      +
      +    @staticmethod
      +    def _load_item(session, name: str, risk: str):
      +        row = {"name": name, "risk_level": risk, "enabled": True, "content": "x"}
      +        with patch("turnstone.core.session.get_storage") as gs:
      +            gs.return_value.get_prompt_template_by_name.return_value = row
      +            return session._prepare_skills("c1", {"action": "load", "name": name})
      +
      +    def test_high_risk_load_denied_for_model(self) -> None:
      +        item = self._load_item(_make_session(), "danger", "high")
      +        assert item.get("needs_approval") is False
      +        assert "/skill danger" in item["error"]
      +        assert "high" in item["error"]
      +
      +    def test_critical_risk_load_denied_for_model(self) -> None:
      +        item = self._load_item(_make_session(), "nuke", "critical")
      +        assert item.get("needs_approval") is False
      +        assert "critical" in item["error"]
      +
      +    def test_low_risk_load_allowed_for_model(self) -> None:
      +        item = self._load_item(_make_session(), "safe", "low")
      +        assert item.get("needs_approval") is True
      +        assert item["action"] == "load"
      +        assert item["name"] == "safe"
      +
      +    def test_no_risk_load_allowed_for_model(self) -> None:
      +        item = self._load_item(_make_session(), "plain", "")
      +        assert item.get("needs_approval") is True
      +
      +    def test_missing_skill_falls_through_to_exec_not_found(self) -> None:
      +        # Unknown name → the gate finds no row and passes through; the
      +        # not-found error is the exec path's job, so prep still asks for
      +        # approval rather than erroring on the gate.
      +        session = _make_session()
      +        with patch("turnstone.core.session.get_storage") as gs:
      +            gs.return_value.get_prompt_template_by_name.return_value = None
      +            item = session._prepare_skills("c1", {"action": "load", "name": "ghost"})
      +        assert item.get("needs_approval") is True
      diff --git a/turnstone/core/session.py b/turnstone/core/session.py
      index 53f948a6..54d4352f 100644
      --- a/turnstone/core/session.py
      +++ b/turnstone/core/session.py
      @@ -11632,6 +11632,26 @@ class ChatSession:
               name = self._coord_str_arg(args, "name").strip()
               if not name:
                   return self._coord_tool_error(call_id, "skills", "load: 'name' is required")
      +        # Risk gate (design §5.5 / HYPOTHESIS Principle 7): a high/critical-risk
      +        # skill is PRINCIPAL-load-only.  The model must not activate it through
      +        # the tools path — an injection-steerable lane that would widen
      +        # authority behind a rubber-stampable approval (the scanner escalates
      +        # risk precisely for the auto_approve + allowed_tools authority the
      +        # create path warns about).  The operator loads such a skill explicitly
      +        # with ``/skill``; that path (handle_command / cli --skill) calls
      +        # set_skill directly and bypasses this gate.  A narrowing check — it can
      +        # only DENY, never widen — so it is safe by construction.
      +        storage = get_storage()
      +        if storage is not None:
      +            row = storage.get_prompt_template_by_name(name)
      +            if row and row.get("risk_level") in ("high", "critical"):
      +                return self._coord_tool_error(
      +                    call_id,
      +                    "skills",
      +                    f"load: skill '{name}' has risk tier '{row['risk_level']}' and can "
      +                    f"only be activated by the operator. Ask the user to run "
      +                    f"/skill {name} if they want it — the model cannot load it.",
      +                )
               # SKILL.md spec ``$ARGUMENTS`` payload — optional.  Mirror
               # the spec's free-form string shape (``/skill-name a b "c d"``)
               # rather than a list, so the model can pass quoted positional
