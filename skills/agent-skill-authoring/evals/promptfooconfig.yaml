# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Agent skill authoring skill effectiveness

# Two arms over the same tasks. Arm labels come from the skill's frontmatter
# version, so bumping metadata.version in SKILL.md relabels the comparison.
prompts:
  - id: file://prompts/arms.js:noSkill
    label: no-skill
  - id: file://prompts/arms.js:skillCurrent
    label: skill-current

providers:
  # Custom provider, not `openai:chat:*`: same OpenAI-compatible call, plus a
  # `load_resource` tool over the skill's own directory so the skill arm can
  # follow SKILL.md's instructions to read references/spec-requirements.md and
  # assets/skill-template.md. The tool exists only when the prompt supplies
  # `skillDir` (see prompts/arms.js), so the baseline arm sends no `tools` key
  # and is called exactly as before.
  - id: file://../../../evals/lib/skill-tools.js
    label: deepseek-v4-flash+resources
    config:
      model: deepseek/deepseek-v4-flash
      apiBaseUrl: https://openrouter.ai/api/v1
      max_tokens: 8192
      passthrough:
        reasoning:
          enabled: false
      apiKeyEnvar: OPENROUTER_API_KEY
      # Two files, 8.2 KB together (references/spec-requirements.md 4.2 KB,
      # assets/skill-template.md 4.0 KB) - the budget is a ceiling on a runaway
      # loop, not a rationing of two small files. Measured: 4 was too tight -
      # a model that lists "." then "assets" and "references" before reading
      # the two actual files needs 5 calls, and hit "tool loop exceeded 4
      # rounds" mid-suite, erroring that row instead of scoring it.
      maxToolCalls: 6
      maxResourceBytes: 16384

defaultTest:
  options:
    # Every judged assertion is llm-rubric; no g-eval survives in this suite, so
    # no rubricPrompt override is needed anywhere.
    # The model is asked to return the skill as `FILE: <path>` blocks; this pulls
    # them into a {path: content} JSON object so every native `is-json` and
    # `javascript` assertion below grades the package, not the chatter around it.
    # Output with no FILE: block passes through untouched behind a sentinel, which
    # is the correct outcome for a case whose right answer is to push back.
    transform: file://assertions/skillauth.cjs:normalizeToFiles
    provider:
      id: openai:chat:deepseek/deepseek-v4-flash
      config:
        # Kept deliberately, matching rest-api-authoring: an isolated A/B found
        # it does not break judge parsing, and llm-rubric brace-matches its
        # verdict regardless.
        response_format:
          type: json_object
        apiBaseUrl: https://openrouter.ai/api/v1
        max_tokens: 8192
        max_completion_tokens: 8192
        passthrough:
          reasoning:
            enabled: false
        apiKeyEnvar: OPENROUTER_API_KEY
        showThinking: false
        omitDefaults: true
  assert:
    # Only the latency ceiling is universal. Everything else lives per case in
    # tests/cases.yaml, anchored on the first case and aliased into the cases
    # that earn it: the negative controls whose right answer is not a skill
    # package would otherwise be scored by graders that can only report "no
    # skill package found" against correct behaviour.
    #
    # Loading a SKILL.md costs wall time; that overhead is part of what this
    # suite measures. Not `cost` - the provider declares no per-token price, so
    # a cost assertion reads 0 and passes trivially. This one carries no metric
    # deliberately: it is a ceiling that fails a row, not a score to average.
    - type: latency
      threshold: 240000

tests:
  - file://tests/*.yaml
