      auth's a bearer token in the Authorization header, and it's
      specifically a JWT, not an opaque token. org: Helios Support
      (https://heliosupport.example), endpoint
      https://api.heliosupport.example/a2a/v1 over JSONRPC, docs at
      https://docs.heliosupport.example, version 3.0.0.
      can you write the agent-card.json for it?
  assert:
    - *contract_shape
    # Both flags stated live and tested. Same A2A s3.3.4 citation as case A -
    # this is the inverse combination from case B (both true instead of both
    # false).
    - type: javascript
      metric: capabilities_match_brief
      value: file://assertions/agentcard.cjs:capabilitiesMatch
      config:
        streaming: true
        pushNotifications: true
    # httpAuth family (assertions/agent-card.schema.json
    # ^(http_auth_security_scheme)$), not yet exercised by any other case.
    # headerName checks the specific detail the brief calls out - JWT, not
    # just any bearer token - actually lands in the matched scheme.
    - type: javascript
      metric: security_scheme_matches_brief
      value: file://assertions/agentcard.cjs:securitySchemeDeclares
      config:
        family: httpAuth
        headerName: JWT

