- description: H - scheduling assistant, OAuth2 authorization-code flow, push live
  vars:
    brief: |
      can you write up the agent-card.json for the scheduling assistant?
      one skill: given a list of attendees and a rough time window, it
      proposes meeting slots and books the one people pick. once it's
      booked we fire a webhook back to the caller with the
      confirmation - that part's live and covers every booking. we don't do
      incremental streaming responses, whole thing comes back as one shot.
      auth's OAuth2, but it's the authorization-code flow through our
      identity provider - authorize endpoint's
      https://auth.schedulehub.example/oauth/authorize, token endpoint
      https://auth.schedulehub.example/oauth/token, scope needed is
      `schedule:write`. org ScheduleHub (https://schedulehub.example),
      agent's at https://agent.schedulehub.example/a2a/v1 over JSONRPC,
      docs https://docs.schedulehub.example, version 1.3.0.
  assert:
    # Authorization-code oauth2 flows carry their own REQUIRED fields
    # (authorizationUrl, tokenUrl, scopes - see build-schema.py's
    # REQUIRED_FIELDS note on AuthorizationCodeOAuthFlow), so this exercises
    # contract_shape harder than case A's client-credentials flow did.
    - *contract_shape
    # Push confirmed live and covering every booking; streaming explicitly
    # not done. Same A2A s3.3.4 citation as case A.
    - type: javascript
      metric: capabilities_match_brief
      value: file://assertions/agentcard.cjs:capabilitiesMatch
      config:
        streaming: false
        pushNotifications: true
    # oauth2 family again (case A used client-credentials; this is
    # authorization-code), checked here for the scope value actually landing
    # in the declared flow rather than being dropped.
    - type: javascript
      metric: security_scheme_matches_brief
      value: file://assertions/agentcard.cjs:securitySchemeDeclares
      config:
        family: oauth2
        headerName: 'schedule:write'

