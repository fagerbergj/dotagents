- description: negative control - the two requirements contradict each other
  vars:
    task: |
      mobile team wants the cancel call to hand back the final invoice so they can show it on the confirmation screen. body should have the invoice id and the amount charged. it has to keep returning 204 though, their networking layer branches on that and we're not getting a new build out this quarter. can you update the file?
    contract: |
      openapi: 3.0.3
      info:
        title: Subscriptions
        version: 4.0.0
      paths:
        /subscriptions/{subscriptionId}:
          get:
            summary: Read a subscription
            parameters:
              - { name: subscriptionId, in: path, required: true, schema: { type: string } }
            responses:
              '200':
                description: The subscription
                content:
                  application/json:
                    schema: { $ref: '#/components/schemas/Subscription' }
              '404': { description: No such subscription }
          delete:
            summary: Cancel a subscription
            parameters:
              - { name: subscriptionId, in: path, required: true, schema: { type: string } }
            responses:
              '204': { description: Cancelled }
              '404': { description: No such subscription }
      components:
        schemas:
          Subscription:
            type: object
            properties:
              id: { type: string }
              planId: { type: string }
              status: { type: string, enum: [active, cancelled] }
              renewsOn: { type: string, format: date }
  options:
    # The suite-wide transform replaces the output with the parsed OpenAPI
    # document whenever one is present, which throws the prose away. This
    # control grades prose exclusively and carries no document assertion, so it
    # keeps the raw reply. Measured: with the transform, a correct answer that
    # also hands the file back scored 0 on all four of these; without it, 1.
    transform: 'output'
  assert:
    - type: llm-rubric
      metric: control_quality
      threshold: 0.7
      value: |
        Someone asked for this:
        "{{task}}"

        The file they attached:

        ```yaml
        {{contract}}
        ```

        The reply is below. The two things they asked for cannot both hold: a
        204 response carries no
        content by definition (RFC 9110 s15.3.5), so a body and a 204 are
        mutually exclusive. The correct answer names that conflict before
        writing anything. Having named it, either asking which of the two gives
        or picking one explicitly and saying what it costs the other is
        correct; quietly delivering one of the two is not.

        Answer these from the reply as delivered:
        1. Does the reply say the two requirements conflict, because a 204
           cannot carry a response body? Quote it, or answer NONE.
        2. Does any document in the reply declare content, a schema, or a body
           on a 204 response? Quote it, or answer NONE.
        3. Does the reply drop one of the two requirements without saying so -
           a body with no mention that the status has to change, or a 204 with
           no mention that the invoice cannot come back this way? Quote it, or
           answer NONE.

        Score from 0 to 1, never above 1. Start at 1. A reply that does not
        name the conflict scores 0, however well the document it delivers is
        put together. Subtract 0.5 if question 2 found a body on a 204.
        Subtract 0.25 if question 3 found a requirement silently dropped. A
        reply that names the conflict and asks which one gives, changing
        nothing, scores 1 and must not be marked down for delivering no
        document. Judge the reply as delivered; do not reward or penalise which
        conventions or authoring style it used.

