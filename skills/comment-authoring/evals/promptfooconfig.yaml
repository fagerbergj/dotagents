# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Comment authoring skill effectiveness

# Two arms over the same tasks. Arm labels come from the skill's frontmatter
# version, so bumping metadata.version in SKILL.md relabels the comparison. Add
# the skill-next arm only once a SKILL.next.md exists to put in it.
prompts:
  - id: file://prompts/arms.js:noSkill
    label: no-skill
  - id: file://prompts/arms.js:skillCurrent
    label: skill-current

providers:
  # Custom provider, not `openai:chat:*`: same OpenAI-compatible call, plus a
  # `load_resource` tool over the skill's own directory so the skill arm can
  # follow SKILL.md's instructions to read its bundled files. The tool exists
  # only when the prompt supplies `skillDir` (see prompts/arms.js), so the
  # baseline arm sends no `tools` key and is called exactly as before.
  - id: file://../../../evals/lib/skill-tools.js
    label: deepseek-v4-flash+resources
    config:
      model: deepseek/deepseek-v4-flash
      apiBaseUrl: https://openrouter.ai/api/v1
      max_tokens: 8192
      passthrough:
        reasoning:
          enabled: false
      apiKeyEnvar: OPENROUTER_API_KEY
      # A single 3.3 KB reference: three rounds is a wrong guess, the directory
      # listing that answers it, and the read.
      maxToolCalls: 3
      maxResourceBytes: 4096

defaultTest:
  options:
    # The llm-swap gateway returns reasoning as message content; strip it so the
    # graders see the commented file, not the leak.
    transform: file://../../../evals/lib/strip-reasoning.js:stripReasoning
    provider:
      id: openai:chat:deepseek/deepseek-v4-flash
      config:
        # Kept from the g-eval era: json_object, never json_schema - the latter makes
        # promptfoo pre-parse the reply into an object, which the graders reject as
        # 'not a string'.
        response_format:
          type: json_object
        apiBaseUrl: https://openrouter.ai/api/v1
        max_tokens: 8192
        max_completion_tokens: 8192
        passthrough:
          reasoning:
            enabled: false
        apiKeyEnvar: OPENROUTER_API_KEY
        showThinking: false
        omitDefaults: true
  assert:
    # 1. Did it answer with a file at all.
    #    Kept although it reads 1.00/1.00 on all 84 rows of
    #    results/comment-authoring@2.0.1.json, which evals/AGENTS.md would
    #    normally cut. It is not grading the model's formatting - it is the
    #    tripwire on the pipeline that delivers the artifact to every other
    #    grader here. It has fired once for real: sending `tools` makes the
    #    gateway prefix the reply with blank lines, and all 14 skill-arm rows
    #    arrived as `\n\n```go...` and scored 0.00 against a 1.00 baseline - a
    #    -1.00 phantom delta that five other suites carried silently because
    #    they had no shape assertion to fail on it. That specific bug is now
    #    covered offline by lib/skill-tools.test.cjs, but the transform and the
    #    fence unwrapper still sit between the gateway and the judges, and a
    #    preamble reintroduced anywhere in there leaves `code_preserved`,
    #    `not_narration` and `restraint` all reading a fragment without saying
    #    so. A `starts-with` costs no call and no token; a ceiling that is free
    #    reports "the instrument is still pointing at the artifact" for nothing.
    - type: starts-with
      value: '```'
      metric: code_block
    # 2. A commenting task must not rewrite the code. Strip the comments from the
    #    input and the output, normalise whitespace, demand the rest be identical.
    - type: javascript
      value: file://assertions/comment.cjs:codePreserved
      metric: code_preserved
    # 3. not_narration and no_false_comments live in tests/cases.yaml, on the nine
    #    cases that hide something, not here. They are one enumeration of the added
    #    comments read two ways: K / N, the share that say something a competent
    #    reader would not already know, and whether any of them is false about the
    #    code. Both score a reply that adds nothing at 0, which is why neither runs
    #    on the five negative controls - restraint grades those instead, so the
    #    metrics partition the suite rather than overlapping on it.
    # 4. Loading a SKILL.md is not free; the overhead is part of the comparison,
    #    but as a guard on the run's shape, not as a graded column. Named it
    #    scored 1.00/1.00 on all 84 rows of results/comment-authoring@2.0.1.json
    #    and could only ever move on a row the completion cap truncated - which
    #    `code_preserved` and `not_narration` already fail. report.js prints
    #    `latency (s avg)` from latencyMs with no assertion involved.
    - type: latency
      threshold: 180000

tests:
  - file://tests/*.yaml
