- description: javascript public API - request accessors whose answers depend on trust proxy
  vars:
    lang: js
    ask: |
      These are on the request object every app in the world touches, and I would
      rather write the contract down once than keep answering it. X-Forwarded-Proto is
      only honoured when trust proxy trusts the socket's own remote address; with no
      trust proxy configured the socket's TLS state wins and the header is ignored
      entirely. The comma split in there is belt and braces - that header is normally a
      single value. ips is ordered client first, so index 0 is the furthest downstream
      and the socket address is deliberately dropped off the end; it is not a raw
      X-Forwarded-For dump, and with no trust proxy it is empty. secure is defined as
      protocol === 'https' and nothing else, so it inherits all of that rather than
      asking the socket. And is() has three outcomes, not two: the matched type as a
      string, false when the body does not match, null when there is no body at all.
      Comment it before I tag the release.
    code: |
      defineGetter(req, 'query', function query(){
        var queryparse = this.app.get('query parser fn');

        if (!queryparse) {
          return Object.create(null);
        }

        var querystring = parse(this).query;

        return queryparse(querystring);
      });

      req.is = function is(types) {
        var arr = types;

        if (!Array.isArray(types)) {
          arr = new Array(arguments.length);
          for (var i = 0; i < arr.length; i++) {
            arr[i] = arguments[i];
          }
        }

        return typeis(this, arr);
      };

      defineGetter(req, 'protocol', function protocol(){
        var proto = this.socket.encrypted
          ? 'https'
          : 'http';
        var trust = this.app.get('trust proxy fn');

        if (!trust(this.socket.remoteAddress, 0)) {
          return proto;
        }

        var header = this.get('X-Forwarded-Proto') || proto
        var index = header.indexOf(',')

        return index !== -1
          ? header.substring(0, index).trim()
          : header.trim()
      });

      defineGetter(req, 'secure', function secure(){
        return this.protocol === 'https';
      });

      defineGetter(req, 'ip', function ip(){
        var trust = this.app.get('trust proxy fn');
        return proxyaddr(this, trust);
      });

      defineGetter(req, 'ips', function ips() {
        var trust = this.app.get('trust proxy fn');
        var addrs = proxyaddr.all(this, trust);

        addrs.reverse().pop()

        return addrs
      });
