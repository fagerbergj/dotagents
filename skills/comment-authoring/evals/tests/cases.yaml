- description: java public API - the adapter base class every serializer subclasses
  vars:
    lang: java
    ask: |
      This is the class everyone extends when they write their own adapter, and the
      same four questions come back on every review. write can be handed a null value
      and read is allowed to return null - an implementation has to deal with null
      itself, we do not filter it out before calling. The two toJson methods are not
      the same on errors: toJson(Writer) is declared throws IOException and lets
      whatever write throws go straight out to the caller, while the String one has no
      way to do that, so it catches and rethrows as JsonIOException, which is
      unchecked. toJsonTree hands back JsonNull for a null value, not a Java null, so
      the return is never null. And fromJson(Reader) builds a reader with the default
      legacy-strict setting, which means it will not complain about several top-level
      values or trailing junk after the first one - anyone who wants that has to build
      their own JsonReader and call read directly. Comment it before I tag the release.
    code: |
      public abstract class TypeAdapter<T> {

        public TypeAdapter() {}

        public abstract void write(JsonWriter out, T value) throws IOException;

        public final void toJson(Writer out, T value) throws IOException {
          JsonWriter writer = new JsonWriter(out);
          write(writer, value);
        }

        public final String toJson(T value) {
          StringBuilder stringBuilder = new StringBuilder();
          try {
            toJson(Streams.writerForAppendable(stringBuilder), value);
          } catch (IOException e) {
            throw new JsonIOException(e);
          }
          return stringBuilder.toString();
        }

        public final JsonElement toJsonTree(T value) {
          try {
            JsonTreeWriter jsonWriter = new JsonTreeWriter();
            write(jsonWriter, value);
            return jsonWriter.get();
          } catch (IOException e) {
            throw new JsonIOException(e);
          }
        }

        public abstract T read(JsonReader in) throws IOException;

        public final T fromJson(Reader in) throws IOException {
          JsonReader reader = new JsonReader(in);
          return read(reader);
        }
      }
