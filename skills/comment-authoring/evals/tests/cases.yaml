# Real code, comments stripped, plus what the author knows that the file does
# not say. The ask never names a comment category or a rule: deciding what
# deserves a comment, and what deserves none, is what is being graded.
#
# Each ask carries 2-4 specific, load-bearing facts, and the case's fact_transfer
# rubric enumerates exactly those. Grading fact transfer rather than the "state
# why" principle keeps the judge independent of the skill under test and computes
# against this case's own input.
#
# The last five cases are negative controls - plain code where the right answer
# is few or no comments, and where over-commenting is the failure. Knowing when
# not to comment is where this skill's value most shows, so the controls carry
# cases rather than losing them: two of them offer one assumption the types do
# not carry and nothing else, the rest are self-evident throughout. None of them
# has a second defensible answer - restraint scores adding nothing and adding
# only an assumption-carrying comment the same, so both correct answers pass.
#
# PROVENANCE. The nine graded cases come from seven different projects, in five
# languages, and no project supplies more than three of them. That spread is the
# point: a suite drawn from one codebase measures how well the model fits that
# codebase's idiom, not whether the skill works. `fagerbergj/quack` was removed
# outright in the previous revision - quack is an AI code-review bot that runs
# these very skills, so its code may have been commented with the skill under
# test - and its eight cases were replaced one-for-one from `turnstone`, which
# then supplied eight of the nine. Six of those eight are now replaced again,
# from six unrelated public repositories. Do not reintroduce quack material, and
# do not let any one project drift back above roughly a third of the suite.
#
# Each extract is the real file at the pinned commit with its comments and
# docstrings stripped. Where a case shows only part of a module - the TLS client
# without `_request_cert`, TypeAdapter without `nullSafe` - that is deliberate:
# the file is a coherent extract, not a compiling program, and every fact the
# ask carries is about code that IS shown.
#
# THE SIX NEW CASES, in file order.
#
#   - go constraint - `caddyserver/caddy`, `modules/caddyhttp/encode/encode.go`
#     L443-518 at 502691f5, the encoder's `Close`, `init` and `hasVaryValue`.
#     Qualifies: the status-code guard exists for a named regression, the two
#     header deletions each have an external reason, the ETag suffix is an RFC
#     requirement, and the obligation to strip that suffix back out of
#     If-None-Match happens in another file entirely.
#   - go workaround - `rclone/rclone`, `fs/fshttp/dialer.go` L42-127 at
#     55fa9b6a, `DialContext` and `timeoutConn`. Qualifies: the family suffix
#     and the success-path Windows warning are both workarounds for named Go
#     issues, the deadline is an idle timeout rather than an operation timeout,
#     and the bandwidth accounting records a shape the author prefers and did
#     not build.
#   - python security - `psf/requests`, `src/requests/sessions.py` L127-132 and
#     L309-392 at 6e83187b: the `SessionRedirectMixin` declaration, then
#     `rebuild_auth`, `rebuild_proxies` and `rebuild_method`. Every line of the
#     three is a credential-leak rule that reads like housekeeping. The class
#     header is carried so the extract starts at column zero - a YAML block
#     scalar takes its indentation from the first line, so an extract that
#     began inside the class body would silently store dedented code.
#   - javascript public API - `expressjs/express`, `lib/request.js` L220-366 at
#     023767fe, the `query`, `is`, `protocol`, `secure`, `ip` and `ips`
#     accessors. Qualifies: four contract facts a caller cannot read off the
#     getters, three of them turning on the "trust proxy" setting.
#   - java public API - `google/gson`,
#     `gson/src/main/java/com/google/gson/TypeAdapter.java` L122-214 at
#     b3f4ca20, plus the class-closing brace from L323. Qualifies: null
#     handling is the implementer's job, the checked exception reaches the
#     caller from the Writer overload and is rewrapped unchecked by the String
#     one, the tree form returns JsonNull rather than null, and the
#     reader's default strictness accepts trailing data. This case restores the
#     Java coverage the quack removal cost, and carries the third
#     doc_placement_floor.
#   - python security plus deferred work - `pallets/click`,
#     `src/click/_termui_impl.py` L548-632 at 36baa15f, `_pipepager`.
#     Qualifies: a copied environment and a shell-free argv, plus two pieces of
#     deferred work with their conditions - a branch that is dead until the
#     caller's routing changes, and a swallowed ^C left to the user's own
#     configuration.
#
# THE THREE TURNSTONE CASES KEPT, unchanged: the thumbnails decode bound
# (performance), the TypeScript SDK base client (public API, two
# doc_placement_floor assertions) and the boot-only PEM sweep (invariant). All
# five negative controls are unchanged too.
#
# REMOVED IN THIS PASS, all turnstone: the mcp_oauth refresh cooldown
# (constraint), the tls.py cancellation shield (workaround), the output_guard
# credential redaction (security), the list_cache.js shared cache (javascript
# public API), the mcp_crypto compare-and-swap (security plus deferred work),
# and the hand-written MemoryClient (python public API) - the last of these was
# not from any repository at all, which is why it went rather than a turnstone
# case: the suite's opening line says real code.
#
# AI-AUTHORSHIP SCREEN. Run twice per case, and per line rather than per file.
# Every commit attributed by `git blame` over the exact extracted line range was
# checked for an authorship disclosure - `Co-Authored-By: Claude ...
# <noreply@anthropic.com>`, a "Generated with Claude Code" trailer, a bot
# co-author - AND for `copilot`, `claude` or `anthropic` in the author or
# committer ident. That second check is not redundant: `copilot-swe-agent[bot]`
# authors commits whose own `Co-authored-by:` names a human, so a trailer-only
# screen passes them. Contamination counts at the time of writing: caddy 33,
# rclone 18, express 2, click/requests/gson 0. Every range shown here blames
# clean under both checks. Subject-matter mentions of Anthropic or Copilot
# inside a body are not authorship claims.
#
# Nothing grades on the language: the comment scanner reads Java and JavaScript
# through the same C-like path the three Go negative controls exercise, and
# Python through its own. Rust was considered and left out - its lifetime
# syntax (`&'a str`) confuses the scanner's quote handling.
#
# Metric counts: not_narration 9, no_false_comments 9, fact_transfer 9,
# restraint 5, doc_placement_floor 4 assertions over 3 cases. no_false_comments
# is the F term lifted out of not_narration's numerator; it runs on the same
# nine cases and nowhere else.
# NOT RE-MEASURED. Every stored baseline for this suite was taken on a case set
# that included eight quack files, and the revision before this one on a set
# that was eight-ninths turnstone. Neither describes this one. All of it needs
# re-measuring.
- description: go constraint - what an encoder has to take out of the response headers
  vars:
    lang: go
    ask: |
      Comment pass on this before it goes back up. Review came back saying three of
      these look defensive and asking whether they are needed - they all are, and the
      reason is nowhere in the file. The statusCode check is issue #5059: if nothing
      set a status explicitly we must not invent one on the way out. Content-Length
      goes because of golang/go#14975, and Accept-Ranges goes because once we encode
      on the fly we no longer know what byte ranges mean. The Etag suffix is RFC 9110
      section 8.8.3.3 - a strong ETag has to be distinct per selected representation -
      and the part that catches people is that whatever we append here has to be
      stripped back out of If-None-Match before the request goes on upstream, since
      the upstream handler built that ETag without knowing we would touch it.
    code: |
      func (rw *responseWriter) Close() error {
      	if !rw.wroteHeader {
      		cl, err := strconv.Atoi(rw.Header().Get("Content-Length"))
      		if err == nil && cl > rw.config.MinLength {
      			rw.init()
      		}

      		if rw.statusCode != 0 {
      			rw.ResponseWriter.WriteHeader(rw.statusCode)
      		}
      		rw.wroteHeader = true
      	}

      	var err error
      	if rw.w != nil {
      		err = rw.w.Close()
      		rw.w.Reset(nil)
      		rw.config.writerPools[rw.encodingName].Put(rw.w)
      		rw.w = nil
      	}
      	return err
      }

      func (rw *responseWriter) Unwrap() http.ResponseWriter {
      	return rw.ResponseWriter
      }

      func (rw *responseWriter) init() {
      	if rw.disabled {
      		return
      	}

      	hdr := rw.Header()

      	if hdr.Get("Content-Encoding") == "" && isEncodeAllowed(hdr) &&
      		rw.config.Match(rw) {
      		rw.w = rw.config.writerPools[rw.encodingName].Get().(Encoder)
      		rw.w.Reset(rw.ResponseWriter)
      		hdr.Del("Content-Length")
      		hdr.Set("Content-Encoding", rw.encodingName)
      		if !hasVaryValue(hdr, "Accept-Encoding") {
      			hdr.Add("Vary", "Accept-Encoding")
      		}
      		hdr.Del("Accept-Ranges")

      		if etag := hdr.Get("Etag"); etag != "" && !strings.HasPrefix(etag, "W/") {
      			etag = fmt.Sprintf(`%s-%s"`, strings.TrimSuffix(etag, `"`), rw.encodingName)
      			hdr.Set("Etag", etag)
      		}
      	}
      }

      func hasVaryValue(hdr http.Header, target string) bool {
      	for _, vary := range hdr.Values("Vary") {
      		for val := range strings.SplitSeq(vary, ",") {
      			if strings.EqualFold(strings.TrimSpace(val), target) {
      				return true
      			}
      		}
      	}
      	return false
      }
  assert:
    # not_narration, enumerate-and-divide. The three-band holistic version had the
    # worst per-cell spread in the suite (0.568 over five identical runs) even at
    # n=11, cells wandering [0, 0.5, 0, 1, 0.5] between runs. Anchored here and
    # aliased by the eight other cases that hide something. The negative controls
    # do not carry it - K / N would score a reply that correctly adds nothing at
    # 0, so those are graded by restraint instead.
    #
    # It scored (K - F) / N until now, which collapsed two independent failures:
    # a comment that states the obvious and a comment that is FALSE about the
    # code cost the row exactly the same, and F was buried in a numerator instead
    # of reported. They are different properties - one is a comment not worth
    # writing, the other is a comment that misleads the next reader - so F is now
    # its own metric below. On the 18 stored rows of results/comment-authoring
    # @2.0.1.json F was non-zero exactly once, so this split is a correction to
    # what the number MEANS, not a change anyone should expect to see move.
    - &not_narration
      type: llm-rubric
      metric: not_narration
      threshold: 0.6
      value: |
        Google's C++ style guide, under "Don'ts", says: "Do not state the obvious. In
        particular, don't literally describe what code does, unless the behavior is
        nonobvious to a reader who understands C++ well. Instead, provide higher-level
        comments that describe why the code does what it does, or make the code
        self-describing." It adds that "Self-describing code doesn't need a comment."
        Pascarella and Bacchelli (MSR 2017) hand-classified comments in 2,000 Java files
        and found summary comments outnumbering rationale comments by roughly twenty to
        one, which is the failure this scores.

        Judge only the comments the Reply added. Ignore where comments sit, their length,
        their syntax, and their punctuation. Judge what they say.

        List every comment the Reply added, quoting each verbatim and numbering them. Let N
        be that count. For each numbered comment answer, in one line:
          - the constraint, cause, contract, or consequence it states, quoted; or NARRATION
            if a competent programmer in this language, reading only the identifiers and
            statements it sits beside, would already know what it says.
        Answer for every comment before scoring. Do not group them.

        Take each comment's claim at face value. Whether it is TRUE of this code is a
        separate question with its own score: a comment that states a constraint counts
        here even if you believe the constraint is wrong, and a comment that states the
        obvious counts as NARRATION even if it is perfectly accurate.

        Let K be the number answered with a quoted constraint, cause, contract, or
        consequence.

        Score from 0 to 1, never above 1: K / N. If N is 0, score 0. State N, K and the
        arithmetic in your reason.
    # Split out of not_narration, where a FALSE comment was subtracted from the
    # count of good ones: one false claim and one obvious remark moved the score
    # by the same 1/N, and a reader of the number could not tell which had
    # happened. A comment that lies about the code is a different defect from a
    # comment not worth writing - it costs the next reader more than no comment
    # at all - so it is reported rather than netted off.
    #
    # Yes/no, not a proportion: a file carrying one false claim is not "mostly
    # accurate", it has a wrong statement in it that someone will act on. Same
    # shape as fix-bug's no_invented_file_refs. N=0 scores 0 exactly as
    # not_narration does, so the two never point opposite ways on a reply that
    # added nothing - restraint owns that behaviour, on the controls.
    - &no_false_comments
      type: llm-rubric
      metric: no_false_comments
      threshold: 1
      value: |
        Judge only the comments the Reply added. Ignore where comments sit, their length,
        their syntax, and their punctuation. Ignore whether a comment was worth writing at
        all - a comment that states the obvious is not a fault here, and is scored
        separately.

        List every comment the Reply added, quoting each verbatim and numbering them. Let N
        be that count. For each numbered comment answer, in one line, TRUE or FALSE:
        answer FALSE only when the code beside it contradicts the comment - it names a
        function, field, parameter, error, or branch that is not there; it states a
        condition the code does not test; it describes behaviour this code does not have;
        or it attributes the code to a cause or standard that does not apply to it. A
        claim you cannot check against the code shown, and a judgement call you would
        argue with, are both TRUE. Answer for every comment before scoring. Do not group
        them.

        Let F be the number answered FALSE.

        Score from 0 to 1, never above 1: 1 if F is 0, and 0 if F is 1 or more. There is
        no partial credit - one wrong statement about the code is the failure. If N is 0,
        score 0. State N, F, which comments were FALSE and why, and the arithmetic.
    - type: llm-rubric
      metric: fact_transfer
      threshold: 0.6
      value: |
        The requester wrote this:
        "{{ask}}"

        Judge only whether the comments the Reply added carry the facts listed below. Match on
        meaning, never on wording: a paraphrase that carries the same claim counts in full, and
        matching phrasing earns nothing extra. Read every comment in the file before answering,
        including doc comments on helpers, and quote the comment carrying each fact verbatim.
        Write NONE for a fact only after searching the whole file for it, and when you write
        NONE, name the declarations you checked.

        A fact stated as a reason plus a consequence is carried only when both halves are
        present in some comment; if one half is present and the other is not, it is half
        carried.

        A block of comment text that reproduces the requester's message as a passage, rather
        than saying something about the declaration it sits on, carries no facts. Facts must be
        stated as claims about this code.

          (a) the status-code guard is there because a status that was never set explicitly must
              not be written out, not as a general defensive check.
          (b) Content-Length is dropped for a known Go issue, and Accept-Ranges is dropped because
              byte ranges are not knowable for content encoded on the fly.
          (c) the encoding name is appended to a strong ETag because the standard requires a strong
              ETag to differ per selected representation.
          (d) that appended suffix has to be removed from If-None-Match before the request is sent
              upstream, because upstream handlers produced their ETag without knowing about it.

        Score from 0 to 1, never above 1: award 0.25 per fact carried and 0.125 per fact half carried. A
        comment that only says Close "flushes and releases the writer", or that init "sets the
        encoding headers", carries none of them.

        Ignore comment placement, length and syntax.
- description: go workaround - a dialer that has to name the address family itself
  vars:
    lang: go
    ask: |
      Can you comment this before I push it back? Four things in here that nobody can
      see from the code. Appending "4" or "6" to the network string is golang/go#48723:
      binding to 0.0.0.0 or ::0 binds both families, so --bind cannot pin one unless we
      say tcp4 or tcp6 outright. The Windows warning fires on the path where there was
      no error on purpose - SetTOS over IPv4 on Windows returns nil and does nothing
      (golang/go#42728), so there is nothing to report and the user would otherwise
      think their DSCP setting took. The deadline on timeoutConn is an idle timeout,
      not a deadline for the whole transfer, which is why it gets nudged again after
      every read and write that actually moved bytes. And on Read we account bandwidth
      with the count we actually got back; reserving len(b) up front and returning the
      tokens we did not use would be the better shape and we have not done it.
    code: |
      func (d *Dialer) Dial(network, address string) (net.Conn, error) {
      	return d.DialContext(context.Background(), network, address)
      }

      var warnDSCPFail, warnDSCPWindows sync.Once

      func (d *Dialer) DialContext(ctx context.Context, network, address string) (net.Conn, error) {
      	if ip, ok := d.Dialer.LocalAddr.(*net.TCPAddr); ok && ip.IP.IsUnspecified() && (network == "tcp" || network == "udp") {
      		if ip.IP.To4() != nil {
      			network += "4"
      		} else {
      			network += "6"
      		}
      	}

      	c, err := d.Dialer.DialContext(ctx, network, address)
      	if err != nil {
      		return c, err
      	}

      	if d.tclass != 0 {
      		if strings.Count(c.RemoteAddr().String(), ":") > 1 {
      			err = ipv6.NewConn(c).SetTrafficClass(d.tclass)
      		} else {
      			err = ipv4.NewConn(c).SetTOS(d.tclass)
      			if runtime.GOOS == "windows" {
      				warnDSCPWindows.Do(func() {
      					fs.LogLevelPrintf(fs.LogLevelWarning, nil, "dialer: setting DSCP on Windows/IPv4 fails silently; see https://github.com/golang/go/issues/42728")
      				})
      			}
      		}
      		if err != nil {
      			warnDSCPFail.Do(func() {
      				fs.LogLevelPrintf(fs.LogLevelWarning, nil, "dialer: failed to set DSCP socket options: %v", err)
      			})
      		}
      	}

      	t := &timeoutConn{
      		Conn:    c,
      		timeout: d.timeout,
      	}
      	return t, t.nudgeDeadline()
      }

      type timeoutConn struct {
      	net.Conn
      	timeout time.Duration
      }

      func (c *timeoutConn) nudgeDeadline() error {
      	if c.timeout > 0 {
      		return c.SetDeadline(time.Now().Add(c.timeout))
      	}
      	return nil
      }

      func (c *timeoutConn) Read(b []byte) (n int, err error) {
      	n, err = c.Conn.Read(b)
      	accounting.TokenBucket.LimitBandwidth(accounting.TokenBucketSlotTransportRx, n)
      	if err == nil && n > 0 && c.timeout > 0 {
      		err = c.nudgeDeadline()
      	}
      	return n, err
      }

      func (c *timeoutConn) Write(b []byte) (n int, err error) {
      	accounting.TokenBucket.LimitBandwidth(accounting.TokenBucketSlotTransportTx, len(b))
      	n, err = c.Conn.Write(b)
      	if err == nil && n > 0 && c.timeout > 0 {
      		err = c.nudgeDeadline()
      	}
      	return n, err
      }
  assert:
    - *not_narration
    - *no_false_comments
    - type: llm-rubric
      metric: fact_transfer
      threshold: 0.6
      value: |
        The requester wrote this:
        "{{ask}}"

        Judge only whether the comments the Reply added carry the facts listed below. Match on
        meaning, never on wording: a paraphrase that carries the same claim counts in full, and
        matching phrasing earns nothing extra. Read every comment in the file before answering,
        including doc comments on helpers, and quote the comment carrying each fact verbatim.
        Write NONE for a fact only after searching the whole file for it, and when you write
        NONE, name the declarations you checked.

        A fact stated as a reason plus a consequence is carried only when both halves are
        present in some comment; if one half is present and the other is not, it is half
        carried.

        A block of comment text that reproduces the requester's message as a passage, rather
        than saying something about the declaration it sits on, carries no facts. Facts must be
        stated as claims about this code.

          (a) the family suffix on the network string works around a Go issue in which an
              unspecified local bind address binds both address families, so the bind option
              cannot pin one without it.
          (b) the Windows warning is emitted where there was no error because setting the traffic
              class on Windows over IPv4 silently does nothing and reports success.
          (c) the deadline is an idle timeout re-armed after each read or write that moved bytes,
              not a deadline for the whole operation.
          (d) bandwidth is accounted after the read with the count actually returned, and the
              better shape - reserving the buffer length up front and returning the unused
              tokens - is knowingly not done.

        Score from 0 to 1, never above 1: award 0.25 per fact carried and 0.125 per fact half carried. A
        comment that only says DialContext "dials with the configured options", or that
        nudgeDeadline "sets the deadline", carries none of them.

        Ignore comment placement, length and syntax.
- description: python security - what a redirect is allowed to carry to the next host
  vars:
    lang: python
    ask: |
      Commenting this before it goes in - it is the redirect path and every line of it
      is a credential-leak rule that reads like housekeeping. Authorization comes off
      when the redirect crosses to a different host, so we do not hand a token to
      somewhere it was not issued for; the netrc lookup right after is not putting it
      back, it is a fresh grant that happens to exist for the new host. Proxy-
      Authorization is deleted every hop and only put back for a non-https scheme,
      because urllib3 supplies proxy auth itself on the tunnelled path and adding ours
      there risks it going out where it can be seen. Proxies get recomputed on every
      hop rather than carried across, because the new URL may be covered by NO_PROXY
      or may need keys an earlier hop stripped. And the method rewrites are browsers,
      not the RFC - 302 and POST-plus-301 become GET because that is what everything
      else does, which is issue 1704; 307 and 308 keep the method and body on purpose.
    code: |
      class SessionRedirectMixin:
          max_redirects: int
          trust_env: bool
          cookies: RequestsCookieJar

          def send(self, request: PreparedRequest, **kwargs: Any) -> Response: ...

          def rebuild_auth(
              self, prepared_request: PreparedRequest, response: Response
          ) -> None:
              original_request = response.request
              assert _is_prepared(original_request)
              assert _is_prepared(prepared_request)

              headers = prepared_request.headers
              original_url = original_request.url
              url = prepared_request.url

              if "Authorization" in headers and self.should_strip_auth(original_url, url):
                  del headers["Authorization"]

              new_auth = get_netrc_auth(url) if self.trust_env else None
              if new_auth is not None:
                  prepared_request.prepare_auth(new_auth)

          def rebuild_proxies(
              self,
              prepared_request: PreparedRequest,
              proxies: dict[str, str] | None,
          ) -> dict[str, str]:
              assert _is_prepared(prepared_request)
              headers = prepared_request.headers
              scheme = urlparse(prepared_request.url).scheme
              new_proxies = resolve_proxies(prepared_request, proxies, self.trust_env)

              if "Proxy-Authorization" in headers:
                  del headers["Proxy-Authorization"]

              try:
                  username, password = get_auth_from_url(new_proxies[scheme])
              except KeyError:
                  username, password = None, None

              if not scheme.startswith("https") and username and password:
                  headers["Proxy-Authorization"] = _basic_auth_str(username, password)

              return new_proxies

          def rebuild_method(
              self, prepared_request: PreparedRequest, response: Response
          ) -> None:
              method = prepared_request.method

              if response.status_code == codes.see_other and method != "HEAD":
                  method = "GET"

              if response.status_code == codes.found and method != "HEAD":
                  method = "GET"

              if response.status_code == codes.moved and method == "POST":
                  method = "GET"

              prepared_request.method = method
  assert:
    - *not_narration
    - *no_false_comments
    - type: llm-rubric
      metric: fact_transfer
      threshold: 0.6
      value: |
        The requester wrote this:
        "{{ask}}"

        Judge only whether the comments the Reply added carry the facts listed below. Match on
        meaning, never on wording: a paraphrase that carries the same claim counts in full, and
        matching phrasing earns nothing extra. Read every comment in the file before answering,
        including doc comments on helpers, and quote the comment carrying each fact verbatim.
        Write NONE for a fact only after searching the whole file for it, and when you write
        NONE, name the declarations you checked.

        A fact stated as a reason plus a consequence is carried only when both halves are
        present in some comment; if one half is present and the other is not, it is half
        carried.

        A block of comment text that reproduces the requester's message as a passage, rather
        than saying something about the declaration it sits on, carries no facts. Facts must be
        stated as claims about this code.

          (a) Authorization is stripped on a cross-host redirect so credentials are not handed to
              a host they were not issued for, and the netrc lookup afterwards is a fresh grant
              for the new host rather than a restore of the old one.
          (b) Proxy-Authorization is removed every hop and re-attached only for a non-https
              scheme, because the underlying pool manager supplies proxy auth on the tunnelled
              path and re-adding it there risks exposing it.
          (c) proxies are recomputed each hop rather than carried forward, because the new URL may
              be covered by NO_PROXY or may need keys a previous hop removed.
          (d) turning 302, and POST with 301, into GET is browser behaviour kept deliberately
              against the specification.

        Score from 0 to 1, never above 1: award 0.25 per fact carried and 0.125 per fact half carried. A
        comment that only says rebuild_auth "updates the authentication headers", or that
        rebuild_method "adjusts the method for the status code", carries none of them.

        Ignore comment placement, length and syntax.
- description: python performance - a decode bound that the library's own ceiling does not enforce
  vars:
    lang: python
    ask: |
      Someone is going to look at this and delete the explicit pixel check because
      "MAX_IMAGE_PIXELS already does that". It does not: Pillow only RAISES above
      twice the cap - between the cap and 2x it just warns and decodes the whole
      thing, so a 40-80M pixel image still lands as ~480MB of RGB. That is why there
      is an explicit check, why it runs on the header-declared size straight after
      open() and before exif_transpose or convert (both of those decode the pixels),
      and why it is a check and not a warnings filter - this runs in a thread and the
      global warnings state is not thread-safe. The 40M cap is deliberately below
      PIL's ~89M default, which still lets a few-KB file decode to something like
      530MB. Can you comment it so nobody simplifies it away?
    code: |
      from __future__ import annotations

      from io import BytesIO

      from turnstone.core.log import get_logger

      log = get_logger(__name__)

      _THUMB_MAX_PX = 160

      _MAX_IMAGE_PIXELS = 40_000_000

      def make_thumbnail(data: bytes, kind: str, *, max_px: int = _THUMB_MAX_PX) -> bytes | None:
          try:
              from PIL import Image, ImageOps
          except ImportError:
              log.warning("Pillow not installed; thumbnails unavailable")
              return None

          Image.MAX_IMAGE_PIXELS = _MAX_IMAGE_PIXELS
          try:
              if kind == "pdf":
                  from turnstone.core.pdf import rasterize_pdf

                  pages = rasterize_pdf(data, max_pages=1)
                  if not pages:
                      return None
                  img = Image.open(BytesIO(pages[0]))
              elif kind == "image":
                  img = Image.open(BytesIO(data))
              else:
                  return None
              px = img.size[0] * img.size[1]
              if px > _MAX_IMAGE_PIXELS:
                  log.warning(
                      "thumbnail rejected: %d×%d (%d px) exceeds %d-pixel cap",
                      img.size[0],
                      img.size[1],
                      px,
                      _MAX_IMAGE_PIXELS,
                  )
                  return None
              oriented = ImageOps.exif_transpose(img) or img
              rgb = oriented.convert("RGB")
              rgb.thumbnail((max_px, max_px))
              buf = BytesIO()
              rgb.save(buf, format="PNG")
              return buf.getvalue()
          except Image.DecompressionBombError as exc:
              log.warning("thumbnail rejected: image exceeds %d-pixel cap: %s", _MAX_IMAGE_PIXELS, exc)
              return None
          except Exception as exc:
              log.warning("thumbnail generation failed (kind=%s): %s", kind, exc)
              return None
