- description: python security plus deferred work - a pager child that must not outlive an error
  vars:
    lang: python
    ask: |
      Comment pass before this merges. The environment is copied rather than mutated
      because injecting LESS=-R must not follow the parent process around after the
      pager exits, and the command goes to Popen as an argv list with shell=False so a
      PAGER value a user set is never handed to a shell. The casefold branch under WIN
      is dead code today - the caller routes every Windows invocation to
      _tempfilepager - and it stays deliberately so the name detection is still right
      if that routing ever changes. The terminate on a stray exception is not tidiness:
      if we let the pager keep running the user never sees the traceback and the
      terminal can be left in a broken state. And the wait loop swallowing
      KeyboardInterrupt is deliberate too - less takes ^C for its own search UI rather
      than exiting, so if someone wants ^C to kill the pager they set LESS='-K'; that
      is their call to make, not ours.
    code: |
      @contextlib.contextmanager
      def _pipepager(
          cmd_path: Path, cmd_params: list[str], color: bool | None = None
      ) -> t.Iterator[tuple[t.TextIO, bool | None]]:
          import subprocess

          env = dict(os.environ)

          cmd_name = cmd_path.stem
          if WIN:
              cmd_name = cmd_name.casefold()

          if color is None and cmd_name == "less":
              less_env = os.environ.get("LESS", "")
              if _less_uses_raw_mode(less_env, cmd_params):
                  color = True
              elif not less_env and not cmd_params:
                  env["LESS"] = "-R"
                  color = True

          c = subprocess.Popen(
              [str(cmd_path)] + cmd_params,
              shell=False,
              stdin=subprocess.PIPE,
              env=env,
              errors="replace",
              text=True,
          )
          stdin = t.cast(t.TextIO, c.stdin)
          try:
              yield stdin, color
          except BrokenPipeError:
              pass
          except Exception as e:
              c.terminate()
              raise e
          finally:
              try:
                  stdin.close()
              except BrokenPipeError:
                  pass

              while True:
                  try:
                      c.wait()
                  except KeyboardInterrupt:
                      pass
                  else:
                      break
