- description: go security - credential redaction before anything is persisted
  vars:
    lang: go
    ask: |
      This one guards the ledger - anything that gets past it lands in a file we
      keep for months and ship to support. Two things people keep trying to
      "clean up": the string branch re-parses values as JSON because half our
      upstreams hand us a pre-marshalled blob and the keys would otherwise sail
      straight through, and the key set is matched lowercased because header
      casing is whatever the sender felt like that day. Comment it before I open
      the PR.
    code: |
      package ledger

      import (
      	"encoding/json"
      	"strings"
      )

      var redactedKeys = map[string]bool{
      	"authorization": true, "www-authenticate": true, "proxy-authorization": true,
      	"api_key": true, "apikey": true, "api-key": true, "x-api-key": true,
      	"token": true, "access_token": true, "refresh_token": true, "id_token": true,
      	"secret": true, "client_secret": true, "webhook_secret": true,
      	"password": true, "passwd": true,
      	"private_key": true, "privatekey": true,
      	"cookie": true, "set-cookie": true,
      }

      const redactedValue = "[REDACTED]"

      func Redact(v any) any {
      	switch x := v.(type) {
      	case map[string]any:
      		out := make(map[string]any, len(x))
      		for k, val := range x {
      			if redactedKeys[strings.ToLower(k)] {
      				out[k] = redactedValue
      				continue
      			}
      			out[k] = Redact(val)
      		}
      		return out
      	case []any:
      		out := make([]any, len(x))
      		for i, e := range x {
      			out[i] = Redact(e)
      		}
      		return out
      	case string:
      		return redactJSONString(x)
      	default:
      		return v
      	}
      }

      func redactJSONString(s string) string {
      	var decoded any
      	if err := json.Unmarshal([]byte(s), &decoded); err != nil {
      		return s
      	}
      	switch decoded.(type) {
      	case map[string]any, []any:
      	default:
      		return s
      	}
      	b, err := json.Marshal(Redact(decoded))
      	if err != nil {
      		return s
      	}
      	return string(b)
      }
