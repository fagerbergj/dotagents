- description: go workaround - span reparenting around an upstream context rebuild
  vars:
    lang: go
    ask: |
      Nobody remembers why this re-injects a span context instead of just using
      the one on ctx, and someone already "simplified" it once and silently broke
      our traces for a week. The ADK rebuilds the child context this callback runs
      under, so oteltrace.SpanFromContext(ctx) hands back the no-op span and we
      root a brand new disconnected trace. Coords carries the SpanContext we
      captured before that rebuild. And no, StartLinked is not the fix - it forces
      WithNewRoot and forks the trace anyway. Comment it so the next person leaves
      it alone.
    code: |
      package agent

      import (
      	"go.opentelemetry.io/otel/attribute"
      	oteltrace "go.opentelemetry.io/otel/trace"
      	adkagent "google.golang.org/adk/v2/agent"

      	"github.com/fagerbergj/quack/internal/ledger"
      	"github.com/fagerbergj/quack/internal/otelobs"
      	"github.com/fagerbergj/quack/internal/stream"
      )

      func emitCompaction(ctx adkagent.Context, before, after int) {
      	coords := ledger.CoordsFromContext(ctx)
      	parentCtx := oteltrace.ContextWithSpanContext(ctx, coords.SpanContext)
      	_, span := otelobs.Start(parentCtx, "compaction",
      		attribute.String("node_id", coords.Node),
      		attribute.String("run_id", coords.Round),
      		attribute.Bool(otelobs.GenAIConversationCompacted, true))
      	span.End()

      	sink, ok := stream.YieldFromContext(ctx)
      	if !ok {
      		return
      	}
      	sink(stream.Compaction(coords.Node, coords.Round, int32(before), int32(after)))
      }
  assert:
    - *not_narration
    - type: llm-rubric
      metric: fact_transfer
      threshold: 0.6
      value: |
