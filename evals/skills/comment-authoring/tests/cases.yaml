- description: go invariant - a startup-only sweep callers must not run late
  vars:
    lang: go
    ask: |
      Two landmines in here I'd like written down. ScanOrphanedRuns is table-wide
      with no per-chat liveness check, so it is only safe before the Hub has
      registered any run - call it later and it stamps a chat that is very much
      alive. And it deliberately leaves pending_question alone: the node row owns
      that question now, and the last time we blanked the chat's copy we destroyed
      resume state for everyone mid-run. Comment it up, I'm handing this off.
    code: |
      package store

      import (
      	"context"
      	"log/slog"
      	"time"
      )

      const (
      	RunStatusIdle        = "idle"
      	RunStatusFailed      = "failed"
      	RunStatusInterrupted = "interrupted"
      	RunStatusPaused      = "paused"
      )

      func (s *Store) ScanOrphanedRuns(ctx context.Context) (paused, interrupted []string, err error) {
      	var chats []Chat
      	if err := s.db.WithContext(ctx).
      		Where("active_turn_id <> ? OR run_status IN ?", "", []string{RunStatusInterrupted, RunStatusPaused}).
      		Find(&chats).Error; err != nil {
      		return nil, nil, err
      	}
      	suspended, err := s.chatsWithPausedNodes(ctx)
      	if err != nil {
      		return nil, nil, err
      	}
      	for _, c := range chats {
      		status := RunStatusInterrupted
      		if suspended[c.ID] {
      			status = RunStatusPaused
      			paused = append(paused, c.ID)
      		} else {
      			interrupted = append(interrupted, c.ID)
      		}
      		if err := s.stampRunStatusKeepingQuestion(ctx, c.ID, status); err != nil {
      			slog.Warn("scan orphaned runs: stamp failed", "component", "store", "chat", c.ID, "err", err)
      		}
      	}
      	return paused, interrupted, nil
      }

      func (s *Store) stampRunStatusKeepingQuestion(ctx context.Context, chatID, status string) error {
      	return s.db.WithContext(ctx).Model(&Chat{}).Where("id = ?", chatID).Updates(map[string]any{
      		"run_status":     status,
      		"active_turn_id": "",
      		"updated_at":     time.Now().UTC(),
      	}).Error
      }

      func (s *Store) chatsWithPausedNodes(ctx context.Context) (map[string]bool, error) {
      	nodes, err := s.ListPausedDagNodes(ctx)
      	if err != nil {
      		return nil, err
      	}
      	out := map[string]bool{}
      	for _, n := range nodes {
      		var p DagPlan
      		if e := s.db.WithContext(ctx).Where("id = ?", n.PlanID).First(&p).Error; e == nil {
      			out[p.ChatID] = true
      		}
      	}
      	return out, nil
      }
  assert:
    - *not_narration
    - type: llm-rubric
      metric: fact_transfer
      threshold: 0.6
      value: |
        The requester wrote this:
        "{{ask}}"

        Judge only whether the comments the Reply added carry the facts listed below. Match on
        meaning, never on wording: a paraphrase that carries the same claim counts in full, and
        matching phrasing earns nothing extra. Read every comment in the file before answering,
        including doc comments on helpers, and quote the comment carrying each fact verbatim.
        Write NONE for a fact only after searching the whole file for it, and when you write
        NONE, name the declarations you checked.

        A fact stated as a reason plus a consequence is carried only when both halves are
        present in some comment; if one half is present and the other is not, it is half
        carried.

        A block of comment text that reproduces the requester's message as a passage, rather
        than saying something about the declaration it sits on, carries no facts. Facts must be
        stated as claims about this code.

          (a) the sweep is table-wide with no per-chat liveness check, so it is only safe to
              call before any run has been registered; calling it later stamps a chat that is
              still running.
          (b) pending_question is deliberately left untouched because the node row owns that
              question, and blanking the chat's copy destroyed resume state for in-flight runs.

        Score from 0 to 1, never above 1: award 0.5 per fact carried and 0.25 per fact half carried. Naming the helper "keeps
        the question" in prose does not carry (b) - the reason and the consequence must both be
