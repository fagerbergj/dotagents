- description: java security plus deferred work - webhook signature check
  vars:
    lang: java
    ask: |
      Last thing before this goes out: verify() is all that stands between a
      forged payload and a dispatched run, and callers have to hand it the raw
      body bytes - if anyone re-serialises the JSON first the digest won't match
      and they'll waste a day on it. Also, that .equals() is not constant time and
      leaks a timing signal; we can't move to MessageDigest.isEqual until the
      platform crypto upgrade lands, which is PLAT-4417 on Priya's board. I don't
      want either of those to be tribal knowledge, so please comment it.
    code: |
      package com.quack.webhooks;

      import java.nio.charset.StandardCharsets;
      import java.security.GeneralSecurityException;
      import java.util.HexFormat;

      import javax.crypto.Mac;
      import javax.crypto.spec.SecretKeySpec;

      public final class WebhookVerifier {

          private static final String ALGORITHM = "HmacSHA256";
          private static final String PREFIX = "sha256=";

          private final byte[] secret;

          public WebhookVerifier(String secret) {
              this.secret = secret.getBytes(StandardCharsets.UTF_8);
          }

          @Deprecated
          public boolean verify(String body, String signatureHeader) {
              return verify(body.getBytes(StandardCharsets.UTF_8), signatureHeader);
          }

          public boolean verify(byte[] rawBody, String signatureHeader) {
              if (signatureHeader == null || !signatureHeader.startsWith(PREFIX)) {
                  return false;
              }
              String provided = signatureHeader.substring(PREFIX.length());
              return sign(rawBody).equals(provided);
          }

          private String sign(byte[] body) {
              try {
                  Mac mac = Mac.getInstance(ALGORITHM);
                  mac.init(new SecretKeySpec(secret, ALGORITHM));
                  return HexFormat.of().formatHex(mac.doFinal(body));
              } catch (GeneralSecurityException e) {
                  throw new IllegalStateException("HMAC unavailable: " + ALGORITHM, e);
              }
          }
      }
  assert:
    - *not_narration
    - type: llm-rubric
      metric: fact_transfer
      threshold: 0.6
      value: |
        Judge only whether the comments the Reply added carry the facts listed below. Match on
        meaning, never on wording: a paraphrase that carries the same claim counts in full, and
        matching phrasing earns nothing extra. Read every comment in the file before answering,
        including doc comments on helpers, and quote the comment carrying each fact verbatim.
        Write NONE for a fact only after searching the whole file for it, and when you write
        NONE, name the declarations you checked.

        A fact stated as a reason plus a consequence is carried only when both halves are
        present in some comment; if one half is present and the other is not, it is half
        carried.

        A block of comment text that reproduces the requester's message as a passage, rather
        than saying something about the declaration it sits on, carries no facts. Facts must be
        stated as claims about this code.

          (a) the byte[] overload requires the raw request body exactly as received -
              re-serialising the JSON before calling changes the bytes and the digest will not
              match.
          (b) this check is the only thing between a forged payload and a dispatched run.
          (c) the string comparison of computed and provided digests is not constant time and
              leaks a timing signal.
          (d) that comparison is deferred work, not an oversight - it is tracked as PLAT-4417
              on Priya's board, and it can be removed once the platform crypto upgrade lands
              and MessageDigest.isEqual becomes available. Naming the ticket or the owner is
              one half; naming the condition that retires the deferral is the other. A comment
              that only says the comparison should be fixed later carries neither half.

        Score from 0 to 1, never above 1: award 0.25 per fact carried and 0.125 per fact half carried. A comment saying the
        method "verifies the HMAC signature" carries none. Do not score any marker keyword, its
        casing, its bracket style, or its position.

