- description: go public API - godoc contract on an encode/decode pair
  vars:
    lang: go
    ask: |
      This package is the bit three other packages import, and I keep getting
      asked the same questions in review, so I want it written down next to the
      code. Things worth knowing: the scheme is chosen so it can never collide
      with a real FileData part (gs://, https://), Decode returns ok=false for
      anything that isn't ours rather than erroring, and callers must not assume
      the revision still exists in the artifact store by the time they resolve it.
      Comment it for me.
    code: |
      package artifactref

      import (
      	"net/url"
      	"strconv"
      	"strings"

      	"google.golang.org/genai"
      )

      const AppName = "quack"

      const Scheme = "quack-artifact"

      func Encode(userID, sessionID, name string, revision int64, mimeType string) *genai.Part {
      	u := url.URL{
      		Scheme: Scheme,
      		Path:   "/" + url.PathEscape(userID) + "/" + url.PathEscape(sessionID) + "/" + url.PathEscape(name),
      	}
      	q := url.Values{}
      	q.Set("v", strconv.FormatInt(revision, 10))
      	u.RawQuery = q.Encode()
      	return &genai.Part{FileData: &genai.FileData{FileURI: u.String(), MIMEType: mimeType}}
      }

      func Decode(p *genai.Part) (userID, sessionID, name string, revision int64, ok bool) {
      	if p == nil || p.FileData == nil || p.FileData.FileURI == "" {
      		return "", "", "", 0, false
      	}
      	u, err := url.Parse(p.FileData.FileURI)
      	if err != nil || u.Scheme != Scheme {
      		return "", "", "", 0, false
      	}
      	segs := strings.Split(strings.TrimPrefix(u.Path, "/"), "/")
      	if len(segs) != 3 {
      		return "", "", "", 0, false
      	}
      	uid, err1 := url.PathUnescape(segs[0])
      	sid, err2 := url.PathUnescape(segs[1])
      	nm, err3 := url.PathUnescape(segs[2])
      	if err1 != nil || err2 != nil || err3 != nil || uid == "" || sid == "" || nm == "" {
      		return "", "", "", 0, false
      	}
      	rev, err := strconv.ParseInt(u.Query().Get("v"), 10, 64)
      	if err != nil {
      		return "", "", "", 0, false
      	}
      	return uid, sid, nm, rev, true
      }
  assert:
    - *not_narration
    - type: llm-rubric
      metric: fact_transfer
      threshold: 0.6
      value: |
        The requester wrote this:
        "{{ask}}"

        Judge only whether the comments the Reply added carry the facts listed below. Match on
        meaning, never on wording: a paraphrase that carries the same claim counts in full, and
        matching phrasing earns nothing extra. Read every comment in the file before answering,
        including doc comments on helpers, and quote the comment carrying each fact verbatim.
        Write NONE for a fact only after searching the whole file for it, and when you write
        NONE, name the declarations you checked.

        A fact stated as a reason plus a consequence is carried only when both halves are
        present in some comment; if one half is present and the other is not, it is half
        carried.

        A block of comment text that reproduces the requester's message as a passage, rather
        than saying something about the declaration it sits on, carries no facts. Facts must be
        stated as claims about this code.

          (a) the URI scheme is chosen so it can never collide with a real FileData part such as
              a gs:// or https:// URI.
          (b) Decode reports ok=false for any part that is not one of ours rather than returning
              an error - a false result is a normal outcome, not a failure.
          (c) a successful Decode does not mean the revision still exists in the artifact store,
              so callers must not assume it is resolvable.

        Score from 0 to 1, never above 1: award 0.34 per fact carried and 0.17 per fact half carried. A doc comment that only
        restates the signature carries none of them.

        Ignore comment placement, length and syntax.
        Also ignore whether the comment opens with the identifier name.
    # Placement only, and a conformance floor rather than a discriminator: go doc and
    # pkgsite drop a comment that is not immediately above the declaration, so the
    # rendered artifact differs. The name-prefix half is gone - it patterns over the
    # comment's prose and is the skill's own instruction.
    - type: regex
      value: '(?:^|\n)(?://[^\n]*\n)+func Encode\('
      metric: doc_placement_floor
