- description: python public API - client method with a clamp and an error contract
  vars:
    lang: python
    ask: |
      This is the only thing outside the package that other teams import, and I'd
      rather write it down once than answer it in Slack again. What they need:
      limit is clamped at 100 because the server silently clamps it anyway and
      then the page you get back doesn't match the number you asked for; a 429 is
      retried twice with whatever Retry-After says and everything else raises
      requests.HTTPError; an empty result is an empty page, not an exception; and
      iter_all holds a cursor, so it is not safe to share one across threads.
      Comment it before I tag the release.
    code: |
      from dataclasses import dataclass
      from typing import Any, Iterator, Optional
      import time
      import warnings

      import requests


      @dataclass
      class Page:
          items: list[dict[str, Any]]
          cursor: Optional[str]


      class MemoryClient:
          def __init__(self, base_url: str, token: str, session: Optional[requests.Session] = None):
              self.base_url = base_url.rstrip("/")
              self.token = token
              self.session = session or requests.Session()

          def search(self, query: str, bucket: Optional[str] = None, limit: int = 20, cursor: Optional[str] = None, page_size: Optional[int] = None) -> Page:
              if page_size is not None:
                  warnings.warn("page_size is deprecated, use limit", DeprecationWarning, stacklevel=2)
                  limit = page_size
              params: dict[str, Any] = {"q": query, "limit": min(limit, 100)}
              if bucket:
                  params["bucket"] = bucket
              if cursor:
                  params["cursor"] = cursor
              for attempt in range(3):
                  response = self.session.get(
                      f"{self.base_url}/v1/memory/search",
                      params=params,
                      headers={"Authorization": f"Bearer {self.token}"},
                      timeout=10,
                  )
                  if response.status_code == 429 and attempt < 2:
                      time.sleep(float(response.headers.get("Retry-After", 1)))
                      continue
                  response.raise_for_status()
                  break
              body = response.json()
              return Page(items=body["items"], cursor=body.get("next_cursor"))

          def iter_all(self, query: str, **kwargs: Any) -> Iterator[dict[str, Any]]:
              cursor = None
              while True:
                  page = self.search(query, cursor=cursor, **kwargs)
                  yield from page.items
                  if not page.cursor:
                      return
                  cursor = page.cursor
  assert:
    - *not_narration
    - type: llm-rubric
      metric: fact_transfer
      threshold: 0.6
      value: |
