- description: python constraint - a refresh cooldown and the streak that escalates past it
  vars:
    lang: python
    ask: |
      Can you comment this up before I push it back? Review read the cooldown as
      rate-limiting the user, which it is not. The 30 seconds exists to short-circuit
      the token-endpoint round trip while the authorization server is down - it is a
      cost thing, not a punishment. The five-strike ambiguous streak is the opposite
      direction: a rejection we cannot classify but that keeps happening escalates to
      re-consent, so a dead grant in some non-standard shape can't strand the user
      forever. And last_failure_permanent only ever gets armed on the obo path,
      because that path's shared credential survives a per-server revoke - the
      in-cooldown short-circuit reads it so it tells the user "re-login" instead of a
      misleading "try again". A transient or ambiguous arm resets it to False on
      purpose so a later transient window can't inherit a stale permanent flag.
    code: |
      from __future__ import annotations

      import time
      from dataclasses import dataclass
      from typing import Any

      from turnstone.core.mcp_types import TokenLookupResult

      _REFRESH_TRANSIENT_COOLDOWN_SECONDS = 30.0
      _AMBIGUOUS_ESCALATION_THRESHOLD = 5

      @dataclass
      class _RefreshBackoffState:

          last_failure_monotonic: float = 0.0
          ambiguous_streak: int = 0
          last_failure_permanent: bool = False

      def _refresh_backoff_state(app_state: Any, user_id: str, server_name: str) -> _RefreshBackoffState:
          states = getattr(app_state, "mcp_oauth_refresh_backoff", None)
          if states is None:
              states = {}
              app_state.mcp_oauth_refresh_backoff = states
          key = (user_id, server_name)
          state = states.get(key)
          if state is None:
              state = _RefreshBackoffState()
              states[key] = state
          return state

      def _arm_cooldown(
          app_state: Any, user_id: str, server_name: str, *, permanent: bool = False
      ) -> _RefreshBackoffState:
          state = _refresh_backoff_state(app_state, user_id, server_name)
          state.last_failure_monotonic = time.monotonic()
          state.last_failure_permanent = permanent
          return state

      def _clear_refresh_backoff(app_state: Any, user_id: str, server_name: str) -> None:
          states = getattr(app_state, "mcp_oauth_refresh_backoff", None)
          if isinstance(states, dict):
              states.pop((user_id, server_name), None)

      def _refresh_in_cooldown(app_state: Any, user_id: str, server_name: str) -> bool:
          states = getattr(app_state, "mcp_oauth_refresh_backoff", None)
          if not isinstance(states, dict):
              return False
          state: _RefreshBackoffState | None = states.get((user_id, server_name))
          if state is None or not state.last_failure_monotonic:
              return False
          elapsed = time.monotonic() - state.last_failure_monotonic
          return elapsed < _REFRESH_TRANSIENT_COOLDOWN_SECONDS

      def _token_result(
          app_state: Any, user_id: str, server_name: str, token: str | None
      ) -> TokenLookupResult:
          _clear_refresh_backoff(app_state, user_id, server_name)
          return TokenLookupResult(kind="token", token=token)
  assert:
    # not_narration, enumerate-and-divide. The three-band holistic version had the
    # worst per-cell spread in the suite (0.568 over five identical runs) even at
    # n=11, cells wandering [0, 0.5, 0, 1, 0.5] between runs. A false claim is
    # counted as an F term instead of capping the row: a cap is a binary switch
    # bolted onto a graded scale. Anchored here and aliased by the eight other
    # cases that hide something. The negative controls do not carry it - scoring
    # (K - F) / N would score a reply that correctly adds nothing at 0, so those
    # are graded by restraint instead.
    - &not_narration
      type: llm-rubric
      metric: not_narration
      threshold: 0.6
      value: |
        Google's C++ style guide, under "Don'ts", says: "Do not state the obvious. In
        particular, don't literally describe what code does, unless the behavior is
        nonobvious to a reader who understands C++ well. Instead, provide higher-level
        comments that describe why the code does what it does, or make the code
        self-describing." It adds that "Self-describing code doesn't need a comment."
        Pascarella and Bacchelli (MSR 2017) hand-classified comments in 2,000 Java files
        and found summary comments outnumbering rationale comments by roughly twenty to
        one, which is the failure this scores.

        Judge only the comments the Reply added. Ignore where comments sit, their length,
        their syntax, and their punctuation. Judge what they say.

        List every comment the Reply added, quoting each verbatim and numbering them. Let N
        be that count. For each numbered comment answer, in one line:
          - the constraint, cause, contract, or consequence it states, quoted; or NARRATION
            if a competent programmer in this language, reading only the identifiers and
            statements it sits beside, would already know what it says; or FALSE if it makes
            a claim that is not true of this code.
        Answer for every comment before scoring. Do not group them.

        Let K be the number answered with a quoted constraint, cause, contract, or
        consequence. Let F be the number answered FALSE.

        Score from 0 to 1, never above 1: (K - F) / N, floored at 0. If N is 0, score 0.
        State N, K, F and the arithmetic in your reason.
    - type: llm-rubric
      metric: fact_transfer
      threshold: 0.6
      value: |
        The requester wrote this:
        "{{ask}}"

        Judge only whether the comments the Reply added carry the facts listed below. Match on
        meaning, never on wording: a paraphrase that carries the same claim counts in full, and
        matching phrasing earns nothing extra. Read every comment in the file before answering,
        including doc comments on helpers, and quote the comment carrying each fact verbatim.
        Write NONE for a fact only after searching the whole file for it, and when you write
        NONE, name the declarations you checked.

        A fact stated as a reason plus a consequence is carried only when both halves are
        present in some comment; if one half is present and the other is not, it is half
        carried.

        A block of comment text that reproduces the requester's message as a passage, rather
        than saying something about the declaration it sits on, carries no facts. Facts must be
        stated as claims about this code.

          (a) the cooldown exists to skip the token-endpoint round trip while the authorization
              server is down, not to rate-limit the user.
          (b) the ambiguous streak escalates an unclassifiable but persistent rejection to
              re-consent, so a dead grant in a non-standard shape cannot strand the user forever.
          (c) the permanent flag is armed only on the path whose shared credential survives a
              per-server revoke, and the in-cooldown short-circuit reads it so it reports the
              honest permanent outcome instead of a misleading "retry".
          (d) a transient or ambiguous arm resets that flag so a later transient window cannot
              inherit a stale permanent classification.

