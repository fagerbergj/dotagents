- description: python workaround - a cancellation shield that has to be retried
  vars:
    lang: python
    ask: |
      Nobody remembers why this loops instead of just awaiting the shield once, and
      someone already "simplified" it and gave us leaked TLS sessions for a week. A
      one-shot asyncio.shield still returns immediately the moment its own caller is
      cancelled - the shielded task keeps running but nothing owns or observes it any
      more. Retrying the shield is what keeps the cleanup owned until it actually
      finishes. The two CancelledError cases are different on purpose: if the cleanup
      task itself was cancelled we stop, and if it was the caller we remember that and
      keep draining, then re-raise it afterwards so the caller still sees its
      cancellation. And when we have both a remembered cancellation and a cleanup
      error, the cancellation wins and the error is only logged - swallowing the
      cancellation would be the worse bug. Comment it so the next person leaves it
      alone.
    code: |
      from __future__ import annotations

      from collections.abc import Coroutine
      from typing import Any

      from turnstone.core.log import get_logger

      log = get_logger(__name__)

      async def complete_tls_cleanup(cleanup: Coroutine[Any, Any, None]) -> None:
          import asyncio

          task = asyncio.create_task(cleanup)
          cancellation: asyncio.CancelledError | None = None
          while not task.done():
              try:
                  await asyncio.shield(task)
              except asyncio.CancelledError as exc:
                  if task.done() and task.cancelled():
                      break
                  if cancellation is None:
                      cancellation = exc

          cleanup_error: BaseException | None = None
          try:
              task.result()
          except BaseException as exc:
              cleanup_error = exc

          if cancellation is not None:
              if cleanup_error is not None:
                  log.error(
                      "tls.cleanup.failed_during_cancellation",
                      error=f"{type(cleanup_error).__name__}: {cleanup_error}",
                  )
              raise cancellation
          if cleanup_error is not None:
              raise cleanup_error
  assert:
    - *not_narration
    - type: llm-rubric
      metric: fact_transfer
      threshold: 0.6
      value: |
        The requester wrote this:
        "{{ask}}"

        Judge only whether the comments the Reply added carry the facts listed below. Match on
        meaning, never on wording: a paraphrase that carries the same claim counts in full, and
        matching phrasing earns nothing extra. Read every comment in the file before answering,
        including doc comments on helpers, and quote the comment carrying each fact verbatim.
        Write NONE for a fact only after searching the whole file for it, and when you write
        NONE, name the declarations you checked.

        A fact stated as a reason plus a consequence is carried only when both halves are
        present in some comment; if one half is present and the other is not, it is half
        carried.

        A block of comment text that reproduces the requester's message as a passage, rather
        than saying something about the declaration it sits on, carries no facts. Facts must be
        stated as claims about this code.

          (a) a one-shot shield still returns as soon as its own caller is cancelled, leaving the
              cleanup running but unowned and unobserved - which is why the shield is retried in
              a loop rather than awaited once.
          (b) the two cancellation cases are handled differently on purpose: the cleanup task being
              cancelled ends the wait, while the caller being cancelled is remembered and the
              drain continues.
          (c) the remembered caller cancellation is re-raised after cleanup finishes, so the caller
              still observes its own cancellation rather than having it swallowed.
          (d) when both a remembered cancellation and a cleanup error exist the cancellation is
              raised and the error only logged, because dropping the cancellation is the worse
              failure.

        Score from 0 to 1, never above 1: award 0.25 per fact carried and 0.125 per fact half carried. A
        comment that only narrates the loop ("wait for the task, catch CancelledError, re-raise")
        carries none of them.

        Ignore comment placement, length and syntax.
- description: python security - credential redaction on everything that gets persisted
  vars:
    lang: python
    ask: |
      This is the thing standing between a leaked secret and our audit tables -
      whatever gets past it lands in close_reason rows, audit details and the
      coordinator inspect surfaces, and those stick around. Three things people keep
      trying to "clean up". http and https are in the connection-string scheme list
      deliberately: a misconfigured base URL with user:pass@ in it ends up inside an
      httpx error string, and the user:pass@ shape is specific enough that a plain
      host:port with no @ does not match. The single-quoted JSON pattern is not a
      duplicate - Python dict reprs and JS object literals emit single quotes and the
      double-quoted one misses them completely. And the JSON substitution is
      positional off group 1 rather than a plain sub because otherwise the key gets
      mangled whenever the value happens to equal the key name. Comment it before I
      open the PR.
    code: |
      from __future__ import annotations

      import re

      _RE_PRIVATE_KEY_BLOCK = re.compile(
          r"-----BEGIN\s+(?:RSA\s+|EC\s+|OPENSSH\s+|PGP\s+)?PRIVATE\s+KEY-----"
          r"[\s\S]*?"
          r"-----END\s+(?:RSA\s+|EC\s+|OPENSSH\s+|PGP\s+)?PRIVATE\s+KEY-----",
      )
      _RE_CONNECTION_STRING = re.compile(
          r"(?:postgresql|mysql|mongodb|rediss?|amqps?|sqlite|https?)(?:\+[a-z0-9]*)?"
          r"://[^:@\s]+:[^@\s]+@",
          re.IGNORECASE,
      )
      _RE_ENV_SECRET_LINE = re.compile(r"[A-Z][A-Z_0-9]+=\S+")
      _RE_ENV_SECRET_KEY = re.compile(
          r"(?:^|_)(?:SECRET|TOKEN|PASSWORD|CREDENTIAL|DSN)(?:_|$)"
          r"|(?:^|_)KEY(?:_|$)"
          r"|^(?:DATABASE_URL|TURNSTONE_DB_URL|DB_URL)$",
          re.IGNORECASE,
      )
      _RE_JSON_SECRET = re.compile(
          r'"(?:api_key|apikey|api_secret|secret_key|secret|password|passwd|'
          r"token|access_token|refresh_token|auth_token|private_key|"
          r"client_secret|webhook_secret|signing_key|encryption_key|"
          r"x_api_key|x-api-key|"
          r'authorization)"\s*:\s*"([^"]{8,})"',
          re.IGNORECASE,
      )
      _RE_JSON_SECRET_SQ = re.compile(
          r"'(?:api_key|apikey|api_secret|secret_key|secret|password|passwd|"
          r"token|access_token|refresh_token|auth_token|private_key|"
          r"client_secret|webhook_secret|signing_key|encryption_key|"
          r"x_api_key|x-api-key|"
          r"authorization)'\s*:\s*'([^']{8,})'",
          re.IGNORECASE,
      )

      _CREDENTIAL_PATTERNS: list[tuple[re.Pattern[str], str]] = [
          (re.compile(r"sk-proj-[a-zA-Z0-9\-]{20,}"), "api_key"),
          (re.compile(r"sk-[a-zA-Z0-9]{20,}"), "api_key"),
          (re.compile(r"ghp_[a-zA-Z0-9]{36}"), "api_key"),
          (re.compile(r"gho_[a-zA-Z0-9]{36}"), "api_key"),
          (re.compile(r"AKIA[0-9A-Z]{16}"), "api_key"),
          (re.compile(r"AIza[a-zA-Z0-9_\-]{35}"), "api_key"),
          (re.compile(r"Bearer\s+[a-zA-Z0-9._~+/=\-]{20,}", re.IGNORECASE), "api_key"),
          (
              re.compile(
                  r"(?:(?:api|secret|session|auth|encryption|signing|private|public|access|"
                  r"secret_access|aws_secret_access)_?key|"
                  r"(?<![a-zA-Z0-9_])key)="
                  r"[a-zA-Z0-9]{20,}"
              ),
              "api_key",
          ),
          (
              re.compile(
                  r"(?:(?:access|refresh|auth|api|session|bearer|secret)_?token|"
                  r"(?<![a-zA-Z0-9_])token)="
                  r"[a-zA-Z0-9]{20,}"
              ),
              "api_key",
          ),
      ]

      def redact_credentials(text: str) -> str:
          return _redact_credentials(text)

      def _redact_credentials(text: str) -> str:
          result = _RE_PRIVATE_KEY_BLOCK.sub("[REDACTED:private_key]", text)

          def _redact_conn(m: re.Match[str]) -> str:
              return re.sub(r"://([^:@\s]+):([^@\s]+)@", r"://\1:[REDACTED:password]@", m.group())

          result = _RE_CONNECTION_STRING.sub(_redact_conn, result)
          for pattern, redact_type in _CREDENTIAL_PATTERNS:
              result = pattern.sub(f"[REDACTED:{redact_type}]", result)

          def _redact_env(m: re.Match[str]) -> str:
              key = m.group().split("=", 1)[0]
              return key + "=[REDACTED:secret]" if _RE_ENV_SECRET_KEY.search(key) else m.group()

          result = _RE_ENV_SECRET_LINE.sub(_redact_env, result)

          def _redact_json_secret(m: re.Match[str]) -> str:
              start = m.start(1) - m.start()
              end = m.end(1) - m.start()
              full = m.group()
              return full[:start] + "[REDACTED:secret]" + full[end:]

          result = _RE_JSON_SECRET.sub(_redact_json_secret, result)
          result = _RE_JSON_SECRET_SQ.sub(_redact_json_secret, result)
          return result
  assert:
    - *not_narration
    - type: llm-rubric
      metric: fact_transfer
      threshold: 0.6
      value: |
        The requester wrote this:
        "{{ask}}"

        Judge only whether the comments the Reply added carry the facts listed below. Match on
        meaning, never on wording: a paraphrase that carries the same claim counts in full, and
        matching phrasing earns nothing extra. Read every comment in the file before answering,
        including doc comments on helpers, and quote the comment carrying each fact verbatim.
        Write NONE for a fact only after searching the whole file for it, and when you write
        NONE, name the declarations you checked.

        A fact stated as a reason plus a consequence is carried only when both halves are
        present in some comment; if one half is present and the other is not, it is half
        carried.

        A block of comment text that reproduces the requester's message as a passage, rather
        than saying something about the declaration it sits on, carries no facts. Facts must be
        stated as claims about this code.

          (a) whatever survives this is persisted - close_reason rows, audit details, the
              coordinator inspect surfaces - so a miss is a durable disclosure rather than a
              transient one.
          (b) http and https are in the connection-string scheme set on purpose, because a
              misconfigured base URL carrying user:pass@ reaches this through an httpx error
              string; the user:pass@ shape is what keeps a bare host:port from matching.
          (c) the single-quoted JSON pattern exists because Python dict reprs and JS object literals
              emit single quotes, which the double-quoted pattern does not match at all.
          (d) the JSON value is replaced by group-1 offsets rather than a plain substitution so the
              key is not corrupted when the value equals the key name.

        Score from 0 to 1, never above 1: award 0.25 per fact carried and 0.125 per fact half carried. A
        comment that only labels the pattern list "credential patterns" or the function
        "redacts secrets" carries none of them.

        Ignore comment placement, length and syntax.
- description: python performance - a decode bound that the library's own ceiling does not enforce
  vars:
    lang: python
    ask: |
      Someone is going to look at this and delete the explicit pixel check because
      "MAX_IMAGE_PIXELS already does that". It does not: Pillow only RAISES above
      twice the cap - between the cap and 2x it just warns and decodes the whole
      thing, so a 40-80M pixel image still lands as ~480MB of RGB. That is why there
      is an explicit check, why it runs on the header-declared size straight after
      open() and before exif_transpose or convert (both of those decode the pixels),
      and why it is a check and not a warnings filter - this runs in a thread and the
      global warnings state is not thread-safe. The 40M cap is deliberately below
      PIL's ~89M default, which still lets a few-KB file decode to something like
      530MB. Can you comment it so nobody simplifies it away?
    code: |
      from __future__ import annotations

      from io import BytesIO

      from turnstone.core.log import get_logger

      log = get_logger(__name__)

      _THUMB_MAX_PX = 160

      _MAX_IMAGE_PIXELS = 40_000_000

      def make_thumbnail(data: bytes, kind: str, *, max_px: int = _THUMB_MAX_PX) -> bytes | None:
          try:
              from PIL import Image, ImageOps
          except ImportError:
              log.warning("Pillow not installed; thumbnails unavailable")
              return None

          Image.MAX_IMAGE_PIXELS = _MAX_IMAGE_PIXELS
          try:
              if kind == "pdf":
                  from turnstone.core.pdf import rasterize_pdf

                  pages = rasterize_pdf(data, max_pages=1)
                  if not pages:
                      return None
                  img = Image.open(BytesIO(pages[0]))
              elif kind == "image":
                  img = Image.open(BytesIO(data))
              else:
                  return None
              px = img.size[0] * img.size[1]
              if px > _MAX_IMAGE_PIXELS:
                  log.warning(
                      "thumbnail rejected: %d×%d (%d px) exceeds %d-pixel cap",
                      img.size[0],
                      img.size[1],
                      px,
                      _MAX_IMAGE_PIXELS,
                  )
                  return None
              oriented = ImageOps.exif_transpose(img) or img
              rgb = oriented.convert("RGB")
              rgb.thumbnail((max_px, max_px))
              buf = BytesIO()
              rgb.save(buf, format="PNG")
              return buf.getvalue()
          except Image.DecompressionBombError as exc:
              log.warning("thumbnail rejected: image exceeds %d-pixel cap: %s", _MAX_IMAGE_PIXELS, exc)
              return None
