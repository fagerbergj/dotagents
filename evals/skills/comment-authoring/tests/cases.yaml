- description: go performance - the ugly cap ladder that keeps a request under budget
  vars:
    lang: go
    ask: |
      I know this looks like something written at 2am, and it sort of was. The
      three-pass cap ladder is deliberate: one pass at 500 chars shreds tool
      results that would have fit fine at 8k, so we squeeze in stages and stop as
      soon as we're under. The char-per-token divisor of 4 and the 1.3 calibration
      ratio came out of comparing our estimate against what the provider actually
      billed us. Can you put some comments on it so the next reader doesn't
      "simplify" it into a single pass?
    code: |
      package agent

      import (
      	"log/slog"

      	adkagent "google.golang.org/adk/v2/agent"
      	"google.golang.org/adk/v2/model"
      	"google.golang.org/genai"
      )

      const (
      	charsPerToken           = 4
      	toolOutputMaxChars      = 2_000
      	minPreserveTokens       = 2_000
      	defaultCalibrationRatio = 1.3
      )

      func backstop(ctx adkagent.Context, req *model.LLMRequest, threshold int) {
      	if len(req.Contents) == 0 {
      		return
      	}
      	ratio := defaultCalibrationRatio
      	overhead := intState(ctx, overheadKey)

      	if head := calibrated(estimateTokens(req.Contents[:1]), ratio, overhead); head > threshold {
      		if truncateHeadToFit(req.Contents, threshold, ratio) {
      			slog.Warn("compaction truncated an oversized prompt as a last resort",
      				"component", "agent", "threshold", threshold, "head_tokens", head)
      		}
      	}
      	for _, cap := range []int{8_000, toolOutputMaxChars, 500} {
      		if calibrated(estimateTokens(req.Contents), ratio, overhead) <= threshold {
      			break
      		}
      		if n := clampToolResults(req.Contents[1:], cap); n > 0 {
      			slog.Warn("compaction clamped oversized tool results",
      				"component", "agent", "clamped", n, "cap_chars", cap)
      		}
      	}
      	if got := calibrated(estimateTokens(req.Contents), ratio, overhead); got > threshold {
      		slog.Warn("compaction could not bring request under budget; overflow likely",
      			"component", "agent", "calibrated_tokens", got, "threshold", threshold)
      	}
      }

      func truncateHeadToFit(contents []*genai.Content, budget int, ratio float64) bool {
      	if len(contents) == 0 || contents[0] == nil {
      		return false
      	}
      	headBudgetEst := int(float64(budget)/ratio) - estimateTokens(contents[1:])
      	if headBudgetEst < minPreserveTokens {
      		headBudgetEst = minPreserveTokens
      	}
      	headMaxChars := headBudgetEst * charsPerToken
      	if contentBytes(contents[0]) <= headMaxChars {
      		return false
      	}
      	contents[0] = truncateContentMiddle(contents[0], headMaxChars)
      	return true
      }
  assert:
