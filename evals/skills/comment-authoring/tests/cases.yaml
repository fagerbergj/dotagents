        PEP 257: "The docstring for a function or method should summarize its behavior and
        document its arguments, return value(s), side effects, exceptions raised, and
        restrictions on when it can be called (all if applicable)." It is a should, and the
        parenthetical is the source's own - a fact that does not apply to this code is not
        owed a line.

        Judge only whether the comments the Reply added carry the facts listed below. Match on
