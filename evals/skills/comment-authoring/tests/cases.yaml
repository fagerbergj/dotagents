- description: typescript public API - the SDK base client other packages extend
  vars:
    lang: ts
    ask: |
      Handing this to the integrations team tomorrow and they will use it without
      reading the body. Things they will trip on: the tls option is documentation
      only - the SDK never opens those files, and anyone who actually needs mTLS has
      to pass their own fetch wired to their runtime's agent; Content-Type is left
      off deliberately when form is set, because the runtime's fetch writes it along
      with the multipart boundary and setting it ourselves breaks the upload; a
      non-2xx always arrives as a TurnstoneAPIError carrying the status, with the
      message taken from error, then detail, then the raw body; and baseUrl has its
      trailing slash stripped in the constructor, so every path they pass needs a
      leading slash. Comment it up for them.
    code: |
      import { TurnstoneAPIError } from "./errors.js";
      import { parseSSEStream } from "./sse.js";

      export interface TlsOptions {
        caCert?: string;
        clientCert?: string;
        clientKey?: string;
      }

      export interface ClientOptions {
        baseUrl: string;
        token?: string;
        fetch?: typeof globalThis.fetch;
        tls?: TlsOptions;
      }

      export interface RequestOptions {
        json?: object;
        params?: Record<string, string | number>;
        form?: FormData;
      }

      export class BaseClient {
        protected readonly baseUrl: string;
        protected readonly token: string;
        protected readonly fetchFn: typeof globalThis.fetch;

        constructor(options: ClientOptions) {
          this.baseUrl = options.baseUrl.replace(/\/$/, "");
          this.token = options.token ?? "";
          this.fetchFn = options.fetch ?? globalThis.fetch.bind(globalThis);
        }

        protected async request<T>(
          method: string,
          path: string,
          options?: RequestOptions,
        ): Promise<T> {
          const headers: Record<string, string> = {};
          if (!options?.form) {
            headers["Content-Type"] = "application/json";
          }
          if (this.token) {
            headers["Authorization"] = `Bearer ${this.token}`;
          }

          const url = this._buildUrl(path, options?.params);

          let body: BodyInit | undefined;
          if (options?.form) {
            body = options.form;
          } else if (options?.json) {
            body = JSON.stringify(options.json);
          }

          const resp = await this.fetchFn(url, {
            method,
            headers,
            body,
          });

          if (!resp.ok) {
            let msg = "";
            try {
              const errBody = (await resp.json()) as Record<string, unknown>;
              msg = (errBody.error as string) ?? (errBody.detail as string) ?? "";
            } catch {
              msg = await resp.text().catch(() => "");
            }
            throw new TurnstoneAPIError(resp.status, msg || `HTTP ${resp.status}`);
          }

          return (await resp.json()) as T;
        }

        private _buildUrl(
          path: string,
          params?: Record<string, string | number>,
        ): string {
          let url = `${this.baseUrl}${path}`;
          if (params) {
            const searchParams = new URLSearchParams();
            for (const [key, value] of Object.entries(params)) {
              if (value !== undefined && value !== "") {
                searchParams.set(key, String(value));
              }
            }
            const qs = searchParams.toString();
            if (qs) url += `?${qs}`;
          }
          return url;
        }

        protected async *streamSSE<T = Record<string, unknown>>(
          path: string,
          params?: Record<string, string | number>,
          signal?: AbortSignal,
        ): AsyncIterableIterator<T> {
          const headers: Record<string, string> = {
            Accept: "text/event-stream",
          };
          if (this.token) {
            headers["Authorization"] = `Bearer ${this.token}`;
          }

          let url = `${this.baseUrl}${path}`;
          if (params) {
            const searchParams = new URLSearchParams();
            for (const [key, value] of Object.entries(params)) {
              if (value !== undefined && value !== "") {
                searchParams.set(key, String(value));
              }
            }
            const qs = searchParams.toString();
            if (qs) url += `?${qs}`;
          }

          const resp = await this.fetchFn(url, { method: "GET", headers, signal });
          if (!resp.ok) {
            throw new TurnstoneAPIError(
              resp.status,
              `SSE connection failed: HTTP ${resp.status}`,
            );
          }

          yield* parseSSEStream<T>(resp);
        }
      }
