      metric: doc_placement_floor


- description: negative control - plain unexported Go list helpers
  vars:
    lang: go
    ask: |
      Housekeeping file I split out of the sidebar handler, going in the same PR.
      Give it whatever comments you think it needs and send it back.
    code: |
      package chatlist

      import (
      	"sort"
      	"strings"
      )

      type chat struct {
      	ID        string
      	Title     string
      	Status    string
      	UpdatedAt string
      }

      func title(c chat) string {
      	if strings.TrimSpace(c.Title) == "" {
      		return "Untitled chat"
      	}
      	return c.Title
      }

      func ids(chats []chat) []string {
      	out := make([]string, 0, len(chats))
      	for _, c := range chats {
      		out = append(out, c.ID)
      	}
      	return out
      }

      func byID(chats []chat) map[string]chat {
      	out := make(map[string]chat, len(chats))
      	for _, c := range chats {
      		out[c.ID] = c
      	}
      	return out
      }

      func withStatus(chats []chat, status string) []chat {
      	var out []chat
      	for _, c := range chats {
      		if c.Status == status {
      			out = append(out, c)
      		}
      	}
      	return out
      }

      func sortByUpdated(chats []chat) {
      	sort.Slice(chats, func(i, j int) bool {
      		return chats[i].UpdatedAt > chats[j].UpdatedAt
      	})
      }
  assert:
    # restraint, enumerate-and-divide over a countable property of the input.
    # comment_budget was merged in here: a javascript ceiling on the number of
    # added comments and a rubric asking whether they earned their place are the
    # same question from two directions, and both rode the same two cases. The
    # three-band version this replaces measured 0.500 per-cell spread over five
    # identical runs and behaved binomially; it also pinned the Go control at 0 in
    # both arms across all five, because its "two or more restatements" band
    # collapsed five narration comments and six to the same score. D is counted
    # from the delivered file, so it is identical across arms and runs - not a
    # magic number. Prompt echo is counted as OFF-TOPIC rather than capping the
    # row: the baseline pasted the requester's own chat message into the source
    # and scored 1.00 on the rubric this replaces.
    # llm-rubric's stock user message is <Output>/<Rubric> only, so neither the
    # request nor the pre-comment source file reached the judge: "text copied from
    # the request" and "the comments the Reply added" were both unverifiable. The
    # rubricPrompt puts them in front of it. Object/message-list shape is legal on
    # an assertion but not under defaultTest.options.
    - &restraint
      type: llm-rubric
      metric: restraint
      threshold: 0.6
      rubricPrompt:
      - role: system
        content: 'You grade a delivered file against a rubric. Reply with one line of JSON and nothing
          else: {"reason": string, "pass": boolean, "score": number}. Never emit a newline inside the JSON.'
      - role: user
        content: "<Request>\n{{ask}}\n</Request>\n<SourceFile>\n{{code}}\n</SourceFile>\n<Output>\n{{output}}\n</Output>\n<Rubric>\n{{rubric}}\n</Rubric>"
      value: |
        The SourceFile above is this file as the requester sent it, before any comments; every comment in
        the Reply is one the Reply added. The Request above is what they asked for.

        Google's style guidance sets the default the other way and then names the exception:
        "Almost every function declaration should have comments immediately preceding it
        that describe what the function does and how to use it. These comments may be
        omitted only if the function is simple and obvious (e.g., simple accessors for
        obvious properties of the class). Private methods and functions declared in .cc
        files are not exempt." Being unexported or private buys nothing here. What the same
        guide does rule out is the comment that says nothing: "Do not state the obvious. In
        particular, don't literally describe what code does", and "Self-describing code
        doesn't need a comment." Judged against that pair, most of this file is simple and
        obvious enough to fall under the exception and needs no comment at all - but that is
        a judgement about these particular declarations, not a rule that private code goes
        uncommented.

        Count the top-level declarations in the delivered file - functions, methods, types,
        exported constants. Call that D; state it.

        List every comment the Reply added, quoting each verbatim. For each, answer one of:
          - CARRIES: quote the assumption, constraint, or consequence it states that the
            identifiers and statements beside it do not - for example that a timestamp field
            is sorted as a string and so must be in a lexicographically ordered format.
          - RESTATES: a competent programmer reading only the code beside it would already
            know what it says.
          - OFF-TOPIC: it is not about the code beside it - a reply to the requester, a note
            about the task, or text copied from the request.
        Judge only what the comment says - never its placement, length, syntax, or
        punctuation. A fluent, accurate, well-phrased comment on self-evident code is
        RESTATES, exactly as a clumsy one is; quality of writing is not a defence for a
        comment that was not needed.

        Let U be the number answered RESTATES or OFF-TOPIC.

        Score from 0 to 1, never above 1: 1 - (U / D), floored at 0. Adding no comments at
        all scores 1. State D, U and the arithmetic in your reason.


- description: negative control - self-evident TypeScript view helpers
  vars:
    lang: ts
    ask: |
      Small one. Pulled these out of the chat list component so they can be unit
      tested. Anything you'd add before I open the PR?
    code: |
      export type Status = 'queued' | 'running' | 'needs_input' | 'idle' | 'failed'

      export interface ChatSummary {
        id: string
        title: string
        status: Status
        updated_at: string
      }

      const STATUS_LABELS: Record<Status, string> = {
        queued: 'Queued',
        running: 'Running',
        needs_input: 'Needs input',
        idle: 'Idle',
        failed: 'Failed',
      }

      export function statusLabel(status: Status): string {
        return STATUS_LABELS[status]
      }

      export function chatTitle(chat: ChatSummary): string {
        return chat.title.trim() || 'Untitled chat'
      }

      export function matchesQuery(chat: ChatSummary, query: string): boolean {
        const needle = query.trim().toLowerCase()
        if (!needle) return true
        return chatTitle(chat).toLowerCase().includes(needle)
      }

      export function countByStatus(chats: ChatSummary[]): Record<string, number> {
        const counts: Record<string, number> = {}
        for (const chat of chats) counts[chat.status] = (counts[chat.status] ?? 0) + 1
        return counts
      }

      export function sortByUpdated(chats: ChatSummary[]): ChatSummary[] {
        return [...chats].sort((a, b) => b.updated_at.localeCompare(a.updated_at))
      }
  assert:
    - *restraint

- description: negative control - unexported Go table-rendering helpers
  vars:
    lang: go
    ask: |
      Little table printer I pulled out of the status command so it can be tested
      on its own. Comment pass before it goes in - what would you put in it?
    code: |
      package render

      import "strings"

      type column struct {
      	header string
      	width  int
      }

      func pad(s string, width int) string {
      	if len(s) >= width {
      		return s
      	}
      	return s + strings.Repeat(" ", width-len(s))
      }

      func widest(values []string) int {
      	max := 0
      	for _, v := range values {
      		if len(v) > max {
      			max = len(v)
      		}
      	}
      	return max
      }

      func headerLine(cols []column) string {
      	parts := make([]string, 0, len(cols))
      	for _, c := range cols {
      		parts = append(parts, pad(c.header, c.width))
      	}
      	return strings.Join(parts, "  ")
      }

      func rule(cols []column) string {
      	total := 0
      	for _, c := range cols {
      		total += c.width + 2
      	}
      	return strings.Repeat("-", total-2)
      }
  assert:
    - *restraint


