- description: python invariant - a boot-only sweep callers must not run late
  vars:
    lang: python
    ask: |
      Two landmines in here I want written down before I hand it off.
      prepare_pem_runtime_dir wipes every lacme-pem-* directory under the root, so it
      is a boot-only call - run it after the live dir has been written and you have
      just deleted the cert the container healthcheck presents. It also assumes one
      node per PEM root: two processes sharing a root clear each other's live dirs,
      which is why bare metal has to set TURNSTONE_TLS_PEM_DIR per node. The symlink
      and ownership refusal is not paranoia either - the default root is in shared
      /tmp, where a local user can pre-create it and redirect where the key material
      lands. And refresh_runtime_pems writes the new directory before removing the old
      one on purpose, so a probe that lands mid-renewal always finds at least one
      complete dir. Comment it up.
    code: |
      from __future__ import annotations

      from pathlib import Path

      def tls_pem_runtime_dir() -> Path:
          import os
          import tempfile

          env = os.environ.get("TURNSTONE_TLS_PEM_DIR")
          return Path(env) if env else Path(tempfile.gettempdir()) / "turnstone-tls"

      def prepare_pem_runtime_dir() -> Path:
          import os
          import shutil
          import stat

          root = tls_pem_runtime_dir()
          try:
              st = os.lstat(root)
          except FileNotFoundError:
              st = None
          if st is not None and (stat.S_ISLNK(st.st_mode) or st.st_uid != os.geteuid()):
              raise RuntimeError(
                  f"PEM runtime dir {root} exists but is a symlink or not owned by this process"
              )
          root.mkdir(mode=0o700, parents=True, exist_ok=True)
          os.chmod(root, 0o700)
          for stale in root.glob("lacme-pem-*"):
              shutil.rmtree(stale, ignore_errors=True)
          return root

      def refresh_runtime_pems(
          bundle: CertBundle,
          *,
          ca_pem: bytes | None,
          previous: Path | None,
      ) -> PemPaths:
          import shutil

          from lacme.mtls import write_pem_files

          new_paths = write_pem_files(bundle, ca_pem=ca_pem, directory=tls_pem_runtime_dir())
          if previous is not None and previous != new_paths.cert.parent:
              shutil.rmtree(previous, ignore_errors=True)
          return new_paths
