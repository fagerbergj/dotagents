      value: '(?:^|\n)(?://[^\n]*\n)+func Decode\('
      metric: doc_placement_floor


- description: typescript public API - exported router helpers other pages call
  vars:
    lang: ts
    ask: |
      Handing this module to the extensions team tomorrow and they'll be calling
      it without reading the body. Stuff they'll trip on: navigate() keeps the
      current query string when the path has no '?' of its own, which is what
      stops a chat switch from dropping the sidebar's filters; the route matches
      are anchored to a whole segment on purpose, because startsWith('/memory')
      also matches /memory-export; and the hooks re-render on popstate, so they
      only work inside a component. Comment it up for them.
    code: |
      import { useState, useEffect } from 'react'

      export type Route = 'chat' | 'memory' | 'ext'

      function readChatId(): string | undefined {
        const m = window.location.pathname.match(/^\/chat\/([^/]+)/)
        return m ? decodeURIComponent(m[1]) : undefined
      }

      export function navigate(path: string, opts?: { replace?: boolean }) {
        const full = path.includes('?') ? path : path + window.location.search
        if (opts?.replace) window.history.replaceState(null, '', full)
        else window.history.pushState(null, '', full)
        window.dispatchEvent(new PopStateEvent('popstate'))
      }

      export function routeFor(pathname: string): Route {
        if (/^\/ext(\/|$)/.test(pathname)) return 'ext'
        return /^\/memory(\/|$)/.test(pathname) ? 'memory' : 'chat'
      }

      export function useChatId(): string | undefined {
        const [chatId, setChatId] = useState(readChatId)
        useEffect(() => {
          const onPop = () => setChatId(readChatId())
          window.addEventListener('popstate', onPop)
          return () => window.removeEventListener('popstate', onPop)
        }, [])
        return chatId
      }

      export function useSearch(): string {
        const [search, setSearch] = useState(() => window.location.search)
        useEffect(() => {
          const onPop = () => setSearch(window.location.search)
          window.addEventListener('popstate', onPop)
          return () => window.removeEventListener('popstate', onPop)
        }, [])
        return search
      }
