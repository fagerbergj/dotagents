# Real code, comments stripped, plus what the author knows that the file does
# not say. The ask never names a comment category or a rule: deciding what
# deserves a comment, and what deserves none, is what is being graded.
#
# Each ask carries 2-4 specific, load-bearing facts, and the case's fact_transfer
# rubric enumerates exactly those. Grading fact transfer rather than the "state
# why" principle keeps the judge independent of the skill under test and computes
# against this case's own input.
#
# The last five cases are negative controls - plain code where the right answer
# is few or no comments, and where over-commenting is the failure. Knowing when
# not to comment is where this skill's value most shows, so the controls carry
# cases rather than losing them: two of them offer one assumption the types do
# not carry and nothing else, the rest are self-evident throughout. None of them
# has a second defensible answer - restraint scores adding nothing and adding
# only an assumption-carrying comment the same, so both correct answers pass.

- description: go constraint - retry policy and backoff budget
  vars:
    lang: go
    ask: |
      Can you comment this up before I push it back? Got a review saying "why is
      POST treated differently, looks like a bug". It isn't. A POST that times out
      mid-flight may already have been processed server-side, so we only send it
      again when the connection provably never landed - WithIdempotent is the
      escape hatch for calls where a repeat is harmless, like regenerating a model
      completion. The 4 attempts and the 200ms/5s pair are there so a dead upstream
      gives up after about a second instead of grinding away for minutes.
    code: |
      package httpx

      import (
      	"context"
      	"errors"
      	"net"
      	"net/http"
      	"strconv"
      	"time"
      )

      const (
      	DefaultMaxAttempts = uint(4)
      	DefaultBaseDelay   = 200 * time.Millisecond
      	DefaultMaxDelay    = 5 * time.Second
      )

      type idempotencyKey struct{}

      func WithIdempotent(ctx context.Context) context.Context {
      	return context.WithValue(ctx, idempotencyKey{}, true)
      }

      func isIdempotent(ctx context.Context) bool {
      	v, _ := ctx.Value(idempotencyKey{}).(bool)
      	return v
      }

      type transport struct {
      	next        http.RoundTripper
      	maxAttempts uint
      	baseDelay   time.Duration
      	maxDelay    time.Duration
      }

      func (t *transport) shouldRetry(req *http.Request, resp *http.Response, err error) bool {
      	free := req.Method == http.MethodGet || req.Method == http.MethodHead || isIdempotent(req.Context())
      	if err != nil {
      		var netErr net.Error
      		if errors.As(err, &netErr) && netErr.Timeout() {
      			return free
      		}
      		var opErr *net.OpError
      		if errors.As(err, &opErr) && !opErr.Temporary() {
      			return true
      		}
      		return free
      	}
      	if resp == nil {
      		return false
      	}
      	if resp.StatusCode == http.StatusTooManyRequests {
      		return free
      	}
      	return free && resp.StatusCode >= 500
      }

      func retryAfter(resp *http.Response) (time.Duration, bool) {
      	if resp == nil {
      		return 0, false
      	}
      	v := resp.Header.Get("Retry-After")
      	if v == "" {
      		return 0, false
      	}
      	if secs, err := strconv.Atoi(v); err == nil && secs >= 0 {
      		return time.Duration(secs) * time.Second, true
      	}
      	if at, err := http.ParseTime(v); err == nil {
      		return time.Until(at), true
      	}
      	return 0, false
      }
  assert:
    # not_narration, enumerate-and-divide. The three-band holistic version had the
    # worst per-cell spread in the suite (0.568 over five identical runs) even at
    # n=11, cells wandering [0, 0.5, 0, 1, 0.5] between runs. A false claim is
    # counted as an F term instead of capping the row: a cap is a binary switch
    # bolted onto a graded scale. Anchored here and aliased by the eight other
    # cases that hide something. The negative controls do not carry it - scoring
    # (K - F) / N would score a reply that correctly adds nothing at 0, so those
    # are graded by restraint instead.
    - &not_narration
      type: llm-rubric
      metric: not_narration
      threshold: 0.6
      value: |
        Google's C++ style guide, under "Don'ts", says: "Do not state the obvious. In
        particular, don't literally describe what code does, unless the behavior is
        nonobvious to a reader who understands C++ well. Instead, provide higher-level
        comments that describe why the code does what it does, or make the code
        self-describing." It adds that "Self-describing code doesn't need a comment."
        Pascarella and Bacchelli (MSR 2017) hand-classified comments in 2,000 Java files
        and found summary comments outnumbering rationale comments by roughly twenty to
        one, which is the failure this scores.

        Judge only the comments the Reply added. Ignore where comments sit, their length,
        their syntax, and their punctuation. Judge what they say.

        List every comment the Reply added, quoting each verbatim and numbering them. Let N
        be that count. For each numbered comment answer, in one line:
          - the constraint, cause, contract, or consequence it states, quoted; or NARRATION
            if a competent programmer in this language, reading only the identifiers and
            statements it sits beside, would already know what it says; or FALSE if it makes
            a claim that is not true of this code.
        Answer for every comment before scoring. Do not group them.

        Let K be the number answered with a quoted constraint, cause, contract, or
        consequence. Let F be the number answered FALSE.

        Score from 0 to 1, never above 1: (K - F) / N, floored at 0. If N is 0, score 0.
        State N, K, F and the arithmetic in your reason.
    - type: llm-rubric
      metric: fact_transfer
      threshold: 0.6
      value: |
