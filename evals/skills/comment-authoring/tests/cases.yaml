- description: javascript public API - the shared list cache four data layers build on
  vars:
    lang: js
    ask: |
      Four modules are about to be rewritten on top of this and none of their authors
      will read the body. What they need to know: refresh() never rejects - a failed
      refresh keeps the last-known rows, records the status on error() and resolves
      with the cache, so a bare .then is safe; a non-OK status is emphatically not
      "zero rows", and blanking the cache on a 403 is the bug this avoids;
      refresh({force:true}) is an invalidation, so it chains ONE trailing refetch
      after an in-flight request rather than coalescing onto a response that may
      predate the change, and _pending is cleared before the recursive call so a force
      arriving during the trailing fetch chains a new one; and _byKey is
      null-prototype so a row keyed "__proto__" can't swap the map's prototype and a
      lookup for "toString" misses instead of returning an inherited member as a row.
      Comment it for them.
    code: |
      import { authFetch } from "./auth.js";

      export function makeListCache(opts) {
        const url = opts.url;
        const dataKey = opts.dataKey;
        const name = opts.name;
        const keyField = opts.keyField || null;
        const fpRow = opts.fpRow;
        const captureExtra = opts.captureExtra || null;
        const extraDefaults = opts.extraDefaults || null;
        const resetExtraOnError = opts.resetExtraOnError !== false;

        let _cache = [];
        let _byKey = Object.create(null);
        let _loaded = false;
        let _lastError = null;
        let _inflight = null;
        let _pending = null;
        let _fingerprint = null;
        let _extra = extraDefaults ? Object.assign({}, extraDefaults) : {};
        const _subs = [];

        function _fp() {
          return JSON.stringify(_cache.map(fpRow));
        }

        function _setCache(rows) {
          _cache = Array.isArray(rows) ? rows : [];
          if (keyField) {
            _byKey = Object.create(null);
            for (const r of _cache) if (r && r[keyField]) _byKey[r[keyField]] = r;
          }
          const firstLoad = !_loaded;
          _loaded = true;
          const fp = _fp();
          if (firstLoad || fp !== _fingerprint) {
            _fingerprint = fp;
            _subs.forEach(function (cb) {
              try {
                cb(_cache);
              } catch (_) {
              }
            });
          }
        }

        function refresh(callOpts) {
          if (_inflight) {
            if (callOpts && callOpts.force) {
              _pending =
                _pending ||
                _inflight.then(function () {
                  _pending = null;
                  return refresh();
                });
              return _pending;
            }
            return _inflight;
          }
          _inflight = authFetch(url)
            .then(function (r) {
              if (r.ok) return r.json();
              _lastError = r.status;
              if (resetExtraOnError && extraDefaults) {
                _extra = Object.assign({}, extraDefaults);
              }
              console.warn(name + ": GET " + url + " -> " + r.status);
              return null;
            })
            .then(function (data) {
              if (data) {
                _lastError = null;
                if (captureExtra) _extra = captureExtra(data);
                _setCache(data[dataKey] || []);
              }
              return _cache;
            })
            .catch(function (e) {
              _lastError = 0;
              if (resetExtraOnError && extraDefaults) {
                _extra = Object.assign({}, extraDefaults);
              }
              console.warn(name + ": refresh failed", e);
              return _cache;
            })
            .finally(function () {
              _loaded = true;
              _inflight = null;
            });
          return _inflight;
        }

        return {
          refresh: refresh,
          get: function () {
            return _cache;
          },
          getByKey: function (k) {
            return (k && _byKey[k]) || null;
          },
          loaded: function () {
            return _loaded;
          },
          error: function () {
            return _lastError;
          },
          extra: function () {
            return _extra;
          },
          onChange: function (cb) {
            if (typeof cb === "function" && _subs.indexOf(cb) < 0) _subs.push(cb);
          },
        };
      }
