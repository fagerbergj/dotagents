# Real code, comments stripped, plus what the author knows that the file does
# not say. The ask never names a comment category or a rule: deciding what
# deserves a comment, and what deserves none, is what is being graded.
#
# Each ask carries 2-4 specific, load-bearing facts, and the case's fact_transfer
# rubric enumerates exactly those. Grading fact transfer rather than the "state
# why" principle keeps the judge independent of the skill under test and computes
# against this case's own input.
#
# The last five cases are negative controls - plain code where the right answer
# is few or no comments, and where over-commenting is the failure. Knowing when
# not to comment is where this skill's value most shows, so the controls carry
# cases rather than losing them: two of them offer one assumption the types do
# not carry and nothing else, the rest are self-evident throughout. None of them
# has a second defensible answer - restraint scores adding nothing and adding
# only an assumption-carrying comment the same, so both correct answers pass.
#
# PROVENANCE. Eight of the nine graded cases were sourced from
# `fagerbergj/quack` and have been removed. quack is an AI code-review bot that
# runs these very skills, so its code may have been commented with the skill
# under test, and grading a model on it risks scoring the model for reproducing
