# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Comment authoring skill effectiveness

# Two arms over the same tasks. Arm labels come from the skill's frontmatter
# version, so bumping metadata.version in SKILL.md relabels the comparison. Add
# the skill-next arm only once a SKILL.next.md exists to put in it.
prompts:
  - id: file://prompts/arms.js:noSkill
    label: no-skill
  - id: file://prompts/arms.js:skillCurrent
    label: skill-current

providers:
  # Custom provider, not `openai:chat:*`: same OpenAI-compatible call, plus a
  # `load_resource` tool over the skill's own directory so the skill arm can
  # follow SKILL.md's instructions to read its bundled files. The tool exists
  # only when the prompt supplies `skillDir` (see prompts/arms.js), so the
  # baseline arm sends no `tools` key and is called exactly as before.
  - id: file://../../lib/skill-tools.js
    label: deepseek-v4-flash+resources
    config:
      model: deepseek/deepseek-v4-flash
      apiBaseUrl: https://openrouter.ai/api/v1
      max_tokens: 8192
      passthrough:
        reasoning:
          enabled: false
      apiKeyEnvar: OPENROUTER_API_KEY
      # A single 3.3 KB reference: three rounds is a wrong guess, the directory
      # listing that answers it, and the read.
      maxToolCalls: 3
      maxResourceBytes: 4096

defaultTest:
  options:
    # The llm-swap gateway returns reasoning as message content; strip it so the
    # graders see the commented file, not the leak.
    transform: file://../../lib/strip-reasoning.js:stripReasoning
    provider:
      id: openai:chat:deepseek/deepseek-v4-flash
      config:
        # Kept from the g-eval era: json_object, never json_schema - the latter makes
        # promptfoo pre-parse the reply into an object, which the graders reject as
        # 'not a string'.
        response_format:
          type: json_object
        apiBaseUrl: https://openrouter.ai/api/v1
        max_tokens: 8192
        max_completion_tokens: 8192
        passthrough:
          reasoning:
            enabled: false
        apiKeyEnvar: OPENROUTER_API_KEY
        showThinking: false
        omitDefaults: true
  assert:
    # 1. Did it answer with a file at all.
    - type: starts-with
      value: '```'
      metric: code_block
    # 2. A commenting task must not rewrite the code. Strip the comments from the
    #    input and the output, normalise whitespace, demand the rest be identical.
    - type: javascript
      value: file://assertions/comment.cjs:codePreserved
      metric: code_preserved
    # 3. not_narration lives in tests/cases.yaml, on the nine cases that hide
    #    something, not here. It scores (K - F) / N over the comments added, so a
    #    reply that correctly adds nothing scores 0 - which is the right answer on
    #    the five negative controls. Those are graded by restraint instead, and the
    #    two metrics now partition the suite rather than overlapping on it.
    # 4. Loading a SKILL.md is not free; the overhead is part of the comparison.
    - type: latency
      threshold: 180000
      metric: latency

tests:
  - file://tests/*.yaml
