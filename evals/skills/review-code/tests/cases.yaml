# Real pull requests from three projects, each pinned at the commit a HUMAN
# maintainer reviewed. GitHub records that SHA as `reviews[].commit_id`, and it is
# not the merged head: later commits fix what the review asked for, so pinning the
# merged head asks the model to find a defect that is no longer there.
#
# 16 cases, 8 the maintainer blocked and 8 they approved, across caddyserver/caddy,
# cli/cli and rclone/rclone, reviewed by steadytao, babakks and ncw. Spreading the
# projects and the reviewers is deliberate: an earlier version was one repository
# and one reviewer, which measured agreement with one person's taste.
#
# `expected` is the maintainer's own review text, not a summary of it. Paraphrasing
# put my reading of the review between the reviewer and the judge; quoting does not.
#
# An earlier version of this suite used reviews from an automated reviewer on the
# author's own repository, which made it circular - grading a skill against a bot
# that may run the same skill - and called that output `HumanFindings`. Every
# review here is `user.type == "User"`, and one approving review was still dropped
# because its body opened by saying an agent wrote it on the maintainer's behalf.

- description: "caddy#7916 - reverseproxy: isolate active health-check stat"
  vars:
    fixture: caddy-7916
    title: "reverseproxy: isolate active health-check state per distinct check config"
    verdict: "CHANGES_REQUESTED"
    expected: "Each handler still writes `caddy_reverse_proxy_upstreams_healthy` using only `upstream.Dial`. Distinct health-check states therefore race to update the same Prometheus series so the reported value depends on which updater ran last. The metric identity needs to match the newly separated health-state identity + comment"
  assert:
    - type: javascript
      value: file://assertions/review.cjs:noInventedCitations
      metric: no_invented_citations
    # Anchored so all sixteen cases are judged in identical words; only the case's
    # own ground truth differs. Uniform wording keeps rubric variance out of the
    # measurement - rewriting it per case adds noise that is not the skill.
    - &review_quality
      type: llm-rubric
      rubricPrompt:
        - role: system
          content: |
            You are grading output according to a user-specified rubric. If the
            statement in the rubric is true, then the output passes the test. You
            respond with a JSON object with this structure:
            {reason: string, pass: boolean, score: number}
        - role: user
          content: |
            <MaintainerReview>{{expected}}</MaintainerReview>
            <MaintainerVerdict>{{verdict}}</MaintainerVerdict>
            <Output>{{output}}</Output>
            <Rubric>{{rubric}}</Rubric>
      value: |
        <Output> is a review of a real pull request. <MaintainerReview> is what the
        project's maintainer wrote about that same change, and <MaintainerVerdict>
        is what they decided: APPROVED, or CHANGES_REQUESTED meaning they withheld
        approval until something was fixed.

        The maintainer is the ground truth for what mattered in this change, not
        for how a review should read. Do not reward matching their tone, structure
        or length - only whether the same substance is there.

        Answer each with a quote from <Output>, or NONE.

        1. It raises a concern the maintainer raised, OR another specific defect in
           this change of comparable seriousness. Specific means a reader could go
           and confirm it against the code; a general call for more tests, more
           error handling or more documentation is NONE. Where the maintainer
           raised nothing blocking, a review that raises no defect satisfies this.
        2. It reasons about code the diff does not show - a caller, an adjacent
           function, an existing test, an invariant elsewhere - rather than only
           about the lines in the hunks.
        3. Its verdict matches <MaintainerVerdict>. Google's standard for code
           review is that a reviewer approves once the change definitely improves
           overall code health even if it is not perfect, and withholds approval
           only for something that must change first. Blocking a change the
           maintainer approved is wrong, and approving one they blocked is wrong.

        Score from 0 to 1, never above 1: 0.5 for the first, 0.25 for the second,
        0.25 for the third. Award nothing for an item you cannot quote for.
        Brevity is never a deduction. State the arithmetic.
      threshold: 0.5
      metric: review_quality

