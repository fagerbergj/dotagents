# Real merged pull requests from fagerbergj/quack, pinned by base and head SHA in
# tests/fixtures.json. The diff is whatever git produces for that range and both
# arms can open the tree the change was opened against, so this measures
# reviewing a change in the code it lives in rather than reviewing hunks.
#
# One judged metric across every case, not one per kind of case. Three cases
# split two ways gave `verifies_rather_than_trusts` n=2 and `severity_restraint`
# n=1, and five identical runs put every delta inside its own noise band - the
# subjective rubric reached a per-cell sd of 0.752, worse than a coin flip on a
# 0-1 scale. Combining them and widening to nine cases spends the budget on n,
# which is what the noise floor actually responds to.
#
# `expected` carries what the human reviewer actually found on that PR. It is
# ground truth, not a checklist: any other specific, checkable defect scores the
# same. It reaches the judge through the anchor's rubricPrompt, because this
# suite disables templating and an assertion value would otherwise arrive with
# the placeholder intact.

- description: 'real PR - fix(dag): plan tool errors enumerate valid options'
  vars:
    fixture: quack-1013
    title: 'fix(dag): plan tool errors enumerate valid options'
    note: 'the unknown-agent incident was costing blind retries at ~8.8k tokens each. this turns it into one self-correcting error.'
    expected: |
      - The new tests use the offending node id as the only declared id, so they pass whether or not the enumeration clause is present.
      - The hint gating - silent at zero candidates, silent at two or more, hint at exactly one - is untested.
      - The cycle error lists every node left with a non-zero in-degree, which includes nodes that merely depend on a cycle rather than nodes in it.
  assert:
    - type: javascript
      value: file://assertions/review.cjs:noInventedCitations
      metric: no_invented_citations
    # Anchored so all nine cases are judged in identical words; only `expected`
    # differs. Uniform wording is the other half of the noise fix - a rubric
    # rewritten per case adds variance that has nothing to do with the skill.
    - &review_quality
      type: llm-rubric
      rubricPrompt:
        - role: user
          content: |
            <HumanFindings>{{expected}}</HumanFindings>
            <Output>{{output}}</Output>
            <Rubric>{{rubric}}</Rubric>
      value: |
        <Output> is a review of a real pull request. <HumanFindings> is what the
        reviewer who actually merged that change raised on it. That change was
        approved.

        Judge the review as delivered. Do not reward or penalise how it was
        produced, which convention it followed, or how long it is.

        Answer each with a quote from the review, or NONE.

        1. It raises at least one point in <HumanFindings>, OR some other
           specific, checkable defect in this change. Specific means a reader
           could go and confirm it against the code. A general call for more
           tests, more error handling, or more documentation is NONE. Where
           <HumanFindings> says nothing substantive is wrong, a review that
           raises no defect satisfies this item.
        2. It reasons about code the diff does not show - a caller, an adjacent
           function, an existing test, an invariant elsewhere - rather than only
           about the lines in the hunks.
        3. It neither blocks this change nor asserts anything the diff refutes.

        Score from 0 to 1, never above 1: 0.5 for the first, 0.25 for the
        second, 0.25 for the third. Award nothing for an item you cannot quote
        for. Brevity is never a deduction. State the arithmetic.
      threshold: 0.5
      metric: review_quality

