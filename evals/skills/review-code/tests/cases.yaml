- description: "traefik#13767 - Set access log entry level and time before f"
  vars:
    fixture: traefik-13767
    title: "Set access log entry level and time before formatting the OTLP body"
    verdict: "APPROVED"
    expected: "LGTM"
    note: "The pull request's own description:\n\n### What does this PR do?\n\nSets the access log entry level and time before the formatter computes the OTLP log body.\n\n`logrus.Entry.Level` and `logrus.Entry.Time` are only populated by logrus when the log method is called: `Entry.log` sets `newEntry.Level = level`, and `newEntry.Time = time.Now()` only if it is zero. The OTLP body is produced by calling `Formatter.Format(entry)` before `entry.Println`, so at format time both fields are still zero values. `logrus.PanicLevel` is `0`, which is why every record shipped over OTLP carries `\"level\":\"panic\"` and `\"time\":\"0001-01-01T00:00:00Z\"` in its body.\n\nBecause `Entry.log` only overrides `Time` when it is zero, logrus reuses the timestamp set here, so the OTLP body and the regular output now carry the same level and the same time rather than two independently computed values.\n\nFixes #13766\n\n### Motivation\n\nAny Traefik instance shipping access logs over OTLP has every access log body stamped as a panic, with an unusable timestamp inside the body. The OTLP `severityText` field itself is correct (`info`), so only the body is affected, but the body is what most backends index, display and alert on.\n\nFound while comparing the file output and the OTLP output of the same records against an `otel/opentelemetry-collector-contrib` receiver.\n\n### More\n\n- [X] Added/updated tests\n- [ ] Added/updated documentation\n\n### Additional Notes\n\nThe new assertions are on the JSON-format case of `TestOTelAccessLogWithBodyAndDualOutput`. They fail on the current `v3.7` branch and pass with the fix.\n\nTargeting `v3.7` as a bug fix, per the branch guidance in the PR template.\n\nIt links issue #13766, \"Access log records shipped over OTLP have level=panic and a zero time in their body\", which reads:\n\n### Welcome!\n\n- [X] Yes, I've searched similar issues on GitHub and didn't find any.\n- [X] Yes, I've searched similar issues on the Traefik community forum and didn't find any.\n\n### What did you do?\n\nConfigured the access log to be shipped over OTLP, with `dualOutput` so the same records also go to a file:\n\n```yaml\naccessLog:\n  filePath: \"/logs/access.log\"\n  format: json\n  otlp:\n    grpc:\n      endpoint: collector:4317\n      insecure: true\n  dualOutput: true\n\nexperimental:\n  otlpLogs: true\n```\n\nSent traffic through a router, then compared the records written to the file with the ones received by the OTLP collector.\n\n### What did you see instead?\n\nEvery access log record shipped over OTLP has a JSON body stamped with `\"level\":\"panic\"` and `\"time\":\"0001-01-01T00:00:00Z\"`, while the exact same record written to the file has the correct `\"level\":\"info\"` and a real timestamp.\n\nReceived over OTLP (body, abridged):\n\n```json\n{\"DownstreamStatus\":200,\"RequestHost\":\"whoami.localhost\",\"RouterName\":\"whoami@docker\",\"ServiceName\":\"whoami@docker\",\"level\":\"panic\",\"msg\":\"\",\"time\":\"0001-01-01T00:00:00Z\"}\n```\n\nSame record in the file:\n\n```json\n{\"DownstreamStatus\":200,\"RequestHost\":\"whoami.localhost\",\"RouterName\":\"whoami@docker\",\"ServiceName\":\"whoami@docker\",\"level\":\"info\",\"time\":\"2026-08-25T08:28:52.141714591Z\"}\n```\n\nThe OTLP `severityText` field itself is correct (`info`), so only the log body is affected. But the body is what most backends index, display and alert on, so in practice every access log record looks like a panic. It also makes the body's `time` field useless for anything reading it.\n\n### What did you expect to see?\n\nThe OTLP body to carry the same `level` and `time` as the file output.\n\n### Root cause\n\nIn `pkg/middlewares/accesslog/logger.go`, the OTLP body is produced by calling the formatter on the entry before the entry is actually logged:\n\n```go\nentry := h.logger.WithContext(ctx).WithFields(fields)\n\nvar message string\nif h.config.OTLP != nil {\n    mBytes, err := h.logger.Formatter.Format(entry)\n    ...\n    message = string(mBytes)\n}\n\nentry.Println(message)\n```\n\n`logrus.Entry.Level` and `logrus.Entry.Time` are only populated by logrus when the log method is called (`Entry.log` sets `newEntry.Level = level`, and `newEntry.Time = time.Now()` if it is zero). At `Format` time both are still zero values: `logrus.PanicLevel` is `0`, hence `\"level\":\"panic\"`, and the zero `time.Time` renders as `0001-01-01T00:00:00Z`.\n\n### What version of Traefik are you using?\n\nv3.7.8, and reproduced on the current `v3.7` branch.\n\n### What is your environment & configuration?\n\nSee above. Reproduced with the OTLP/gRPC exporter against an `otel/opentelemetry-collector-contrib` receiver, and with a unit test on the `v3.7` branch.\n\n### If applicable, please paste the log output in DEBUG level\n\nNot applicable, the issue is in the access log body itself."
  assert:
    - *citations
    - *no_false_claims
    - *no_false_blocker
    - *reasons_beyond_diff
    - *severity_discipline
- description: "cli#14065 - Trim spaces when parsing X-Oauth-Scopes in `gh r"
  vars:
    fixture: cli-14065
    title: "Trim spaces when parsing X-Oauth-Scopes in `gh release create`"
    verdict: "APPROVED"
    expected: "✨ Makes sense."
    note: "The pull request's own description:\n\nFixes #14063\r\n\r\n### Description\r\n\r\nWhen `gh release create` gets an HTTP 404 back from the API, it tries to work out whether the token is missing the `workflow` scope. There is a real case where that matters: if the release's tag introduces changes to workflow files, the API returns a bare 404 and gives no other signal that the scope is the problem. So the command checks the `X-Oauth-Scopes` response header and, when `workflow` is absent, swaps the raw error for a hint telling the user to run `gh auth refresh -s workflow`.\r\n\r\nThe check was wrong. `X-Oauth-Scopes` is comma-**space** separated:\r\n\r\n```\r\nX-Oauth-Scopes: gist, project, read:org, repo, user, workflow\r\n```\r\n\r\n`tokenHasWorkflowScope` did `slices.Contains(strings.Split(scopes, \",\"), \"workflow\")`, which leaves a leading space on every element except the first: `[\"gist\", \" project\", \" read:org\", \" repo\", \" user\", \" workflow\"]`. Only the first element can ever match a bare scope name, and the API returns scopes in sorted order, so `workflow` is essentially never first. The function returned false for every real OAuth token.\r\n\r\nTwo consequences, the second being the serious one:\r\n\r\n1. Users who already have `workflow` were told to request it. Running `gh auth refresh -s workflow` changed nothing, so there was no way to make the message go away.\r\n2. The guard never held, so **every** 404 from `POST /repos/{owner}/{repo}/releases` was rewritten into the scope hint. A typo in the repo name, a repo that does not exist, or missing push access all surfaced as a scope problem instead of `HTTP 404: Not Found`.\r\n\r\nThe fix trims each element before comparing, which is what `generateScopesSuggestion` in `api/client.go` already does.\r\n\r\n### How did you test this change?\r\n\r\n![gh release create against a nonexistent repo: before, the 404 is blamed on the workflow scope; after, the real 404 surfaces](https://github.com/user-attachments/assets/aa9576af-5a3b-4912-9a78-9e6474364b05)\r\n\r\n### Authorship and follow-up\r\n\r\nWho wrote this:\r\n\r\n- [ ] A human wrote it.\r\n- [x] An agent wrote it under close human direction.\r\n- [ ] An agent wrote it independently, and no human has guided the implementation beyond the initial prompt.\r\n\r\nWho answers review comments:\r\n\r\n- [x] @williammartin will read and reply directly.\r\n- [ ] An agent will draft replies and @username will read them before they are posted.\r\n- [ ] Nobody has explicitly committed to replying.\n\nIt links issue #14063, \"`gh release create` always blames the missing `workflow` scope on any 404\", which reads:\n\n### Describe the bug\n\nWhen `gh release create` receives an HTTP 404, it checks whether the token carries the `workflow` scope and, if not, replaces the error with a hint about requesting that scope. The scope check is broken, so it reports \"no workflow scope\" for essentially every OAuth token — including tokens that plainly do have the scope.\n\nTwo consequences:\n\n1. Users are told to run `gh auth refresh -s workflow` when they already have `workflow`. Running it changes nothing, so there is no way to make the message go away.\n2. More importantly, the **real** reason for the 404 is masked. A typo in the repo name, a repo that does not exist, or a lack of push access all surface as a scope problem instead of `HTTP 404: Not Found`.\n\nThe cause is in `tokenHasWorkflowScope` in `pkg/cmd/release/create/http.go`:\n\n```go\nreturn slices.Contains(strings.Split(scopes, \",\"), \"workflow\")\n```\n\nThe `X-Oauth-Scopes` response header is comma-**space** separated, so splitting on `,` alone yields elements with a leading space: `[\"gist\", \" project\", \" read:org\", \" repo\", \" user\", \" workflow\"]`. Only the first element ever matches a bare scope name, and the header lists scopes in sorted order, so `workflow` is effectively never first. The comparison therefore fails no matter what the token holds.\n\nOther scope parsers in this repo already account for this — `generateScopesSuggestion` in `api/client.go` does `strings.TrimSpace(s)` on each element, and the `pkg/cmd/auth/status` tests stub the header as `\"repo, read:org\"` with the space. `tokenHasWorkflowScope` is the one place that omits the trim.\n\n### Affected version\n\n```\ngh version 2.96.0 (2026-07-02)\nhttps://github.com/cli/cli/releases/tag/v2.96.0\n```\n\nAlso reproduces on a build of current `trunk`.\n\n### Steps to reproduce the behavior\n\nAuthenticate with an OAuth token that includes the `workflow` scope (`gh auth login` via the web flow grants it by default; `gh auth refresh -s workflow` otherwise), then point `gh release create` at a repository that does not exist:\n\n```console\n$ GH_DEBUG=api GH_REPO=cli/definitely-not-a-real-repo-wm-9f3a gh release create v0.0.0 --notes test\n```\n\nA single run shows the whole problem — the scope the token actually has, the real reason for the failure, and the conclusion `gh` draws instead.\n\n### Expected vs actual behavior\n\n**Expected:** because the token has the `workflow` scope, the scope-specific hint should be suppressed and the underlying error reported, e.g. `HTTP 404: Not Found (https://api.github.com/repos/cli/definitely-not-a-real-repo-wm-9f3a/releases)`.\n\n**Actual:** the 404 is swallowed and replaced with a `workflow`-scope hint that does not apply and cannot be acted on.\n\nNote the hint is genuinely useful in the case it was written for: creating a release whose tag introduces workflow file changes does 404 without the `workflow` scope, and the API gives no other signal. The problem is only that the guard meant to limit the hint to that case never holds.\n\n### Logs\n\n```console\n$ GH_DEBUG=api GH_REPO=cli/definitely-not-a-real-repo-wm-9f3a gh release create v0.0.0 --notes test\n[git tag --list v0.0.0 --format=%(contents)]\n* Request at 2026-08-04 15:34:04.695914 +0200 CEST m=+0.020581376\n* Request to https://api.github.com/repos/cli/definitely-not-a-real-repo-wm-9f3a/releases\n> POST /repos/cli/definitely-not-a-real-repo-wm-9f3a/releases HTTP/1.1\n> Host: api.github.com\n> Accept: application/vnd.github.merge-info-preview+json, application/vnd.github.nebula-preview\n> Authorization: token ████████████████████\n> Content-Length: 68\n> Content-Type: application/json; charset=utf-8\n> Time-Zone: Europe/Amsterdam\n> User-Agent: GitHub CLI 2.96.0 Agent/github_copilot_app_agent\n> X-Github-Api-Version: 2022-11-28\n\n{\n  \"body\": \"test\",\n  \"draft\": false,\n  \"prerelease\": false,\n  \"tag_name\": \"v0.0.0\"\n}\n\n< HTTP/2.0 404 Not Found\n< Access-Control-Allow-Origin: *\n< Access-Control-Expose-Headers: ETag, Link, Location, Retry-After, X-GitHub-OTP, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Used, X-RateLimit-Resource, X-RateLimit-Reset, X-OAuth-Scopes, X-Accepted-OAuth-Scopes, X-Poll-Interval, X-GitHub-Media-Type, X-GitHub-SSO, X-GitHub-Request-Id, Deprecation, Sunset, Warning\n< Content-Security-Policy: default-src 'none'\n< Content-Type: application/json; charset=utf-8\n< Date: Tue, 04 Aug 2026 13:34:04 GMT\n< Referrer-Policy: origin-when-cross-origin, strict-origin-when-cross-origin\n< Server: github.com\n< Strict-Transport-Security: max-age=31536000; includeSubdomains; preload\n< Vary: Accept-Encoding, Accept, X-Requested-With\n< X-Accepted-Oauth-Scopes: repo\n< X-Content-Type-Options: nosniff\n< X-Frame-Options: deny\n< X-Github-Api-Version-Selected: 2022-11-28\n< X-Github-Edge-Region: fra\n< X-Github-Media-Type: github.v3; param=merge-info-preview.nebula-preview; format=json\n< X-Github-Request-Id: 869B:13D926:7E44EFB:789D20F:6A71EA4C\n< X-Oauth-Client-Id: Ov23ctr1Udn5GokVCVJf\n< X-Oauth-Scopes: gist, project, read:org, repo, user, workflow\n< X-Ratelimit-Limit: 15000\n< X-Ratelimit-Remaining: 14978\n< X-Ratelimit-Reset: 1785850871\n< X-Ratelimit-Resource: core\n< X-Ratelimit-Used: 22\n< X-Xss-Protection: 0\n\n{\n  \"message\": \"Not Found\",\n  \"documentation_url\": \"https://docs.github.com/rest/releases/releases#create-a-release\",\n  \"status\": \"404\"\n}\n\n* Request took 239.281167ms\n! Failed to create release, \"workflow\" scope may be required.\nTo request it, run:\ngh auth refresh -h github.com -s workflow\n```\n\nThree things to note in that transcript:\n\n- `X-Oauth-Scopes` on the failing response ends in `workflow`, so the token has the scope and the header carrying that fact reached `gh` intact. Note the `, ` separator.\n- The body says `\"message\": \"Not Found\"` — the repository does not exist. That is the error the user needed to see.\n- `gh` nevertheless prints the `workflow`-scope hint and discards the 404.\n\n### Suggested fix\n\nTrim each element before comparing, matching what `api/client.go` already does:\n\n```go\nfor _, s := range strings.Split(scopes, \",\") {\n    if strings.TrimSpace(s) == \"workflow\" {\n        return true\n    }\n}\nreturn false\n```\n\nWorth adding a test case with the realistic `\"repo, workflow\"` spacing — the existing fixtures for this function use unspaced values such as `repo,read:org,workflow`, which is why the bug was not caught."
  assert:
    - *citations
    - *no_false_claims
    - *no_false_blocker
    - *reasons_beyond_diff
    - *severity_discipline
