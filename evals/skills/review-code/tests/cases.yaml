- description: "rclone#9714 - vfs: fix VFS instance leaks on mount/serve fai"
  vars:
    fixture: rclone-9714
    title: "vfs: fix VFS instance leaks on mount/serve failures and shutdown"
    verdict: "CHANGES_REQUESTED"
    expected: "Thank you for coming back to this with the decentralized approach - this is much closer to what I had in mind than #9473, and the mountlib part with the `sync.Once` guarded `shutdownVFS()` is great :-) However I found some correctness problems in the serve half, and I think there is a neater way of implementing it which would remove most of the repetition. 1. The proxy cache finalizer will shut down VFSes still in use `libcache` entries expire after 5 minutes of disuse and `cacheExpire` calls the finalizer. Nothing pins the proxy cache entries, and sftp/ftp call `proxy.Call` once at auth then hold the returned VFS for the whole session. So an sftp session which is idle for more than 5 minutes will have its VFS shut down underneath it - we've traded a leak for a use-after-shutdown, which is worse! This is OK for http/webdav/s3 (every request goes through `Call`/`Get` which refreshes the timer), but sftp/ftp would need to `Pin` the cache entry when the connection opens and `Unpin` it when it closes. That's the correct fix here I think, though it does make the change bigger. 2. Double shutdown in serve/nfs `VFS.Shutdown()` is a refcount decrement, and VFS instances are shared via the active cache (`vfs.New` reuses an existing VFS for the same fs + options), so decrementing twice can kill a VFS out from under another user. The rule needs to be: whoever calls `vfs.New` calls `Shutdo"
  assert:
    - *citations
    - *no_false_claims
    - *finds_the_defect
    - *reasons_beyond_diff
    - *severity_discipline
- description: "caddy#7920 - caddyhttp: shield specific hostnames from a co"
  vars:
    fixture: caddy-7920
    title: "caddyhttp: shield specific hostnames from a covering wildcard's client auth"
