- description: "rclone#9827 - accounting: fix bwlimit burst overflow - fixes"
  vars:
    fixture: rclone-9827
    title: "accounting: fix bwlimit burst overflow - fixes #9820"
    verdict: "APPROVED"
    expected: "Thank you :-)"
    note: "The pull request's own description:\n\n#### What does this change do?\n\nAvoids overflow while scaling the accounting token-bucket burst for very large `--bwlimit` values. The burst calculation now divides before scaling can overflow and caps the burst at the platform `int` maximum before passing it to `rate.NewLimiter` / `WaitN`.\n\nRegression coverage checks that a 4 TiB/s limit keeps the scaled burst instead of falling back to the default burst, and that the burst is capped safely for the largest `SizeSuffix` value.\n\n#### Linked issue\n\nFixes #9820\n\n#### For new or changed backends\n\nNot a backend change.\n\n#### Checklist\n\n- [x] This change is trivial **OR** it has been discussed and agreed in the linked issue.\n- [x] I have read the [contribution guidelines](https://github.com/rclone/rclone/blob/master/CONTRIBUTING.md#submitting-a-new-feature-or-bug-fix).\n- [x] **(If I used AI tools to help write this code)** I have read and understood the [AI-assisted contributions guidance](https://github.com/rclone/rclone/blob/master/CONTRIBUTING.md#ai-assisted-contributions), and I have tested and take ownership of this change myself.\n- [x] I have added tests for all changes in this PR if appropriate.\n- [x] I have added documentation for the changes if appropriate.\n- [x] All commit messages are in [house style](https://github.com/rclone/rclone/blob/master/CONTRIBUTING.md#commit-messages).\n- [x] **(Backend changes only)** `test_all` passes for this backend and if submitting a new backend can provide a test account for the integration tester - see [CONTRIBUTING.md](https://github.com/rclone/rclone/blob/master/CONTRIBUTING.md#integration-tests).\n- [x] This Pull Request is ready for review.\n\nVerification run locally:\n\n- `go test ./fs/accounting -run TokenBucket -count=1`\n- `go test ./fs/accounting -count=1`\n- `go build`\n- `git diff --check`\n\nI also attempted `make quicktest`; it did not complete successfully in this container because unrelated environment-sensitive tests failed (for example `cmd/gitannex` could not find `rclone` in `PATH`, `cmd/nfsmount` could not mount NFS/FUSE, and `cmd/selfupdate` failed while testing installation). The focused accounting tests and build above pass.\n\nIt links issue #9820, \"accounting: --bwlimit silently disabled for large T/P values - int64 overflow wraps token-bucket burst negative\", which reads:\n\n## Summary\n\n`newEmptyTokenBucket` scales the token-burst size linearly with the configured bandwidth without any overflow guard:\n\n```go\nconst defaultMaxBurstSize = 4 * 1024 * 1024\n\nmaxBurstSize := max((bandwidth*defaultMaxBurstSize)/(256*1024*1024), defaultMaxBurstSize)\ntb := rate.NewLimiter(rate.Limit(bandwidth), int(maxBurstSize))\nerr := tb.WaitN(context.Background(), int(maxBurstSize)) // \"empty the bucket\"\n```\n\n`bandwidth` is `fs.SizeSuffix` (int64, accepts `T`/`P` suffixes). Once `bandwidth ≥ 2 TiB/s`, `bandwidth * defaultMaxBurstSize` overflows int64 and wraps **negative**, so the limiter is created with a negative burst. From then on every transfer's `WaitN(ctx, n>0)` fails instantly with `rate: Wait(n=…) exceeds limiter's burst …`, and `LimitBandwidth`'s error path only logs `\"Token bucket error\"` and returns **without waiting** — i.e. `--bwlimit` is silently disabled for the entire session while spamming that log per call.\n\nOn still-shipped 32-bit builds the same total bypass arrives earlier via `int(maxBurstSize)` truncation (`--bwlimit 200G` class values).\n\nStatic analysis against current master; arithmetic verified deterministically, and the upstream `golang.org/x/time/rate` behavior (`wait()` rejects `n > burst`) checked against its source.\n\n## Location\n\n- File: `fs/accounting/token_bucket.go`\n- Function: `newEmptyTokenBucket` (overflow at the scaling line; consumption in `LimitBandwidth` ~line 172)\n\n## Steps to Reproduce\n\n```bash\nrclone copy src dst --bwlimit 4T -v\n# observe repeated \"Token bucket error\" lines and transfer speed unthrottled\n```\n\n## Expected Behavior\n\nEither clamp the scaled burst to a safe maximum (e.g. `min(maxBurst, math.MaxInt32)` with the limit itself still enforced by `rate.Limit`), or reject/round absurd bandwidths at flag-parse time. A user asking for \"very large\" bwlimit should get effectively-unlimited-but-logged behavior, not an accidentally disabled limiter.\n\n## Actual Behavior\n\nNegative burst → every WaitN errors → error path proceeds without throttling. Complete silent loss of bandwidth limiting.\n\n## Impact\n\nUsers passing large T/P `--bwlimit` values as a soft cap get zero limiting — ISP/mobile-data overage risk; also defeats `--bwlimit` used deliberately to avoid saturating shared links. No data loss.\n\n## Suggested Direction\n\nGuard the scaling product (compute in float64 or clamp before cast), and make `LimitBandwidth` treat limiter errors as fail-closed (wait full n duration) rather than fail-open, so any future arithmetic regression degrades to \"slower than requested\", never \"unlimited\".\n\n## Evidence\n\n- Scaling introduced in `33ddd540` (\"scales up token bucket size linearly above 2 Gbps\", fixes #5507) without an overflow guard.\n- Dedup: searches `bwlimit burst`, `bwlimit overflow`, `bwlimit 4T`, `token bucket error` across issues/PRs surface #8104 (log-message fix only) and #5507. Nothing reports the overflow or the resulting bypass."
