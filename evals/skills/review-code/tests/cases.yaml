- description: "rclone#9912 - archive: fix crash when creating archive to st"
  vars:
    fixture: rclone-9912
    title: "archive: fix crash when creating archive to stdout - fixes #9910"
    verdict: "APPROVED"
    expected: "Thanks, looks good to me!"
    note: "The pull request's own description:\n\n#### What does this change do?\n\n`rclone archive create <source>` (no destination, archive to stdout) crashed with a nil pointer dereference: `ArchiveCreate` always called `CheckValidDestination(ctx, dst, dstFile)`, but `dst` is nil in the stdout case, so `dst.NewObject` panicked. This skips the destination check when there is no destination — the existing `dst == nil` branch later in the function already handles writing to stdout.\n\nIt also removes a leftover debug `fmt.Printf(\"dst=%v, ...\")` in the command's `RunE`, which wrote a text line to stdout before the archive bytes (visible in the issue's log) and would corrupt a piped archive.\n\nAdds `TestArchiveStdout` in `cmd/archive/archive_test.go`: archives a remote to stdout (redirected to a file) with `dst == nil`, then lists the resulting zip to check it is a valid archive with the expected entries.\n\nVerification (Go 1.26.6, linux/amd64):\n\n- `go test ./cmd/archive/ -run TestArchiveStdout` with the fix stashed → panics at `create.go:272` (`CheckValidDestination`), same trace as the issue.\n- With the fix → `PASS`.\n- `go test ./cmd/archive/...` → all green; `go vet` / `gofmt` clean.\n- Built the binary and ran `rclone archive create --format tar.gz /tmp/srcdir > out.tgz` → exit 0, `tar tzf out.tgz` lists the files; `--dry-run` also works.\n\n#### Linked issue\n\nFixes #9910\n\n#### Checklist\n\n- [x] This change is trivial **OR** it has been discussed and agreed in the linked issue.\n- [x] I have read the [contribution guidelines](https://github.com/rclone/rclone/blob/master/CONTRIBUTING.md#submitting-a-new-feature-or-bug-fix).\n- [x] **(If I used AI tools to help write this code)** I have read and understood the [AI-assisted contributions guidance](https://github.com/rclone/rclone/blob/master/CONTRIBUTING.md#ai-assisted-contributions), and I have tested and take ownership of this change myself.\n- [x] I have added tests for all changes in this PR if appropriate.\n- [ ] I have added documentation for the changes if appropriate.\n- [x] All commit messages are in [house style](https://github.com/rclone/rclone/blob/master/CONTRIBUTING.md#commit-messages).\n- [ ] **(Backend changes only)** `test_all` passes for this backend and if submitting a new backend can provide a test account for the integration tester - see [CONTRIBUTING.md](https://github.com/rclone/rclone/blob/master/CONTRIBUTING.md#integration-tests).\n- [x] This Pull Request is ready for review.\n\nIt links issue #9910, \"Crash when running `rclone archive create` without destination\", which reads:\n\n### Before you start\n\n- [x] I have searched the [forum](https://forum.rclone.org/) and the existing issues for this problem.\n- [x] I have tested with the latest beta or stable release and can still reproduce the problem.\n- [x] This is a reproducible bug, not a usage question (questions belong on the forum).\n\n### Associated forum post URL\n\n_No response_\n\n### What is the problem you are having with rclone?\n\nWhen I run `rclone archive create --format tar.gz remote:filepath`, rclone crashes on a nil pointer dereference.\n\n### rclone version\n\nrclone v1.75.1\n- os/version: arch (64 bit)\n- os/kernel: 7.2.4-arch1-2 (x86_64)\n- os/type: linux\n- os/arch: amd64\n- go/version: go1.27.0-X:nodwarf5\n- go/linking: dynamic\n- go/tags: none\n\n### Operating system\n\nLinux\n\n### Which cloud storage system are you using?\n\nMinio (S3 compatible)\n\n### Output of `rclone config redacted`\n\n```ini\n[gitlab-minio]\ntype = s3\nprovider = Minio\naccess_key_id = XXX\nsecret_access_key = XXX\nendpoint = https://redacted.endpoint\nlist_url_encode = false\n```\n\n### The command you were trying to run\n\n```shell\nrclone archive create --format tar.gz gitlab-minio:gitlab-uploads\n```\n\n### A log from the command with the `-vv` flag\n\n```shell\n2026/09/12 14:38:30 DEBUG : rclone: Version \"v1.75.1\" starting with parameters [\"rclone\" \"archive\" \"create\" \"--format\" \"tar.gz\" \"gitlab-minio:gitlab-uploads\" \"-vv\"]\n2026/09/12 14:38:30 DEBUG : Creating backend with remote \"gitlab-minio:gitlab-uploads\"\n2026/09/12 14:38:30 DEBUG : Using config file from \"/home/breigner01/.config/rclone/rclone.conf\"\ndst=<nil>, dstFile=\"\", src=S3 bucket gitlab-uploads, format=\"tar.gz\", prefix=\"\"\npanic: runtime error: invalid memory address or nil pointer dereference\n[signal SIGSEGV: segmentation violation code=0x1 addr=0x40 pc=0x56207ccb4fb1]\n\ngoroutine 1 [running]:\ngithub.com/rclone/rclone/cmd/archive/create.CheckValidDestination({0x56207fa7c5b0?, 0x56207fed9a20?}, {0x0?, 0x0?}, {0x0?, 0x311e4364f200?})\n\tgithub.com/rclone/rclone/cmd/archive/create/create.go:272 +0x31\ngithub.com/rclone/rclone/cmd/archive/create.ArchiveCreate({0x56207fa7c5b0, 0x56207fed9a20}, {0x0, 0x0}, {0x0, 0x0}, {0x56207fa8ebc0, 0x311e43a48708}, {0x7ffdfdfdb419, 0x6}, ...)\n\tgithub.com/rclone/rclone/cmd/archive/create/create.go:305 +0xda\ngithub.com/rclone/rclone/cmd/archive/create.init.func1.1()\n\tgithub.com/rclone/rclone/cmd/archive/create/create.go:127 +0x23c\ngithub.com/rclone/rclone/cmd.Run(0x0, 0x0, 0x56207faf1fe8, 0x311e43579b48)\n\tgithub.com/rclone/rclone/cmd/cmd.go:255 +0x125\ngithub.com/rclone/rclone/cmd/archive/create.init.func1(0x56207faf1fe8, {0x311e43e14380?, 0x4?, 0x56207cfb8297?})\n\tgithub.com/rclone/rclone/cmd/archive/create/create.go:120 +0x113\ngithub.com/spf13/cobra.(*Command).execute(0x56207faf1fe8, {0x311e43e14340, 0x4, 0x4})\n\tgithub.com/spf13/cobra@v1.10.2/command.go:1015 +0xb3c\ngithub.com/spf13/cobra.(*Command).ExecuteC(0x56207faf0c00)\n\tgithub.com/spf13/cobra@v1.10.2/command.go:1148 +0x450\ngithub.com/spf13/cobra.(*Command).Execute(...)\n\tgithub.com/spf13/cobra@v1.10.2/command.go:1071\ngithub.com/rclone/rclone/cmd.Main()\n\tgithub.com/rclone/rclone/cmd/cmd.go:539 +0x31\nmain.main()\n\tgithub.com/rclone/rclone/rclone.go:14 +0xf\n```\n\n### Anything else?\n\nMy best guess would be that it always expects a destination and crashes because there aren't any.\n\nIt is supposed to output to stdout when given no destination"
  assert:
    - *citations
    - *no_false_claims
    - *no_false_blocker
    - *reasons_beyond_diff
    - *severity_discipline
- description: "rclone#9762 - fserrors: fix out of space detection on Window"
  vars:
    fixture: rclone-9762
    title: "fserrors: fix out of space detection on Windows - fixes #8011"
    verdict: "APPROVED"
    expected: "This looks very nice - thank you.\n\nI'll merge this as 4 commits."
    note: "The pull request's own description:\n\n#### What does this change do?\n\nRecognize Windows disk-full errors (`ERROR_DISK_FULL` and `ERROR_HANDLE_DISK_FULL`) so `--local-fatal-if-no-space` stops transfers instead of retrying them. This also prevents a VFS cache hang when the cleaner is disabled and completes fatal-error handling for local multi-thread writer setup, writes and close. Regression tests cover classification, transfer propagation and disabled-cleaner behavior.\n\nThe option remains off by default and preallocation remains best-effort. No flags, public APIs or dependencies are added.\n\n#### Validation\n\nRebased onto master at `3d7b101c7f4b`; validated candidate `03abd08b5541`:\n\n- Windows build and complete uncached quicktest pass on Go 1.27.1 (174 packages). All eight local integration groups pass on their first attempts; actual restic integration passes separately. Repository-defined platform and feature skips remain, including Windows git-annex end-to-end tests.\n- Ten shuffled Windows race repetitions, focused Go 1.26.8 compatibility tests, complete affected Linux suites and focused Linux race coverage pass. Full configured lint, formatting and whitespace checks pass.\n- Actual write-time exhaustion on a fixed-capacity NTFS fixture with four streams and preallocation disabled: the published baseline retries and exits 1 with the option off or on; the candidate retries and exits 1 when off, and stops without retrying with exit 7 when on. Healthy-copy and default-preallocation smoke tests verify contents. This does not establish native preallocation-exhaustion behavior or every later metadata failure.\n\nAn earlier Windows quicktest hit an intermittent directory-timestamp assertion also reproduced on clean upstream; no workaround was added. Full Linux quicktest remains environment-limited: mount/Docker-volume tests require unavailable FUSE, and NFS tests require unsupported filesystem handle operations. This is not a claim that every repository test passed.\n\n#### Linked issue\n\nFixes #8011\n\n#### Checklist\n\n- [x] This change is trivial **OR** it has been discussed and agreed in the linked issue.\n- [x] I have read the [contribution guidelines](https://github.com/rclone/rclone/blob/master/CONTRIBUTING.md#submitting-a-new-feature-or-bug-fix).\n- [x] **(If I used AI tools to help write this code)** I have read and understood the [AI-assisted contributions guidance](https://github.com/rclone/rclone/blob/master/CONTRIBUTING.md#ai-assisted-contributions), and I have tested and take ownership of this change myself.\n- [x] I have added tests for all changes in this PR if appropriate.\n- [x] I have added documentation for the changes if appropriate.\n- [x] All commit messages are in [house style](https://github.com/rclone/rclone/blob/master/CONTRIBUTING.md#commit-messages).\n- [x] **(Backend changes only)** `test_all` passes for this backend and if submitting a new backend can provide a test account for the integration tester - see [CONTRIBUTING.md](https://github.com/rclone/rclone/blob/master/CONTRIBUTING.md#integration-tests).\n- [x] This Pull Request is ready for review.\n\nIt links issue #8011, \"add --local-fatal-if-no-space\", which reads:\n\nSuggested by @ncw here:\r\nhttps://forum.rclone.org/t/how-to-make-rclone-copy-local-to-localdestination-stop-when-out-of-space/30859/2?u=orena1\r\n\r\n```\r\nWe could make a --local-fatal-if-no-space flag or something like that?\r\n\r\nThat would be fairly easy, except for making it cross platform on all the different platforms rclone supports\r\n```"
  assert:
    - *citations
    - *no_false_claims
    - *no_false_blocker
    - *reasons_beyond_diff
    - *severity_discipline

