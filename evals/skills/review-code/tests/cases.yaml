    verdict: "CHANGES_REQUESTED"
    expected: "Thanks for putting this together, @sergiou87! :pray: Heads up that I haven't gone through the tests yet. I suspect the implementation will shift based on the points below, and the tests will follow, so I'll hold off reviewing them until things settle. A few things I'd like us to address: - **Replicate the worktree safety checks from `pr checkout`:** The symlink and other target safety validations that `pr checkout` performs (rejecting leaf symlinks, non-directory targets, paths inside a different repository, paths inside an existing worktree, etc.) aren't present here. We should replicate them. Rather than duplicating, I think we should extract that logic from `pr checkout` into a shared package, probably `pkg/cmd/pr/shared`, since there's already precedent for sharing logic between PRs and issues there. @tidy-dev did a great job in `pr checkout` for worktrees covering various use cases and security related concerns. I think the big lift here is to just extract them into the shared package and happily reuse them here. - **Match `pr checkout`'s worktree reuse behavior:** I think users will expect `issue develop` and `pr checkout` to behave the same way around worktrees, in particular the existing worktree reuse behavior that `pr checkout` provides. That's another reason to pull the `pr checkout` internals into a shared place so both commands stay consistent. - **Add acceptance t"
