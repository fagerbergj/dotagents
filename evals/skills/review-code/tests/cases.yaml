    note: "The pull request's own description:\n\nFor this and similar mounts in a theme:\n\n```toml\n[[module.mounts]]\nsource = 'node_modules/bootstrap'\ntarget = 'assets/vendor/bootstrap'\n```\n\nWe first check the theme itself, then the project root.\n\nFor backwards compatibility, we also make any `../../node_modules/...` `source` paths into `node_modules/...` paths when defined in themes/modules.\n\nFixes #14089\n\nIt links issue #14089, \"Make node_modules a \"special case\" mount\", which reads:\n\nSee #14083 for the longer story\n\nThis is not allowed in a theme/module:\n\n```toml\n[[module.mounts]]\nsource = '../../node_modules/bootstrap'\ntarget = 'assets/vendor/bootstrap'\n```\n\nI suggest that we for a mount outside of the main project and the `source` starts with `node_modules/` (or `../../node_modules/` to also allow existing setups work without modification):\n\n* First check the local path.\n* If not found, check relative to the project.\n\nThis should:\n\n* Be OK security wise\n* Me portable and much less brittle compared to the example in #14083.\n\n/cc  @jmooring"
