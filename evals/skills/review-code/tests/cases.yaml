    title: "walk: stop directory traversal when the context is cancelled - fixes #9788"
    verdict: "APPROVED"
    expected: "Thank you - this is a nice fix :-)"
    note: "The pull request's own description:\n\n#### What does this change do?\n\nIt makes the concurrent directory walker created by `walk()` observe context cancellation, and adds a context check between directory-read chunks in the local backend.\n\nBefore: `job/stop` on an async RC `operations/size` (or an interrupt of any command going through `walk()`) cancelled the job's context, but the checkers kept pulling list jobs and walked the whole tree anyway — the job often even completed with `success=true`. On a 1.26M-file local tree, rclone kept burning ~570% CPU for ~4 s after the stop request was acknowledged, then reported success.\n\nAfter: the same stop makes every checker exit through the existing `quit`/drain path within milliseconds, the job finishes with `error=context canceled`, and CPU returns to idle immediately.\n\nTwo changes:\n\n- `fs/walk/walk.go`: each checker now also selects on `ctx.Done()`. On cancellation it calls `closeQuit()` (the existing shutdown path, which drains pending jobs so `traversing` still converges and no producer stays blocked on the channel), pushes `ctx.Err()` into the existing error channel, and returns. No new synchronization is introduced — this reuses the shutdown machinery that was already there for listing errors.\n- `backend/local/local.go`: `List` checks `ctx.Err()` before each `Readdirnames`/`Readdir` chunk, so cancelling during the enumeration of one huge directory does not have to wait for that directory to finish.\n\n`walkRDirTree`/`walkListR` (native `ListR` backends) were not touched: those already propagate the context to the backend, which is expected to honour it.\n\nRelated but distinct: #9416 (channel deadlock in `fs/walk` under `--fast-list`) is a different bug in the same file — this PR does not address it, and the drain path reused here is the one that already existed.\n\n#### Linked issue\n\nFixes #9788\n\n#### Checklist\n\n- [x] This change is trivial **OR** it has been discussed and agreed in the linked issue.\n- [x] I have read the [contribution guidelines](https://github.com/rclone/rclone/blob/master/CONTRIBUTING.md#submitting-a-new-feature-or-bug-fix).\n- [x] **(If I used AI tools to help write this code)** I have read and understood the [AI-assisted contributions guidance](https://github.com/rclone/rclone/blob/master/CONTRIBUTING.md#ai-assisted-contributions), and I have tested and take ownership of this change myself. Verified against the reproducer in the linked issue (official v1.75.0 vs patched build, 1.26M-file local tree): unpatched keeps walking after `job/stop` until the tree is exhausted; patched finishes with `context canceled` within ~1 s and CPU drops to idle. `go build` passes; `go test -race -count=2 ./fs/walk/... ./backend/local/...` passes. Full `go test ./...`: all packages pass except `cmd/serve/s3` (`TestS3Minio`), which fails identically on unpatched `upstream/master` in this environment (pre-existing, unrelated — it needs a minio binary).\n- [x] I have added tests for all changes in this PR if appropriate.\n- [x] I have added documentation for the changes if appropriate. *(no user-facing surface changes: no flags, no output format changes — behaviour now matches what the docs already promise)*\n- [x] All commit messages are in [house style](https://github.com/rclone/rclone/blob/master/CONTRIBUTING.md#commit-messages).\n- [x] **(Backend changes only)** N/A — the local backend change is a 3-line context check with no behavioural change unless the context is cancelled.\n- [x] This Pull Request is ready for review.\n\n**Test added**: `TestWalkContextCancelled` in `fs/walk/walk_test.go` runs a walk whose every directory listing returns a fresh subdirectory (so the walk never terminates on its own), cancels the context once listing has started, and asserts the walk returns `context.Canceled` within 10 s. Verified it fails on unpatched v1.75.0 (`walk did not stop after the context was cancelled`) and passes with the fix, stable across `-count=5` and under `-race`.\n\nIt links issue #9788, \"walk: directory traversal ignores context cancellation - rc job/stop on operations/size has no effect\", which reads:\n\n### Before you start\n\n- [x] I have searched the [forum](https://forum.rclone.org/) and the existing issues for this problem.\n- [x] I have tested with the latest beta or stable release and can still reproduce the problem.\n- [x] This is a reproducible bug, not a usage question (questions belong on the forum).\n\n### Associated forum post URL\n\nNone — I searched the forum and existing issues and found no report of this (see \"Prior art\" below).\n\n### What is the problem you are having with rclone?\n\nCancelling an async RC job that walks a directory tree has no effect on the traversal itself. `job/stop` cancels the job's context and returns immediately, but the concurrent walkers created by `walk()` keep pulling list jobs from the channel and keep listing the entire tree until it is exhausted, at full CPU.\n\nMeasured with the official `v1.75.0` binary on macOS arm64 against a local tree of 1,260,000 files (6000 directories × 210 files): after `job/stop` is acknowledged, the `rclone rcd` process keeps burning ~570% CPU for ~4 more seconds and the job eventually finishes with `success=true`. The cancellation is effectively ignored.\n\nReproducer:\n\n```bash\n# build a big local tree\nmkdir -p bigtree; for i in $(seq 1 6000); do mkdir -p bigtree/d$i; for j in $(seq 1 210); do printf x > bigtree/d$i/f$j.txt; done; done\n\nrclone rcd --rc-addr 127.0.0.1:5571 --rc-user probe --rc-pass probe &\nsleep 1\nJOB=$(curl -sf -u probe:probe -X POST http://127.0.0.1:5571/operations/size -d fs=bigtree -d _async=true | jq -r .jobid)\nsleep 2\ncurl -sf -u probe:probe -X POST http://127.0.0.1:5571/job/stop -d \"jobid=$JOB\"\n# watch the rcd process keep burning CPU, then finish with success=true\n```\n\nRoot cause: the checker loop inside `walk()` (`fs/walk/walk.go`, the `walkN` path used when the backend has no native `ListR`, e.g. local/alias) only selects on the `in` channel and the internal `quit` signal. Nothing observes `ctx.Done()`. The context-propagation effort (#3257) added a `ctx` parameter to `walk()`, but the checkers never watch it, so any cancellation arriving mid-walk is invisible to them.\n\nAdditionally, the local backend's `List` never checks its context, so once a single huge directory (millions of entries) is being enumerated, cancellation cannot take effect until that enumeration completes.\n\nExpected: after `job/stop`, the walk stops promptly and the job finishes with `error=context canceled`.\n\nThe same blind spot affects `operations/list` with `recurse=true` and any other RC command that goes through `walk()` against a backend without native `ListR`. With `--use-listr`-style paths on backends that have `ListR`, cancellation works because the context is propagated to the backend.\n\n### Prior art\n\nI searched the tracker and the forum before filing:\n\n- #3257 is the completed context-propagation effort; this gap looks like a leftover from it — `walk()` received a `ctx` parameter but its checkers never observe `ctx.Done()`.\n- The 2020 forum report of `job/stop` not stopping an sftp transfer is a different mechanism (backend-level cancellation, pre-#3257).\n- #9416 is a channel deadlock in `fs/walk` under `--fast-list` — same file, distinct bug (deadlock during normal operation, not ignored cancellation).\n\nNo existing issue or PR reports the walker ignoring context cancellation.\n\n### rclone version\n\n```\nrclone v1.75.0\n- os/version: darwin 27.0 (64 bit)\n- os/kernel: 27.0.0 (arm64)\n- os/type: darwin\n- os/arch: arm64\n- go/version: go1.26.2\n- go/linking: dynamic\n- go/tags: none\n```\n\nI also checked current master (`fs/walk/walk.go`): the checker loop still has no `ctx.Done()` observation, so the bug is present in master.\n\n### Which OS you are using\n\nmacOS 27.0 (arm64). The repro is OS-independent — the affected code is pure Go concurrency logic with no platform-specific path.\n\n### Which cloud storage system are you using? (eg Google Drive)\n\nLocal filesystem (no `ListR` implementation, which is what routes `operations/size` through the affected `walkN` path).\n\n### The command you were trying to run (eg `rclone copy /tmp remote:tmp`)\n\nAsync RC `operations/size` against a local remote, cancelled via `job/stop` (see reproducer above).\n\n### A log from the command with the `-vv` flag\n\nFrom the reproducer above, polling `job/status` every second after `job/stop`: the job stays `finished=false` with the process at ~570% CPU for ~4 s, then reports `finished=true, success=true` — the walk ran to completion despite the acknowledged cancellation. No error or suspicious entry appears in the log at any point, which is likely why this has gone unnoticed: the cancelled job looks successful, it just keeps burning CPU in silence."
  assert:
    - *citations
    - *no_false_claims
    - *no_false_blocker
    - *reasons_beyond_diff
    - *severity_discipline
- description: "rclone#9762 - fserrors: fix out of space detection on Window"
  vars:
    fixture: rclone-9762
    title: "fserrors: fix out of space detection on Windows - fixes #8011"
    verdict: "APPROVED"
    expected: "This looks very nice - thank you.\n\nI'll merge this as 4 commits."
    note: "The pull request's own description:\n\n#### What does this change do?\n\nRecognize Windows disk-full errors (`ERROR_DISK_FULL` and `ERROR_HANDLE_DISK_FULL`) so `--local-fatal-if-no-space` stops transfers instead of retrying them. This also prevents a VFS cache hang when the cleaner is disabled and completes fatal-error handling for local multi-thread writer setup, writes and close. Regression tests cover classification, transfer propagation and disabled-cleaner behavior.\n\nThe option remains off by default and preallocation remains best-effort. No flags, public APIs or dependencies are added.\n\n#### Validation\n\nRebased onto master at `3d7b101c7f4b`; validated candidate `03abd08b5541`:\n\n- Windows build and complete uncached quicktest pass on Go 1.27.1 (174 packages). All eight local integration groups pass on their first attempts; actual restic integration passes separately. Repository-defined platform and feature skips remain, including Windows git-annex end-to-end tests.\n- Ten shuffled Windows race repetitions, focused Go 1.26.8 compatibility tests, complete affected Linux suites and focused Linux race coverage pass. Full configured lint, formatting and whitespace checks pass.\n- Actual write-time exhaustion on a fixed-capacity NTFS fixture with four streams and preallocation disabled: the published baseline retries and exits 1 with the option off or on; the candidate retries and exits 1 when off, and stops without retrying with exit 7 when on. Healthy-copy and default-preallocation smoke tests verify contents. This does not establish native preallocation-exhaustion behavior or every later metadata failure.\n\nAn earlier Windows quicktest hit an intermittent directory-timestamp assertion also reproduced on clean upstream; no workaround was added. Full Linux quicktest remains environment-limited: mount/Docker-volume tests require unavailable FUSE, and NFS tests require unsupported filesystem handle operations. This is not a claim that every repository test passed.\n\n#### Linked issue\n\nFixes #8011\n\n#### Checklist\n\n- [x] This change is trivial **OR** it has been discussed and agreed in the linked issue.\n- [x] I have read the [contribution guidelines](https://github.com/rclone/rclone/blob/master/CONTRIBUTING.md#submitting-a-new-feature-or-bug-fix).\n- [x] **(If I used AI tools to help write this code)** I have read and understood the [AI-assisted contributions guidance](https://github.com/rclone/rclone/blob/master/CONTRIBUTING.md#ai-assisted-contributions), and I have tested and take ownership of this change myself.\n- [x] I have added tests for all changes in this PR if appropriate.\n- [x] I have added documentation for the changes if appropriate.\n- [x] All commit messages are in [house style](https://github.com/rclone/rclone/blob/master/CONTRIBUTING.md#commit-messages).\n- [x] **(Backend changes only)** `test_all` passes for this backend and if submitting a new backend can provide a test account for the integration tester - see [CONTRIBUTING.md](https://github.com/rclone/rclone/blob/master/CONTRIBUTING.md#integration-tests).\n- [x] This Pull Request is ready for review.\n\nIt links issue #8011, \"add --local-fatal-if-no-space\", which reads:\n\nSuggested by @ncw here:\r\nhttps://forum.rclone.org/t/how-to-make-rclone-copy-local-to-localdestination-stop-when-out-of-space/30859/2?u=orena1\r\n\r\n```\r\nWe could make a --local-fatal-if-no-space flag or something like that?\r\n\r\nThat would be fairly easy, except for making it cross platform on all the different platforms rclone supports\r\n```"
