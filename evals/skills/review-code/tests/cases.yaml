    note: "The pull request's own description:\n\nFixes #14310\n\nCo-authored-by: Joe Mooring <joe.mooring@veriphor.com>\n\nIt links issue #14310, \"Cascade issue on multilingual site\", which reads:\n\nReference: <https://discourse.gohugo.io/t/is-cascade-broken/56450>\n\nThis occurs with v0.153.0 and later.\n\n```go\n// Issue 14310\nfunc TestIssue14310(t *testing.T) {\n\tt.Parallel()\n\n\tfiles := `\n-- hugo.toml --\ndisableKinds = ['home','rss','sitemap','taxonomy','term']\ndefaultContentLanguage = 'en'\ndefaultContentLanguageInSubdir = true\n[languages.en]\nweight = 1\n[languages.de]\nweight = 2\n-- layouts/all.html --\n{{ .Params.color }}\n-- content/s1/_index.de.md --\n---\ntitle: s1 (de)\ncascade:\n  params:\n    color: red (de)\n---\n-- content/s1/_index.en.md --\n---\ntitle: s1 (en)\ncascade:\n  params:\n    color: red (en)\n---\n-- content/s1/p1.de.md --\n---\ntitle: p1 (de)\n---\n-- content/s1/p1.en.md --\n---\ntitle: p1 (en)\n---\n`\n\n\tb := hugolib.Test(t, files)\n\n\tb.AssertFileContent(\"public/en/s1/p1/index.html\", \"red (en)\")\n\tb.AssertFileContent(\"public/de/s1/p1/index.html\", \"red (de)\") // fails: file contains \"red (en)\"\n}\n```"
