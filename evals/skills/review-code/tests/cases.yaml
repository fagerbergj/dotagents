    - *severity_discipline
- description: "cli#13899 - Warn instead of failing when issue fields can't "
  vars:
    fixture: cli-13899
    title: "Warn instead of failing when issue fields can't be set"
    verdict: "CHANGES_REQUESTED"
    expected: "Thanks @imkp1. I agree with the initial direction, but I want a bit more.\n\nOn top of not failing completely when we get an err from a deferred update, I think we shouldn't be showing the type picker at all when a user doesn't have permission. Today, it's gated by whether the repo has types, but clearly that's not enough. We need to gate types showing up based on `repo.ViewerCanTriage()`, I think. Though a test is in order to ensure I'm correct and that's the right permission."
    note: "The pull request's own description:\n\n## Summary\n\n`gh issue create` creates the issue, then applies the deferred fields (type,\nparent, blocked-by, blocking) in a second step. When one of those mutations\nfails, `createRun` returns the error. The deferred `PreserveInput` sees a\nnon-nil error, writes a recovery file and prints:\n\n```\nX operation failed. To restore: gh issue create --recover /var/folders/.../gh2543392225.json\n\nGraphQL: monalisa does not have the correct permissions to execute `UpdateIssueIssueType` (updateIssueIssueType)\n```\n\nThe issue URL is never printed. But the issue **does exist** — `api.IssueCreate`\nalready returned successfully. The message is misleading, and the `--recover`\nprompt invites a duplicate submission of an issue that was just created.\n\nThis is reproducible by creating an issue on a repository where you cannot set\nthe issue type: the `UpdateIssueIssueType` mutation fails with a permissions\nerror after the issue has been created.\n\nThis assigns the deferred-update failure to a separate `updateErr` instead of\nthe named return `err`, reports it as a warning on stderr, and still prints the\nissue URL:\n\n```\n$ gh issue create --title \"Bug\" --type \"Bug\"\n! Issue created, but not all fields could be set: GraphQL: monalisa does not have\n  the correct permissions to execute `UpdateIssueIssueType` (updateIssueIssueType)\nhttps://github.com/OWNER/REPO/issues/123\n```\n\nUsing a separate variable (rather than clearing `err`) means the named return is\nprovably never set on this path, so `PreserveInput` cannot fire and no recovery\nfile is written.\n\nThe issue already exists once `api.IssueCreate` returns, and\n`api.DeferredUpdateIssue` already joins its failures so that a single failing\nmutation does not abort the rest — by the time it returns an error, every\nmutation has been attempted.\n\n## Scope\n\nResolving the deferred fields is deliberately left alone. `deferredUpdateIssueOptions`\nruns *before* any mutation and reports invalid input such as `type \"Bugz\" not found`;\nthat remains a fatal error, and the existing `create with type not found` test pins\nthis behaviour.\n\n## Testing\n\n- `create with type that cannot be set` — added to the `Test_createRun` table,\n  stubbing `UpdateIssueIssueType` with a `FORBIDDEN` error. Asserts the issue URL\n  is printed to stdout, the warning is printed to stderr, and that `createRun`\n  returns no error (which is what stops `PreserveInput` from writing a recovery\n  file). Verified to fail without the change and pass with it.\n- `go test ./pkg/cmd/issue/...`, `go vet ./pkg/cmd/issue/create/...` and `gofmt`\n  all pass.\n\nFixes #13804\n\nIt links issue #13804, \"`gh issue create` errors after successful creation when issue type can't be set\", which reads:\n\n### Describe the bug\n\n`gh issue create` shows an error message with \"does not have the correct\npermissions to execute `UpdateIssueIssueType`\" - even though the issue was\ncreated successfully. Occurs only when you dont have the right permissions on\nthe repo.\n\n### Affected version\n\n```bash\ngh version 2.96.0 (2026-07-02)\n```\n\n### Steps to reproduce the behavior\n\n1. gh issue create --repo <repo-with-issue-types> on a repo where you cant set the type\n2. See the error\n\n### Expected vs actual behavior\n\n**Expected:** Issue created, no error message.\n\n**Actual:** Issue created, then X operation failed... GraphQL: <user> does not\nhave the correct permissions to execute UpdateIssueIssueType.\n\n### Logs\n\n```bash\ngh issue create --repo cli/cli\n\nCreating issue in cli/cli\n\n? Title (required) `gh issue create` errors after successful creation when issue type can't be set\n? Choose a template 🐛 Bug report\n? Body <Received>\n? Issue type Bug\n? What's next? Submit\n\nX operation failed. To restore: gh issue create --recover /var/folders/n6/x5dgkb0j4mncg9_0l47pyzr80000gn/T/gh2543392225.json\n\nGraphQL: LangLangBart does not have the correct permissions to execute `UpdateIssueIssueType` (updateIssueIssueType)\n```"
  assert:
    - *citations
    - *no_false_claims
    - *flags_incomplete_delivery
    - *reasons_beyond_diff
    - *severity_discipline
- description: "rclone#9703 - sync: add backup-dir deletes-only option"
  vars:
    fixture: rclone-9703
    title: "sync: add backup-dir deletes-only option"
    verdict: "CHANGES_REQUESTED"
    expected: "Thanks for the fix! A few thoughts:\n\n1. I think `--backup-dir` also touches a few other places in the code that would need similar treatment in order to truly implement this. For example:\n\nhttps://github.com/rclone/rclone/blob/387b4b5e11d611780a283db01c493e21ba7826f0/fs/operations/operations.go#L2113-L2115\n\nhttps://github.com/rclone/rclone/blob/387b4b5e11d611780a283db01c493e21ba7826f0/fs/operations/operations.go#L1687-L1688\n(`--copy-dest`)\n\n\nConsider:\n```\nrclone copyto src/f.txt dst/f.txt --backup-dir bak --backup-dir-deletes-only\n```\nwould result in `bak/f.txt` existing, while `rclone copy` on the parent folder would produce the opposite result.\n\n2. We can also end up with a `backupDir` a second way, when `--backup-dir` is not set but `--suffix` is:\n\nhttps://github.com/rclone/rclone/blob/387b4b5e11d611780a283db01c493e21ba7826f0/fs/operations/operations.go#L1957-L1959\n\nCurrently, `--backup-dir-deletes-only` would have no effect on that second way, even though it would seem to present a similar problem as the first (backup unnecessary because native versioning takes care of it). A potentially easy solution here would be to gate on `s.backupDir != nil` instead of `ci.BackupDir != \"\"`. (And maybe change the name to `--backup-deletes-only`?)\n\nWhat do you think?"
    note: "The pull request's own description:\n\n#### What does this change do?\n\nAdds `--backup-dir-deletes-only` for `sync`. With the option enabled alongside `--backup-dir`, destination-only files are moved to the backup directory, while changed files are overwritten in place so remotes with native versioning can retain their version history.\n\nThe option is config-backed, documented, and leaves suffix-only behavior unchanged when no backup directory is configured.\n\n#### Linked issue\n\nFixes #2352\n\n#### Verification\n\n- `go build`\n- `make quicktest BRANCH=backup-dir-deletes-only-2352`\n- `go test -race ./fs/sync -count=1`\n- `go test ./fs/... -count=1`\n- `go vet ./fs ./fs/sync`\n- CLI help smoke test\n\n#### Checklist\n\n- [x] This change is trivial **OR** it has been discussed and agreed in the linked issue.\n- [x] I have read the contribution guidelines.\n- [x] I have read and understood the AI-assisted contributions guidance, tested the change, and take ownership of it.\n- [x] I have added tests for all changes in this PR if appropriate.\n- [x] I have added documentation for the changes if appropriate.\n- [x] All commit messages are in house style.\n- [x] Backend-only integration-test requirement is not applicable.\n- [x] This Pull Request is ready for review.\n\nIt links issue #2352, \"[Feature Request] adding --backup-dir-deletes-only feature\", which reads:\n\n#### What is the problem you are having with rclone?\r\ntaking advantage of box versioning when using sync - see thread: \r\nhttps://forum.rclone.org/t/understanding-backup-dir-behavior-with-box-and-others/5880/7\r\n\r\n#### What is your rclone version (eg output from `rclone -V`)\r\nrclone v1.41\r\n- os/arch: windows/amd64\r\n- go version: go1.10\r\n\r\n#### Which OS you are using and how many bits (eg Windows 7, 64 bit)\r\nWindows Server 2012 R2 64 bit\r\n\r\n####  Which cloud storage system are you using? (eg Google Drive)\r\nbox.com\r\n\r\n#### The command you were trying to run (eg `rclone copy /tmp remote:tmp`)\r\nclone sync \r\n\r\n#### A log from the command with the `-vv` flag (eg output from `rclone -vv copy /tmp remote:tmp`)"
  assert:
    - *citations
    - *no_false_claims
    - *flags_incomplete_delivery
    - *reasons_beyond_diff
    - *severity_discipline
- description: "nomad#28519 - core: ignore NomadTokenID when comparing job s"
  vars:
    fixture: nomad-28519
    title: "core: ignore NomadTokenID when comparing job specs (#26810)"
    verdict: "APPROVED"
    expected: "LGTM! Thanks @vky5!"
    note: "The pull request's own description:\n\n### Description\r\n<!-- Please describe why you're making this change and point out any important details the reviewers\r\nshould be aware of.-->\r\n\r\n`Job.SpecChanged()` does a `reflect.DeepEqual` on two jobs after scrubbing the bookkeeping fields (`Status`, `Version`, `ModifyIndex`, `SubmitTime`), but it never scrubs `NomadTokenID`, which holds the accessor ID of the token that submitted the job. So re-running `nomad job run` on a file you haven't touched with a different `NOMAD_TOKEN` reads as a spec change, and you get a new job version and a deployment out of it.\r\n\r\nNot multiregion specific. The field is only there for MRD, but `SpecChanged()` sits on the normal register path, so this hits any cluster with ACLs on.\r\n\r\n`diff.go` already excludes the same field for the plan diff, so the two disagree right now: `nomad plan` says nothing changed while the register path deploys anyway.\r\n\r\n`SpecChanged()` also backs `deploymentwatcher.handleRollbackValidity`, which decides whether a rollback target is actually different from what's running. A token-only difference makes an identical target look changed, so you get one extra rollback and job version before the guard catches it on the next pass.\r\n\r\nTwo things this changes:\r\n1. A token-only resubmit stops writing a version, so the stored `NomadTokenID` sticks with the accessor from the last real spec change until the next one re-stamps it. Confirmed fine in #26810, a token rotated mid-deployment fails the deployment anyway.\r\n2. `nomad job revert` to an older version with the same spec is now a real no-op. `Job.Revert` goes through `doRegister`, so before this the reverting user's token on its own was enough to make a new version.\r\n\r\nOne thing I can't check from the OSS side: the CE `multiregionSpecChanged` just forwards to `SpecChanged`, so this should land under the ENT override too, but someone with ENT access should confirm.\r\n\r\n### Testing & Reproduction steps\r\n<!--\r\n* In the case of bugs, please describe how to reproduce it.\r\n* If any manual tests were done, document the steps and the conditions to reproduce them.\r\n-->\r\n\r\nReproduction steps are in #26810.\r\n\r\nAdded `TestJob_SpecChanged/Same_job_except_NomadTokenID`, checked it fails without the scrub line.\r\n\r\n### Links\r\n<!--\r\nPlease include links to GitHub issues, documentation, or similar which is relevant to this PR. If\r\nthis is a bug fix, please ensure related issues are linked so they will close when this PR is\r\nmerged.\r\n-->\r\n\r\nFixes #26810\r\n\r\n### Contributor Checklist\r\n- [x] **Changelog Entry** If this PR changes user-facing behavior, please generate and add a changelog entry using the `make cl` command.\r\n- [x] **Testing** Please add tests to cover any new functionality or to demonstrate bug fixes and ensure regressions will be caught.\r\n- [ ] **Documentation** If the change impacts user-facing functionality such as the CLI, API, UI, and job configuration, please update the Nomad product documentation, which is stored in the [`web-unified-docs` repo](https://github.com/hashicorp/web-unified-docs/). Refer to the [`web-unified-docs` contributor guide](https://github.com/hashicorp/web-unified-docs/blob/main/CONTRIBUTING.md) for docs guidelines. Please also consider whether the change requires notes within the [upgrade guide](https://developer.hashicorp.com/nomad/docs/upgrade/upgrade-specific). If you would like help with the docs, tag the `nomad-docs` team in this PR.\r\n- [ ] **LLM Usage** If an LLM was used to generate any code, please ensure and confirm you have read and followed the [AI usage guide](../contributing/ai.md).\r\n\r\n### Reviewer Checklist\r\n- [ ] **Backport Labels** Please add the correct backport labels as described by the internal backporting document.\r\n- [ ] **Commit Type** Ensure the correct merge method is selected which should be \"squash and merge\" in the majority of situations. The main exceptions are long-lived feature branches or merges where history should be preserved.\r\n- [ ] **Enterprise PRs** If this is an enterprise only PR, please add any required changelog entry within the public repository.\r\n\r\n\r\n<!-- heimdall_github_prtemplate:grc-pci_dss-2024-01-05 -->\r\n\r\n- [ ] If a change needs to be reverted, we will roll out an update to the code within 7 days.\r\n\r\n## Changes to Security Controls\r\n\r\nNone.\n\nIt links issue #26810, \"Changing NOMAD_TOKEN causes no-op changes to create deployment (due to token accessor for MRD)\", which reads:\n\n### Nomad version\n```bash\nnomad version\nNomad v1.10.4\nBuildDate 2025-08-12T20:48:32Z\nRevision 62b195aaa535b2159d215eaf89e6f4a455d6f686\n```\n\n### Operating system and Environment details\nNomad cluster is a mix of Linux and Windows machines. When deploying jobs Nomad CLI is run from a Linux environment.\n\n### Issue\nAn execution of `nomad job run example.hcl` will create a new deployment when there is no change.\n\n### Reproduction steps\n\nCreate an example job spec, as far as I can tell nothing about it matters, example provided below. Then execute the following commands:\n\n```bash\n# Login to Nomad\nnomad login\nexport NOMAD_TOKEN=#####\n\n# Create the first deployment\nnomad job run example.hcl\n\n# As expected that will create a deployment, once that is completed continue\n\n# This will return immediately and nothing will happen as there is no change \nnomad job run example.hcl\n\n# Generate a new token\nnomad login\nexport NOMAD_TOKEN=#####\n\n# Deploy the job spec again\nnomad job run example.hcl\n\n# That will cause a new deployment even though it should not and there\n# are not any changes\n```\n\nYou can see in this screenshot that the Nomad UI even knows that there is no change between the two versions, yet there is a version bump and a new deployment.\n\n<img width=\"1185\" height=\"409\" alt=\"Image\" src=\"https://github.com/user-attachments/assets/a4b91e30-f7e3-4784-865f-d833d716e6fd\" />\n\n### Job file (if appropriate)\n\n```hcl\njob \"example-bad-things\" {\n  region      = \"global\"\n  datacenters = [\"dcspecial\"]\n  node_pool   = \"specialpool\"\n  type        = \"service\"\n  namespace   = \"production\"\n\n  group \"bad-things\" {\n    task \"postgres\" {\n      driver = \"docker\"\n\n      config {\n        image = \"postgres:17.6\"\n      }\n      resources {\n        cpu    = 500\n        memory = 512\n      }\n\n      template {\n        destination = \"secrets/file.env\"\n        env         = true\n        data        = <<EOF\nPGDATA=/var/lib/postgresql/17/docker\nPOSTGRES_USER=grafana\nPOSTGRES_PASSWORD=badbadbadbad\nPOSTGRES_DB=grafana\nEOF\n      }\n    }\n  }\n}\n```"
