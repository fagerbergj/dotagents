    - *severity_discipline
- description: "k6#6278 - Fix WebCrypto digest BufferSource handling"
  vars:
    fixture: k6-6278
    title: "Fix WebCrypto digest BufferSource handling"
    verdict: "CHANGES_REQUESTED"
    expected: "Fix itself is LGTM with one worry 👍 | internal/js/modules/k6/webcrypto/sobek.go: The PR doesn't seem to close #4259 because the issue asks for the `ArrayBuffer` read fix **and** for dropping the `copyUint8Array(...)` wrapper on the truncated `vector.signature`, which this fix makes unnecessary."
    note: "The pull request's own description:\n\n## What?\n\n- Copy only the visible bytes from `TypedArray` and `DataView` inputs instead of their entire backing buffers.\n- Capture the native `ArrayBuffer.isView` callable before user code runs, so public constructor overrides and later global mutations do not affect BufferSource validation.\n- Add public `crypto.subtle.digest()` regression coverage for view offsets and lengths, snapshot semantics, subclasses, constructor overrides, and spoofed array-like objects.\n\n## Why?\n\n`TypedArray.prototype.subarray()` and `DataView` can expose only part of a larger backing buffer. The previous extraction path copied the complete backing buffer, so WebCrypto operations could process bytes outside the supplied view instead of following Web IDL's BufferSource copy semantics.\n\n## Checklist\n\n- [ ] I have performed a self-review of my code.\n- [x] I have commented on my code, particularly in hard-to-understand areas.\n- [x] I have added tests for my changes.\n- [ ] I have run linter and tests locally (`make check`) and all pass.\n\nVerification completed:\n\n- `go test -count=1 ./internal/js/modules/k6/webcrypto/...`\n- `go test -race -count=1 ./internal/js/modules/k6/webcrypto/...`\n- `go vet ./internal/js/modules/k6/webcrypto/...`\n- Full-repository `golangci-lint` with the pinned v2.10.1: `0 issues`\n- Full-repository race tests with proxy variables disabled passed all packages except `TestGRPCInputOutput/Client_Streaming`, which cannot connect because this environment resolves `localhost` to a different loopback address than the test fixture listener (`127.0.1.1:PORT: connection refused`).\n- The WPT suite was skipped because its separate checkout is not present.\n\n## Related PR(s)/Issue(s)\n\nCloses #4259\n\nIt links issue #4259, \"Adjust an extract array buffer logic\", which reads:\n\n# What?\n\nWe have to adjust how we get a copy of input data.\n\nCurrently, we do read the buffer directly: \nhttps://github.com/grafana/k6/blob/46c37f5b3350094090ea8e5c5eeae1bc6336c92a/js/modules/k6/webcrypto/sobek.go#L24-L27\n\nbut we should do this as specifications suggest:\nhttps://webidl.spec.whatwg.org/#dfn-get-buffer-source-copy\n\n## Context\n\nThe issue was found during the work on the ECDSA where test cases use subarray's so currently, there is a workaround with copying array implemented https://github.com/grafana/xk6-webcrypto/pull/69/commits/ec27d05813b555efbeb268cad6dff6ee09dd14f9\n\nWhen this adjustment is done, we should remove this workaround. \n\n# Why?\n\nUsers could modify the variables, but the `buffer` will contain the original values.\n\nHere is an example of pseudo-code.\n\nLet's say we have a JavaScript function `foo` mapped to Golang's implementation `Foo(v sobek.Value)`. Foo accepts only one argument, `a`, which is supposed to be an ArrayBuffer.\n\n```js\n// We have some data\nlet data = new Uint8Array([48, 129, 135, 2, 1]);\n \n// We'd like to create a new array that contains only the first two elements\n// [48, 129]\nlet a = data.subarray(0, 2);\n\n//We pass a variable to a foo, and expect that foo should process [48, 129]\nfoo(a)\n```\n\nIn golang we have an implementation like:\n\n```golang\nfunc Foo(v sobek.Value) {\n   asObject := v.ToObject(rt)\n   \n   // The problem is that the buffer keeps a reference to an original buffer of data\n   // and the result will be []byte{48, 129, 135, 2, 1}\n   ab, ok = asObject.Get(\"buffer\").Export().(sobek.ArrayBuffer)\n   if !ok {\n      panic(\"not an array buffer\")\n   }\n\n   bytes := ab.Bytes()\n   bytesCopy := make([]byte, len(bytes))\n   copy(bytesCopy, bytes)\n\n   // we expect bytesCopy expecting that it will contain  [48, 129]\n   // but in fact it will be original data with [48, 129, 135, 2, 1]\n}\n```"
  assert:
    - *citations
    - *no_false_claims
    - *flags_incomplete_delivery
    - *reasons_beyond_diff
    - *severity_discipline
- description: "k6#4844 - Feature/remove event listener"
  vars:
    fixture: k6-4844
    title: "Feature/remove event listener"
    verdict: "CHANGES_REQUESTED"
    expected: "@ekgns33 thanks for the PR! Sorry for the delay in getting back to you. We most definitely appreciate it when someone from the community contributes to k6 🙇 \r\n\r\nWe've taken a look at the PR and it's not quite what the original issue was talking about, or at least the changes weren't made in the correct module.\r\n\r\nThe original issue was talking about implementing `removeEventListener` in the `experimental/websocket` module, where there already exists an implementation for [addEventListener](https://github.com/grafana/k6/blob/master/internal/js/modules/k6/experimental/websockets/websockets.go#L185), but it's missing the remove implementation.\r\n\r\nWe'd be happy for you to create a PR to add `removeEventListener` into the experimental websocket module 👍"
    note: "The pull request's own description:\n\n## What?\r\n\r\n<!-- A short (or detailed) description of what this PR does. -->\r\n\r\nThis PR adds `Off` function which remove registered event-listener function mapped to user specified event.\r\n\r\n## Why?\r\n\r\n<!-- A short (or detailed) explanation of why these changes are made and needed. -->\r\n\r\nAs Issue #4823 describes, k6 doesn't have interface for removing event-listener of websocket.\r\n\r\n## Checklist\r\n\r\n<!-- \r\nIf you haven't read the contributing guidelines https://github.com/grafana/k6/blob/master/CONTRIBUTING.md \r\nand code of conduct https://github.com/grafana/k6/blob/master/CODE_OF_CONDUCT.md yet, please do so\r\n-->\r\n\r\n- [x] I have performed a self-review of my code.\r\n- [x] I have commented on my code, particularly in hard-to-understand areas.\r\n- [x] I have added tests for my changes.\r\n- [x] I have run linter and tests locally (`make check`) and all pass.\r\n\r\n## Checklist: Documentation (only for k6 maintainers and if relevant)\r\n\r\n**Please do not merge this PR until the following items are filled out.**\r\n\r\n- [ ] I have added the correct milestone and labels to the PR.\r\n- [ ] I have updated the release notes: _link_\r\n- [ ] I have updated or added an issue to the [k6-documentation](https://github.com/grafana/k6-docs): grafana/k6-docs#NUMBER if applicable\r\n- [ ] I have updated or added an issue to the [TypeScript definitions](https://github.com/grafana/k6-DefinitelyTyped/tree/master/types/k6): grafana/k6-DefinitelyTyped#NUMBER if applicable\r\n\r\n<!-- - [ ] Any other relevant item -->\r\n\r\n## Related PR(s)/Issue(s)\r\n\r\n<!-- - <https://github.com/grafana/...> -->\r\n\r\n<!-- Does it close an issue? -->\r\n\r\n<!-- Closes #ISSUE-ID -->\r\n#4823 \r\n<!-- Thanks for your contribution! 🙏🏼 -->\n\nIt links issue #4823, \"Experimental websocket removeEventListener\", which reads:\n\n### Feature Description\n\nThe standard [Websocket](https://developer.mozilla.org/en-US/docs/Web/API/WebSocket) api by virtue of being an [EventTarget](https://developer.mozilla.org/en-US/docs/Web/API/EventTarget) has both the functions addEventListener and removeEventListener. K6 Websocket implementation only has addEventListener.  \n\n### Suggested Solution (optional)\n\nI propose adding removeEventListener as well. It could be the same as addEventListener. \n\n### Already existing or connected issues / PRs (optional)\n\n_No response_"
