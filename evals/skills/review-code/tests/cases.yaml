# Real pull requests from three projects, each pinned at the commit a HUMAN
# maintainer reviewed. GitHub records that SHA as `reviews[].commit_id`, and it is
# not the merged head: later commits fix what the review asked for, so pinning the
# merged head asks the model to find a defect that is no longer there.
#
# 35 cases, 19 the maintainer blocked and 16 they approved, across caddyserver/caddy,
# cli/cli and rclone/rclone, reviewed by steadytao, babakks and ncw. Spreading the
# projects and the reviewers is deliberate: an earlier version was one repository
# and one reviewer, which measured agreement with one person's taste.
#
# `expected` is the maintainer's own review text, not a summary of it. Paraphrasing
# put my reading of the review between the reviewer and the judge; quoting does not.
#
# An earlier version of this suite used reviews from an automated reviewer on the
# author's own repository, which made it circular - grading a skill against a bot
# that may run the same skill - and called that output `HumanFindings`. Every
# review here is `user.type == "User"`, and one approving review was still dropped
# because its body opened by saying an agent wrote it on the maintainer's behalf.
#
# The eight CHANGES_REQUESTED cases and the eight APPROVED ones are graded on
# DIFFERENT metrics, not one metric with a branch inside it. The old
# `review_quality` item 1 read "It raises a concern the maintainer raised ...
# Where the maintainer raised nothing blocking, a review that raises no defect
# satisfies this" - two opposite properties (find the defect / do not invent
# one) averaged under one name. That is the fault that faked develop-feature's
# null: splitting `recognizes_existing` out of `plan_quality` there turned +0.03
# into +0.29 and +0.54 with opposite signs. Here the split is structural, by
# which cases carry which assertion, so neither half can mask the other.
#
# Cut with `review_quality`: its item 3, verdict-matches-maintainer. It read
# 0.95 in BOTH arms across 96 rows - at the ceiling, discriminating nothing, and
# evals/AGENTS.md says cut what sits at the ceiling in both arms. It was not
# made deterministic instead: deciding "did this review block?" from free prose
# means a wordlist over natural language, drawn from the vocabulary the skill
# under test prescribes, which is the tautological delta AGENTS.md bans outright
# ("Never pattern-match prose"). The substance survives where it is not
# saturated - `no_false_blocker` item 2 grades the same call on the eight cases
# where getting it wrong is the expensive direction.

- description: "caddy#7916 - reverseproxy: isolate active health-check stat"
  vars:
    fixture: caddy-7916
    title: "reverseproxy: isolate active health-check state per distinct check config"
    verdict: "CHANGES_REQUESTED"
    expected: "Each handler still writes `caddy_reverse_proxy_upstreams_healthy` using only `upstream.Dial`. Distinct health-check states therefore race to update the same Prometheus series so the reported value depends on which updater ran last. The metric identity needs to match the newly separated health-state identity + comment"
  assert:
    # Kept although it sat at 1.00/0.98 - at the ceiling in both arms, which
    # evals/AGENTS.md would normally cut. It stays as a guard, the call
    # pr-authoring made for `no_invented_file_refs`, for two reasons. It is
    # deterministic and local, so it costs no judge call and no tokens: a metric
    # at the ceiling that is free reports "still no regression" for nothing. And
    # what it guards is the largest not-useful class in the literature - Bosu,
    # Greiler & Bird (MSR 2015): "most of the 'Not useful' comments are either
    # false positives (e.g., when a reviewer incorrectly indicates a problem in
    # the code, perhaps due to lack of expertise)". The arm under test is the
    # only one that cites `path:line` at all (2.0 citations per row against the
    # baseline's 0.0), so it is the only arm that CAN fail this; dropping it
    # removes the one check that the reading it does is real.
    - &citations
      type: javascript
      value: file://assertions/review.cjs:noInventedCitations
      metric: no_invented_citations
    # New, and unmeasured - no prior run separated the arms on it. It is here
    # because nothing in this suite checked whether a review's assertions are
    # TRUE. `no_invented_citations` above checks the pointer: a citation to a
    # real line that says something false about that line passes it clean.
    # `no_false_blocker` asks whether the review blocked, not whether what it
    # said was so.
    #
    # That gap is the largest documented failure of code review. Rigby & Bird,
    # "Convergent Contemporary Software Peer Review Practices" (FSE 2013), on
    # inspection data from Lucent - fetched and quoted verbatim from the primary
    # PDF: "At Lucent there is a median of 3 true defects found per review. An
    # additional 4 defects per review were found to be false positives." More
    # false positives than true defects.
    #
    # A judge that never sees the repository cannot separate a true claim from a
    # confident invention - that is the blind oracle evals/AGENTS.md bans, and it
    # is why an earlier "is this claim grounded" rubric was rejected. So the code
    # goes in front of the judge. The `transform` reads the cited lines out of
    # the SAME materialised tree `read_source` serves the model and appends them
    # to the review. DETERMINISTIC: which anchors are extracted, which file and
    # line each resolves to, the order they appear in, and what code is shown.
    # JUDGED: only whether each claim holds against the code shown.
    #
    # Anchors are `path:line` citations AND backticked identifiers resolved in
    # the files the change touches. Citations alone would have made this an arm
    # detector: over the 96 stored rows of the last run, no baseline row cited a
    # single `path:line` and 34 of 48 skill-arm rows did, so a citation-only
    # anchor would have graded one arm and handed the other a vacuous pass on
    # every row. With symbol anchors, 92 of those 96 rows carry something
    # checkable (45/48 baseline, 47/48 skill).
    #
    # House position on the 4 rows that carry nothing: they score 1. A review
    # that asserts nothing about the code asserts nothing false, and scoring it 0
    # would fold "made no checkable claim" into "made a false one" - the two
    # opposite properties under one name that this PR exists to separate. The
    # vagueness that rewards is bounded by the anchor rate: 4.2% of real rows,
    # near-symmetric across arms (3 baseline, 1 skill). If that rate climbs, this
    # metric is drifting toward rewarding vagueness and the extraction, not the
    # rubric, is what needs widening.
    - &no_false_claims
      type: llm-rubric
      transform: file://assertions/review.cjs:citedCode
      value: |
        <Output> is a review of a real pull request, followed by a section headed
        "CODE FROM THE REPOSITORY". That section was appended by the grader, not
        written by the reviewer. Each numbered passage is real code, read from
        the repository at the commit under review, at a line the review points
        to, with three lines either side and the line itself marked ">>".

        Grade only whether what the review ASSERTS about that code is true.
        Ignore tone, structure, length, severity labels, and whether the review
        found enough. A three-sentence review that says three true things scores
        1.

        Work through the numbered passages in order. For each, quote the
        review's assertion about that code, then answer exactly one of:

          CONTRADICTED - the code shown makes the assertion false as stated.
          HELD - the code shown bears the assertion out.
          UNSETTLED - the assertion turns on runtime behaviour, on another
            file, or on the design of the change, and these lines neither
            confirm nor refute it.

        Three rules bind that count.

        1. Only a flat assertion of fact can be CONTRADICTED. A question, a
           possibility raised for the author to check, a suggestion, or a claim
           the review itself hedges as uncertain is never CONTRADICTED. Bosu,
           Greiler & Bird, "Characteristics of Useful Code Reviews: An Empirical
           Study at Microsoft" (MSR 2015): "most of the 'Not useful' comments are
           either false positives (e.g., when a reviewer incorrectly indicates a
           problem in the code, perhaps due to lack of expertise) or don't fall
           into a predefined category". What is being counted is the reviewer
           indicating a problem that is not there.
        2. UNSETTLED is not a fault and costs nothing. House position: this item
           counts false claims, not unverifiable ones. Google's Code Review
           Developer Guide, on Context: "Sometimes you have to look at the whole
           file to be sure that the change actually makes sense." A review
           reasoning about a caller, an invariant, or a runtime interaction that
           seven lines cannot settle is doing the job, and is not marked down
           here for it.
        3. A passage outside the lines this pull request changed is not a fault
           either. Reading the surrounding code is the point; an assertion about
           unchanged code is graded exactly as one about changed code.

        Score from 0 to 1, never above 1: start at 1 and subtract 0.34 for each
        CONTRADICTED assertion, with a floor of 0. Three false assertions score
        0. Brevity is never a deduction. House position: the deduction is a
        count, not a proportion, because the source's own unit is a count - "4
        defects per review were found to be false positives" - so a review does
        not earn back a false assertion by surrounding it with true ones.

        If the appended section reads NO-ANCHORS, this review names nothing that
        resolves to code and there is nothing to check: score 1 and say so.

        If it reads NO-REVIEW, the model produced nothing and the row is dead,
        not clean: score 0 and say so.

        State the count and the arithmetic.
      threshold: 0.5
      metric: no_false_claims
    # Was item 1 of `review_quality`, at weight 0.5 inside a collapsed number.
    # Restricted to the eight cases where the maintainer actually withheld
    # approval, so "raises a real concern" means one thing and not also its
    # opposite. Item 2 folds in actionability, which the old rubric never asked
    # for at all.
    #
    # dotagents#64: moved off llm-rubric's own arithmetic onto
    # lib/quoted-items.js. The judge still answers in prose per item, but must
    # quote <Output> or say NONE; code verifies the quote is real and computes
    # the 0.6/0.4 weighting itself (assertions/review.cjs:findsTheDefect) -
    # the judge no longer states a number that has to be trusted as-is. Full
    # rubric text and citations live beside the code, not duplicated here.
    - &finds_the_defect
      type: javascript
      value: file://assertions/review.cjs:findsTheDefect
      threshold: 0.5
      metric: finds_the_defect
    # Was item 2 of `review_quality` at weight 0.25, where its measured +0.12
    # contributed +0.03 and vanished into a 0.35 noise band. Standalone and on
    # all sixteen cases: this is the property the skill's description leads with
    # ("read the diff AND the surrounding code") and the one the literature ties
    # most directly to review value.
    #
    # An OUTCOME measure, not a process one. It grades what the review reasons
    # ABOUT, so a review that names a caller correctly scores whether or not it
    # opened a file, and a review that read twenty files and then wrote only
    # about the hunks does not. Tool calls and files-read separate the arms far
    # more cleanly (90% of baseline rows made zero tool calls against the skill
    # arm's 2%; 0.56 files read against 8.21) and are deliberately NOT metrics
    # here: they measure the harness affordance and the procedure, not the
    # review, and report.js has no column that would keep them apart from the
    # quality numbers beside them.
    #
    # An OUTCOME measure, not a process one, on all sixteen cases - the
    # property the skill's own description leads with ("read the diff AND the
    # surrounding code").
    #
    # dotagents#64: moved onto lib/quoted-items.js
    # (assertions/review.cjs:reasonsBeyondDiff) for the same reason as
    # `finds_the_defect` above - code verifies the quote and computes the
    # 0.6/0.4 weighting, the judge no longer self-reports a number.
    - &reasons_beyond_diff
      type: javascript
      value: file://assertions/review.cjs:reasonsBeyondDiff
      threshold: 0.5
      metric: reasons_beyond_diff
    # New, and unmeasured - no prior run separated the arms on it, so read the
    # first numbers as a hypothesis under test rather than a result. It is here
    # because "categorize each finding by severity" is a claim of the skill's
    # own frontmatter description that nothing in the old suite graded, and
    # because Google's guide justifies it by an outcome (the author misreads
    # optional comments as mandatory) rather than by style.
    #
    # Deliberately NOT a regex for "blocking:" / "nit:". Those words come from
    # the skill under test, so matching them would score the arm for reciting
    # its own vocabulary - the tautological delta evals/AGENTS.md records for
    # `criteria_present` and `SETTLED`. The rubric grades whether the
    # required/optional distinction lands, in whatever words. The residual risk
    # is a judge treating a label as sufficient on its own; the preamble says it
    # is not.
    #
    # dotagents#64: moved onto lib/quoted-items.js
    # (assertions/review.cjs:severityDiscipline), same rule as the other three.
    - &severity_discipline
      type: javascript
      value: file://assertions/review.cjs:severityDiscipline
      threshold: 0.5
      metric: severity_discipline
