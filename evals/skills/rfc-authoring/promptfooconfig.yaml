# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: RFC authoring skill effectiveness

# Two arms over the same tasks. Arm labels come from the skill's frontmatter
# version, so bumping metadata.version in SKILL.md relabels the comparison.
prompts:
  - id: file://prompts/arms.js:noSkill
    label: no-skill
  - id: file://prompts/arms.js:skillCurrent
    label: skill-current

providers:
  # Custom provider, not `openai:chat:*`: same OpenAI-compatible call, plus a
  # `load_resource` tool over the skill's own directory so the skill arm can
  # follow SKILL.md's instructions to read its bundled files. The tool exists
  # only when the prompt supplies `skillDir` (see prompts/arms.js), so the
  # baseline arm sends no `tools` key and is called exactly as before.
  - id: file://../../lib/skill-tools.js
    label: deepseek-v4-flash+resources
    config:
      model: deepseek/deepseek-v4-flash
      apiBaseUrl: https://openrouter.ai/api/v1
      max_tokens: 8192
      passthrough:
        reasoning:
          enabled: false
      apiKeyEnvar: OPENROUTER_API_KEY
      # One reference plus one example RFC, 5.9 KB together - the budget is a ceiling
      # on a runaway loop, not a rationing of two small files.
      maxToolCalls: 4
      maxResourceBytes: 8192

defaultTest:
  options:
    # dotagents#64/#65 quote-verified judge, same as review-code's and
    # adr-authoring's: every judged metric in tests/cases.yaml is
    # `type: javascript` and calls assertions/rfc.cjs, which reads this
    # provider block itself (rfc.cjs's judgeProvider) rather than going
    # through promptfoo's own llm-rubric/g-eval. No rubricPrompt override
    # anywhere in this suite - moving off llm-rubric/g-eval removes both the
    # g-eval newline-parsing bug (verdict extracted with /{.+}/, which cannot
    # cross newlines, so a pretty-printed reply was discarded and the row
    # recorded 0.00) and the risk a custom rubricPrompt drops promptfoo's
    # system message and kills the row with "Could not extract JSON".
    #
    # The llm-swap gateway returns reasoning as message content; strip it so the
    # graders see the answer, not the leak. There is no fence to anchor on, so
    # anchor on the document's first heading and only cut a preamble long enough
    # to be reasoning - an answer that declines to write a document has no
    # heading to cut back to and passes through untouched.
    transform: file://../../lib/strip-reasoning.js:stripReasoning
    # Settings are settled, not suite-tuned (evals/AGENTS.md, "Judge settings
    # are settled"): google/gemini-3.8-flash, temperature 0, reasoning enabled
    # under `passthrough` (a bare `reasoning: {enabled}` under `config` is
    # silently dropped). The suite under test runs deepseek-v4-flash (see
    # `providers:` above); a judge from the reviewer's own family, or sampling
    # left at default, measurably raised run-to-run noise on review-code.
    provider:
      id: openai:chat:google/gemini-3.8-flash
      config:
        # Keeps the judge's reply parseable as JSON. json_object, not json_schema:
        # the latter makes promptfoo pre-parse the reply into an object, which the
        # grader then rejects as 'not a string'.
        response_format:
          type: json_object
        apiBaseUrl: https://openrouter.ai/api/v1
        temperature: 0
        max_tokens: 16384
        max_completion_tokens: 16384
        passthrough:
          temperature: 0
          reasoning:
            enabled: true
        apiKeyEnvar: OPENROUTER_API_KEY
        showThinking: false
        omitDefaults: true
  assert:
    # Unnamed, so it guards the run shape without being graded as quality -
    # named, `metric: latency` turned it into a graded column beside the
    # quality metrics, and a row slow enough to trip it is one the completion
    # cap already truncated, which those metrics fine on their own.
    # Loading a SKILL.md costs wall-clock time and that overhead is part of what
    # the arms are compared on. No `cost` assertion: this gateway declares no
    # per-token price, so it would read zero and pass trivially.
    - type: latency
      threshold: 180000

tests:
  - file://tests/*.yaml
