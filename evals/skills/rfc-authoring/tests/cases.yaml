# Cases span what the skill's description says it is for: substantial,
# cross-team, public-interface, or hard-to-reverse changes - plus two changes
# that are none of those, where the right answer is to turn the process down.
# Tasks are what the engineer actually typed. They never name a document type,
# a section, or anything else the skill would tell an author to do.

- description: public API - money fields change shape under six partners
  vars:
    task: |
      ok, the float thing again. every month reconciliation comes back off by a few cents and I'm in another thread explaining IEEE 754 to a partner's finance person. `amount` on /v1/invoices and /v1/payments should be an integer of minor units. and renamed, `amount_minor`, because silently changing what a number means is worse than breaking it loudly. the catch is v1 is public - six partners, plus our iOS app and the billing dashboard. one of those partners hasn't touched their integration since 2023 and the email on the account bounces.
    rubric: |
      It must be clear what the field becomes, that every existing v1 caller
      breaks on the naive version, and how callers get from the old shape to
      the new one without a flag day.
  assert: &proposal
    # dotagents#64/#65 quote-verified pattern (evals/skills/review-code/assertions/review.cjs,
    # evals/skills/adr-authoring/assertions/adr.cjs): the judge answers narrow
    # numbered items with a verbatim quote from <Output> or NONE, code verifies
    # the quote before it counts, and code - not the judge - does the
    # arithmetic. task/rubric reach the judge as JS-built message content in
    # rfc.cjs's askItems, the same way review.cjs and adr.cjs interpolate
    # context.vars there.
    #
    # The old decision_owner and decision_deadline regexes matched
    # "decision-maker", "sign-off" and "comment period" - all SKILL.md
    # vocabulary - so they paid the skill arm for reciting itself. What they
    # were reaching for is now a judged criterion.
    #
    # Grounding, and what it is not. Two of these sources are also cited in
    # references/industry-examples.md - Go's staged gate at line 52, the
    # Squarespace approver/reviewer split at line 79 - so the earlier claim
    # here that the grounding sat outside that file was false. What holds
    # instead, and is the reason recitation is not a risk: lib/arms.js inlines
    # only SKILL.md, never references/, and SKILL.md names Go, Rust and Mozilla
    # once (line 50, "different artifacts, gates, and meanings") without
    # carrying any of the substance below. The skill arm cannot recite a file
    # it is never shown.
    #
    # Blast radius comes from the Squarespace RFC template's Dependencies and
    # Operations prompts; decision from that template's Approver(s) versus
    # "other reviewer(s)" split plus the Mozilla template's Start date / End
    # date header fields; the case against from Rust's "Why should we *not* do
    # this?"; reversibility from the skill description's own "hard-to-reverse"
    # plus the Squarespace template's Risks prompt.
    #
    # "Proposal, not problem restated" carries no citation on purpose. It used
    # to be grounded on Go's triage gate with the gloss "a restated problem
    # cannot be accepted or declined", which the source does not say: step 2 is
    # a three-outcome triage - accept, decline, or ask for a design doc - so a
    # proposal can be decided at the first gate, and nothing there turns on how
    # the problem is worded. It is a house criterion, and it stands as one.
    - type: javascript
      value: file://assertions/rfc.cjs:proposalQuality
      threshold: 0.7
      metric: proposal_quality
    - type: javascript
      value: file://assertions/rfc.cjs:honestTradeoffs
      threshold: 0.7
      metric: honest_tradeoffs
    # Fabrication on its own axis. It used to be the third item inside
    # honest_tradeoffs AND the subtraction applied to it, so one invention cost
    # 0.66 of the same number that measured recall: a document satisfying all
    # three graded properties reported 0.00 (idx 6, skill-current: "1.0 - 1.36 =
    # -0.36, floored at 0.0"), indistinguishable from one that satisfied none.
    # The two halves are both real; separated, neither can cancel the other.
    #
    # Uncapped and loosely scoped, this then saturated into a length penalty:
    # four listed items was an automatic zero, and 26 of 48 rows of
    # results/rfc-authoring@1.0.1.json sat at 0 with judge arithmetic reading
    # "1.00 - 0.25 x 22 = -4.50, floored", "- 20 items", "- 15 items". A design
    # proposal proposes specifics and a longer one proposes more, so the number
    # measured length, not grounding. Two changes, both needed - the cap alone
    # would still count the wrong things, and the scope alone would still let a
    # long document out-fabricate a short one on volume:
    #
    # 1. The count is capped at 2. Not made binary like commit-authoring's
    #    `no_invented_claims`: a commit message is three lines, so one invention
    #    is the whole artifact, but a 2000-word proposal that invents one figure
    #    is not the same object as one that invents freely, and binary would
    #    have moved 32 of these 48 rows to 0 (mean 0.41 -> 0.33), deepening the
    #    saturation it was meant to fix. `threshold: 1` already makes the
    #    PASS/FAIL binary - any invention fails. The score's remaining job is to
    #    say none / one / more than one, which is all a judge can count
    #    reliably, and it stops being a ruler.
    # 2. What counts as a specific is narrowed to a claim about the engineer's
    #    own systems. The stored rows were fining ordinary vocabulary (`TLS`,
    #    `IAM`, `VPC`, `CloudWatch`), the document's own proposed schema fields
    #    (`event_id`, `timestamp`, `producer`, `data`), its section headings
    #    (`Rationale and alternatives`, `Unresolved questions`), and target
    #    dates the old carve-out already exempted but the judge counted anyway.
    #    The carve-outs are now enumerated rather than described.
    - type: javascript
      value: file://assertions/rfc.cjs:noInventedSpecifics
      threshold: 1
      metric: no_invented_specifics
- description: cross-team infrastructure - self-hosted Kafka to a managed service
  vars:
    task: |
      My manager wants this written up before I take it to the platform sync, so here's the short version. We run our own Kafka - three brokers on EC2, about 40 topics - and I'm the only person here who has replaced a broker without taking downtime. Payments, Search and Fulfilment all have things on it, eleven services in total. I want to pay for the managed one instead. It's roughly 2.3x the EC2 bill, which is the bit I expect to get argued with about, and every one of those eleven services needs someone on that team to change connection config.
    rubric: |
      It must be clear which teams have to do work, what the cost change is,
      and how the move happens without a coordinated outage across all three
      teams at once.
  assert: *proposal

- description: hard-to-reverse data model - 32-bit user IDs are running out
  vars:
    task: |
      user ids are int4. we're at 1.9B, ceiling is 2.1B, ~14 months at current signup rate. need to be on uuidv7 before that. pk on `users`, fk in 14 tables, biggest one is 90M rows. ids are also in urls people have bookmarked, in the warehouse, and in the nightly export two enterprise accounts ingest. not a weekend job and I don't want to find that out halfway through.
    rubric: |
      It must state what the new identifier is, what happens to the 14 tables
      and the existing rows, and what breaks for the warehouse and the two
      export customers.
  assert: *proposal

- description: shared library defaults - timeouts and retries change under 60 services
  vars:
    task: |
      Following on from the cascade last month - the thing that turned one slow dependency into an outage is that our `httpclient` package defaults to no timeout and retries 5xx forever. I want the defaults to be 5s and 3 retries with backoff in the next minor. What makes me nervous: about 60 services depend on it and most of them never pass options at all, so they'd get new behaviour just from bumping the version. And there are at least two batch jobs I know of that hold requests open for minutes on purpose.
    rubric: |
      It must say what the new defaults are, acknowledge that services which
      never passed options get new behaviour without changing a line, and say
      what the long-running batch jobs are supposed to do.
  assert: *proposal

- description: close call - run the open-source flag server or pay the vendor
  vars:
    task: |
      I've rewritten this three times and I keep changing my mind, so I'm going to lay it out and let someone else break the tie. Feature flags: right now every team hand-rolls env vars and it's bad. Either we self-host the open source flag server, which means our uptime, our on-call, another postgres to back up - or we pay the vendor, about $40k a year, but evaluation happens at their edge and the on-prem installs have no egress at all, so that's a hard no for those customers unless we do something else for them. Four teams are blocked waiting on this.
    rubric: |
      Both options must be represented fairly with their real costs, the
      on-prem constraint must be confronted rather than glossed, and the
      document must not pretend the choice is obvious.
  assert: *proposal

- description: cross-team auth - static shared API keys to short-lived OIDC tokens
  vars:
    task: |
      The audit finding landed on me. Every service talks to every other service with a static api key that lives in the config repo, last rotated some time in 2024. Nine services. One of them isn't even ours, it runs in a partner's VPC. What I want is an OIDC issuer and short-lived tokens instead of the shared key. The complication is Fulfilment - they're halfway through their rewrite and I don't believe they can take this on this quarter, and I'd rather know that now than after I've said we're doing it.
    rubric: |
      It must say what replaces the static keys, name the service in the
      partner VPC as the hard case, and account for Fulfilment being mid-
      rewrite rather than assuming everyone moves at once.
  assert: *proposal

- description: public interface - deleting an SDK method enterprise contracts name
  vars:
    task: |
      Can we finally kill `client.query()`? It concatenates sql into a string, which is exactly the footgun it looks like, and `client.execute()` with parameter binding has been there a year. Awkward parts: telemetry says ~70% of downloads still call the old one, and three of the enterprise contracts name it explicitly, which legal will have opinions about. 3.0 is penciled in for November so that's the window if we're doing it.
    rubric: |
      It must state what happens to `query()` and when, treat the three
      contract customers as a real constraint, and give current callers a
      path off the old method.
  assert: *proposal

- description: platform standard - one event envelope and a schema registry for five teams
  vars:
    task: |
      Reporting maintains something like 30 parsers for what is fundamentally one event. Some producers send `ts`, some `timestamp`, one puts it in a header. I want one envelope everyone uses, and a registry that CI validates producers against. Five teams produce, roughly 120 event types between them. Reporting has to read both shapes for however long it takes, which is the part I genuinely can't estimate.
    rubric: |
      It must define the envelope concretely, say what producers and Reporting
      each have to do, and be honest that 120 event types across five teams do
      not move on one date.
  assert: *proposal

# Negative controls: five situations where a formal proposal is the wrong
# artifact - too small and reversible, already decided elsewhere, or not a
# proposal at all. A polished document here is the failure mode, not the
# success. One metric across all five: `stays_short` and `semantic_quality`
# used to split the same two cases in half, and at n=2 a metric moves by more
# than any delta it could report.
- description: negative control - internal file split behind an existing flag
  vars:
    task: |
      `payments_handler.py` is 900 lines and I dread opening it. I want to split it into card/wallet/refund inside our own service. No api change, no schema change, nobody outside the team imports it, and it's all behind the `new_handler_layout` flag we already have, so if it's wrong I flip it back in a deploy. Do I owe anyone a writeup first or can I just get on with it?
    rubric: |
      This change is internal, reversible in one deploy, and touches no other
      team. What it calls for instead is the ordinary path - open the pull
      request, get a code review, note the flag in the ticket.
  assert: &control
    # The old pair of graders is gone. `declines_process` and
    # `names_lighter_path` were regexes over prose - "\bPR\b" and "ticket" are
    # both satisfied by a full RFC that happens to mention opening one. Their
    # replacements, `stays_short` (a word-and-heading count) and
    # `semantic_quality`, then split two cases between two metrics: a word count
    # is the magic number AGENTS.md warns about, and its 0-or-1 verdict is a
    # binary switch bolted onto a graded scale. Both are folded into the five
    # enumerated points below, where "did it ship a document" is worth the same
    # fixed fraction as everything else instead of flipping the row.
    #
    # The Go quote in the preamble is verified against the source and is also
    # summarised in references/industry-examples.md:46-54. That is not a
    # recitation risk: lib/arms.js inlines only SKILL.md, and the skill arm
    # never sees references/.
    - &control_rubric
      type: javascript
      value: file://assertions/rfc.cjs:controlQuality
      threshold: 0.7
      metric: control_quality

- description: negative control - bumping a connection pool size
  vars:
    task: |
      Checkout's postgres pool is capped at 20 and we sit on the ceiling through the Friday peak. The database itself is bored, plenty of headroom. I want to take it to 40. It's one env var, it ships in a normal deploy, and it's two minutes to put back if it's wrong. Does this need writing up for anyone or am I overthinking it?
    rubric: |
      This is a one-variable change, reversible in minutes, inside one service.
      What it calls for instead is to ship it and record the number and the
      reason where the next person will find it - the ticket or the changelog.
  assert: *control

- description: negative control - internal tool, revert undoes it
  vars:
    task: |
      our internal ops console - the one only the four of us use - renders its worklist with a table we hand-rolled in 2022. sorting is broken on two columns and i keep meaning to fix it. i'd rather drop in a real datagrid component and delete the hand-rolled one. it's behind the same sso as everything else, no customer ever sees it, no other team imports it, and if it turns out worse than what we have i revert the pr. worth writing up first?
    rubric: |
      This is an internal tool used by one team, with no customer-facing or
      cross-team surface, and reverting the pull request undoes it. What it
      calls for instead is the ordinary path - open the pull request and let
      the people who use the tool review it.
  assert: *control

- description: negative control - decision already taken, only needs recording
  vars:
    task: |
      the architecture review two weeks ago went with sqs over the self-hosted rabbit, and that's settled - anwar signed it off in the meeting and platform have already started on the terraform. problem is the only trace of it is my notes and a calendar invite, and i've now had the same "why not rabbit" question three times from people who weren't in the room. do i write it up as a proposal so there's something to point at?
    rubric: |
      The choice is already made, signed off, and being implemented. A
      prospective proposal asks for a decision that has already been taken.
      What it calls for instead is a short record of the decision - what was
      chosen, what else was on the table, and why - filed where the people
      asking will find it.
  assert: *control

- description: negative control - a question, not a proposal
  vars:
    task: |
      before i touch anything - does our rate limiter count per api key or per source ip? i've read the middleware twice and i genuinely can't tell, there's a bucket keyed off something that gets built two files away. i'm not proposing we change it, i just need to know which one it is before i can even say whether there's a problem here. sana wrote it originally but she's on leave until the 8th. should i put a writeup together on this?
    rubric: |
      The engineer has a question, not a proposal, and says so. There is
      nothing yet to accept or reject. What it calls for instead is to trace
      the key construction in the code or ask in the team channel, and to
      revisit whether anything needs proposing only once the answer is known.
  assert: *control
