#     subsystems - the hardest of them to see as two pieces of work.
#
# Sub-population counts after the quack removal: marks_breaking 10,
# splits_mixed_change 10, unchanged.
# NOT RE-MEASURED. Every stored baseline for this suite was measured on a case
# set that included thirteen quack diffs and no longer describes it. The deltas
