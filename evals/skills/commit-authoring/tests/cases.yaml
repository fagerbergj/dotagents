# One case per shape of change a commit has to describe. Every diff is a real
# commit from a working repository with its author's own message stripped out,
# so the model is authoring rather than copying. The developer's line of context
# never names a message format, a mood, or a rule.
#
# The four MIXED cases carry two unrelated changes in one tree - two features, a
# refactor hiding a behaviour change, a fix beside a dependency bump, and a
# formatter run beside a real fix. The claimed right answer there is to say so,
# not to write one message that covers both, so each carries its own `ask` that
# leaves the number of commits undecided; the default ask says "the commit
# message", singular, which would foreclose the very choice being graded.
#
# The four breaking cases are diffs whose breaking nature is a fact about the
# code, not a judgement: a removed config field, a renamed CLI flag, a renamed
# argument in a published tool schema, and a config loader that now rejects what
# it used to accept.

