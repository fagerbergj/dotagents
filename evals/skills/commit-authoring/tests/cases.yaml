# One case per shape of change a commit has to describe. Every diff is a real
# commit from a working repository with its author's own message stripped out,
# so the model is authoring rather than copying. The developer's line of context
# never names a message format, a mood, or a rule.
#
# The ten MIXED cases carry two unrelated changes in one tree. The claimed right
# answer there is to say so, not to write one message that covers both, so each
# carries its own `ask` that leaves the number of commits undecided; the default
# ask says "the commit message", singular, which would foreclose the very choice
# being graded.
#
# The ten breaking cases are diffs whose breaking nature is a fact about the
# code, not a judgement: a removed config field, a renamed CLI flag, a renamed
# argument or return field in a published tool schema, and a loader that now
# rejects what it used to accept.
#
# PROVENANCE. Two working repositories: `turnstone` (Python,
# github.com/turnstonelabs/turnstone) and an immich-go tree (Go), both checked
# out locally. `fagerbergj/quack` was the third and is now excluded outright:
# quack is an AI code-review bot that runs these very skills, so its commits and
# code may have been authored with the skill under test, and a diff from it
# risks the model describing its own idiom back to the grader. Thirteen
# quack-sourced cases were removed and replaced one-for-one below. Do not
# reintroduce quack material.
#
# AI-AUTHORSHIP SCREEN. Every commit below was checked for a disclosure in its
# message - `Co-Authored-By: Claude ... <noreply@anthropic.com>`, a "Generated
# with Claude Code" trailer, a bot co-author - and any that carried one was
# dropped, because a body the model itself wrote makes the ground truth
# circular. That screen is not theoretical. It cost this suite the whole
# `home-server` repository, where 8 commits carry a `Co-Authored-By: Claude`
# trailer - among them c3b7e3d "Remove WIREGUARD_ADDRESSES" and 21fa72f's
# env-var consolidation, the two removed-config-key candidates that repo
# offered. In `turnstone` it excludes 13 commits: 8 `Co-authored-by: Copilot`
# (d2a6c285, 0cdb6798, 217d3a3a, c7e0358a, f97c6351, 2b3b2129, 353ff4d,
# 78865c7), 1 `Co-Authored-By: Claude` (73fb84b4, the Helm chart fix), and 4
# `Co-authored-by: github-actions` bot commits (14df09a1, da5eae5, 3cf9485,
# 72bd62d). An earlier revision of this file claimed turnstone carried zero such
# trailers; it carries these. Subject-matter mentions of Anthropic or Copilot
# inside a body (an API document-block format, "Copilot review, PR #804") are
# not authorship claims and were kept.
#
# THE THIRTEEN REPLACEMENTS, in file order. All from `turnstone`.
#
#   - 2b43b8dd "fix(streaming): correlate the fatal trace line with its
#     recorded event". One-line-fix shape: five lines in one file, and the why
#     (correlating a stack trace to its fatal event under concurrent sessions)
#     is nowhere in the diff.
#   - fec5067f "feat(skills): gate model-initiated load of high/critical-risk
#     skills". New-feature-plus-tests shape: a narrowing gate in session.py and
#     the five tests that pin it.
#   - 81dd9fc0 Revert "fix(ui): interactive tool cards no longer overwrite each
#     other (call_id collision)". Revert shape: `_lastMatch` is deleted and
#     five call sites go back to `querySelector`, so the first-match bug
#     returns.
#   - 648ba477 "refactor: list_user_roles uses _row_to_dict instead of
#     positional row mapping". Pure-refactor shape: the same ten-key positional
#     dict is deleted from both storage backends in favour of a helper that
#     already existed. Nothing behaves differently.
#   - d564cee4 "docs(providers): ground the effort_param values caution in
#     official template contracts". Docs-only shape: one hunk of
#     docs/architecture.md, no code.
#   - 1497c392 "chore: cap mcp <2 ahead of the v2 breaking rewrite".
#     Dependency-bump shape: a pyproject constraint and the matching uv.lock
#     line; resolution is unchanged, no code touched.
#   - 0150523b "test(session): pin the both-vocabulary title peel". Test-only
#     shape: two cases and a docstring added to one test file.
#
#   BREAKING
#   - 58d20f40 "chore(coord): remove spawn-quota subsystem (#403)". Qualifies:
#     `coordinator.spawn_budget`, `coordinator.spawn_rate.tokens_per_minute`
#     and `coordinator.spawn_rate.burst` are deleted SettingDefs, and migration
#     047 DELETEs their persisted rows out of `system_settings`, so an operator
#     who set them loses the value. Trimmed to settings_registry.py and the
#     migration; the spawn_quota module, the two quota endpoints, the Pydantic
#     schemas and the tests are in the commit but not shown.
#   - 6948ea21 "fix(coord): rename ws_id->child_ws_id in spawn return JSON".
#     Qualifies: the key in the JSON `spawn_workstream` and `spawn_batch` hand
#     back is renamed in the published tool descriptions and in the two session
#     call sites, so anything reading `ws_id` off a spawn result now reads
#     nothing. Trimmed to the two tool schemas and session.py.
#   - 7ef04e57 "fix(providers): require base_url for anthropic-compatible".
#     Qualifies: a blank `base_url` used to fall through to the SDK's
#     `https://api.anthropic.com` default and now raises ValueError at client
#     construction - a loader that rejects what it used to accept. Shown whole.
#
#   MIXED - each is two unrelated commits' diffs laid into one tree, the same
#   construction the surviving mixed cases use. No pair shares a file.
#   - bcfc6306 "fix(attachments): reject video as audio in ftyp sniff; add
#     ADTS-AAC sniff" + 9653b57e "fix(ui): interactive tool cards no longer
#     collapse to an empty stripe".
#   - 79eeb25e "feat(sse): raise default event buffer cap 2000 -> 50000" +
#     a0298497 "fix(models): keep raw exception text out of
#     client-construction 503s".
#   - 2c5adb7a "fix(web): sanitize the latin1_safe_filename fallback too" +
#     7886d3b7 "fix(nudge): wake gate requires a real NudgeQueue".
#
# THE CASES THAT PREDATE THE QUACK REMOVAL, kept as they were:
#
# BREAKING
#   - immich-go: a renamed CLI flag (`--on-server-errors` becomes
#     `--on-errors`, the old name is gone).
#   - turnstone 8b4b8b3f "refactor(rerank): reranker is a per-model definition
#     only (drop global endpoint settings)". Qualifies: `tools.rerank_url`,
#     `tools.rerank_model` and `tools.rerank_api_key` are deleted SettingDefs
#     and deleted config.py getters, and $TURNSTONE_RERANK_URL /
#     $TURNSTONE_RERANK_MODEL stop being read. A config.toml that sets
#     rerank_url has no reranker afterwards - a fact readable off the diff, not
#     a judgement. Trimmed to config.py, settings_registry.py and the example
#     toml; the resolver and its tests are in the commit but not shown.
#   - turnstone 1728a4c0 "feat(web-search): replace Tavily/DuckDuckGo backends
#     with self-hosted SearxNG". Qualifies: `tools.web_search_backend`'s
#     accepted values change - the help text still names the valid set, and
#     "tavily"/"ddg" are no longer in it - and `tools.tavily_api_key` plus
#     TAVILY_API_KEY are removed outright. A loader that now rejects what it
#     used to accept. Trimmed to config.py, env.py and settings_registry.py;
#     the web_search.json hunk is deliberately left out because the suite
#     already grades a `topic`-argument rename from a later commit on that
#     same file.
#   - turnstone 110d44b0 "refactor(tools): remove man, math, and plan_agent
#     built-in tools". Qualifies: three tool JSON schemas are deleted from the
#     published tool set, the `agent` tool-metadata key is removed from
#     _META_KEYS, and `model.plan_alias` / `model.plan_effort` are deleted
#     SettingDefs. Trimmed to the tool schemas, tools.py and
#     settings_registry.py out of a 106-file commit.
#   - turnstone eb2a119d "refactor(mcp): remove periodic refresh, add manual
#     refresh/reconnect controls". Qualifies: `--mcp-refresh-interval` is a
#     deleted parser.add_argument and `mcp.refresh_interval` a deleted
#     SettingDef and a deleted _CONFIG_MAP entry - an invocation that passed
#     the flag now fails to parse. This is the "renamed CLI flag" shape in its
#     starkest form: removed, with nothing to rename to. Trimmed to cli.py,
#     config.py, settings_registry.py and the example toml.
#   - turnstone 2c050b25 "refactor: remove duplicate judge provider/base_url/
#     api_key fields". Qualifies: three fields disappear from the JudgeConfig
#     dataclass, the explicit-provider branch in IntentJudge.__init__ goes with
#     them, and `judge.provider` / `judge.base_url` / `judge.api_key` are
#     deleted SettingDefs. Shown whole - it is a three-file commit.
#   - turnstone: a renamed argument in the published `web_search` tool schema
#     (`topic`), callers passing the old name lose it.
#
# MIXED
#   - turnstone: a formatter run over the frontend beside an unrelated
#     fence-defanging fix.
#   - turnstone a3cb5460 "docs(attachments): pin xAI Grok to the rasterize-PDF
#     fallback" (a capability comment plus a test that pins it) + a628e9f3
#     "fix(ui): interactive pane keeps its scroll pin across tool calls".
#   - turnstone c988c9ed "test(console): pin system-turn dedupe wiring on both
#     read paths" + b8a8b040 "fix(attachments): drain create-time staged
#     uploads synchronously".
#   - turnstone 25101e7f "fix(attachments): close thumbnail
#     decompression-bomb gap (40M, not 80M)" + d8619ce3 "docs(ui): the
#     pane-hosted coordinator scope is every coordinator in practice" (a CSS
#     comment correction).
#   - turnstone 695a3357 Revert "fix(server): accept --skip-permissions CLI
#     flag (#450)" + 07e7e6db "perf(attachments): stop downloading the whole
