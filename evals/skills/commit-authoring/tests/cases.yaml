# One case per shape of change a commit has to describe. Every diff is a real
# commit from a working repository with its author's own message stripped out,
# so the model is authoring rather than copying. The developer's line of context
# never names a message format, a mood, or a rule.
#
# The ten MIXED cases carry two unrelated changes in one tree. The claimed right
# answer there is to say so, not to write one message that covers both, so each
# carries its own `ask` that leaves the number of commits undecided; the default
# ask says "the commit message", singular, which would foreclose the very choice
# being graded.
#
# The ten breaking cases are diffs whose breaking nature is a fact about the
# code, not a judgement: a removed config field, a renamed CLI flag, a renamed
# argument in a published tool schema, and a config loader that now rejects what
# it used to accept.
#
# PROVENANCE. Two working repositories, both checked out locally:
# `quack` (Go, github.com/fagerbergj/quack) and `turnstone` (Python,
# github.com/turnstonelabs/turnstone). Every
# commit below was checked for an AI-authorship disclosure in its message -
# `Co-Authored-By: Claude ... <noreply@anthropic.com>`, a "Generated with
# Claude Code" trailer - and any that carried one was dropped, because a body
# the model itself wrote makes the ground truth circular. That screen is not
# theoretical: it cost this suite the whole `home-server` repository, where 8
# commits carry a `Co-Authored-By: Claude <noreply@anthropic.com>` trailer -
# among them c3b7e3d "Remove WIREGUARD_ADDRESSES" and 21fa72f's env-var
# consolidation, which were the two removed-config-key candidates that repo
# offered. `turnstone` and `quack` carry zero such trailers. Subject-matter
# mentions of Anthropic or Copilot inside a body (an API document-block format,
# a review finding) are not authorship claims and were kept.
#
# The four original cases (config KnownFields #560, the removed
# gates.judge.skeptics field, the renamed CLI flag, the renamed web_search
# `topic` argument) predate this block. The twelve added below:
#
# BREAKING
#   - turnstone 8b4b8b3f "refactor(rerank): reranker is a per-model definition
#     only (drop global endpoint settings)". Qualifies: `tools.rerank_url`,
#     `tools.rerank_model` and `tools.rerank_api_key` are deleted SettingDefs
#     and deleted config.py getters, and $TURNSTONE_RERANK_URL /
#     $TURNSTONE_RERANK_MODEL stop being read. A config.toml that sets
#     rerank_url has no reranker afterwards - a fact readable off the diff, not
#     a judgement. Trimmed to config.py, settings_registry.py and the example
#     toml; the resolver and its tests are in the commit but not shown.
#   - turnstone 1728a4c0 "feat(web-search): replace Tavily/DuckDuckGo backends
#     with self-hosted SearxNG". Qualifies: `tools.web_search_backend`'s
#     accepted values change - the help text still names the valid set, and
#     "tavily"/"ddg" are no longer in it - and `tools.tavily_api_key` plus
#     TAVILY_API_KEY are removed outright. A loader that now rejects what it
#     used to accept. Trimmed to config.py, env.py and settings_registry.py;
#     the web_search.json hunk is deliberately left out because the suite
#     already grades a `topic`-argument rename from a later commit on that
#     same file.
#   - turnstone 110d44b0 "refactor(tools): remove man, math, and plan_agent
#     built-in tools". Qualifies: three tool JSON schemas are deleted from the
#     published tool set, the `agent` tool-metadata key is removed from
#     _META_KEYS, and `model.plan_alias` / `model.plan_effort` are deleted
#     SettingDefs. Trimmed to the tool schemas, tools.py and
#     settings_registry.py out of a 106-file commit.
#   - turnstone eb2a119d "refactor(mcp): remove periodic refresh, add manual
#     refresh/reconnect controls". Qualifies: `--mcp-refresh-interval` is a
#     deleted parser.add_argument and `mcp.refresh_interval` a deleted
#     SettingDef and a deleted _CONFIG_MAP entry - an invocation that passed
#     the flag now fails to parse. This is the "renamed CLI flag" shape in its
#     starkest form: removed, with nothing to rename to. Trimmed to cli.py,
#     config.py, settings_registry.py and the example toml.
#   - turnstone 2c050b25 "refactor: remove duplicate judge provider/base_url/
#     api_key fields". Qualifies: three fields disappear from the JudgeConfig
#     dataclass, the explicit-provider branch in IntentJudge.__init__ goes with
#     them, and `judge.provider` / `judge.base_url` / `judge.api_key` are
#     deleted SettingDefs. Shown whole - it is a three-file commit.
#   - quack 5bf5cbaa "config: restructure model/provider schema for
#     capacity-based admission (#1009)". Qualifies: `ProviderConfig.Models
#     map[string]ModelPricing` (yaml `models`) is deleted and per-model price
#     moves to a top-level `models.<m>.cost`. Because Load runs the decoder
#     with KnownFields(true) (the loader the suite's first breaking case is
#     about), a config still carrying providers.<p>.models.<m>.input_per_mtok
#     does not start. Trimmed to the quack.yaml registry hunk and the config.go
#     struct/validation hunks.
#
# MIXED - each is two unrelated commits' diffs laid into one tree, the same
# construction the original four use. No pair shares a file.
#   - turnstone a3cb5460 "docs(attachments): pin xAI Grok to the rasterize-PDF
#     fallback" (a capability comment plus a test that pins it) + a628e9f3
#     "fix(ui): interactive pane keeps its scroll pin across tool calls".
#   - turnstone c988c9ed "test(console): pin system-turn dedupe wiring on both
#     read paths" + b8a8b040 "fix(attachments): drain create-time staged
#     uploads synchronously".
#   - turnstone 25101e7f "fix(attachments): close thumbnail
#     decompression-bomb gap (40M, not 80M)" + d8619ce3 "docs(ui): the
#     pane-hosted coordinator scope is every coordinator in practice" (a CSS
#     comment correction).
#   - turnstone 695a3357 Revert "fix(server): accept --skip-permissions CLI
#     flag (#450)" + 07e7e6db "perf(attachments): stop downloading the whole
#     text blob for a 240-char preview". A revert beside a perf fix.
#   - turnstone 793c5518 "fix(attachments): surface the perception role in
#     admin (roles tab + settings filter)" + 9fefe830 "fix(tls): validate
#     init() retry params".
#   - turnstone 8ba669cf "fix(deadline): prefer a ready result over a
#     same-window deadline/cancel" + ce105c4e "fix(ui): split separator ARIA
#     range reflects the real clamp, not 10-90". Two fixes, unrelated
#     subsystems - the hardest of the six to see as two pieces of work.
#
# Sub-population counts after this: marks_breaking 10, splits_mixed_change 10.
# NOT YET RE-MEASURED - the deltas recorded for these two metrics (+0.42 and
# +0.58 at n=4) are from the smaller populations and say nothing about these
# cases.

- description: 'one-line fix - the disclosure advised a command the agent is not allowed to run'
  vars:
    context: 'ok tiny one. found this while poking at the read-only agents yesterday, already tested it. what do i put on the commit?'
    diff: |
      diff --git a/internal/acp/environment.go b/internal/acp/environment.go
      index 4ebff39..e955ef0 100644
      --- a/internal/acp/environment.go
      +++ b/internal/acp/environment.go
      @@ -58,7 +58,12 @@ func environmentBlock(ctx context.Context, cwd string, caps workspace.Caps) stri
       			writable = append(writable, caps.HomeDir)
       		}
       		fmt.Fprintf(&b, "filesystem: writable: %s\n", strings.Join(writable, ", "))
      -		b.WriteString("reads and execution work anywhere; in-tree writes (npm install, go build artifacts, file edits) fail. To run code against this tree, copy or `git clone --local` it into a writable path first - a clone keeps the module path, so language-level rules like Go's internal/ visibility still resolve.\n")
      +		// `cp -a`, not `git clone --local`: clone is denied for every ACP agent
      +		// without acp.allow_clone (opencodeEnv), which is all of them but the
      +		// explorer - so naming clone here hands the reviewer advice its own
      +		// permissions reject. A copy is allowed everywhere and carries go.mod
      +		// just the same.
      +		b.WriteString("reads and execution work anywhere; in-tree writes (npm install, go build artifacts, file edits) fail. To run code against this tree, copy it into a writable path first (`cp -a \"$PWD\" \"$TMPDIR/probe\"`) - the copy carries go.mod, so language-level rules like Go's internal/ visibility still resolve.\n")
       	}
       	b.WriteString("</environment_context>")
       	return b.String()

- description: 'new feature - environment block gains a read-only filesystem disclosure'
  vars:
    context: 'new bit for the acp environment block, plus tests. need a commit message.'
    diff: |
      diff --git a/internal/acp/environment.go b/internal/acp/environment.go
      index f8745ad..0b41139 100644
      --- a/internal/acp/environment.go
      +++ b/internal/acp/environment.go
      @@ -47,6 +47,11 @@ func environmentBlock(ctx context.Context, cwd string, caps workspace.Caps) stri
       	default:
       		fmt.Fprintf(&b, "entries: %s\n", strings.Join(entries, ", "))
       	}
      +	if caps.ReadOnly {
      +		// Landlock enforces this; a reviewer that doesn't know WHY npm install
      +		// bare-fails with EACCES burns a round finding out the hard way.
      +		b.WriteString("filesystem: this working tree is READ-ONLY at the OS level (reads and execution work; any write into it - npm install, go build artifacts in-tree, file edits - fails with EACCES). Verify claims by reading code and the PR's CI results instead of building.\n")
      +	}
       	b.WriteString("</environment_context>")
       	return b.String()
       }
      diff --git a/internal/acp/environment_test.go b/internal/acp/environment_test.go
      index ac6abc6..7b90e76 100644
      --- a/internal/acp/environment_test.go
      +++ b/internal/acp/environment_test.go
      @@ -97,6 +97,29 @@ func TestEnvironmentBlockEmptyDir(t *testing.T) {
       	}
       }
       
      +// TestEnvironmentBlockDisclosesReadOnly: a read-only round's block states the
      +// filesystem is read-only (the landlock grant already enforces it - a
      +// reviewer burning a round on an unexplained npm install EACCES is the bug
      +// this line fixes), and stays silent when the tree is writable.
      +func TestEnvironmentBlockDisclosesReadOnly(t *testing.T) {
      +	dir := t.TempDir()
      +
      +	caps := workspace.DefaultCaps()
      +	caps.ReadOnly = true
      +	block := environmentBlock(context.Background(), dir, caps)
      +	if !strings.Contains(block, "filesystem: this working tree is READ-ONLY") {
      +		t.Errorf("block = %q, want a read-only filesystem disclosure line", block)
      +	}
      +	if !strings.Contains(block, "EACCES") {
      +		t.Errorf("block = %q, want the EACCES consequence named", block)
      +	}
      +
      +	block = environmentBlock(context.Background(), dir, workspace.DefaultCaps())
      +	if strings.Contains(block, "filesystem:") {
      +		t.Errorf("block = %q, want no filesystem line for a writable tree", block)
      +	}
      +}
      +
       func runGit(t *testing.T, dir string, args ...string) {
       	t.Helper()
       	cmd := exec.Command("git", args...)

