    diff: |
      diff --git a/turnstone/core/settings_registry.py b/turnstone/core/settings_registry.py
      index 91a23907..1ad53848 100644
      --- a/turnstone/core/settings_registry.py
      +++ b/turnstone/core/settings_registry.py
      @@ -676,47 +676,6 @@ def _build_registry() -> dict[str, SettingDef]:
                   "this short (5 minutes default) to limit blast radius if the process "
