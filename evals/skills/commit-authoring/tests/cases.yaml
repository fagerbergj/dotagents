  assert:
    # Conventional Commits v1.0.0 §11-13: a breaking change MUST be marked, by
    # `!` before the colon or by a `BREAKING CHANGE:` footer (§16 also allows
    # `BREAKING-CHANGE`). §15 makes every unit case-insensitive EXCEPT
    # `BREAKING CHANGE`, which MUST be uppercase - hence `[A-Za-z]+` for the
    # type and a literal uppercase footer token.
    - &marks_breaking
      type: regex
      value: '(?:^|\n)[A-Za-z]+(?:\([^)\n]+\))?!:[ ]|(?:^|\n)BREAKING[ -]CHANGE:[ ]'
      metric: marks_breaking

