# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Commit authoring skill effectiveness

# Both arms run the same diffs. Arm labels come from the skill's frontmatter
# version, so bumping metadata.version in SKILL.md relabels the comparison.
# skill-next stays out until a SKILL.next.md exists - lib/arms.js falls back to
# the current skill, so the arm would be a duplicate that costs a third of the run.
prompts:
  - id: file://prompts/arms.js:noSkill
    label: no-skill
  - id: file://prompts/arms.js:skillCurrent
    label: skill-current

providers:
  - id: openai:chat:deepseek/deepseek-v4-flash
    config:
      apiBaseUrl: https://openrouter.ai/api/v1
      max_tokens: 8192
      max_completion_tokens: 8192
      passthrough:
        reasoning:
          enabled: false
      apiKeyEnvar: OPENROUTER_API_KEY
      showThinking: false
      omitDefaults: true
      # Self-hosted model with no published price. The rate is nominal, so the
      # `cost` assertion reads as a token-count proxy: what matters is the gap
      # between the arms, since loading SKILL.md is itself part of the cost.
      cost: 0.0000002

defaultTest:
  options:
    # The llm-swap gateway returns reasoning as message content; strip it so the
    # graders see the message, not the leak. Anchors on the first fence, which
    # is where the answer starts; a fenceless answer passes through untouched.
    transform: file://../../lib/strip-reasoning.js:stripReasoning
    # Judge settings are settled (evals/AGENTS.md): google/gemini-3.8-flash,
    # temperature 0, reasoning on under passthrough. Was deepseek-v4-flash,
    # the same family as the provider under test above - grading its own
    # family shares its blind spots, which is what the settled judge exists
    # to avoid. commit.cjs's judgeQuotedItems assertions read this same block
    # via context.test.options.provider, so one change here re-points both
    # the llm-rubric grader and the quote-verified ones.
    provider:
      id: openai:chat:google/gemini-3.8-flash
      config:
        response_format:
          type: json_object
        apiBaseUrl: https://openrouter.ai/api/v1
        temperature: 0
        max_tokens: 16384
        max_completion_tokens: 16384
        passthrough:
          temperature: 0
          reasoning:
            enabled: true
        apiKeyEnvar: OPENROUTER_API_KEY
        showThinking: false
        omitDefaults: true
  assert:
    # Conventional Commits v1.0.0 conformance, decided by the reference parser
    # (the engine commitlint runs on) rather than a pattern: the spec allows any
    # noun type (§14), is case-insensitive except for BREAKING CHANGE (§15),
    # and sets no length or punctuation rule. The §6 blank line before the body
    # is folded in here too.
    - type: javascript
      value: file://assertions/commit.cjs:conventionalHeader
      metric: conventional_header
    # Whether the body carries the motivation is a semantic question, judged
    # against the diff. An overlap-with-the-diff heuristic was tried and cut: a
    # body that correctly explains why necessarily reuses the diff's nouns, so
    # the proxy scored real commit bodies below fluent narration.
    #
    # Three of the original six items are gone, because a metric scores one
    # property and no two criteria score one behaviour with opposite signs:
    #
    # - Item 6 (flag a mixed diff) is `splits_mixed_change`'s job, and that
    #   metric runs only on the cases where it applies. Here it was a free 0.2
    #   on every single-change case - credited on 64 of the 90 rows of
    #   results/commit-authoring@1.0.json, more often to no-skill (34/45) than
    #   to skill-current (30/45), so it padded the baseline and compressed the
    #   delta. It was not even judgeable: this rubric never sees the diff, and
    #   on 5 of the 24 genuinely mixed rows the judge wrote "N/A (single piece
    #   of work)" and took the 0.2 anyway. One row totalled "6 x 0.2 = 1.2".
    # - Item 4 (body length matched to the change) graded a second property,
    #   size, and pointed against items 1 and 2. On the dependency-bump case
    #   its "no body where the change is a version bump" half PAYS for the
    #   missing body that items 1 and 2 score NONE for - one behaviour, two
    #   signs. Its other half is redundant: a body carrying a concrete why is
    #   "matched to the change" by construction. It was awarded on 22 of the 57
    #   parsable stored rows where items 1 and 2 were both NONE, i.e. it paid
    #   0.2 for a body those items had just rejected as content-free. Cut
    #   rather than re-scoped: the harmful direction, padding a trivial change
    #   with reasons nobody has, is what `no_invented_claims` below catches,
    #   and nothing else in the suite rewards length.
    # - Item 5 was an unbounded subtraction sitting inside another metric's
    #   score; it is now its own metric.
    # dotagents#64/#65: moved off llm-rubric's own arithmetic onto
    # lib/quoted-items.js, the same fix review-code's four judged metrics
    # took. The judge still answers the three items in prose, but must quote
    # <Output> or say NONE; code verifies the quote is real and computes the
    # 0.4/0.3/0.3 weighting itself (assertions/commit.cjs:whyQuality) - the
    # judge no longer states a number that has to be trusted as-is. Full item
    # text and citations live beside the code, not duplicated here.
    - type: javascript
      value: file://assertions/commit.cjs:whyQuality
      threshold: 0.7
      metric: why_quality
    # Split out of why_quality, where it was an open-ended subtraction from a
    # total earned by unrelated items: two inventions took 0.4 off, and one
    # stored row records "Score: 0.2 for item 6, minus 0.4 for two inventions,
    # floored at 0" - a message scored 0.00 whose only credit was an item that
    # was N/A. Fabrication is its own property and gets its own number.
    #
    # Yes/no, like fix-bug's `no_invented_file_refs`: a message either made
    # something up or it did not, and a fraction over "how many" would rank a
    # message that invented one cause above one that invented two while both
    # are unusable. This is the only metric here that judges whether a claim is
    # TRUE; why_quality judges whether a reason is present and concrete, so a
    # fabricated-but-concrete why scores well there and 0 here - two different
    # questions about one sentence, not two signs on one property.
    #
    # Unlike why_quality this one is given the diff. A rubric only sees what is
    # interpolated into it (evals/AGENTS.md), so "the diff does not support it"
    # was inert where this criterion used to sit, and the judge guessed.
    #
    # Two things it must not fine, both measured on
    # results/commit-authoring@1.0.json, where this metric read -0.21:
    #
    # - An unfilled placeholder ticket ref. `SKILL.md` prescribes a `Refs
    #   #<issue>` footer, so the skill arm emits one and the judge quoted
    #   `#<issue>`, `Refs #<TBD>`, `Refs #<ticket-number>` back as "an invented
    #   reference to an issue number that does not exist" - 9 skill-arm zeros
    #   against 0 in the baseline, i.e. the arm was fined for its own template
    #   slot. A slot asserts nothing. pr-authoring's `restraint` already carries
    #   this exemption and, like it, this one stops at a CONCRETE number.
    # - Recommending a split. `splits_mixed_change` pays +0.47 for exactly that,
    #   and this metric took it off again on ~4 skill rows - one reason reads
    #   "this is a recommendation about how to commit it, which is explicitly
    #   excluded from consideration" and scores 0 anyway, because the judge went
    #   on to fine a sentence the recommendation is MADE of. So the exemption
    #   now names the parts, not just the act.
    # dotagents#64/#65: moved off llm-rubric's own arithmetic onto
    # lib/quoted-items.js. The judge still lists inventions in prose, but
    # each one must be a quote from <Output> or the whole item is NONE; code
    # verifies the quote is real and any verified, holding invention fails
    # the message outright (assertions/commit.cjs:noInventedClaims) - no
    # partial credit either way, same as the rubric this replaces. Full item
    # text and citations live beside the code, not duplicated here.
    - type: javascript
      value: file://assertions/commit.cjs:noInventedClaims
      threshold: 1
      metric: no_invented_claims
    # Loading a SKILL.md costs tokens and wall time; that overhead is part of
    # what is being measured. Needs `--no-cache` to mean anything.
    #
    # Unnamed: a run-shape guard, not a scored metric. As `latency_overhead` it
    # read 1.00/1.00 on all 162 rows of results/commit-authoring@1.0.json and
    # had no way to say anything else - a commit message at 120s is a message
    # the completion cap cut off, which `why_quality` and `conventional_header`
    # already fine. The timing survives: report.js prints `latency (s avg)` and
    # rollup.js records `latency_s` straight off latencyMs.
    - type: latency
      threshold: 120000

tests:
  - file://tests/*.yaml
