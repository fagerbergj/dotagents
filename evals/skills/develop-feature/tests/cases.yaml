- description: "want to script against pr list output"
  vars:
    request: "we want to pull pr data into a script - can you plan out adding a way for `gh pr list` to spit out structured output instead of the human-readable table"
    existingIdentifier: "AddJSONFlags"
  assert:
    - type: javascript
      value: file://assertions/plan.cjs:namesExistingSolution
      metric: names_existing_solution
    - &plan_quality_negative
      type: llm-rubric
      # See the plan_quality_reuse anchor above for why the system message is
      # restated here too - same custom-rubricPrompt bug, same fix.
      rubricPrompt:
        - role: system
          content: |
            You are grading output according to a user-specified rubric. If the statement in the rubric is true, then the output passes the test. You respond with a JSON object with this structure: {reason: string, pass: boolean, score: number}

            Examples:

            <Output>Hello world</Output>
            <Rubric>Content contains a greeting</Rubric>
            {"reason": "the content contains the word 'Hello'", "pass": true, "score": 1.0}

            <Output>Avast ye swabs, repel the invaders!</Output>
            <Rubric>Does not speak like a pirate</Rubric>
            {"reason": "'avast ye' is a common pirate term", "pass": false, "score": 0.0}
        - role: user
          content: |
            <FeatureRequest>{{request}}</FeatureRequest>
            <ExistingMechanism>{{existingIdentifier}}</ExistingMechanism>
            <Output>{{output}}</Output>
            <Rubric>{{rubric}}</Rubric>
      value: |
        <Output> is an implementation PLAN, not code, written against the
        cli/cli (GitHub CLI) codebase in response to <FeatureRequest>.
        <ExistingMechanism> is real, present in that codebase right now, and
        already does everything the request is asking for - the correct
        answer here is that little or nothing needs to be built.

        Answer each with a quote from <Output>, or NONE.

        1. It says plainly that this already exists and names
           <ExistingMechanism>, or points at the same place in the code, as
           where. A plan that goes straight into design steps without first
           checking whether the feature is already there fails this even if
           it stumbles onto the right file along the way. Eric S. Raymond,
           "The Cathedral and the Bazaar": "Good programmers know what to
           write. Great ones know what to rewrite (and reuse)" - the reuse
           starts with noticing there is nothing to write.
        2. It does not propose new code, new abstractions, or a redesign to
           accomplish what <ExistingMechanism> already does. At most a
           trivial, explicitly-scoped next step (a doc note, a one-line
           follow-up) is acceptable. Martin Fowler on YAGNI: "some capability
           we presume our software needs in the future should not be built
           now because 'you aren't gonna need it'" - here it is not even
           presumed, it is already there.

        Score from 0 to 1, never above 1: 0.5 for each. Award nothing for an
        item you cannot quote for. Brevity is never a deduction - a plan that
        is three sentences long and correct on both counts should score 1.
        State the arithmetic.
      threshold: 0.5
      # Its own metric, not `plan_quality`. Sharing the name with the reuse
      # rubric above averaged two opposite things: on a 66-row run the eight
      # reuse cases moved +0.146 for the skill arm while these three negative
      # controls moved -0.278 against it (the skill's observed failure mode is
      # designing something when the answer is "it's already there"), and the
      # rollup reported the sum as +0.03 - "no effect" assembled out of two
      # real effects with opposite signs.
      metric: recognizes_existing

