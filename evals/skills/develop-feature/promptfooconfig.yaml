# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: develop-feature skill effectiveness (planning only)

# Scope: this suite grades the PLAN the skill's frontmatter description
# promises - understand the problem, reuse or extend before you add, prefer a
# proven library, work the edge cases - never the code that would implement
# it. Many implementations of a feature are valid, which makes code
# unmeasurable against a single ground truth; a plan can be graded against the
# repo it was written for, which is exactly what the graders below do.
#
# case vars carry no `{{`/`{%`; this is set for parity with the other suites
# and because a real repo file could contain either.
env:
  PROMPTFOO_DISABLE_TEMPLATING: "1"

prompts:
  - id: file://prompts/arms.js:noSkill
    label: no-skill
  - id: file://prompts/arms.js:skillCurrent
    label: skill-current

providers:
  # Same custom provider review-code uses: an OpenAI-compatible call plus
  # tools over two roots. `read_source` serves cli/cli at the pinned commit
  # (lib/repo.js) and goes to BOTH arms - the codebase is the subject matter
  # a plan is written against, not something the skill grants access to.
  # Only `load_resource`, over the skill's own directory, is skill-only.
  - id: file://../../lib/skill-tools.js
    label: deepseek-v4-flash+resources
    config:
      model: deepseek/deepseek-v4-flash
      apiBaseUrl: https://openrouter.ai/api/v1
      max_tokens: 8192
      passthrough:
        reasoning:
          enabled: false
      apiKeyEnvar: OPENROUTER_API_KEY
      # A plan needs to locate a handful of relevant files (the command being
      # extended, the package that already does the job), not review every
      # hunk of a diff - so this suite's budget starts below review-code's and
      # can grow if a case turns out to need more browsing than expected. Bumped
      # from 20 to 30: cases now deliberately put the reuse target in a sibling
      # file or a narrower local interface rather than the touched file itself
      # (tests/cases.yaml), which costs an extra round or two of browsing, and
      # a persona is attached (every arm gets ask_user - see prompts/arms.js),
      # which also spends rounds. Bumped again to 45: a real run hit "tool loop
      # exceeded 30 rounds" on the AddJSONFlags case's skill-current arm, which
      # was genuinely investigating (checking whether sibling `list` commands -
      # pkg/cmd/run/list, pkg/cmd/issue/list - follow the same --json
      # convention) rather than looping; failing that case on budget instead of
      # judging the plan it would have written is worse than the extra spend.
      maxToolCalls: 45
      maxResourceBytes: 65536

defaultTest:
  options:
    # llm-rubric everywhere: g-eval extracts with /{.+}/, which cannot cross
    # newlines, so a pretty-printed verdict is discarded and the row records
    # 0.00 where the judge wrote full marks (evals/AGENTS.md Harness facts).
    transform: file://../../lib/strip-reasoning.js:stripReasoning
    provider:
      id: openai:chat:deepseek/deepseek-v4-flash
      config:
        response_format:
          type: json_object
        apiBaseUrl: https://openrouter.ai/api/v1
        max_tokens: 8192
        max_completion_tokens: 8192
        passthrough:
          reasoning:
            enabled: false
        apiKeyEnvar: OPENROUTER_API_KEY
        showThinking: false
        omitDefaults: true
  assert:
    # Browsing the repo before answering costs round-trips; that overhead is
    # part of what the arms are compared on. No `cost` assertion: this gateway
    # declares no per-token price, so it would read zero and pass trivially.
    #
    # Kept despite sitting at ceiling (sd 0.000) in both arms on the 4-case
    # --repeat 3 run, which looks like the AGENTS.md "dead metric" case for
    # cutting. It isn't one: check-suite.py exempts latency from needing a
    # `metric` at all (NO_METRIC_NEEDED) because this was never meant as a
    # scored comparison axis, only a runaway guard - it costs nothing beyond
    # the generation call already happening (no extra judge round-trip, unlike
    # a dropped llm-rubric), and it is the only thing standing between a
    # genuinely runaway tool loop and a silent pass. That is not hypothetical
    # here: a real run already hit "tool loop exceeded 30 rounds" on this
    # suite's skill-current arm (see maxToolCalls' comment above), which is
    # exactly the failure mode this assertion exists to catch if the budget
    # or the model's behavior regresses. Ceiling on both arms right now says
    # the 45-call budget is comfortable, not that the check is dead weight.
    - type: latency
      threshold: 300000
      metric: latency

tests:
  - file://tests/*.yaml
