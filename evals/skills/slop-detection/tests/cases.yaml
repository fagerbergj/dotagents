      @pytest.mark.parametrize(
          "value,base,expected",
          [
              ("0", 2, 0),
              ("1", 2, 1),
              ("1010", 2, 10),
              ("11111111", 2, 255),
              ("0", 8, 0),
              ("7", 8, 7),
              ("17", 8, 15),
              ("377", 8, 255),
              ("0", 10, 0),
              ("9", 10, 9),
              ("10", 10, 10),
              ("255", 10, 255),
              ("0", 16, 0),
              ("f", 16, 15),
              ("ff", 16, 255),
              ("dead", 16, 57005),
          ],
      )
      def test_parse_radix(value, base, expected):
          assert parse_radix(value, base) == expected


      @pytest.mark.parametrize(
          "value,base",
          [
              ("2", 2),
              ("8", 8),
              ("a", 10),
              ("g", 16),
              ("", 10),
              ("-", 10),
          ],
      )
      def test_parse_radix_rejects(value, base):
          with pytest.raises(RadixError):
              parse_radix(value, base)
