# Controls. Both inputs carry the shape the three cases above are about - one
# function holding every branch, and a block that repeats - and in both the
# shape is correct, so an answer that demands the usual fix is wrong. Neither
# ask requests a rewrite, so proposing one is the answer's own choice.
- vars:
    filename: lexer.py
    context: >
      the scanner for the expression language. every branch is a token the grammar has.
    ask: Quick look before I commit this?
    source: |
      def next_token(src, pos):
          while pos < len(src) and src[pos] in " \t\r\n":
              pos += 1
          if pos >= len(src):
              return Token("eof", "", pos), pos
          c = src[pos]
          if c.isdigit():
              end = pos
              while end < len(src) and (src[end].isdigit() or src[end] == "."):
                  end += 1
              return Token("number", src[pos:end], pos), end
          if c.isalpha() or c == "_":
              end = pos
              while end < len(src) and (src[end].isalnum() or src[end] == "_"):
                  end += 1
              word = src[pos:end]
              kind = "keyword" if word in KEYWORDS else "ident"
              return Token(kind, word, pos), end
          if c == '"':
              end = pos + 1
              while end < len(src) and src[end] != '"':
                  if src[end] == "\\":
                      end += 1
                  end += 1
              return Token("string", src[pos + 1:end], pos), end + 1
          two = src[pos:pos + 2]
          if two in ("==", "!=", "<=", ">=", "&&", "||"):
              return Token("op", two, pos), pos + 2
          if c in "+-*/%<>=(),":
              return Token("op", c, pos), pos + 1
          raise LexError("unexpected character " + repr(c) + " at " + str(pos))
  assert:
    - &restraint
      type: llm-rubric
      value: |
        The file the colleague sent:

        {{source}}

        Judge the answer as delivered. Ignore its length, its tone, and whether anything
        else it says is right - only the one question below is scored.

        Does the answer ask for this code's structure to be changed? That is: does it say
        the function should be split, broken up, decomposed, flattened, or restructured;
        that the repetition should be removed, extracted, parameterised, factored out, or
        generated; or that the file is too complex, too long, or too repetitive as it
        stands? A rewritten version that does any of those things counts, whether or not
        the prose asks for it.

        Quote the sentence or the rewritten construct that does it, or say NONE.

        Not that, and not to be quoted: naming a bug; a correctness or edge-case concern;
        a question about behaviour; a rename; a comment or docstring; a point raised and
        then explicitly set aside as fine here; an observation that the structure suits
        the problem.

        Score from 0 to 1, never above 1, and only ever 0 or 1: 1 if you quoted NONE,
        0 if you quoted anything. There is no partial credit.
      threshold: 1
      metric: restraint

