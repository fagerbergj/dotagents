# Five cases, each built from an example the source material uses to illustrate
# one signal. Three carry a defect the skill claims to find; two carry a shape
# that looks like one and is not, so an arm that pattern-matches loses there.
#
# PROVENANCE. Listings 1-3 of the SlopCodeBench paper (arxiv.org/html/2603.24755v1),
# which the article (earendil.com/posts/measuring-code-sloppiness) draws its two
# metrics from. Each listing is elided in the paper; the code here is written out
# to the shape and the scale the listing and its caption describe, in the paper's
# own Python track, so the defect is the one the figure is about.
#
#   1 concentration  find_matches_in_file(), Listing 1: every rule kind's
#                    branching lands in one function rather than in a callable
#                    per kind. The caption's point is that mass collapses into
#                    one function while the agent adds others around it.
#   2 verbosity      the search loop, Listing 2: identity comprehension,
#                    empty-checks around an iteration that handles empty fine,
#                    single-use variables. The caption names all three.
#   3 duplication    main(), Listing 3: command branches repeating one
#                    argument-parsing scaffold inside a dispatcher.
#   4 control        a scanner whose branch count IS the token grammar.
#   5 control        a parametrize table: repetition that is data.
#
# WHICH OF THESE ARE HYPOTHESES: all five. None has run. A case earns its place
# by separating the arms or by failing an answer that deserved to fail, and
# until the first CI run says which did, every row here is a guess. Read the
# per-metric namedScores per arm before adding a sixth.
#
# The ask on cases 1-3 requests the rewritten file. That is the case's
# environment, identical in both arms, and it decides nothing the skill decides:
# what to cut, and whether anything needs cutting at all, is left open. Without
# it the two deterministic graders have no code to measure and report a dead 0
# on every row. The controls ask for neither, so an arm that proposes a rewrite
# there is choosing to.

- vars:
    filename: matcher.py
    context: >
      matcher.py as it stands after I added the AST pattern rules this week. it passes
      the suite and I keep putting off going back into it.
    ask: Send me back the version you would rather maintain, in a fenced block.
    source: |
      def find_matches_in_file(text, path, language, rules):
          matches = []
          for rule in rules:
              kind = rule.get("kind")
              spans = None
              if kind == "exact":
                  needle = rule["pattern"]
                  if not rule.get("case_sensitive"):
                      needle = needle.lower()
                      hay = text.lower()
                  else:
                      hay = text
                  spans = []
                  start = 0
                  while True:
                      idx = hay.find(needle, start)
                      if idx < 0:
                          break
                      spans.append((idx, idx + len(needle)))
                      start = idx + 1
              elif kind == "regex":
                  flags = 0
                  if not rule.get("case_sensitive"):
                      flags = flags | re.IGNORECASE
                  if rule.get("multiline"):
                      flags = flags | re.MULTILINE
                  try:
                      compiled = re.compile(rule["pattern"], flags)
                  except re.error:
                      compiled = None
                  if compiled is not None:
                      spans = [(m.start(), m.end()) for m in compiled.finditer(text)]
              elif kind == "pattern":
                  root = parse_tree(text, language)
                  if root is not None:
                      spans = []
                      for node in iter_tree_nodes(root):
                          if not node_matches_selector(rule["selector"], node):
                              continue
                          if rule.get("capture") and node.capture != rule["capture"]:
                              continue
                          spans.append((node.start, node.end))
              else:
                  spans = None
              if spans is not None:
                  for start, end in spans:
                      line = text.count("\n", 0, start) + 1
                      if rule.get("max_line") and line > rule["max_line"]:
                          continue
                      matches.append(
                          dict(path=path, line=line, rule=rule["id"], span=(start, end))
                      )
          return matches
  assert:
    # The signal's own measure, computed the same way over the answer's code and
    # over the input, so the number scored is the change rather than a threshold
    # anyone could have picked to favour an arm.
    - &max_cc
      type: javascript
      value: file://assertions/slop.cjs:maxCcReduced
      metric: max_cc_reduced
    - &names_defect
      type: llm-rubric
      value: |
        The file the colleague sent:

        {{source}}

        Judge the answer as delivered. Ignore its length, its tone, whether it followed any
        particular method, and whether its rewritten code would compile - none of that is
        graded here. Do not reward an answer for mentioning a metric, a formula, or a number;
        an answer that names the right problem in plain words scores the same as one that
        measures it.

        The single question: does the answer identify a specific structural problem in THIS
        file, pointing at the construct that carries it, and say concretely what replaces it?

        Answer these two with a quote from the answer, or NONE, before scoring.

        1. The construct it names - the function, the branch, the block, the variable -
           identified specifically enough that you could find it in the file above. A
           problem attributed to the file as a whole, or phrased so it would read true of
           any Python file, is NONE.
        2. What it proposes instead, concretely enough to act on without asking a follow-up
           question. "Simplify this", "consider refactoring", "make it more readable" and
           "split it up" with no boundary named are all NONE.

        If the answer's rewritten code makes a change the prose never names, read the change
        itself as the answer to both: a rewrite that visibly restructures the file is naming
        a problem and proposing a replacement, whether or not it narrates either.

        Score from 0 to 1, never above 1: 0.5 for item 1, 0.5 for item 2. Award nothing for an
        item you could not quote for. State the arithmetic.
      threshold: 0.5
      metric: names_defect

- vars:
    filename: search.py
    context: >
      the walk that drives the matcher. works, and it reads longer than what it does.
    ask: Clean it up and send it back in a fenced block.
    source: |
      def search_tree(source_files, all_compiled_rules, encoding):
          match_list = []
          for posix_path, full_path, language in source_files:
              applicable_rules = [
                  r for r in all_compiled_rules
                  if language in r["languages"]
              ]
              if not applicable_rules:
                  continue
              with open(full_path, "r", encoding=encoding) as f:
                  content = f.read()
              matches = find_matches_in_content(
                  content, applicable_rules, language
              )
              if not matches:
                  continue
              match_list.extend(matches)
          all_matches = deduplicate_matches(match_list)
          return all_matches
  assert:
    # Line count is scored on this case alone, where the whole claim about the
    # input is that it says its own job in more lines than it needs. It is not
    # in defaultTest and must not be: as a standing target it rewards golfing,
    # which is the failure mode the skill warns about in its own words.
    - type: javascript
      value: file://assertions/slop.cjs:codeLinesReduced
      metric: lines_reduced
    - *names_defect

