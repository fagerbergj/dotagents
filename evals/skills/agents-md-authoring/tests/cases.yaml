- description: nested AGENTS.md for semver/benches - criterion works on stable but not under Miri
  vars:
    repo: semver
    existingRoot: |
      CI runs `cargo test` plus `cargo check --no-default-features`,
      `cargo check --features serde`, and `cargo check --no-default-features
      --features serde` - a plain `cargo test` alone does not cover the
      feature matrix. RUSTFLAGS=-Dwarnings in CI: treat any compiler
      warning as a failure before pushing. Run `cargo clippy --tests
      --benches -- -Dclippy::all -Dclippy::pedantic` separately; it is not
      part of `cargo test`. The pinned MSRV (Rust 1.68, see Cargo.toml) is
      check-only in CI - don't assume `cargo test` itself passes at that
      toolchain version, only `cargo check`.
    task: |
      one more - a small AGENTS.md for benches/? someone tried running the
      benchmarks under miri and got confused about why it didn't work.
      pasting the root file below again
    evidence: |
      - The `[[bench]]` declaration (name = "parse", harness = false) lives
        in the root Cargo.toml, not in benches/ itself - benches/parse.rs
        is the only file, with no build config of its own.
      - Unlike many Rust crates where `cargo bench` needs a nightly
        toolchain (the native `#[bench]` harness), this crate uses
        `criterion` with `harness = false`, so plain `cargo bench` works
        fine on stable Rust.
      - `criterion` is scoped as a dev-dependency only outside Miri:
        `[target.'cfg(not(miri))'.dev-dependencies] criterion = { version =
        "0.8", default-features = false }`. Running anything Miri-driven
        against this crate (`cargo miri test`, etc.) will not have
        `criterion` available at all - benches/ is structurally excluded
        from any Miri-based flow, not merely slow under it.
      This is the fact serious enough that missing it causes the mistake
      the task describes: assuming benches/ needs nightly (the common Rust
      convention) when it doesn't, and not knowing why it's unreachable
      under Miri when it is.
    obvious: |
      a directory/file tour of benches/ (one file), a generic explanation
      of what criterion or cargo bench are, and anything already stated in
      the root AGENTS.md above (graded separately by nested_not_redundant).
  assert:
    - type: javascript
      value: file://assertions/agentsmd.cjs:citedFactsExistInRepo
      config:
        repo: semver
        cwd: benches
      metric: cited_facts_exist

    - *discoverability_filter
    - *length_proportionate

    - type: javascript
      value: file://assertions/agentsmd.cjs:nestedDoesNotRepeatRoot
      metric: nested_not_redundant
