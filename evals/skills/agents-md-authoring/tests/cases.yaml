# Two real repos, pinned in lib/repo.js and served to both arms via repoDir
# (prompts/arms.js). Tasks are written the way the person asking would
# actually type them - partial, casual - and never name a section, a
# discoverability test, or which facts are hard to find: deciding that is the
# thing being graded.
#
# citedFactsExistInRepo (assertions/agentsmd.cjs) is the suite's central
# claim: every command or path the produced file cites has to actually exist
# in the repo it was written against. It is reused across all three cases.
# GUARD, not a pure discriminator: --repeat 3 read +0.22 (sd 0.13, borderline
# noise at n=3) - but on independent live runs it is what caught genuine
# hallucinations (`pip install -e ".[test]"` naming an extra pyproject.toml
# does not declare; `requests/__init__.py` when the real path is
# `src/requests/__init__.py`). Stays wired to catch those regressions again
# regardless of whether n=3 lets it clear a noise floor as a discriminator.
#
# discoverability_filter (defined on the first case below, reused via *alias
# on the other two) was originally two separate, differently-worded rubrics:
# one on this file's case (n=1, sign-unstable across --repeat 3:
# -0.30/-0.15/+0.35) and a second, "resists_invention", living only on the
# third case (n=1, -0.10 sd 0.17). Per evals/AGENTS.md's steer to merge thin
# per-case metrics into one metric at higher n rather than reword each in
# isolation (precedent: review-code's verifies_rather_than_trusts +
# severity_restraint -> review_quality), they are now ONE uniformly-worded
# rubric spanning all three cases (n=3), with each case supplying its own
# <Evidence> (what's actually true, gathered independently) and <Obvious>
# (what one glance at the repo already gives an agent for free) - the
# wording never changes, only the ground truth it is judged against.
#
# Grounded in two independent sources, neither cited by the skill itself:
# - agents.md, the community convention this file format is named for
#   (fetched 2026-08-27): the file's whole reason to exist is holding "the
#   extra, sometimes detailed context coding agents need: build steps,
#   tests, and conventions that might clutter a README or aren't relevant to
#   human contributors" - stated precisely opposite "Keep READMEs concise
#   and focused on human contributors." A file that restates what one glance
#   already gives an agent fails that standard as surely as one that omits a
#   real hazard.
# - Diátaxis (diataxis.fr/reference, fetched 2026-08-27): reference-style
#   technical material should be "austere and uncompromising", limited to
#   "the machinery and how to operate it", avoiding content that would
#   "explain, instruct, discuss, opine" because that "run[s] counter to the
#   needs of technical reference." A repo with little worth documenting
#   should get a correspondingly thin file, not padding.

- description: fresh AGENTS.md for requests - nobody has one yet
  vars:
    repo: requests
    task: |
      the requests repo doesn't have any AGENTS.md yet and it shows - people
      keep running pip install -e . then wondering why half of pytest's
      plugins are missing, and we just had a PR closed for listing an LLM as
      co-author. can you write us a root AGENTS.md so this stops happening
    evidence: |
      - `pip install -e .` alone does not install pytest or its plugins;
        the dev setup needs `pip install -r requirements-dev.txt` (or
        `make init`, which runs the same command). This is the fact serious
        enough that missing it causes the mistake the task describes.
      - `make test` runs the suite; `make coverage` adds coverage
        reporting; `tox` (envs `default` and `use_chardet_on_py3`) runs it
        across every supported interpreter.
      - pytest is configured with `--doctest-modules`, so doctests inside
        source docstrings are collected and must pass, not only tests/.
      - `.github/AI_POLICY.md` forbids unsupervised agentic tools and LLM
        co-authorship on commits, and requires a human who can defend every
        line of a contribution - a second fact serious enough on its own
        (a policy violation, not just a broken build) that omitting it
        would be a real miss.
    obvious: |
      a restated dependency list from pyproject.toml, a directory/file
      tour, the MIT/Apache license text, or the CONTRIBUTING.md bug report
      template - all one read away and not agent-specific.
  assert:
    - type: javascript
      value: file://assertions/agentsmd.cjs:citedFactsExistInRepo
      config:
        repo: requests
      metric: cited_facts_exist

    # Claim: "discoverability-first rubric" (see the file-level comment
    # above for full grounding and the merge that produced this shared
    # rubric). Judges whether <Output> holds only what an agent could not
    # quickly get by reading the repo's own files, and omits what it could -
    # against this case's own <Evidence>/<Obvious>, reused unchanged by the
    # other two cases via *discoverability_filter.
    - &discoverability_filter
      type: llm-rubric
      # A custom rubricPrompt replaces promptfoo's default JSON-format system
      # message wholesale (loadRubricPrompt in graders-*.cjs returns the
      # override verbatim rather than merging it), so it has to reassert the
      # JSON contract itself or the row dies with "Could not extract JSON" -
      # reproduced on this exact suite, matched against adr-authoring's
      # tests/cases.yaml, which carries this same system message and scored
      # 120/120 llm-rubric rows with zero extraction failures historically.
      rubricPrompt:
        - role: system
          content: 'You grade a document against a rubric. Reply with one line of JSON and nothing else:
            {"reason": string, "pass": boolean, "score": number}. Never emit a newline inside the JSON.'
        - role: user
          content: |
            <Output>{{output}}</Output>
            <Evidence>{{evidence}}</Evidence>
            <Obvious>{{obvious}}</Obvious>
            <Rubric>{{rubric}}</Rubric>
      value: |
        <Output> is a candidate AGENTS.md (or a section of one, for a nested
        file) for a real repository. <Evidence> lists facts about the
        repository gathered independently - treat it as ground truth, not
        as a list <Output> must quote verbatim. <Obvious> lists what one
        glance at the repo's own files already gives an agent for free -
        restating any of it is clutter, not content.

        Answer every item with a quote from <Output>, or NONE - a holistic
        impression is not an answer. A live failure on this exact rubric
        scored an output containing a directory tree and an invented
        "Release checklist" a 1.0, reasoning "obvious clutter is absent" -
        false against the text being judged. An item is not satisfied until
        you can point to the specific words that satisfy or violate it.

        1. If <Evidence> names a fact serious enough that missing it would
           cause a real mistake (a broken build or test run, a violated
           policy, a wasted debugging session), does <Output> state it and
           say how to actually avoid the mistake - not just gesture at the
           topic? Quote the sentence(s) that do this, or NONE if it is
           missing or only gestured at. If <Evidence> says no such fact
           exists for this repo, score this item 1 automatically.
        2. Does <Output> restate anything in <Obvious> (a dependency list,
           a directory/file tour, license text, a boilerplate contribution
           template, or generic software-engineering advice not specific to
           this repo)? Quote the specific offending passage, or NONE if
           none appears. Score 1 for NONE, 0 for a quote.
        3. Does <Output> contain any passage that is not grounded in
           <Evidence> and not needed to state <Evidence>'s facts - padding
           such as a "Useful links" section, an invented checklist, restated
           ceremony, or elaboration beyond what the fact requires? Quote the
           specific offending passage, or NONE if none appears. Score 1 for
           NONE, 0 for a quote.

        Score from 0 to 1, never above 1: 0.4 for the first, 0.3 for the
        second, 0.3 for the third. Award nothing for any item where you
        cannot produce the quote it requires (unless <Evidence> says item 1
        doesn't apply).
      threshold: 0.5
      metric: discoverability_filter

    # Deterministic backstop for item 3 above, computed against this case's
    # own vars.evidence rather than a fixed word count (assertions/agentsmd.cjs
    # comment has the full rationale for why item 3 needed one).
    - &length_proportionate
      type: javascript
      value: file://assertions/agentsmd.cjs:lengthProportionateToEvidence
      metric: length_proportionate

- description: nested AGENTS.md for requests/docs - people keep botching the sphinx build
  vars:
    repo: requests
    existingRoot: |
      Install dev deps before testing: `pip install -r requirements-dev.txt`
      (plain `pip install -e .` skips pytest and its plugins).
      Run the suite with `make test`; `make coverage` adds coverage
      reporting; `tox` covers every supported interpreter.
      Every PR needs a human who wrote and can defend the change. No LLM
      co-author, no unsupervised agentic tools - see `.github/AI_POLICY.md`.
    # No "don't just copy it in, only add what's specific to that folder" -
    # a prior version of this task spelled out the correct answer in the
    # ask itself, which is the case doing the skill's job (evals/AGENTS.md:
    # "never let the case do the skill's job"). The task now only states
    # that a root file exists, for nestedDoesNotRepeatRoot below to grade
    # honestly - though see that assertion's own note: fixing the prompt
    # was not enough on its own.
    task: |
      can you add a small AGENTS.md just for docs/? people keep trying to
      build the sphinx docs and getting it wrong. we've already got a root
      one, it's below for reference
    # Fetched from the pinned requests checkout (psf/requests @
    # 5460f467b02e49471c0fd6cfc9ca0adab6351f98), 2026-08-28.
    evidence: |
      - docs/requirements.txt pins `Sphinx==7.2.6`, with the file's own
        comment "Pinning to avoid unexpected breakages" - installing a
        different or newer Sphinx is not the sanctioned way to build these
        docs.
      - The repo root's Makefile has no `html` target. Running `make html`
        from the repo root fails; the Sphinx build lives in docs/Makefile
        and has to be run either as `cd docs && make html`, or as `make
        docs` from the repo root (the root Makefile's `docs` target does
        exactly `cd docs && make html`).
      - The real production build (.readthedocs.yaml) uses the `dirhtml`
        builder, not `html`, and installs from docs/requirements.txt - a
        local `make html` preview and the actual Read the Docs build are
        not quite the same command.
      This is the fact serious enough that missing it causes the mistake
      the task describes ("people keep trying to build the sphinx docs and
      getting it wrong"): running a Sphinx command from the repo root
      instead of docs/, or installing an unpinned Sphinx.
    obvious: |
      a directory/file tour of docs/ (it is visibly Sphinx from one `ls` -
      conf.py, *.rst files, a Makefile), Sphinx's own generic usage
      instructions (documented by Sphinx itself, not specific to this
      repo), and anything already stated in the root AGENTS.md above.
  assert:
    - type: javascript
      value: file://assertions/agentsmd.cjs:citedFactsExistInRepo
      config:
        repo: requests
        # This file's own instructions are correctly written to run from
        # docs/ ("build with `make html` from this directory"), so a bare
        # `make html` has to resolve against docs/Makefile, not the root
        # one - without this a true, accurate nested instruction was scored
        # as invented on a live row.
        cwd: docs
      metric: cited_facts_exist

    - *discoverability_filter
    - *length_proportionate

    # REINSTATED: nested_not_redundant was cut here after a --repeat 3 run
    # still read ceiling in both arms (no-skill 0.875/1.0/1.0, skill-current
    # 1.0/1.0/1.0), on the theory the case's own "don't just copy it in"
    # wording (removed above) had foreclosed it. It hadn't, fully - a
    # second, separate foreclosure lived in prompts/arms.js's shared
    # template, appended to EVERY nested case regardless of per-case
    # wording ("do not repeat it, only add what is specific to this
    # subtree"), so the prior run was never a clean test. That template
    # instruction is now removed (see prompts/arms.js), which makes this
    # the first genuinely unforeclosed run of this metric on this case -
    # earning its place fresh rather than staying cut on stale evidence.
    - type: javascript
      value: file://assertions/agentsmd.cjs:nestedDoesNotRepeatRoot
      metric: nested_not_redundant

- description: AGENTS.md for is-plain-obj - five files, nothing hidden
  vars:
    repo: is-plain-obj
    task: |
      can you set up an AGENTS.md for is-plain-obj so agents know how to
      work in this repo
    # The judge's own ground truth. Without this the judge guessed at what
    # index.js and .editorconfig actually contain and got it wrong twice on a
    # live row: it called "tabs for indentation" invented when .editorconfig
    # says `indent_style = tab` and index.js is tab-indented, and called
    # Symbol.toStringTag/Symbol.iterator unforced when index.js literally
    # tests `!(Symbol.toStringTag in value) && !(Symbol.iterator in value)`.
    # Verbatim from the pinned checkout, not summarised.
    evidence: |
      None of this repo's facts rise to a hazard serious enough that
      missing it would cause a real mistake - nothing here breaks a build,
      fails a test, or violates a policy. The correct file is near-empty,
      or explicitly says there is nothing more to add beyond package.json.

      Repository file listing (everything at the repo root): .editorconfig,
      benchmark.js, index.d.ts, index.js, index.test-d.ts, license,
      package.json, readme.md, test.js. A citation naming one of these files
      is real, not invented, even though its contents are not all quoted below.

      benchmark.js (what it does, not run by `npm test`): times isPlainObject
      against a list of sample values, calling it 1e8 (100 million) times per
      value in a loop, timed with console.time/console.timeEnd. A citation
      matching this - "100 million iterations", "console.time", "manual
      performance script" - is real, not invented.

      test.js (what it does): the ava test suite, asserting isPlainObject
      against plain and non-plain values including one created in a separate
      vm context via node:vm's runInNewContext.

      .editorconfig (full file):
      root = true

      [*]
      indent_style = tab
      end_of_line = lf
      charset = utf-8
      trim_trailing_whitespace = true
      insert_final_newline = true

      [*.yml]
      indent_style = space
      indent_size = 2

      index.js (full file):
      export default function isPlainObject(value) {
      	if (typeof value !== 'object' || value === null) {
      		return false;
      	}

      	const prototype = Object.getPrototypeOf(value);
      	return (prototype === null || prototype === Object.prototype || Object.getPrototypeOf(prototype) === null) && !(Symbol.toStringTag in value) && !(Symbol.iterator in value);
      }

      package.json "scripts": { "test": "xo && ava && tsd" }. "type": "module".
      "engines": { "node": ">=18" }. No other scripts, no build step.
    obvious: |
      a restated dependency list or test script from package.json (the
      `xo && ava && tsd` chain), a directory/file tour (five files, one
      glance), license text, or generic software-engineering advice
      ("write clean code", "add tests for new features", "follow best
      practices" and the like).
  assert:
    - type: javascript
      value: file://assertions/agentsmd.cjs:citedFactsExistInRepo
      config:
        repo: is-plain-obj
        # The ideal answer here is a very short file, or an explicit refusal -
        # both can legitimately cite nothing checkable at all. Contrast the
        # other two cases, where this is left at its default (required).
        requireCitation: false
      metric: cited_facts_exist

    - *discoverability_filter
    - *length_proportionate

# --- New repos below: dtolnay/semver (Rust/cargo) and jqlang/jq (C/autotools),
# added alongside a third requests case, to grow n on all three retained
# metrics and to stop the suite measuring only two repos' conventions. Facts
# verified against the pinned checkouts directly, not summarised from memory.

- description: fresh AGENTS.md for semver - CI checks more than plain cargo test
  vars:
    repo: semver
    task: |
      setting up an AGENTS.md for dtolnay/semver - it's a small crate but
      we've had a couple of PRs pass locally and then fail in CI for
      reasons that weren't obvious from just running the tests. can you
      write us a root one?
    # Fetched from the pinned checkout (dtolnay/semver @
    # 280ebcb6edac3aa4cdc545dbff8a26c5ac4861fe), 2026-08-28.
    evidence: |
      - CI sets `RUSTFLAGS: -Dwarnings` (.github/workflows/ci.yml) - any
        warning (dead code, an unregistered #[cfg], a deprecation) is a
        hard CI failure even though it is silent locally.
      - Cargo.toml pins `rust-version = "1.68"`, and that toolchain is in
        the CI matrix, but CI only runs `cargo test` "if: matrix.rust !=
        '1.68.0'" - at the pinned MSRV, only `cargo check` (in three
        feature combinations) runs, never the test suite. `cargo test`
        compiling cleanly at 1.68 has never actually been verified by CI.
      - The feature matrix is checked explicitly and separately: `cargo
        check --no-default-features`, `cargo check --features serde`, and
        `cargo check --no-default-features --features serde` all run in CI
        in addition to the default `cargo test`. A change gated behind a
        feature combination the default `cargo test` doesn't exercise can
        pass locally and still be broken.
      - `cargo clippy --tests --benches -- -Dclippy::all -Dclippy::pedantic`
        runs in CI and is not part of `cargo test` at all - lint-clean
        tests still need a separate clippy pass before pushing.
    obvious: |
      a restated Cargo.toml dependency/version list, a directory/file tour
      of src/ (parsing/eval/display/serde modules, visible from one `ls`),
      the dual MIT/Apache-2.0 license text, or generic "how cargo test
      works" advice.
  assert:
    - type: javascript
      value: file://assertions/agentsmd.cjs:citedFactsExistInRepo
      config:
        repo: semver
      metric: cited_facts_exist

    - *discoverability_filter
    - *length_proportionate

- description: nested AGENTS.md for semver/fuzz - not part of cargo test at all
  vars:
    repo: semver
    existingRoot: |
      CI runs `cargo test` plus `cargo check --no-default-features`,
      `cargo check --features serde`, and `cargo check --no-default-features
      --features serde` - a plain `cargo test` alone does not cover the
      feature matrix. RUSTFLAGS=-Dwarnings in CI: treat any compiler
      warning as a failure before pushing. Run `cargo clippy --tests
      --benches -- -Dclippy::all -Dclippy::pedantic` separately; it is not
      part of `cargo test`. The pinned MSRV (Rust 1.68, see Cargo.toml) is
      check-only in CI - don't assume `cargo test` itself passes at that
      toolchain version, only `cargo check`.
    task: |
      can you add a small AGENTS.md just for fuzz/? people keep trying to
      build or run stuff in there the normal way and it doesn't work. we've
      already got a root one, it's below for reference
    evidence: |
      - fuzz/Cargo.toml declares its own `[workspace]`, cutting it off from
        the crate root's workspace, and its `[[bin]]` targets point
        directly at files in fuzz/ (fuzz/parse_version.rs,
        fuzz/parse_version_req.rs, fuzz/sort_version.rs), not the
        conventional fuzz/fuzz_targets/ directory cargo-fuzz normally
        creates.
      - `cargo build`/`cargo test` from the repo root never touches this
        directory at all. To even compile a fuzz target you need a nightly
        toolchain (`rustup default nightly` or `cargo +nightly ...`) and
        `cargo install cargo-fuzz` first, then run from inside fuzz/ (e.g.
        `cargo fuzz check` or `cargo fuzz run parse_version`).
      - CI's fuzz job only runs `cargo fuzz check` (a compile-only check) -
        it never actually executes a fuzzer for any duration.
      This is the fact serious enough that missing it causes the mistake
      the task describes: running `cargo test` or plain `cargo build` from
      fuzz/ (or the repo root) and concluding the fuzz targets are fine, or
      not knowing nightly + cargo-fuzz are required at all.
    obvious: |
      a directory/file tour of fuzz/ (three .rs files, one glance), a
      generic "what is fuzzing" explanation, and anything already stated in
      the root AGENTS.md above (that overlap is graded separately, by
      nested_not_redundant below, not by this rubric).
  assert:
    - type: javascript
      value: file://assertions/agentsmd.cjs:citedFactsExistInRepo
      config:
        repo: semver
        cwd: fuzz
      metric: cited_facts_exist

    - *discoverability_filter
    - *length_proportionate

    - type: javascript
      value: file://assertions/agentsmd.cjs:nestedDoesNotRepeatRoot
      metric: nested_not_redundant

- description: nested AGENTS.md for semver/tests - the Node.js cross-check is opt-in
  vars:
    repo: semver
    existingRoot: |
      CI runs `cargo test` plus `cargo check --no-default-features`,
      `cargo check --features serde`, and `cargo check --no-default-features
      --features serde` - a plain `cargo test` alone does not cover the
      feature matrix. RUSTFLAGS=-Dwarnings in CI: treat any compiler
      warning as a failure before pushing. Run `cargo clippy --tests
      --benches -- -Dclippy::all -Dclippy::pedantic` separately; it is not
      part of `cargo test`. The pinned MSRV (Rust 1.68, see Cargo.toml) is
      check-only in CI - don't assume `cargo test` itself passes at that
      toolchain version, only `cargo check`.
    task: |
      what about a nested AGENTS.md for tests/ too? we want to make sure
      the node.js cross-check we've got actually gets run when someone
      touches that stuff. root one's below again for reference
    evidence: |
      - tests/node/mod.rs starts with `#![cfg(test_node_semver)]` - this
        module compiles to nothing unless the custom cfg flag
        `test_node_semver` is set. A plain `cargo test` at the root
        silently skips this cross-check entirely and still reports
        success.
      - To actually run it, you need Node.js installed, `npm install
        semver` run first (a JS dependency inside a Rust crate's test
        suite), and `RUSTFLAGS="--cfg test_node_semver"` set when invoking
        `cargo test` - exactly what CI's separate "Node" job does
        (.github/workflows/ci.yml).
      - Without that cfg flag, tests/test_version_req.rs takes a
        different, non-comparative code path - so a green `cargo test` run
        proves nothing about whether the crate's behavior actually matches
        the real npm `semver` package's `satisfies()`.
      This is the fact serious enough that missing it causes the mistake
      the task describes: assuming a green `cargo test` already covers the
      Node.js differential check, when by default it silently does not.
    obvious: |
      a directory/file tour of tests/ (six files, one glance), generic
      advice about writing Rust tests, and anything already stated in the
      root AGENTS.md above (graded separately by nested_not_redundant).
  assert:
    - type: javascript
      value: file://assertions/agentsmd.cjs:citedFactsExistInRepo
      config:
        repo: semver
        cwd: tests
      metric: cited_facts_exist

    - *discoverability_filter
    - *length_proportionate

    - type: javascript
      value: file://assertions/agentsmd.cjs:nestedDoesNotRepeatRoot
      metric: nested_not_redundant

- description: fresh AGENTS.md for jq - a clean clone's ./configure trips people up
  vars:
    repo: jq
    task: |
      can you write a root AGENTS.md for jq? new contributors keep cloning
      it and then ./configure either fails outright or does something
      weird depending on their machine, and nobody can figure out why
    # Fetched from the pinned checkout (jqlang/jq @
    # 41b8edfe5437fcd25a072081c05f9f770f9e9b85), 2026-08-28.
    evidence: |
      - A fresh clone has no `configure` script at all and an
        uninitialized vendor/oniguruma submodule (`git submodule status`
        shows a leading "-", meaning not initialized - it's an empty
        directory). The correct build sequence, per README.md, is: `git
        submodule update --init`, then `autoreconf -i`, then `./configure
        --with-oniguruma=builtin`, then `make -j8` and `make check`.
      - `--with-oniguruma=builtin` is not optional decoration:
        configure.ac's default (with_oniguruma=yes) probes the *system*
        for oniguruma.h/libonig first, and only falls back to the vendored
        copy if that probe fails - and the vendored fallback itself only
        works if the submodule was actually initialized. Skipping the flag
        on a machine with a system oniguruma links against a possibly
        different, unintended version; skipping it with no system
        oniguruma and no submodule silently compiles jq's regex support
        (test/match builtins) without oniguruma at all rather than failing
        loudly.
      - If building from a released tarball rather than git, README.md
        says to skip the `autoreconf` step (and flex/bison aren't needed
        then) - running it anyway against a tarball checkout is itself a
        footgun the README calls out.
    obvious: |
      a directory/file tour (src/ has 45 flat C files, visible from one
      `ls`), restating the MIT license, a generic autotools/"how
      ./configure works" explanation, or the Docker one-liners already
      spelled out plainly in README.md.
  assert:
    - type: javascript
      value: file://assertions/agentsmd.cjs:citedFactsExistInRepo
      config:
        repo: jq
      metric: cited_facts_exist

    - *discoverability_filter
    - *length_proportionate

- description: nested AGENTS.md for jq/docs - the manual build degrades silently, not loudly
  vars:
    repo: jq
    existingRoot: |
      Build from git: `git submodule update --init`, then `autoreconf -i`,
      then `./configure --with-oniguruma=builtin`, then `make -j8` and
      `make check`. Skipping `--with-oniguruma=builtin` risks linking
      against a mismatched system oniguruma, or silently building without
      regex support if the submodule isn't initialized. Building from a
      release tarball instead of git: skip the `autoreconf` step.
    task: |
      can you add a small AGENTS.md just for docs/? people keep editing the
      manual and then wondering why their change didn't show up anywhere
      when they ran the tests. we've already got a root one, below for
      reference
    evidence: |
      - Docs are enabled by default (configure.ac: enable_docs=yes unless
        --disable-docs is passed), and `./configure` probes for a working
        pipenv environment inside docs/. If that probe fails, the build
        does NOT error - it prints a warning and continues with docs
        disabled: "Python dependencies for building jq documentation not
        found. You can still build, install and hack on jq, but the
        manpage will not be rebuilt and new manpage tests will not be run."
      - Building the docs toolchain requires python3 + pipenv, run from
        inside docs/: `pipenv sync` (docs/README.md notes you may first
