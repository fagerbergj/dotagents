        docs/content/manual/dev/manual.yml via docs/build_manpage.py -
        editing jq.1.prebuilt directly is pointless, it gets regenerated
        and overwritten; edit the manual.yml source instead.
      - docs/'s dependencies (Pipfile: jinja2, pyyaml, markdown, lxml,
        jsonschema, importlib_resources) are a wholly separate dependency
        graph from the root C build with no shared source of truth - the
