# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: agents-md-authoring skill effectiveness

# Arms over real repositories, pinned in lib/repo.js. Labels come from the
# skill's frontmatter version, so bumping metadata.version in SKILL.md
# relabels the comparison.
prompts:
  - id: file://prompts/arms.js:noSkill
    label: no-skill
  - id: file://prompts/arms.js:skillCurrent
    label: skill-current

providers:
  # Custom provider: the same OpenAI-compatible call, plus tools over two
  # roots. `read_source` serves the repository named by the case's `repo` var
  # and goes to BOTH arms - the repo is the subject matter, and gating it on
  # the skill would make the delta measure file access instead of authoring
  # judgment. Only `load_resource`, over the skill's own directory, is
  # skill-only.
  - id: file://../../lib/skill-tools.js
    label: deepseek-v4-flash+resources
    config:
      model: deepseek/deepseek-v4-flash
      apiBaseUrl: https://openrouter.ai/api/v1
      max_tokens: 8192
      passthrough:
        reasoning:
          enabled: false
      apiKeyEnvar: OPENROUTER_API_KEY
      # These repos are small, but semver/jq/zerolog have more subdirectories
      # than requests/is-plain-obj (fuzz/, tests/, benches/ for semver; docs/
      # for jq; journald/, cmd/lint/ for zerolog) - a careful read of root plus
      # one subtree costs more round-trips. Proven live: a 12-round budget hit
      # "tool loop exceeded 12 rounds" on semver's root case and produced an
      # empty, unscored row for the skill arm only (the no-skill arm sends no
      # tools at all), an asymmetric sample-count bug, not a fair comparison.
      # 20 rounds and 48 KB leave headroom for a full subtree read plus a
      # wrong guess or two, without funding a runaway loop.
      maxToolCalls: 20
      maxResourceBytes: 49152

defaultTest:
  options:
    # The gateway can leak deliberation as message content; this pulls it out
    # before any grader (including the fence-extraction in agentsmd.cjs) sees
    # the output.
    transform: file://../../lib/strip-reasoning.js:stripReasoning
    # Judge settings are settled (evals/AGENTS.md): google/gemini-3.8-flash,
    # temperature 0, reasoning on. A judge from the actor's own family
    # (deepseek grading deepseek shares its blind spots) measurably raised
    # run-to-run noise elsewhere in this harness - per-case SD 0.29 -> 0.04
    # and arm-mean SD 0.12 -> 0.015 across that pair of changes (dotagents#65).
    provider:
      id: openai:chat:google/gemini-3.8-flash
      config:
        response_format:
          type: json_object
        apiBaseUrl: https://openrouter.ai/api/v1
        temperature: 0
        max_tokens: 16384
        max_completion_tokens: 16384
        passthrough:
          temperature: 0
          reasoning:
            enabled: true
        apiKeyEnvar: OPENROUTER_API_KEY
        showThinking: false
        omitDefaults: true
  assert:
    # Reading the repo costs round-trips; that overhead is part of what the
    # arms are compared on. No `cost` assertion: this gateway declares no
    # per-token price, so it would read zero and pass trivially.
    - type: latency
      threshold: 180000

tests:
  - file://tests/*.yaml
