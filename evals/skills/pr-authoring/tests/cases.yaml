- description: bat-3885
  # Tiniest fixture in the pool (1 line, 2 LOC): the honest ground truth is one sentence, so this
  # is coverage's own negative control - padding here has nowhere honest to hide.
  vars:
    fixture: bat-3885
    note: 'typo report in the tracker, one word repeated in the README'
    diff: |
      diff --git a/README.md b/README.md
      index 9eb4c09..8826d4e 100644
      --- a/README.md
      +++ b/README.md
      @@ -902,7 +902,7 @@ cargo install --path . --locked --force
       ```
       
       If you want to build an application that uses `bat`'s pretty-printing
      -features as a library, check out the [the API documentation](https://docs.rs/bat/).
      +features as a library, check out the [API documentation](https://docs.rs/bat/).
       Note that you have to use either `regex-onig` or `regex-fancy` as a feature
       when you depend on `bat` as a library.
       
    author_description: |
      Small doubled-word fix in the README: "check out the [the API documentation]" renders as "the the API documentation". This removes the duplicate article so it reads "check out the [API documentation]". The link target is unchanged.
  assert:
    - type: javascript
      value: file://assertions/pr.cjs:proportionateLength
      config: { maxWords: 110 }
      metric: proportionality

    - &coverage
      type: llm-rubric
      # A rubric only ever sees {{output}} and {{rubric}} unless it carries its
      # own rubricPrompt, and a bare `- role: user` rubricPrompt drops
      # promptfoo's system message establishing the {reason,pass,score} JSON
      # contract - the exact "Could not extract JSON" failure that killed
      # 18/18 rows of this suite's old pr_quality metric. Restating that
      # system message is required, not decoration (evals/AGENTS.md).
      rubricPrompt:
        - role: system
          content: |
            You are grading output according to a user-specified rubric. If the
            statement in the rubric is true, then the output passes the test. You
            respond with a JSON object with this structure:
            {reason: string, pass: boolean, score: number}
        - role: user
          content: |
            <AuthorDescription>{{author_description}}</AuthorDescription>
            <Output>{{output}}</Output>
            <Rubric>{{rubric}}</Rubric>
      value: |
        <AuthorDescription> above is this pull request's own author's real
        description, withheld from whoever wrote <Output> - the one record of
        WHY the change was made that exists nowhere in the diff, since only the
        author had it. Source: Google's eng-practices guide on CL descriptions
        asks exactly this of a description - "Why are these changes being
        made? What contexts did you have as an author when making this
        change? Were there decisions you made that aren't reflected in the
        source code?"
        (https://google.github.io/eng-practices/review/developer/cl-descriptions.html).

        <AuthorDescription> is evidence of what a competent author thought
        worth saying about THIS change, not a template to imitate. Do not
        reward <Output> for matching its tone, structure, length, or wording,
        and do not penalise <Output> for saying something true that
        <AuthorDescription> happened to omit.

        1. List every substantive point <AuthorDescription> makes - each a
           distinct claim about what changed, why, what it affects, or what
           the reader should know - one per line, each quoted. Skip
           boilerplate (a bare issue link with no explanation, a sign-off).
           Call the count P.
        2. For each quoted point, mark COVERED if <Output> conveys the same
           substance somewhere - paraphrase is fine, exact wording is not
           required - or MISSING if it does not. Call the number marked
           COVERED C.
        3. Compare <Output>'s overall length against <AuthorDescription>'s
           own: write SHORTER, COMPARABLE, or LONGER.
        4. Compute base = C / P.
        5. If step 3 was LONGER, the final score is base * 0.85: spending more
           words than the author did to cover the same or less ground is a
           defect, not a neutral choice - this is the suite's own house
           calibration, not conformance to any published standard. Otherwise
           (SHORTER or COMPARABLE) the final score is base, unchanged:
           matching or beating the author's length earns no separate bonus,
           only the absence of this penalty.

        Score from 0 to 1, never above 1, equal to the number computed in step 5.
      threshold: 0.6
      metric: coverage

    - &restraint
      type: llm-rubric
      # Step 2 marks each claim against the diff or the note, so the judge
      # needs both - without this it sees neither and every claim collapses
      # to NEITHER.
      rubricPrompt:
        - role: system
          content: |
            You are grading output according to a user-specified rubric. If the
            statement in the rubric is true, then the output passes the test. You
            respond with a JSON object with this structure:
            {reason: string, pass: boolean, score: number}
        - role: user
          content: |
            <AuthorNote>{{note}}</AuthorNote>
            <Diff>{{diff}}</Diff>
            <Output>{{output}}</Output>
            <Rubric>{{rubric}}</Rubric>
      value: |
        The developer's own note is in <AuthorNote> above and the change
        itself is in <Diff>. Judge <Output> as delivered: do not reward or
        penalise how it was built or which authoring convention it followed.

        Work through these in order, then score.

        1. List every claim <Output> makes, one per line, each quoted. A claim
           is any statement about what the change does, why it was made, what
           it affects, what was run, or what the reader should expect. The
           title is always at least one claim. Write the total as T.
        2. Against each quoted claim write exactly one of:
             DIFF    - the diff shows it
             NOTE    - the developer's note says it
             NEITHER - neither the diff nor the note contains it. An invented
                       risk, a design rationale this change does not have, a
                       test command or a test result the author cannot have
                       run, or a file, symbol, or identifier absent from the
                       change all count as NEITHER.
        3. Write the number of claims marked NEITHER as U.

        Score from 0 to 1, never above 1: max(0, 1 - U / 4). Each unsupported
        claim costs a fixed 0.25 regardless of how many total claims the
        description makes. A ratio score - (T - U) / T - lets padding dilute
        an invention's cost by inflating T, which rewards verbosity; this
        fixed cost is this suite's own house calibration, chosen so one slip
        is tolerated and two are not, not conformance to any published
        standard: no widely cited guidance on change descriptions specifies a
        tolerance for unsupported claims.

        Headings, sections, and formatting are not scored. Overall length is
        not scored here either - that is `coverage`'s job - so a two-sentence
        answer and a five-paragraph answer face exactly the same arithmetic
        for this criterion alone, and brevity is never itself a deduction.
      threshold: 0.7
      metric: restraint

