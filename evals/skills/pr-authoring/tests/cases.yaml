    note: 'someone in the tracker spotted adminstrator in the pause-jobs error text - one letter, the thee two clauses along is still there'
    diff: |
      diff --git a/app/cmd/upload/run.go b/app/cmd/upload/run.go
      index 41d870c..a34a171 100644
      --- a/app/cmd/upload/run.go
      +++ b/app/cmd/upload/run.go
      @@ -180,7 +180,7 @@ func (upCmd *UpCmd) run(ctx context.Context, adapter adapters.Reader, app *app.A
       	if app.Client().PauseImmichBackgroundJobs {
       		err := upCmd.pauseJobs(ctx, app)
       		if err != nil {
      -			return fmt.Errorf("Can't pause immich background jobs: %wpass an adminstrator key with the flag --admin-api-key or disable the pause with thee flag --pause-immich-jobs=FALSE", err)
      +			return fmt.Errorf("Can't pause immich background jobs: %wpass an administrator key with the flag --admin-api-key or disable the pause with thee flag --pause-immich-jobs=FALSE", err)
       		}
       	}
       	defer func() { _ = upCmd.finishing(ctx, app) }()
  assert:
    - type: javascript
      value: file://assertions/pr.cjs:proportionateLength
      config: { maxWords: 60 }
      metric: proportionality
    - *restraint

- description: generated-types-regen
  vars:
    note: 'regenerated the client types off the same spec - the generator emits reasoning_tokens in a different position now, no schema change'
    diff: |
      diff --git a/frontend/src/generated/types.gen.ts b/frontend/src/generated/types.gen.ts
      index 1580194..09aa71f 100644
      --- a/frontend/src/generated/types.gen.ts
      +++ b/frontend/src/generated/types.gen.ts
      @@ -110,9 +110,9 @@ export type DagNodeState = {
           model?: string;
           prompt_tokens?: number;
           completion_tokens?: number;
      -    reasoning_tokens?: number;
           total_tokens?: number;
           finish_reason?: string;
      +    reasoning_tokens?: number;
           server_duration_ms?: number;
           self_refined?: boolean;
           judge_rounds?: number;
  assert:
    - type: javascript
      value: file://assertions/pr.cjs:proportionateLength
      config: { maxWords: 60 }
      metric: proportionality
    - *restraint

- description: config-default-flip
  vars:
    note: 'the shipped config still defaults web_search to searxng, which needs a url nobody sets on the no-docker path; exa works with no key'
    diff: |
      diff --git a/config/quack.yaml b/config/quack.yaml
      index e55ed53..0da4e02 100644
      --- a/config/quack.yaml
      +++ b/config/quack.yaml
      @@ -79,7 +79,7 @@ agents:
       # internal/tools/backends.go.
       tools:
         web_search:
      -    kind: searxng                 # searxng (needs url) | exa. empty ⇒ searxng
      +    kind: exa                     # searxng (needs url) | exa. empty ⇒ searxng
           url: ${QUACK_SEARXNG_URL}           # SearXNG JSON API, e.g. http://searxng:8080; unused by kind: exa
           # exa is keyless via Exa's hosted MCP by default (the no-docker path). Add an
           # api_key to use Exa's REST API instead (structured JSON, more robust):
  assert:
    - type: javascript
      value: file://assertions/pr.cjs:proportionateLength
      config: { maxWords: 70 }
      metric: proportionality
    - *restraint
