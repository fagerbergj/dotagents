- description: bat-3812
  # Description cites exact line numbers and a sibling PR (#3804/#3803) and states the
  # release-vs-debug-build distinction precisely - heavy on quantified, checkable claims for its size.
  vars:
    fixture: bat-3812
    note: 'found this while going through the sibling code paths after the last panic fix landed'
    diff: |
      diff --git a/CHANGELOG.md b/CHANGELOG.md
      index 9049dca..1e5b161 100644
      --- a/CHANGELOG.md
      +++ b/CHANGELOG.md
      @@ -46,6 +46,7 @@
       - Fixed syntax tests path, see #3610 (@foxfromworld)
       - Fix zsh tab completion word-splitting language names containing spaces (e.g. `HTML (Jinja2)`, `Apache Conf`), see #3693 (@YoshKoz)
       - Fix zsh tab completion offering invalid `-l` arguments (file globs, paths, hidden filenames) sourced from the second column of `--list-languages`. Closes #3735, see #3737 (@truffle-dev)
      +- Fix `usize` underflow in `--list-languages` when `--terminal-width` is smaller than the longest language name, see #3812 (@greymoth-jp)
       
       ## Other
       - Use git version of cross. See #3533 (@OctopusET)
      diff --git a/src/bin/bat/main.rs b/src/bin/bat/main.rs
      index 1d89f8e..c8bbd36 100644
      --- a/src/bin/bat/main.rs
      +++ b/src/bin/bat/main.rs
      @@ -152,7 +152,14 @@ pub fn get_languages(config: &Config, cache_dir: &Path) -> Result<String> {
               let comma_separator = ", ";
               let separator = " ";
               // Line-wrapping for the possible file extension overflow.
      -        let desired_width = config.term_width - longest - separator.len();
      +        // Clamp instead of subtracting: a tiny `--terminal-width` (smaller than the
      +        // longest language name) would otherwise underflow `usize` and wrap to a huge
      +        // value, silently disabling wrapping (and panicking in debug/overflow-checked
      +        // builds). Mirrors the `saturating_sub` fix applied to `print_snip` in #3804.
      +        let desired_width = config
      +            .term_width
      +            .saturating_sub(longest)
      +            .saturating_sub(separator.len());
       
               let style = if config.colored_output {
                   Green.normal()
    author_description: |
      Mirrors #3804 to its remaining sibling site.

      #3804 hardened `print_snip` with `saturating_sub` after #3803 reported a `capacity overflow` panic at `--terminal-width 1` (the `term_width - panel_count - title_count` subtraction underflowing `usize`). That fix covered the snip renderer. The `--list-languages` renderer has the identical `term_width - X - Y` shape and was left unhardened:

      `src/bin/bat/main.rs:155`
      ```rust
      let desired_width = config.term_width - longest - separator.len();
      ```

      Unlike the `term_width -` sites in `printer.rs` (356/418/731/810), this one sits outside the panel-disable guard at `printer.rs:261`, so nothing clamps it. `bat --list-languages --terminal-width 1` underflows.

      Honest scope: in debug / overflow-checked builds this panics (exit 101). In release the subtraction wraps, and since `desired_width` only feeds a `>=` comparison it silently yields wrong column layout rather than crashing. Same class as #3804, narrowed to the language list, latent since the code was introduced.

      Verified both directions on a standalone replica of the arithmetic: the old form panics (debug) / wraps to wrong output (release), the patched form is clean, and the two are byte-identical at a normal width (100), so there is zero behavior change away from the edge case. `saturating_sub` is the minimal change and matches the precedent set by #3804.
  assert:
    - type: javascript
      value: file://assertions/pr.cjs:proportionateLength
      config: { maxWords: 555 }
      metric: proportionality
    - *coverage
    - *restraint

- description: caddy-7936
  # Carries a real before/after benchmark (ns/op, B/op, allocs/op) - direct grounding for
  # "quote the number behind the claim". The repo's own Assistance Disclosure ("No AI was used")
  # is boilerplate and is stripped from the ground truth used for grading, below.
  vars:
    fixture: caddy-7936
    note: 'profiling showed an allocation on the hot path nobody actually uses most of the time'
    diff: |
      diff --git a/modules/caddyhttp/replacer.go b/modules/caddyhttp/replacer.go
      index 65f9dd4..c510938 100644
      --- a/modules/caddyhttp/replacer.go
      +++ b/modules/caddyhttp/replacer.go
      @@ -57,7 +57,6 @@ func NewTestReplacer(req *http.Request) *caddy.Replacer {
       
       func addHTTPVarsToReplacer(repl *caddy.Replacer, req *http.Request, w http.ResponseWriter) {
       	SetVar(req.Context(), "start_time", time.Now())
      -	SetVar(req.Context(), "uuid", new(requestID))
       
       	httpVars := func(key string) (any, bool) {
       		if req != nil {
      @@ -213,8 +212,14 @@ func addHTTPVarsToReplacer(repl *caddy.Replacer, req *http.Request, w http.Respo
       				return time.Since(start).Seconds() * 1e3, true // multiply seconds to preserve decimal (see #4666)
       
       			case "http.request.uuid":
      -				// fetch the UUID for this request
      -				id := GetVar(req.Context(), "uuid").(*requestID)
      +				// fetch the UUID for this request, generating and caching it
      +				// on first access so requests that never reference the UUID
      +				// don't pay for the allocation
      +				id, ok := GetVar(req.Context(), "uuid").(*requestID)
      +				if !ok {
      +					id = new(requestID)
      +					SetVar(req.Context(), "uuid", id)
      +				}
       
       				// set it to this request's access log
       				extra := req.Context().Value(ExtraLogFieldsCtxKey).(*ExtraLogFields)
      diff --git a/modules/caddyhttp/replacer_test.go b/modules/caddyhttp/replacer_test.go
      index 4f8d8f0..b77b599 100644
      --- a/modules/caddyhttp/replacer_test.go
      +++ b/modules/caddyhttp/replacer_test.go
      @@ -296,3 +296,42 @@ func TestHTTPProtoNameNormalization(t *testing.T) {
       		}
       	}
       }
      +
      +// BenchmarkAddHTTPVarsToReplacer measures the per-request replacer setup, which
      +// is the common path where the request UUID is never referenced.
      +func BenchmarkAddHTTPVarsToReplacer(b *testing.B) {
      +	req := httptest.NewRequest(http.MethodGet, "http://example.com/foo?a=b", nil)
      +	req.Header.Set("User-Agent", "test-agent")
      +	ctx := context.WithValue(req.Context(), VarsCtxKey, make(map[string]any))
      +	ctx = context.WithValue(ctx, ExtraLogFieldsCtxKey, new(ExtraLogFields))
      +	req = req.WithContext(ctx)
      +
      +	b.ReportAllocs()
      +	for b.Loop() {
      +		repl := caddy.NewReplacer()
      +		addHTTPVarsToReplacer(repl, req, nil)
      +	}
      +}
      +
      +// TestHTTPVarReplacementUUID verifies the lazily-allocated request UUID is
      +// generated on first access and stays stable across references.
      +func TestHTTPVarReplacementUUID(t *testing.T) {
      +	req := httptest.NewRequest(http.MethodGet, "http://example.com/", nil)
      +	repl := caddy.NewReplacer()
      +	ctx := context.WithValue(req.Context(), caddy.ReplacerCtxKey, repl)
      +	ctx = context.WithValue(ctx, VarsCtxKey, make(map[string]any))
      +	ctx = context.WithValue(ctx, ExtraLogFieldsCtxKey, new(ExtraLogFields))
      +	req = req.WithContext(ctx)
      +	addHTTPVarsToReplacer(repl, req, nil)
      +
      +	first, ok := repl.GetString("http.request.uuid")
      +	if !ok || first == "" {
      +		t.Fatalf("expected a non-empty uuid, got %q (ok=%t)", first, ok)
      +	}
      +
      +	second, _ := repl.GetString("http.request.uuid")
      +	if first != second {
      +		t.Errorf("expected stable uuid across references: %q != %q", first, second)
      +	}
      +}
      +
    author_description: |
      addHTTPVarsToReplacer ran SetVar(ctx, "uuid", new(requestID)) for every request during replacer setup, allocating a *requestID unconditionally even though it is only ever read by the {http.request.uuid} placeholder. The UUID value itself was already generated lazily (requestID.String caches on first call), but the container was not.

      Allocate the *requestID on first access instead: the uuid placeholder now creates and stores it in the request's vars table when absent, so repeated references within a request still share one instance (and thus one UUID), while requests that never reference the UUID pay nothing.

      Add a benchmark for the per-request replacer setup and a regression test for the uuid placeholder, which previously had no coverage.

      Benchmark (BenchmarkAddHTTPVarsToReplacer, linux/arm64, count=6), common path where the UUID is never referenced:

          before: ~700 ns/op   352 B/op   9 allocs/op
          after:  ~690 ns/op   336 B/op   8 allocs/op

      One 16-byte allocation removed per request; a GC-pressure win rather than a latency one.
