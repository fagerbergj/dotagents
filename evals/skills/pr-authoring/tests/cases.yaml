    author_description: |
      Leaving Scroll mode (to Normal or Locked) snapped the active pane back to the bottom. Switching panes means leaving Scroll mode, so that reset is what made it impossible to keep one pane scrolled up to read from while working in another.

      Follows the discussion in https://github.com/zellij-org/zellij/issues/638.

      ## Fix

      Remove the implicit scroll reset in `Screen::change_mode`. Scroll position is already per-pane and survives focus changes, so with the reset gone the position is simply kept. It was also redundant: the scroll keymap already binds an explicit `ScrollToBottom` on exit (`Ctrl c`), so following live output stays one keypress away, while a plain exit (`Ctrl s`) now preserves the position.

      This does not reintroduce the scroll-buffer overwrite that buffering guards against: output is buffered while a pane `is_scrolled`, independent of input mode, and every path that clears scroll already replays the buffered events, so a pane catches up to live output the moment it is scrolled back to the bottom.

      Added a `screen_tests` snapshot test asserting the pane stays scrolled after a Scroll to Normal transition.

      ## Open question

      #638 literally asks to be "placed in scroll mode again" when returning to the pane. This implements the underlying goal (the position is no longer lost) without re-entering scroll mode, which fits the current per-client mode model better than making mode per-pane. If you would rather keep the old default and put this behind a config option, that is a small change and I can do that instead.
