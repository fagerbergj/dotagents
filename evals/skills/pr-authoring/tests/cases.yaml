# One case per point on the size range - a one-line icon swap through an
# eleven-file refactor - because "scaled to the size of the change" is the claim
# under test. Every diff is a real commit from a working repository with the
# author's own commit message and PR title stripped: the model writes from the
# diff and one line of a developer's context, never from the author's wording.
#
# `maxWords` is a ceiling on the whole answer (title + description) and is
# house-calibrated, not derived from any published standard: it exists because a
# template dumped on a one-line diff is a failure this suite has actually seen.
# There is no floor - nothing published endorses a minimum length, and brevity
# that fits the change is the judges' call. Length alone cannot see padding that
# fits under the ceiling; the `pr_quality` restatement criterion catches that.

- description: ui-icon-swap-one-line
  vars:
    note: 'tiny one - the trash can was the odd control out, everything else in the app removes with an X'
    diff: |
      diff --git a/frontend/src/components/MemoryEntry.tsx b/frontend/src/components/MemoryEntry.tsx
      index 95567ba..94bf1bb 100644
      --- a/frontend/src/components/MemoryEntry.tsx
      +++ b/frontend/src/components/MemoryEntry.tsx
      @@ -151,7 +151,7 @@ export function MemoryEntry({ memory, onForget }: MemoryEntryProps) {
                   title="Forget this memory"
                   className="w-7 h-7 flex items-center justify-center rounded text-gray-400 hover:text-red-500 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors"
                 >
      -            <span aria-hidden="true">🗑</span>
      +            <span aria-hidden="true">✕</span>
                 </button>
               )}
             </div>
  assert:
    - type: javascript
      value: file://assertions/pr.cjs:proportionateLength
      config: { maxWords: 105 }
      metric: proportionality
    # Shared unchanged across every real case - individually anchored so each
    # case can append it to its own distinct proportionality config above.
    # what_and_why is gone: 19 of its 20 rows sat at exactly 1.00 and every
    # question it asked is asked again by items 1-3 below.
    - &pr_quality
      type: llm-rubric
      # A rubric only ever sees {{output}} and {{rubric}}, and this suite disables
      # templating, so a {{note}} in the value below reaches the judge as those
      # eight literal characters. Carry it in a tag of its own instead.
      rubricPrompt:
        - role: user
          content: |
            <AuthorNote>{{note}}</AuthorNote>
            <Output>{{output}}</Output>
            <Rubric>{{rubric}}</Rubric>
      value: |
        The author's own note about the change is in <AuthorNote> above.

        A reviewer is about to review a code change and has seen nothing of it
        but this pull request. Judge the pull request as delivered: do not
        reward or penalise how it was built, which features it used, or whether
        it followed any particular authoring convention.

        Answer each of the six below with a quote from the pull request, or
        NONE. Answer all six before scoring.

        1. What the change does and why it was made, with a first line that says
           specifically what is being done, written as though it were an order.
           "Fix bug" is NONE.
        2. The problem the change solves. Where it claims an optimisation or a
           trade-off, quote the number behind the claim; an asserted improvement
           with no number is NONE.
        3. Something the diff does not already show. Restating the changed file
           list, narrating the hunks, or paraphrasing the code back is NONE,
           however well written.
        4. A claim specific to this change that the reviewer could check, rather
           than a statement true of changes in general.
        5. How the change was verified, concretely enough that the reviewer
           could repeat it. Treat this as a house standard rather than
           conformance to anything published.
        6. Detail matched to the size of the change: quote either the section
           that earns its length on a large change, or - on a one-line change -
           the whole description, which counts as satisfying this item when it
           is short. This is also a house standard, and a short description of a
           small change is not a fault on its own.

        Score from 0 to 1, never above 1: award 0.167 for each of the six you
        answered with a quote, and nothing for each NONE.
      threshold: 0.7
      metric: pr_quality

