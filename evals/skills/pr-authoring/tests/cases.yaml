- description: wire-compat-fix
  vars:
    note: 'if we ever roll a deploy back the old binary re-sends every steer someone already got, putting the old field back on the wire'
    diff: |
      diff --git a/internal/dag/control.go b/internal/dag/control.go
      index 15f6792..04a35cc 100644
      --- a/internal/dag/control.go
      +++ b/internal/dag/control.go
      @@ -65,6 +65,19 @@ func (m *queuedMsg) UnmarshalJSON(b []byte) error {
       	return nil
       }
      
      +// MarshalJSON also writes the legacy Delivered bool so a row written here and
      +// read back by an OLDER binary (a rollback) is not seen as still-queued and
      +// re-delivered to the node.
      +func (m queuedMsg) MarshalJSON() ([]byte, error) {
      +	return json.Marshal(struct {
      +		ID        string
      +		Text      string
      +		Status    MsgStatus
      +		Delivered bool
      +		CreatedAt time.Time
      +	}{m.ID, m.Text, m.Status, m.Status != MsgQueued, m.CreatedAt})
      +}
      +
       func newMsgID() string {
       	b := make([]byte, 8)
       	_, _ = rand.Read(b)
      diff --git a/internal/dag/control_test.go b/internal/dag/control_test.go
      index b30afb6..0705806 100644
      --- a/internal/dag/control_test.go
      +++ b/internal/dag/control_test.go
      @@ -528,3 +528,34 @@ func TestQueuedMsg_StatusTransitions(t *testing.T) {
       		}
       	})
       }
      +
      +// A row written by this binary must stay correct when an OLDER binary reads it
      +// back after a rollback: without the legacy bool it would look still-queued and
      +// be re-delivered to the node.
      +func TestQueuedMsg_MarshalKeepsLegacyDeliveredForRollback(t *testing.T) {
      +	for _, tc := range []struct {
      +		status MsgStatus
      +		want   bool
      +	}{{MsgQueued, false}, {MsgForwarded, true}, {MsgDrained, true}} {
      +		b, err := json.Marshal(queuedMsg{ID: "m1", Text: "hi", Status: tc.status})
      +		if err != nil {
      +			t.Fatalf("marshal(%s): %v", tc.status, err)
      +		}
      +		var old struct {
      +			ID        string
      +			Text      string
      +			Delivered bool
      +		}
      +		if err := json.Unmarshal(b, &old); err != nil {
      +			t.Fatalf("old-binary unmarshal(%s): %v", tc.status, err)
      +		}
      +		if old.Delivered != tc.want {
      +			t.Errorf("status %s -> old Delivered = %v, want %v (rollback would re-deliver)", tc.status, old.Delivered, tc.want)
      +		}
      +		// And the new shape must still round-trip through our own decoder.
      +		var back queuedMsg
      +		if err := json.Unmarshal(b, &back); err != nil || back.Status != tc.status {
      +			t.Errorf("round-trip(%s) = %q, err %v", tc.status, back.Status, err)
      +		}
      +	}
      +}
  assert:
    - type: javascript
      value: file://assertions/pr.cjs:proportionateLength
      config: { maxWords: 175 }
      metric: proportionality
    - *pr_quality

