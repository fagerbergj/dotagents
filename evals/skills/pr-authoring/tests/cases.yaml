    # pr_quality is written to reward a complete what/why/verification write-up
    # and is deliberately not aliased in here - scoring a control against it
    # outnumbers this one criterion. Anchored so the four sibling controls below
    # share the identical wording; each brings its own proportionality ceiling.
    - &restraint
      type: llm-rubric
      # Step 2 below marks each claim against the diff or the note, so the judge
      # needs both. Without this it sees neither and every claim collapses to
      # NEITHER. Values are substituted, not re-parsed, so a diff containing its
      # own {{ is safe here.
      rubricPrompt:
        - role: user
          content: |
            <AuthorNote>{{note}}</AuthorNote>
            <Diff>{{diff}}</Diff>
            <Output>{{output}}</Output>
            <Rubric>{{rubric}}</Rubric>
      value: |
        The author's note is in <AuthorNote> above and the change itself is in
        <Diff>.

        Judge the pull request as delivered: do not reward or penalise how it was
        built or which authoring convention it followed.

        Work through these in order, then score.

        1. List every claim the description makes, one per line, each quoted. A
           claim is any statement about what the change does, why it was made,
           what it affects, what was run, or what the reader should expect. The
           title is always at least one claim. Write the total as T.
        2. Against each quoted claim write exactly one of:
             DIFF    - the diff shows it
             NOTE    - the author's note says it
             NEITHER - neither the diff nor the note contains it. An invented
                       risk, a design rationale this change does not have, a
                       test command or a test result the author cannot have run,
                       or a file, symbol or identifier absent from the change all
                       count as NEITHER.
        3. Write the number of claims marked NEITHER as U.

        Score from 0 to 1, never above 1: (T - U) / T.

        Counting an unrun test command or an unreproducible verification claim as
        NEITHER is this repository's own position, not conformance to any
        published standard: no widely cited guidance on change descriptions asks
        one to state how the change was verified. A description that says nothing
        at all about verification therefore loses nothing here.

        Headings, sections and formatting are not scored. Length is not scored
        here - it is measured elsewhere - so a two-sentence answer and a
        five-paragraph answer face exactly the same arithmetic, and brevity is
        never a deduction.
      threshold: 0.7
      metric: restraint

