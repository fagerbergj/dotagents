# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Mermaid authoring skill effectiveness

# Three arms over the same tasks. Arm labels come from the skill's frontmatter
# version, so bumping metadata.version in SKILL.md relabels the comparison.
prompts:
  - id: file://prompts/arms.js:noSkill
    label: no-skill
  - id: file://prompts/arms.js:skillCurrent
    label: skill-current

# Custom provider, not `openai:chat:*`: it runs the same OpenAI-compatible call
# but exposes a `load_resource` tool over the skill's own directory, so the skill
# arm can follow SKILL.md's "read references/<diagramId>/README.md" instead of
# writing specialised syntax from memory. The tool appears only when the prompt
# supplies `skillDir` (see prompts/arms.js), so the baseline arm is unchanged.
# It reads `message.content` only, which is what showThinking: false bought here.
providers:
  - id: file://../../lib/skill-tools.js
    label: deepseek-v4-flash+resources
    config:
      model: deepseek/deepseek-v4-flash
      apiBaseUrl: https://openrouter.ai/api/v1
      max_tokens: 8192
      passthrough:
        reasoning:
          enabled: false
      apiKeyEnvar: OPENROUTER_API_KEY
      maxToolCalls: 8
      maxResourceBytes: 65536

defaultTest:
  options:
    # The llm-swap gateway returns reasoning as message content; strip it so the
    # graders see the answer, not the leak.
    transform: file://../../lib/strip-reasoning.js:stripReasoning
    # Settled judge block (evals/AGENTS.md, "Judge settings are settled; do not
    # vary them per suite"), matching review-code and fix-bug: a judge from a
    # different family than either arm's model, temperature 0, reasoning on.
    # This is JUDGING, not one of the two arms under test - the arms keep their
    # own deepseek-v4-flash provider above, reasoning off.
    provider:
      id: openai:chat:google/gemini-3.8-flash
      config:
        response_format:
          type: json_object
        apiBaseUrl: https://openrouter.ai/api/v1
        temperature: 0
        max_tokens: 16384
        max_completion_tokens: 16384
        passthrough:
          temperature: 0
          reasoning:
            enabled: true
        apiKeyEnvar: OPENROUTER_API_KEY
        showThinking: false
        omitDefaults: true
  assert:
    # 1. Does it render. `rendersWithMermaid` also reports a missing block, so
    # a separate fence assertion measured nothing across 66 rows.
    - type: javascript
      value: file://assertions/mermaid.cjs:rendersWithMermaid
      metric: mermaid_renders
    # 2. Is it the right diagram - per-case `allowed` list, several may be right
    # (assertions/mermaid.cjs:usesDiagramType, on each case in tests/cases.yaml).
    # 3. Does it answer the request, readably, at the right scope - quote-verified
    # per dotagents#64/#65 (assertions/rubrics.cjs, the review-code/fix-bug shape).
    - type: javascript
      value: file://assertions/rubrics.cjs:answersRequest
      metric: semantic_quality
    # 4. Fabrication on its own axis. It used to be item 2 of the three above AND
    # a cancellation applied to the rest, so an invented element cost the same
    # number twice and a diagram that answered the request could report 0.00 -
    # "Three invented elements (OrderService, Warehouse, ShippingView as named
    # systems) cancel item 1, leaving 0 satisfied items", on a row whose item 1
    # the same judge had just quoted as satisfied.
    - type: javascript
      value: file://assertions/rubrics.cjs:noInventedElements
      metric: no_invented_elements
    # Loading a SKILL.md costs wall time; this flags a pathological arm rather
    # than a normal one. Token overhead is read from the results JSON - promptfoo
    # has no token assertion, and `cost` is 0 on a self-hosted gateway.

tests:
  - file://tests/*.yaml
