# Each case is a real document with real mess in it, plus the way its author
# actually asked. The ask never says what is wrong with the document, never
# names a formatting rule, and never uses the skill's vocabulary: knowing what
# to fix is what is being graded.

- description: heading levels - runbook with two titles and skipped levels
  vars:
    ask: "wrote this runbook between two meetings and it shows. it goes in the team wiki tomorrow, can you make it presentable? not attached to how it's laid out."
    rubric: |
      The runbook has one title, its sections sit under it in order, and no step or sentence has been added, dropped, or reworded.
    document: |
      # Deploy Runbook
      ### Prerequisites
      You need the CLI installed and a token with deploy access.
      ##### Token scopes
      The token needs deploy:write and logs:read. Ask an admin if yours is missing either.
      # Steps
      Run the deploy from a clean checkout, then watch the logs until the health check goes green.
      ### Rollback
      Roll back by redeploying the previous tag. There is no separate rollback command.
  assert:
    # "scannability" and "clean visual rendering" - the part no parser settles.
    # Anchored here and aliased by the eight other cases that hand over a messy
    # document. The three negative controls do NOT carry it: items 1 and 2 pay
    # for shortening a prose run and for moving prose into a heading or list,
    # and on an already-clean document the right answer is to do neither -
    # exactly what unchanged_when_clean fines. Scored over all twelve, the
    # fenced-commands control lost 0.40 here for leaving a run it was right to
    # leave, in the same row where unchanged_when_clean scored it 1.00.
    #
    # Four countable items, each quoted before it is scored: bands ("one soft
    # spot", "largely as it arrived") wandered between identical runs. The fifth
    # item, "it is still the same document", is CUT: `preserved` computes the
    # same property against the input by rendering both through markdown-it, so
    # the judge was being asked to re-guess a fact already decided. The one
    # zero-gate left is "no document came back at all", which is how the
    # baseline arm most often fails.
    - &readability
      type: llm-rubric
      value: |
        The reader below handed over a Markdown document and asked for it back in better
        shape. Score the document they received.

        Judge the document as delivered. Do not reward or penalise how it was built, which
        features it used, or whether it followed any particular authoring convention. Which
        bullet character or emphasis delimiter it uses, and how its blank lines fall, are
        graded elsewhere and are not your concern. What a reader sees is.

        Answer each of the four below by quoting the part of the delivered document that
        supports it, or answer NONE. Answer all four before scoring.

        1. The longest run of unbroken prose in the delivered document is shorter than the
           longest run in the document the reader handed over. Quote the first line of each.
           If the document handed over held no run of prose a reader would want broken up,
           answer N/A and count this item as satisfied.
        2. At least one piece of content that was prose in the original is now carried by a
           heading, list, or table. Quote it in both forms, or answer NONE if nothing moved.
           If the original already carried its content in headings, lists, tables or code,
           answer N/A and count this item as satisfied.
        3. Every heading in the delivered document names what is under it, so a reader
           choosing where to jump does not have to read the section to find out. Quote the
           one that names its content least well.
        4. Nothing would render broken: quote any fence, table, link definition, or inline
           HTML that a renderer would not handle, or answer NONE - NONE satisfies this item.

        Whether content was added or lost is not yours to judge and is graded elsewhere
        against the original; do not mark the document down for it.

        Score from 0 to 1, never above 1: award 0.25 for each of the four satisfied, where
        N/A counts as satisfied. If no document was delivered at all - advice, or a list of
        suggested changes instead of the document - score 0 regardless of the four.

        The restraint the reader is entitled to, specifically: {{rubric}}
      threshold: 0.7
      metric: readability
      rubricPrompt:
        - role: system
          content: 'You grade a document against a rubric. Reply with one line of JSON and nothing else: {"reason": string, "pass": boolean, "score": number}. Never emit a newline inside the JSON.'
        - role: user
          content: "<Original>\n{{document}}\n</Original>\n<Delivered>\n{{output}}\n</Delivered>\n<Rubric>\n{{rubric}}\n</Rubric>"

- description: ragged lists - onboarding checklist with three bullet characters
  vars:
    ask: "hey - onboarding checklist below, it looks like garbage on the intranet. sort it out for me?"
    rubric: |
      Every checklist item is still there and still says the same thing, and the nesting reads the way it was meant.
    document: |
      ## Onboarding checklist
      Before your first day:
      * Get your laptop from IT
      + Set up two-factor authentication
      - Clone the main repository
          * Install the toolchain
             - Run the test suite once end to end
      Ask your onboarding buddy if anything here is unclear.
  assert:
    - *readability

- description: unlabeled fences - release notes with three bare code blocks
  vars:
    ask: "Release notes for 2.4.0. These go up on the docs site within the hour and they are the first thing customers will see about this version. See what you can do with them."
    rubric: |
      All three commands and the config snippet are byte-for-byte what they were, and each block is recognisable as the kind of thing it is.
    document: |
      # Release 2.4.0
      ## Install
      ```
      npm install acme@2.4.0
      ```
      ## Configure
      ```
      {
        "retries": 3,
        "timeout": "30s"
      }
      ```
      ## Verify
      ```
      acme --version
      acme doctor --strict
      ```
  assert:
    - *readability

- description: broken table - rate limits with ragged pipes
  vars:
    ask: "our rate limit page - support keeps pointing people at it. give it a pass before i publish?"
    rubric: |
      The table has the same three endpoints with the same limits and bursts, and the note after it is still a note and not a table row.
    document: |
      # Rate limits
      | Endpoint | Limit | Burst |
      |---|-----|-|
      | `/search` | 60/min | 10 |
      |`/upload`|5/min|2|
      |   `/status`   |   unlimited   |   n/a   |
      Notes: limits are counted per API key, not per user.
  assert:
    - *readability

- description: stray HTML - incident note with inline tags and a details block
  vars:
    ask: "incident note for the postmortem thread. half of it came out of an email so there's junk in it. make it look like something i'd actually post in #incidents"
    rubric: |
      The impact, cause and both source links are intact, and the collapsible sources block would still expand and render its list.
    document: |
      # Incident 2026-04-02<br>
      <b>Impact:</b> checkout was unavailable for 22 minutes.<br>
      <i>Cause:</i> a config push that pointed the payment client at staging.
      <details><summary>Sources</summary>
      - [Status page](https://status.example.com/incidents/2026-04-02)
      - [Postmortem](https://docs.example.com/postmortems/checkout-april)
      </details>
  assert:
    - *readability

- description: reference links - weekly digest with link definitions at the bottom
  vars:
    ask: "weekly digest, goes to the whole eng org in about 20 minutes. give it a once-over so it doesn't look sloppy?"
    rubric: |
      Every link still points where it pointed and still reads the way it read.
    document: |
      # Weekly digest
      Two things shipped this week: the [new search index][search] and the [billing export][billing].
      The rollout notes are in [the handbook][handbook], and the API reference lives at https://api.example.com/docs
      [search]: https://github.com/acme/search/pull/1180
