- description: no title - status page with several sections and no H1
  vars:
    ask: "internal status snapshot, goes in the ops channel every morning. what would you do with it"
    rubric: |
      The document was not given a title it never had, and each service still reports the same status.
    document: |
      ## API
      All endpoints are healthy. Latency is within normal range.
      #### Search
      Search is degraded. Reindexing is running and should finish by 18:00 UTC.
      ## Billing
      Invoicing is healthy. Card capture is healthy.
