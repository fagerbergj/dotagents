- description: negative control - a document that is already clean
  vars:
    ask: "someone asked me to double check this before it goes out. here it is - do whatever you think it needs."
    rubric: |
      This document was already in good shape. The right answer changes almost nothing about it.
    document: |
      # Cache invalidation

      The cache is keyed by tenant and resource. Invalidation is explicit: nothing expires on a timer.

      ## When entries are dropped

      - **Write-through** - a successful write replaces the cached value in the same request.
      - **Explicit purge** - the admin API drops every key under a tenant prefix.
      - **Deploy** - a new build starts with a cold cache by design.

      ## Purging a tenant

      ```bash
      acme cache purge --tenant acme-corp
      ```

      The command is idempotent and safe to run during traffic. See the [operations guide](https://docs.example.com/ops/cache) for the failure modes.
  assert:
    - &unchanged_when_clean
      type: javascript
      value: file://assertions/format.cjs:renderedUnchanged
      config: { minimum: 0.9 }
      metric: unchanged_when_clean

- description: negative control - already clean, and mostly a table
  vars:
    ask: "this is what ops reads when someone asks how long we keep things. give it a once-over before i link it in the channel."
    rubric: |
      This document was already in good shape. The right answer changes almost nothing about it.
    document: |
      # Retention windows

      Each row is the authority for how long a store keeps data before the nightly prune job deletes it.

      | Store | Window | Deleted by |
      | --- | --- | --- |
      | `runs` | 90 days | nightly prune job |
      | `run_events` | 30 days | nightly prune job |
      | `artifacts` | 400 days | nightly prune job |
      | `audit_log` | 7 years | by hand, on a written request |

      A row under legal hold is skipped by the job and stays until the hold is lifted. See the [retention policy](https://docs.example.com/legal/retention) for who can place one.
  assert:
    - *unchanged_when_clean

- description: negative control - already clean, and mostly fenced commands
  vars:
    ask: "key rotation steps for the runbook. anything you'd do to it before i paste it in?"
    rubric: |
      This document was already in good shape. The right answer changes almost nothing about it.
    document: |
      # Rotating the signing key

      Rotation is two commands and a restart. Run them on the primary; replicas pick the new key up from the shared secret store within a minute.

      ## Generate the key

      ```bash
      acme keys generate --alg ed25519 --out /etc/acme/signing-2026-09.pem
      ```

      ## Publish it

      ```bash
      acme keys publish /etc/acme/signing-2026-09.pem --activate-at 2026-09-01T00:00:00Z
      ```

      The previous key stays valid for verification until it expires, so tokens signed before the switch keep working.

      ## Roll back

      ```bash
      acme keys activate signing-2026-08
      ```
  assert:
    - *unchanged_when_clean
