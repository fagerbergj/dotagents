- description: scannability - long support policy written as three walls of text
  vars:
    ask: "This is the support policy page. Nobody reads it, and I am fairly sure the reason is how it looks rather than what it says. Can you do something about that before I point people at it again."
    rubric: |
      Every fact, version number and date is exactly as it was. Nothing has been summarised away and nothing has been invented to pad a section out.
    document: |
      # Support policy
      We support the current major version and the one before it. Version 3.x receives security fixes and bug fixes until 2027-06-30, version 2.x receives security fixes only until 2026-12-31, and version 1.x is out of support as of 2025-09-30 with no further releases planned of any kind. Customers on version 1.x who need a fix must first upgrade to a supported line, and we will help plan that upgrade at no cost if you contact support before your renewal date.
      Support requests are triaged by severity. A severity one incident means a production outage with no workaround and gets a response within one hour at any time of day or night, a severity two means a major feature is unusable and gets a response within four business hours, a severity three means degraded behaviour with a workaround and gets a response within one business day, and a severity four covers questions and feature requests and gets a response within three business days. Severity is assigned by our on-call engineer and can be raised on request if the impact has been misjudged.
      Enterprise plans add a named technical account manager, a quarterly review of open issues, and a private escalation channel that bypasses the general queue. Standard plans use the public support portal only. Neither plan includes custom patch backports to unsupported versions, which is the single most common request we have to turn down, and the answer does not change with contract size.

