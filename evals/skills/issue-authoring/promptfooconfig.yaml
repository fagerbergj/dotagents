# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Issue authoring skill effectiveness

# Three arms over the same tasks. Arm labels come from the skill's frontmatter
# version, so bumping metadata.version in SKILL.md relabels the comparison.
prompts:
  - id: file://prompts/arms.js:noSkill
    label: no-skill
  - id: file://prompts/arms.js:skillCurrent
    label: skill-current

providers:
  # Custom provider, not `openai:chat:*`: same OpenAI-compatible call, plus a
  # `load_resource` tool over the skill's own directory so the skill arm can
  # follow SKILL.md's instructions to read its bundled files. The tool exists
  # only when the prompt supplies `skillDir` (see prompts/arms.js), so the
  # baseline arm sends no `tools` key and is called exactly as before.
  - id: file://../../lib/skill-tools.js
    label: deepseek-v4-flash+resources
    config:
      model: deepseek/deepseek-v4-flash
      apiBaseUrl: https://openrouter.ai/api/v1
      max_tokens: 8192
      passthrough:
        reasoning:
          enabled: false
      apiKeyEnvar: OPENROUTER_API_KEY
      # Two references totalling 10.5 KB, and step 2 picks exactly one by work type.
      # 12 KB fits both if it wants them; 4 rounds covers a wrong guess and a listing.
      maxToolCalls: 4
      maxResourceBytes: 12288

defaultTest:
  options:
    # The llm-swap gateway returns reasoning as message content; strip it so the
    # graders see the issue, not the leak. There is no fence to anchor on, so
    # cut everything before the first heading or title label, then drop a
    # leading conversational line so a bare first-line title is the title.
    transform: file://../../lib/strip-reasoning.js:stripReasoning
    provider:
      id: openai:chat:deepseek/deepseek-v4-flash
      config:
        # json_object, not json_schema - the latter makes promptfoo pre-parse the
        # reply into an object, which the grader then rejects as 'not a string'.
        response_format:
          type: json_object
        apiBaseUrl: https://openrouter.ai/api/v1
        max_tokens: 8192
        max_completion_tokens: 8192
        passthrough:
          reasoning:
            enabled: false
        apiKeyEnvar: OPENROUTER_API_KEY
        showThinking: false
        omitDefaults: true
  assert:
    # 1. Is the context in the issue the context the report actually supplied.
    #    A set difference against the input, so it stays in JavaScript.
    - type: javascript
      value: file://assertions/issue.cjs:noInventedFacts
      metric: no_invented_facts
    # 2. The four properties the description claims, shared across every case.
    #    Case-specific grading is the separate case_fidelity rubric below, so
    #    a scope property is not scored on the context axis at quarter weight.
    - type: llm-rubric
      value: |
        The write-up below was produced from this raw report:
        "{{report}}"

        Judge the issue as delivered. Do not reward or penalise how it was
        built, which features it used, or whether it followed any particular
        authoring convention. Score from 0 to 1, never above 1.

        Answer each of the four below with a quote from the write-up, or NONE. Answer all
        four before scoring.

        1. Clear outcome: quote the sentence a reader could restate as what will be true when
           this is done, and quote the title. A title naming a category rather than an
           outcome, or a write-up that only restates the complaint, is NONE.
        2. Bounded scope: quote the text that keeps this to what the report raised - or,
           where something a reader might assume is excluded, the text saying so. A write-up
           that fans one report into unrelated work is NONE.
        3. Sufficient context: quote the facts an engineer who has never seen the report would
           need to start. Separately, list every cause, frequency, count of affected users,
           environment, timing, or reproduction step in the write-up that the report above
           does not contain. A detail offered as an explicitly marked assumption, hypothesis,
           or open question does not go on this list.
        4. Testable completion: quote a completion condition someone could settle by observing
           the system - an event, a count, a state, a message. A condition needing someone's
           opinion to settle ("satisfied", "improved", "works properly") is NONE. A condition
           naming an observable result counts even when it contains ordinary words like "no
           errors across 20 consecutive runs".

        Score from 0 to 1, never above 1: award 0.25 for each of the four you answered with a
        quote, then subtract 0.25 for each invention listed under item 3, floored at 0.
      threshold: 0.7
      metric: semantic_quality
    # 3. The case's own property, scored on its own axis rather than folded
    #    into one of the four above.
    - type: llm-rubric
      value: |
        The reply below was produced from this raw report:
        "{{report}}"

        {{rubric}}
      threshold: 0.7
      metric: case_fidelity
    - type: latency
      threshold: 120000

tests:
  - file://tests/*.yaml
