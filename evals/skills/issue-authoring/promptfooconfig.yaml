# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Issue authoring skill effectiveness

# Three arms over the same tasks. Arm labels come from the skill's frontmatter
# version, so bumping metadata.version in SKILL.md relabels the comparison.
prompts:
  - id: file://prompts/arms.js:noSkill
    label: no-skill
  - id: file://prompts/arms.js:skillCurrent
    label: skill-current

providers:
  # Custom provider, not `openai:chat:*`: same OpenAI-compatible call, plus a
  # `load_resource` tool over the skill's own directory so the skill arm can
  # follow SKILL.md's instructions to read its bundled files. The tool exists
  # only when the prompt supplies `skillDir` (see prompts/arms.js), so the
  # baseline arm sends no `tools` key and is called exactly as before.
  - id: file://../../lib/skill-tools.js
    label: deepseek-v4-flash+resources
    config:
      model: deepseek/deepseek-v4-flash
      apiBaseUrl: https://openrouter.ai/api/v1
      max_tokens: 8192
      passthrough:
        reasoning:
          enabled: false
      apiKeyEnvar: OPENROUTER_API_KEY
      # Two references totalling 10.5 KB, and step 2 picks exactly one by work type.
      # 12 KB fits both if it wants them; 4 rounds covers a wrong guess and a listing.
      maxToolCalls: 4
      maxResourceBytes: 12288

defaultTest:
  options:
    # The llm-swap gateway returns reasoning as message content; strip it so the
    # graders see the issue, not the leak. There is no fence to anchor on, so
    # cut everything before the first heading or title label, then drop a
    # leading conversational line so a bare first-line title is the title.
    transform: file://../../lib/strip-reasoning.js:stripReasoning
    # Judge settings are settled, not per-suite (evals/AGENTS.md):
    # google/gemini-3.8-flash, temperature 0, reasoning on under `passthrough`.
    # Sampling left at the default, or a judge sharing the reviewed model's own
    # family, measurably raised run-to-run noise on review-code (dotagents#65).
    provider:
      id: openai:chat:google/gemini-3.8-flash
      config:
        response_format:
          type: json_object
        apiBaseUrl: https://openrouter.ai/api/v1
        temperature: 0
        max_tokens: 16384
        max_completion_tokens: 16384
        passthrough:
          temperature: 0
          reasoning:
            enabled: true
        apiKeyEnvar: OPENROUTER_API_KEY
        showThinking: false
        omitDefaults: true
  assert:
    # 1. Is the context in the issue the context the report actually supplied.
    #    A set difference against the input, so it stays in JavaScript.
    - type: javascript
      value: file://assertions/issue.cjs:noInventedFacts
      metric: no_invented_facts
    # 2. semantic_quality is NOT here. It grades a write-up against the three
    #    properties the description claims, which is the wrong question to ask of
    #    the Jira negative control, where the right answer is to refuse to write
    #    a ticket at all. It now rides on the ten positive cases, anchored in
    #    tests/cases.yaml as *semantic; the control is graded by case_fidelity
    #    alone, whose items were written for it.
    #
    # 3. The case's own property: quote-verified per-item (dotagents#64/#65
    #    pattern; see skills/review-code/assertions/review.cjs). The old
    #    llm-rubric asked the judge to both find the answer AND compute a 0-to-1
    #    score with subtractions in one completion - the exact failure #64
    #    documents (one unchanged metric scored 0.00 then 0.75 across two runs).
    #    Items and weights now live per-case in tests/cases.yaml (`rubric`,
    #    `weights`); this assertion only supplies the judge call and the
    #    report-fact context.
    - type: javascript
      value: file://assertions/quality.cjs:caseFidelity
      threshold: 0.7
      metric: case_fidelity
    - type: latency
      threshold: 120000

tests:
  - file://tests/*.yaml
