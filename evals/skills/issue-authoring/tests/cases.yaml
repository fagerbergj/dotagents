# Each case is a raw report in the voice of whoever filed it - a Slack one-liner,
# a forwarded ticket, a retro board, a paste. The task never names a tracker
# field, a section, or an authoring rule: turning the mess into something
# startable and finishable is what is graded. `report` is the only input the
# graders treat as fact.
#
# `rubric` is the case's own numbered yes/no items, graded quote-verified by the
# case_fidelity assertion in promptfooconfig.yaml (dotagents#64/#65 pattern: the
# judge must quote or say NONE per item, code verifies the quote is real, code -
# not the judge's own arithmetic - computes the score from `weights`). Token-level
# invention (a version, a path, an error code the report never had) is graded
# separately and deterministically by `no_invented_facts`; these items grade only
# what the report's own prose supports.

- description: GitHub - vague bug complaint with no reproduction
  vars:
    tracker: GitHub Issues
    source: Dropped in the support channel just now.
    report: |
      export button does nothing again no spinner no error nothing happened twice today steph got it yesterday too cant get it to do it on demand chrome
    weights: { "1": 0.4, "2": 0.3, "3": 0.3 }
    rubric: |
      1. States what the export button currently does (or fails to do) and what it
         should do instead, in observable terms, without asserting a cause or trigger
         the report never states.
      2. Carries forward that nobody can trigger the failure on demand, rather than
         presenting an invented reliable reproduction recipe.
      3. Gives at least one completion condition a person could settle by watching the
         system rather than by forming an opinion.
  assert:
    # One report, one work item, unless the report genuinely held several.
    - &bounded
      type: javascript
      value: file://assertions/issue.cjs:oneBoundedIssue
      metric: bounded_scope
    # The properties the description claims, on the ten cases where a ticket is
    # the right answer. It used to live in defaultTest.assert and so also graded
    # the Jira negative control, where writing a plausible ticket is the failure.
    #
    # Three items, not four. The old item 2 restated `bounded_scope` above, which
    # already counts work items against a per-case window - a judge guessing at
    # the same property for a quarter of an unrelated score. Token-level invention
    # is `no_invented_facts`, computed against the report itself; the per-case
    # `case_fidelity` items below grade prose-shaped fidelity only. Neither
    # belongs in this number.
    - &semantic
      type: javascript
      value: file://assertions/quality.cjs:semanticQuality
      threshold: 0.7
      metric: semantic_quality

- description: Jira - crash pasted from a forwarded support ticket
  vars:
    tracker: Jira
    source: Support forwarded this and asked if we know what it is.
    report: |
      fwd from support - any idea what this is? they get it every night since tuesday

          [nightly] tenant=acme start=02:00:12
          Error: ENOENT: no such file or directory, open '/var/lib/billing/templates/invoice_default.hbs'
              at renderInvoice (src/billing/render.js:88:19)
              at processTenant (src/billing/nightly.js:142:7)
          [nightly] tenant=acme aborted, dashboard got a 500

          $ billing-api --version
          3.7.1

      stopped when they put 3.6.4 back on
    weights: { "1": 0.4, "2": 0.3, "3": 0.3 }
    rubric: |
      1. Names the failing nightly run and the missing template file.
      2. States the failure is tied to release 3.7.1 and absent on 3.6.4, without
         describing the rolled-back release as a fix.
      3. States who is affected and the consequence of leaving it, without asserting
         a root cause the report only observed.
  assert: [*bounded, *semantic]

- description: Linear - feature wish written as the solution
  vars:
    tracker: Linear
    source: Our PM sent this over DM.
    report: |
      hey - can we get a dropdown next to the search box on the project list to filter by team? multi select ideally. sarah brought it up in the QBR again. we're at 60-odd projects now and everyone only ever cares about their own four or five
    weights: { "1": 0.45, "2": 0.3, "3": 0.25 }
    rubric: |
      1. States the problem as the subject - that people cannot find the handful of
         projects they care about among 60-odd - rather than opening with the
         mechanism.
      2. Marks the multi-select dropdown as the requester's suggestion, not as the
         required design.
      3. Gives completion conditions describing what a person can do afterwards,
         rather than which control was built.
  assert: [*bounded, *semantic]

- description: Azure DevOps - performance gripe with no numbers in it
  vars:
    tracker: Azure DevOps
    source: Came up in standup and I said I would write it down.
    report: |
      reporting dashboard is so slow now. it was fine before. maybe since the two big accounts came on? people literally go make coffee while it loads. nobody has actually timed it, we just all know
    weights: { "1": 0.35, "2": 0.35, "3": 0.3 }
    rubric: |
      1. Does NOT assert a current load time as fact - the report supplies no
         measurement of any kind.
      2. Does NOT assert a target load time as an established figure rather than as
         a threshold still to be agreed.
      3. States establishing the current behaviour - a measurement, a baseline - as
         part of the work, rather than jumping straight to a fix.
  assert: [*bounded, *semantic]

- description: GitHub - one braindump that is really three unrelated asks
  vars:
    tracker: GitHub Issues
    source: A maintainer posted this the day before going on leave.
    report: |
      dumping this before i go, sorry. dark mode - the css variables are all there already, someone just has to wire up the toggle and remember the choice. editor blows up on safari if you paste an image, marco saw it too, we never dug in. and the install page still tells you to run the bootstrap script we deleted in the spring, that one is two minutes
    weights: { "1": 0.4, "2": 0.3, "3": 0.3 }
    rubric: |
      1. Keeps each of the three asks' own specifics - dark mode's existing style
         variables and remembering the choice; the Safari paste failure and the
         second person who saw it; the stale bootstrap instruction and how small it
         is - rather than dropping or merging them.
      2. Keeps the three asks independent: each could be finished and shipped
         without either of the others shipping first.
      3. Splits the three by outcome rather than by activity or by layer.
  assert:
    - type: javascript
      value: file://assertions/issue.cjs:oneBoundedIssue
      config: { min: 2, max: 3 }
      metric: bounded_scope
    - *semantic

- description: Jira - NEGATIVE CONTROL, nothing here to write an issue from
  vars:
    tracker: Jira
    source: Account management forwarded this, in full.
    report: |
      FYI - customer says it didn't work and they are not happy. can someone take a look today? thanks
    weights: { "1": 0.5, "2": 0.2, "3": 0.3 }
    rubric: |
      This report names no product, no behaviour, no failure, and no customer. A
      fresh implementer could not say what is broken or what would have to become
      true.

      1. Does NOT deliver a ticket as though it could be worked - no invented product
         area, symptom, severity, or customer, no matter how well written or how
         carefully hedged. A plausible-looking write-up here is itself the failure.
      2. States plainly that this cannot be written up yet.
      3. Asks at least two specific questions that would unblock it.
  # No *semantic here: semantic_quality grades a ticket against the description's
  # claims, the wrong question on the case where refusing to write one is correct.

- description: Linear - half-remembered bug, specifics genuinely uncertain
  vars:
    tracker: Linear
    source: Posted in the engineering channel a week after the fact.
    report: |
      meant to write this up ages ago. staging i think? two tuesdays back maybe. i was uploading one of the big supplier sheets and got an error page, 500 or 502, honestly cant remember which. tried again and it went straight through. might have been mid deploy. probably worth someone checking whether we dropped anything
    weights: { "1": 0.35, "2": 0.35, "3": 0.3 }
    rubric: |
      Four things in this report are explicitly uncertain: which environment, which
      day, which of two status codes, and whether a deploy was running.

      1. Keeps the environment and the day marked as uncertain, not stated as settled
         fact.
      2. Keeps the status code and the deploy timing marked as uncertain, not stated
         as settled fact.
      3. States the suggested check - whether anything was lost - as work someone can
         carry out.
  assert: [*bounded, *semantic]

- description: Azure DevOps - open question nobody has looked into yet
  vars:
    tracker: Azure DevOps
    source: Copied off yesterday's retro board.
    report: |
      - monday am the job queue backs up for about an hour then clears on its own
      - been like this a month at least
      - ops bounce the workers, nobody knows if that is what fixes it
      - theories on the board: the weekly report batch / cache cold after sunday maintenance / autoscaler too slow to react
      - nobody has actually looked
    weights: { "1": 0.35, "2": 0.35, "3": 0.3 }
    rubric: |
      Nobody has investigated this, so the work is to find something out, not to
      change something.

      1. States the question to be answered, rather than committing to a fix.
      2. Keeps all three theories - the weekly report batch, the cold cache, the slow
         autoscaler - intact and unpicked, rather than building the ticket around one.
      3. Names what the team will hold when the work is done - a finding, an answer,
         a decision, a recommendation.
  assert: [*bounded, *semantic]

- description: GitHub - install docs send a real user down the wrong path
  vars:
    tracker: GitHub Issues
    source: A user left this on an old thread.
    report: |
      followed the getting started page, doesn't work. it says copy config.example.yml to config.yml then run setup - but setup overwrites config.yml so everything you put in it is gone. took me an hour to work out you have to run setup first and edit after. love the tool otherwise
    weights: { "1": 0.4, "2": 0.3, "3": 0.3 }
    rubric: |
      1. Names the wrong instruction ordering - not the setup tool's overwrite
         behaviour - as the subject: what the page currently instructs, and what it
         should instruct instead.
      2. Records the corrected ordering the user worked out (run setup first, edit
         after) as what the page should say.
      3. Gives a completion condition someone could settle by following the page as
         written.
  assert: [*bounded, *semantic]

- description: Jira - a wish that came out of a daily annoyance
  vars:
    tracker: Jira
    source: One of our designers said this while I watched her work.
    report: |
      every single time i log a session i type today's date in again. every time. eight or nine of those a day and it is always today, sometimes yesterday if i am catching up. it is not a big thing but it is a thousand paper cuts, and i have put the wrong month in more than once without noticing
    weights: { "1": 0.35, "2": 0.35, "3": 0.3 }
    rubric: |
      1. States what she does now and how often.
      2. States the consequence - wrong dates entered without noticing - rather than
         only the repetition or a general convenience.
      3. Gives at least one completion condition checkable by observation, without
         inventing a time saving or an error rate the report never gave.
  assert: [*bounded, *semantic]

- description: Linear - flaky test everyone has learned to rerun
  vars:
    tracker: Linear
    source: This has been sitting in the CI channel for weeks.
    report: |
      can we PLEASE do something about test_checkout_applies_promo. red about one run in five, only on CI, never locally. everyone just hits rerun now which is exactly how we are going to miss a real one. gut feel is a timing thing in the fixture but i have not actually looked
    weights: { "1": 0.35, "2": 0.3, "3": 0.35 }
    rubric: |
      1. States the consequence that habitual reruns risk hiding a genuine failure -
         this is internal work, and it earns its place only by stating why it matters.
      2. States both facts about the failure pattern: intermittent, and only on CI,
         never locally.
      3. Keeps the timing hypothesis marked as a guess rather than asserted as the
         cause, and expresses completion as an observable run outcome rather than as
         "the test is fixed".
  assert: [*bounded, *semantic]
