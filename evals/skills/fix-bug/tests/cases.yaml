- description: 'chi#1067 - httpFancyWriter.ReadFrom double-counts bytes written when a Tee writer is set'
  vars:
    fixture: chi-1085
    title: 'httpFancyWriter.ReadFrom double-counts bytes written when a Tee writer is set'
    issueBody: |2
      ## Description

      `httpFancyWriter.ReadFrom` in `middleware/wrap_writer.go` double-counts the bytes written when a `Tee` writer is set.

      When `tee != nil`, `ReadFrom` uses `io.Copy(&f.basicWriter, r)` which routes writes through `basicWriter.Write()`. The `Write` method already increments `basicWriter.bytes` on line 112. However, after `io.Copy` returns, `ReadFrom` also adds `n` to `basicWriter.bytes` again on line 212:

      ```go
      func (f *httpFancyWriter) ReadFrom(r io.Reader) (int64, error) {
      	if f.basicWriter.tee != nil {
      		n, err := io.Copy(&f.basicWriter, r)
      		f.basicWriter.bytes += int(n)  // BUG: double-counts, basicWriter.Write already incremented bytes
      		return n, err
      	}
      	// ...non-tee path correctly counts since rf.ReadFrom bypasses basicWriter.Write
      }
      ```

      This causes `BytesWritten()` to return double the actual number of bytes when using `ReadFrom` with a `Tee` writer.

      ## Reproduction

      ```go
      func TestHttpFancyWriterReadFromWithTee(t *testing.T) {
      	original := &httptest.ResponseRecorder{
      		HeaderMap: make(http.Header),
      		Body:      new(bytes.Buffer),
      	}
      	f := &httpFancyWriter{basicWriter: basicWriter{ResponseWriter: original}}

      	var teeBuf bytes.Buffer
      	f.Tee(&teeBuf)

      	input := "hello world"
      	n, err := f.ReadFrom(strings.NewReader(input))
      	// n == 11, err == nil
      	// f.BytesWritten() == 22  -- BUG: should be 11
      }
      ```

      ## Fix

      Remove the redundant `f.basicWriter.bytes += int(n)` line in the tee branch, since `io.Copy` through `basicWriter.Write` already handles byte counting.
    verdict: 'bug'
    rootCause: |2
      The reporter, in the issue: "ReadFrom uses io.Copy(&f.basicWriter, r) which routes writes through basicWriter.Write(). The Write method already increments basicWriter.bytes... However, after io.Copy returns, ReadFrom also adds n to basicWriter.bytes again... This causes BytesWritten() to return double the actual number of bytes when using ReadFrom with a Tee writer."
    fixScope: |2
      1 source file changed (middleware/wrap_writer.go): the redundant `f.basicWriter.bytes += int(n)` line removed from the Tee branch of ReadFrom, 1 line, no new abstractions.
  assert:
    - type: javascript
      value: file://assertions/fixbug.cjs:noInventedFileRefs
      metric: no_invented_file_refs
    - type: javascript
      value: file://assertions/fixbug.cjs:touchesRealFix
      metric: touches_real_fix
    - *root_cause_depth
    - *regression_proof
    - *proportionate_fix

- description: 'mux#534 - CORSMethodMiddleware leaks allowed methods from other routes on a subrouter'
  vars:
    fixture: mux-535
    title: 'CORSMethodMiddleware leaks allowed methods from other routes on a subrouter'
    issueBody: |2
      **Describe the bug**
      When using `CORSMethodMiddleware` in a Subrouter it can add allowed methods from other routes that shouldn't be present.

      The issue seems to be that in `getAllMethodsForRoute` the matcher matches substrings.

      **Versions**
      > Go version: `go version`
      ```
      % go version
      go version go1.12.1 darwin/amd64
      ```

      > package version: run `git rev-parse HEAD` inside the repo

      Sorry, I'm not using the repo of mux, but my `go.mod` has

      `github.com/gorilla/mux v1.7.3`


      **Steps to Reproduce**
      > How can the bug be triggered?

      Create a PathPrefix with a sub router, add two routes with paths where one is a substring of the other. Eg. `/hello` and `/hello/name`. Add different allowed methods to these routes.

      You can see the allowed methods of both routes when requesting the route with the longer path.

      Using the code example below the response header for `/test/hello/name` looks like

      `Access-Control-Allow-Methods: GET,OPTIONS,POST,GET,OPTIONS`

      **Expected behavior**
      > What output or behaviour were you expecting instead?

      I would expect to see only the allowed methods of the route in the `Access-Control-Allow-Methods` which would be `Access-Control-Allow-Methods: GET,OPTIONS`

      **Code Snippets**
      > A minimum viable code snippet can be useful! (use backticks to format it).
      ```golang
      package main

      import (
      	"fmt"
      	"net/http"

      	"github.com/gorilla/mux"
      )

      func Hello(w http.ResponseWriter, r *http.Request) {
      	fmt.Fprint(w, "Hello")
      }

      func HelloName(w http.ResponseWriter, r *http.Request) {
      	fmt.Fprint(w, "Hello")
      }

      func main() {
      	router := mux.NewRouter().StrictSlash(true)

      	subrouter := router.PathPrefix("/test").Subrouter()
      	subrouter.HandleFunc("/hello", Hello).Methods(http.MethodGet, http.MethodOptions, http.MethodPost)
      	subrouter.HandleFunc("/hello/{name}", HelloName).Methods(http.MethodGet, http.MethodOptions)

      	subrouter.Use(mux.CORSMethodMiddleware(subrouter))

      	http.ListenAndServe(":8081", router)
      }

      ```
    verdict: 'bug'
    rootCause: |2
      The reporter's own diagnosis, in the issue: "The issue seems to be that in getAllMethodsForRoute the matcher matches substrings." getAllMethodsForRoute walked every route and tested only its first routeRegexp matcher directly, rather than calling the route's own full Match against the actual request - so a route whose path pattern was a prefix of the requested path (e.g. /hello short-matching a request meant for /hello/name) contributed its methods too, and CORS responses listed methods that did not belong to the matched route.
    fixScope: |2
      1 source file changed (middleware.go): getAllMethodsForRoute rewritten to call route.Match(req, &match) directly for each route instead of manually testing route.matchers, ~15 lines net, no new abstractions.
  assert:
    - type: javascript
      value: file://assertions/fixbug.cjs:noInventedFileRefs
      metric: no_invented_file_refs
    - type: javascript
      value: file://assertions/fixbug.cjs:touchesRealFix
      metric: touches_real_fix
    - *root_cause_depth
    - *regression_proof
    - *proportionate_fix

