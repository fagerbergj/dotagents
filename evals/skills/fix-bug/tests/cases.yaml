      	req2 := httptest.NewRequest("GET", "/api/v2?from=3&to=-5", nil)
      	out2 := httptest.NewRecorder()

      	r.ServeHTTP(out2, req2)

      	fmt.Println(out2.Code)

      }
      ```

      Result is
      ```go
       404
      ```


      **Expected behavior**
      Both cases should end in only 404-s


      …
    verdict: 'bug'
    rootCause: |2
      Derived directly from the accepted diff's own comment in route.go (no maintainer prose explains it elsewhere): "Multiple routes may share the same path but use different HTTP methods... The router must handle these cases correctly... For a GET request to '/users/abc' with 'id' as '-2', the router should return a 'Not Found' error as no route fully matches this request." Trying the POST route first set match.MatchErr to ErrMethodMismatch and left it set; the GET route's own subsequent query-mismatch was then reported using that stale ErrMethodMismatch (405) instead of the correct ErrNotFound (404).
    fixScope: |2
