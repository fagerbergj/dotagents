# Real bug-fix commits, each pinned at the fix's PARENT commit so the model
# has to produce the fix rather than read it (see lib/bugfix-fixtures.js).
#
# 20 fixtures: 18 real bugs across Python (flask, jinja, click), TypeScript
# (vue), and Go (cobra, chi, gorilla/mux, echo, urfave/cli), plus 2 negative
# controls. The controls - requests-7006 and echo-3052 - have no source fix at
# all and carry `"fix": null` in bugfix-fixtures.json, which is what puts
# touches_real_fix on its inverted branch (a control with a fix SHA and empty
# sourceFiles scores 0 forever, including for the correct answer;
# assertions/fixbug.test.cjs pins the shape). requests-7006's traceback
# fingerprints the reporter's own environment, not a defect in requests;
# echo-3052's "bug" is a maintainer-acknowledged surprising-but-intended
# default (quoted in its rootCause) whose accepted PR touches only
# group_test.go - tests, no source change. Two of the 18, cobra-2285 and
# click-3055, double as restraint cases: their accepted fix is a 1-2 line
# change to one file, so the correct answer stays that small.
# Every issue and PR quoted as ground truth was authored by a human
# (user.type == "User"), checked individually against the GitHub API, not a
# bot - including a check of issue/PR body text for an AI-authorship
# disclosure, which excluded two otherwise-qualifying labstack/echo PRs
# ("Generated with Claude Code") that would have made their own ground truth
# circular.
#
# `rootCause` and `fixScope` are the ground truth the three rubric metrics
# below are judged against. Where an authentic human quote exists (the
# reporter's own diagnosis, or the fix author's PR description) it is quoted
# verbatim, not paraphrased - paraphrasing would put my reading of the bug
# between the real explanation and the judge. Where no such quote exists
# (chi-1029), that is stated explicitly and the synopsis is a plain
# description of the accepted diff instead of an invented attribution.
#
# Metric triage (evals/AGENTS.md's standing rule): no_invented_file_refs and
# touches_real_fix are javascript graders computed against the fixture's own
# tree and the withheld diff - grounded in fetched input, not prose-matched -
# and are kept as regression guards even though no_invented_file_refs sits
# near ceiling in both arms; a hallucinated file path is rare but the guard is
# free (no judge call) and catches the requests-7006/echo-3052 cases where the
# correct move is citing nothing. root_cause_depth and proportionate_fix were
# considered for a MERGE (both judge the fix's substance) but kept separate:
# chi-1029's own rows show them diverging in the same output (a fix graded
# 1.0 for naming the mechanism and 0.0 for landing in the wrong file), so
# collapsing them into one score would erase a real distinction rather than
# remove a redundant one. regression_proof is grounded in a declared house
# position (Fowler's "Self-Testing Code") and kept.
#
# {{/{% sequences quoted from real Go text/template and Jinja syntax inside
# vars below are written as `{ {` / `{ %` (space-broken), matching this
# suite's own top note about nunjucks parsing a real diff's literal braces -
# rubricPrompt's {{issueBody}} etc. render even with PROMPTFOO_DISABLE_TEMPLATING
# set (graders are exempt from that flag per evals/AGENTS.md), so an unbroken
# {{ inside issueBody would be live template syntax at grading time, not just
# at prompt time. Untested here whether nunjucks would actually re-parse a
# substituted value's contents; breaking the sequence removes the question.

- description: 'flask#6096 - IPv6 addresses parsed incorrectly because of .partition'
  vars:
    fixture: flask-6096
    title: 'IPv6 addresses parsed incorrectly because of `.partition(":")`?'
    issueBody: |2
      Hi, I checked the code and saw that two places use `.partition(":")` on addresses, and IPv6 addresses contain ":".

      This breaks 1. `session_transaction` value setting, and 2. `Flask.run()` if `SERVER_NAME` is set. I've already prepared two tests that fail, you can use them to reproduce:

      1. In `test_testing.py`
      ```
      def test_session_transaction_ipv6(app):
          base_url = "http://[::1]:8000/"
          client = app.test_client()

          @app.get("/")
          def index():
              return str(flask.session.get("value"))

          with client.session_transaction(base_url=base_url) as sess:
              sess["value"] = 42

          assert client.get("/", base_url=base_url).text == "42"
      ```

      2. Add one case to `test_run_from_config`
      ```
      (None, None, "[::1]:8080", "::1", 8080),
      ```

      Is this known and intended? I could send the patches for these two places.
    verdict: 'bug'
    rootCause: |2
      The reporter, who also wrote the fix: "I checked the code and saw that two places use `.partition(":")` on addresses, and IPv6 addresses contain `:`. This breaks 1. `session_transaction` value setting, and 2. `Flask.run()` if `SERVER_NAME` is set."
    fixScope: |2
      2 source files changed (src/flask/app.py, src/flask/testing.py), both call sites of the same broken parsing pattern switched to `urllib.parse.urlsplit`, no new abstractions.
