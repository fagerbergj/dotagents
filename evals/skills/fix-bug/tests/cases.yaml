    - *proportionate_fix

- description: 'core#15113 - Watchers created during an async setup() are never stopped on the server, leaking the whole app'
  vars:
    fixture: vue-15114
    title: 'Watchers created during an async setup() are never stopped on the server, leaking the whole app'
    issueBody: |2
      ### Vue version

      3.5.40

      ### Steps to reproduce

      originally reported in https://github.com/nuxt/nuxt/issues/30782

      1. create an options API component with an `async setup()`, a `computed` property that reads shared module-level state, and a `watch` on that
      2. render it on the server and then mutate the shared state after the render is done
      3. see that the watcher is still active on the server

      **Reproduction**
      ```ts
      test('options-api watchers should not be created for async setup components', async () => {
        const open = ref(true)
        const spy = vi.fn()

        const App = defineComponent({
          setup: () => Promise.resolve({}),
          computed: {
            isOpen() {
              return open.value
            },
          },
          watch: {
            isOpen: spy,
          },
          render() {
            return h('div', String(this.isOpen))
          },
        })

        const html = await renderToString(createSSRApp(App))
        expect(html).toBe('<div>true</div>')

        // mutating the state after the request is done should not trigger the watcher
        open.value = false
        await nextTick()
        expect(spy).not.toHaveBeenCalled()
      })
      ```

      ### What is expected?

      the same behavior as with a synchronous setup: regular watchers declared via the `watch` option don't run during SSR and don't survive the render

      mutating the shared state after `renderToString` resolves should not trigger anything

      ### What is actually happening?

      when `setup()` returns a `Promise`, the `watch` option creates a live watcher on the server that is never stopped

      if this subscribes to state that **outlives the request**, it keeps the **entire component instance (and app) reachable forever**

      ### System Info

      ```shell

      ```

      ### Any additional comments?

      _No response_
    verdict: 'bug'
    rootCause: |2
      From the fix's own PR description: "When setup() returns a Promise, the watch option creates a live watcher on the server that is never stopped... if this subscribes to state that outlives the request, it keeps the entire component instance (and app) reachable forever." The flag that suppresses watcher creation during SSR setup was only held active around the synchronous branch of setupStatefulComponent; the async .then(handleSetupResult(...)) callback that handles a Promise-returning setup() ran later, outside that flag's scope, so Options API `watch` entries on such a component were registered as live watchers on the server instead of being skipped.
    fixScope: |2
      1 source file changed (packages/runtime-core/src/component.ts): the SSR-setup-state flag now set/reset around the async .then() callback's call to handleSetupResult too, matching the synchronous path, ~5 lines, no new abstractions.
  assert:
    - type: javascript
      value: file://assertions/fixbug.cjs:noInventedFileRefs
      metric: no_invented_file_refs
    - type: javascript
      value: file://assertions/fixbug.cjs:touchesRealFix
      metric: touches_real_fix
    - *root_cause_depth
    - *regression_proof
    - *proportionate_fix
