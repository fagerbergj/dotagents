- description: 'chi#843 - Router hangs (infinite loop / goroutine leak) when Mount()ed onto itself'
  vars:
    fixture: chi-1159
    title: 'Router hangs (infinite loop / goroutine leak) when Mount()ed onto itself'
    issueBody: |2
      I was implementing an HTTP server for my service and noticed that when I use 'chi' as shown below, the router does not respond to undefined routes. Additionally, I suspect the router gets stuck in an infinite loop, leading to a memory leak in the service.

      ```go
      package main

      import (
      	"fmt"
      	"github.com/go-chi/chi/v5"
      	"github.com/go-chi/chi/v5/middleware"
      	"net/http"
      	_ "net/http/pprof"
      )

      func main() {
      	r := chi.NewRouter().With(middleware.Logger)
      	r.Mount("/", r.Group(func(r chi.Router) {
      		r.Get("/ping", func(writer http.ResponseWriter, request *http.Request) {
      			writer.WriteHeader(http.StatusOK)
      			writer.Write([]byte("pong"))
      		})
      	}))

      	fmt.Println("%v", http.ListenAndServe(":8080", r))
      }
      ```

      For the above-mentioned code, `GET /ping` request will be handled properly, but router never returns a response for an undefined request path.
    verdict: 'bug'
    rootCause: |2
      From the fix's own PR description: "With() and Group() return a new inline *Mux that shares the same underlying tree pointer as the original router rather than copying it... a request that doesn't match /ping falls through to the same '/*' mount node, calls the same mountHandler, recomputes the same RoutePath, and re-enters routing with zero state change - an infinite loop that pins one goroutine per bad request forever."
    fixScope: |2
      1 source file changed (mux.go): a panic guard added in Mount(), checking tree-pointer identity (subr.tree == mx.tree) before wiring the mount, ~7 lines, no new abstractions.
