- description: 'echo#2775 - HTML5 static middleware serves index.html over a real 404 from a matched API handler'
  vars:
    fixture: echo-3043
    title: 'HTML5 static middleware serves index.html over a real 404 from a matched API handler'
    issueBody: |2
      Hello,

      I've encountered a situation which seems to be a bug to me.

      In the following code, I set up the static middleware with HTML5 param to true so I can have my SPA embedded. In my API, I could have endpoints that would return legit 404 (id not found in database, whatever..) but when this happens, it conflicts with the static middleware (because of `HTML5: true`). It would catch the error and return the `index.html` with a 200 instead of a JSON with a 404 that could be handled by the SPA.

      Is this intended? Would you have suggestions? Thanks :)

      ```
      package main

      import (
      	"embed"
      	"errors"
      	"log/slog"
      	"net/http"

      	"github.com/labstack/echo/v4"
      	"github.com/labstack/echo/v4/middleware"
      )

      //go:embed all:dist
      var ui embed.FS

      func main() {
      	// Echo instance
      	e := echo.New()

      	// Middleware
      	e.Use(middleware.Logger())
      	e.Use(middleware.Recover())

      	// Serve static files
      	e.Use(middleware.StaticWithConfig(middleware.StaticConfig{
      		HTML5:      true,
      		Root:       "dist",
      		Filesystem: http.FS(ui),
      	}))

      	// Routes
      	api := e.Group("/api")
      	api.GET("/test/:id", func(c echo.Context) error {
      		id := c.Param("id")
      		if id == "3" {
      			return echo.NewHTTPError(http.StatusNotFound, "not found")
      		}
      		return c.String(http.StatusOK, "ID: "+id)
      	})

      	// Start server
      	if err := e.Start(":8080"); err != nil && !errors.Is(err, http.ErrServerClosed) {
      		slog.Error("failed to start server", "error", err)
      	}
      }
      ```
    verdict: 'bug'
    rootCause: |2
      From the fix's own PR description: "Preserves 404 responses from matched handlers when HTML5 static fallback is enabled, while retaining the index fallback for router misses." The static middleware's error handling treated any echo.HTTPStatusCoder with a 404 status the same way, whether it came from the router failing to match a route at all or from an application handler that matched successfully and deliberately returned 404 (e.g. `echo.NewHTTPError(http.StatusNotFound, "not found")` for a missing database record) - both fell through to serving config.Index, so a real API 404 was silently replaced with the SPA's index page and a 200.
    fixScope: |2
      1 source file changed (middleware/static.go): the HTML5 fallback branch now also checks whether the current context actually has a matched route (c.Path() != "" && c.RouteInfo().Method != echo.RouteNotFound) before falling back to serving the index file, ~4 lines, no new abstractions.
