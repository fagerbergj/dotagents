- description: 'jinja#2032 - ImmutableSandboxedEnvironment does not block clear()/pop() on mutable sequences (lists)'
  vars:
    fixture: jinja-2033
    title: 'ImmutableSandboxedEnvironment does not block clear()/pop() on mutable sequences (lists)'
    issueBody: |2
      I happened to notice in using `ImmutableSandboxedEnvironment` that the default `modifies_known_mutable` check seems to be missing coverage for a couple of methods. In particular the `clear` and `pop` methods are checked for both `MutableMapping` and `MutableSet` but not `MutableSequence`.

      Example:
      ```python
      from jinja2.sandbox import ImmutableSandboxedEnvironment

      env = ImmutableSandboxedEnvironment()
      print(env.from_string("{ { [1].pop() }}").render())
      ```

      Expected: `SecurityError` should be raised
      Actual: `1` is printed

      Environment:

      - Python version: 3.10
      - Jinja version: 3.1.4
    verdict: 'bug'
    rootCause: |2
      The reporter, in the issue: "the default modifies_known_mutable check seems to be missing coverage for a couple of methods. In particular the clear and pop methods are checked for both MutableMapping and MutableSet but not MutableSequence." The sandbox's per-type table of disallowed mutating method names included "clear" and "pop" for MutableMapping and MutableSet, but the MutableSequence (list-like) entry omitted both, so a sandboxed template could call `[1].pop()` or `some_list.clear()` and silently mutate state the sandbox exists to protect.
    fixScope: |2
      1 source file changed (src/jinja2/sandbox.py): "clear" and "pop" added to the existing frozenset of disallowed method names for abc.MutableSequence, 1 line, no new abstractions.
