- description: 'cli#2373 - Order of shell completion subcommands in help output is non-deterministic'
  vars:
    fixture: cli-2374
    title: 'Order of shell completion subcommands in help output is non-deterministic'
    issueBody: |2
      ## My urfave/cli version is

      [v3.10.0](https://github.com/urfave/cli/releases/tag/v3.10.0) (the bug was introduced in [v3.9.1](https://github.com/urfave/cli/releases/tag/v3.9.1))

      ## Checklist

      - [x] Are you running the latest v3 release? The list of releases is [here](https://github.com/urfave/cli/releases).
      - [x] Did you check the manual for your release? The v3 manual is [here](https://cli.urfave.org/v3/getting-started/)
      - [x] Did you perform a search about this problem? Here's the [GitHub guide](https://help.github.com/en/github/managing-your-work-on-github/using-search-to-filter-issues-and-pull-requests) about searching.

      ## Dependency Management

      - My project is using go modules.

      ## Describe the bug

      The order of the shell completion subcommands (`bash`, `zsh`, `fish`, `pwsh`) in help output is non-deterministic across process runs.

      `completion` was changed in #2279 (commit e8afe93601d05d891ad44ad846288ee352142a0b, released in [v3.9.1](https://github.com/urfave/cli/releases/tag/v3.9.1)) to expose each shell as its own subcommand. Those subcommands are generated by ranging over the `shellCompletions` map in `buildCompletionCommand` (`completion.go`):

      ```go
      for shell, render := range shellCompletions {
          cmd.Commands = append(cmd.Commands, buildShellCompletionSubcommand(shell, render, appName))
      }
      ```

      Go randomizes map iteration order per process, so the order of these subcommands — and therefore the `COMMANDS:` section of `completion --help` — changes between runs.

      This breaks downstream projects that generate documentation from `--help` output and commit it (e.g. via CI). The generated docs flip-flop depending on which run produced them, creating spurious diffs and noise commits.

      ## To reproduce

      ```go
      package main

      import (
      	"context"
      	"os"

      	cli "github.com/urfave/cli/v3"
      )

      func main() {
      	cmd := &cli.Command{
      		Name:                  "app",
      		EnableShellCompletion: true,
      	}
      	_ = cmd.Run(context.Background(), []string{"app", "completion", "--help"})
      	_ = os.Stdout
      }
      ```

      Build the binary and run `app completion --help` several times (each run is a separate process). The order of the commands under `COMMANDS:` varies.

      It can also be reproduced directly with a small test that builds the completion command repeatedly across `go test` invocations; the subcommand name order is usually `bash,zsh,fish,pwsh` but occasionally `pwsh,bash,zsh,fish`, etc.

      ## Observed behavior

      The completion subcommands appear in a random order that differs between process runs, e.g. one run prints:

      ```
      COMMANDS:
         bash  Output bash completion script
         zsh   Output zsh completion script
         fish  Output fish completion script
         pwsh  Output pwsh completion script
      ```

      and another run prints:

      ```
      COMMANDS:
         pwsh  Output pwsh completion script
         bash  Output bash completion script
         zsh   Output zsh completion script
         fish  Output fish completion script
      ```

      ## Expected behavior

      The completion subcommands should appear in a fixed, deterministic order (e.g. `bash, zsh, fish, pwsh`) on every run, so that help output and any documentation generated from it are stable.

      ## Additional context

      Real-world impact (CI repeatedly committing reordered docs): https://github.com/suzuki-shunsuke/ghtkn/pull/454

      The fix is to iterate over an explicitly ordered list of shells instead of ranging over the map.

      <img width="909" height="160" alt="Image" src="https://github.com/user-attachments/assets/1352c89a-75f3-4a42-90ba-0e003cf2afd8" />

      ## Want to fix this yourself?

      Yes — I'll open a PR.

      ## Run `go version` and paste its output here

      ```
      go version go1.26.4 darwin/arm64
      ```

      ## Run `go env` and paste its output here

      ```
      GOOS=darwin
      GOARCH=arm64
      GOVERSION=go1.26.4
      CGO_ENABLED=1
      ```
    verdict: 'bug'
    rootCause: |2
      From the issue (and the fix's own PR description, verbatim the same text): "Go randomizes map iteration order per process, so the order of these subcommands - and therefore the COMMANDS: section of completion --help - changed between runs. This breaks downstream projects that generate documentation from --help output and commit it via CI: the generated docs flip-flop depending on which run produced them."
    fixScope: |2
      1 source file changed (completion.go): an explicitly ordered slice (completionShells) added and iterated for display order instead of ranging over the shellCompletions map directly - the map stays as the renderer registry - ~6 lines, no new abstractions.
