      value: file://assertions/fixbug.cjs:noInventedFileRefs
      metric: no_invented_file_refs
    - type: javascript
      value: file://assertions/fixbug.cjs:touchesRealFix
      metric: touches_real_fix
    - *root_cause_depth
    - *regression_proof
    - *proportionate_fix

- description: 'cobra#2356 - Completions modify os.Args'
  vars:
    fixture: cobra-2356
    title: 'Completions modify os.Args'
    issueBody: |2
      I'm trying to workaround https://github.com/spf13/cobra/issues/1877 by inspecting `os.Args` by hand. In some cases cobra accidentally inserts `--` into `os.Args`.

      Minimal example:
      ```go
      package main

      import (
      	"os"
      	"strings"

      	"github.com/spf13/cobra"
      )

      func main() {
      	cmd := &cobra.Command{
      		TraverseChildren: true,
      		ValidArgsFunction: func(cmd *cobra.Command, args []string, toComplete string) ([]cobra.Completion, cobra.ShellCompDirective) {
      			cobra.CompErrorln(strings.Join(os.Args[1:], ", "))
      			return nil, cobra.ShellCompDirectiveDefault
      		},
      	}
      	if err := cmd.Execute(); err != nil {
      		panic(err)
      	}
      }

      ```

      Expected behaviour:
      ```console
      $ go run . __complete x
      [Debug] [Error] __complete, x
      :0
      Completion ended with directive: ShellCompDirectiveDefault
      ```

      Actual behaviour:
      ```console
      $ go run . __complete x
      [Debug] [Error] __complete, --
      :0
      Completion ended with directive: ShellCompDirectiveDefault
      ```
    verdict: 'bug'
    rootCause: |2
      From the fix's own PR description: "getCompletions() accidentally mutates os.Args by writing "--" into the shared backing array via an append with spare capacity... finalArgs is a sub-slice of the original args (derived from os.Args[1:]), and if it has spare capacity in its backing array, append writes "--" directly into the shared memory rather than allocating a new slice."
    fixScope: |2
      1 source file changed (completions.go): the trimmed args slice is copied into a fresh backing array before the later append, a handful of lines, no new abstractions.
  assert:
    - type: javascript
      value: file://assertions/fixbug.cjs:noInventedFileRefs
      metric: no_invented_file_refs
    - type: javascript
      value: file://assertions/fixbug.cjs:touchesRealFix
      metric: touches_real_fix
    - *root_cause_depth
    - *regression_proof
    - *proportionate_fix

- description: 'chi#1029 - Duplicate HTTP methods in 405 Allow header'
  vars:
    fixture: chi-1029
    title: 'Duplicate HTTP methods in 405 Allow header'
    issueBody: |2
      It seems like when routes are registered which 'overlap' due to their wildcards, their methods are repeated in the Allow header in 405 responses.

      Minimal runnable example: https://go.dev/play/p/wm5Roz8MSRJ

      ```go
      package main

      import (
      	"fmt"
      	"log"
      	"net/http"
      	"net/http/httptest"

      	"github.com/go-chi/chi/v5"
      )

      func main() {
      	r := chi.NewRouter()

      	r.Post("/article/1-2-3", func(w http.ResponseWriter, r *http.Request) {
      		w.WriteHeader(http.StatusOK)

      	})

      	r.Post("/article/{a}", func(w http.ResponseWriter, r *http.Request) {
      		w.WriteHeader(http.StatusOK)

      	})

      	r.Post("/article/{b}-{c}", func(w http.ResponseWriter, r *http.Request) {
      		w.WriteHeader(http.StatusOK)
      	})

      	r.Post("/article/{b}-{c}-{d}", func(w http.ResponseWriter, r *http.Request) {
      		w.WriteHeader(http.StatusOK)
      	})

      	server := httptest.NewServer(r)
      	defer server.Close()

      	// Send a request with an unsupported method
      	res, err := http.Get(server.URL + "/article/1-2-3")
      	if err != nil {
      		log.Fatal(err)
      	}

      	fmt.Println("Status:", res.Status)
      	fmt.Println("Header:", res.Header)
      }
      ```

      Outputs:

      ```
      Status: 405 Method Not Allowed
      Header: map[Allow:[POST POST POST POST] Content-Length:[0] Date:[Tue, 10 Nov 2009 23:00:00 GMT]]
      ```

      The `POST` value in the `Allow` header is duplicated four times, which seems strange, and I think ideally it would only appear once.
    verdict: 'bug'
    rootCause: |2
      Derived directly from the accepted diff (no maintainer comment was left explaining it in words): findRoute appends every matching method straight onto rctx.methodsAllowed with no de-duplication, so a path matched by more than one overlapping route pattern adds the same HTTP method to the Allow header once per match. NOTE FOR THE GRADER: methodsAllowed is only ever read in one place, methodNotAllowedHandler in mux.go, which writes one Allow header line per entry with no de-duplication of its own either. A theory that names methodNotAllowedHandler's unguarded loop (rather than, or in addition to, findRoute's appends) as the mechanism is naming the same duplication correctly, just from the read side instead of the write side - credit it exactly as you would findRoute. Do not require the word "findRoute" specifically.
    fixScope: |2
      1 source file changed (tree.go): the same one-line guard (skip the append if the method is already present, via the stdlib slices.Contains) added at the two call sites inside findRoute, ~6 lines total. NOTE FOR THE GRADER: a guard at the one call site that actually consumes methodsAllowed - methodNotAllowedHandler in mux.go, deduplicating before (or while) writing the Allow header - fixes the exact same reported symptom with a comparably small, single-file, no-new-abstraction change. Score that placement as proportionate too; do not penalize it for landing in mux.go instead of tree.go. Only penalize a fix that is materially larger than a single small guard (a new type, a rewrite of the traversal, deduplication scattered across multiple files) or that does not actually deduplicate the Allow header's contents.
  assert:
    - type: javascript
      value: file://assertions/fixbug.cjs:noInventedFileRefs
      metric: no_invented_file_refs
    - type: javascript
      value: file://assertions/fixbug.cjs:touchesRealFix
      metric: touches_real_fix
    - *root_cause_depth
    - *regression_proof
    - *proportionate_fix

- description: 'cobra#2285 - command line args should be quoted in generated fish completion script (negative control: keep it small)'
  vars:
    fixture: cobra-2285
    title: 'command line args should be quoted in generated fish completion script'
    issueBody: |2
      more specifically here in [fish_completions.go:56][1]:

      ```fish
      set -l requestComp "%[10]s=0 $args[1] %[3]s $args[2..-1] $lastArg"
      ```

      where the references `$args[1]`, `$args[2..-1]` and `$lastArg` should have been quoted.

      [1]: https://github.com/spf13/cobra/blob/c8a20a16bafa2dc85d304b59b2e677c7f75a73a6/fish_completions.go#L56

      Downstream issue: https://github.com/mikefarah/yq/issues/1502
    verdict: 'bug'
    rootCause: |2
      From the fix's own PR description: "The arguments used for dynamic completions in fish were missing quotes. This resulted in an error when one of the arguments had a `*` in it whose expansion matched no file... Don't quote the first argument as that is the name of the binary."
    fixScope: |2
      NEGATIVE CONTROL - keep this small. 1 source file changed (fish_completions.go), 2 lines net: the whole-string escape is switched to escaping each argument individually before joining. No new file, no new abstraction, no rewrite of the surrounding completion function - a fix that rewrites more than this line is over-engineered for what the defect actually is.
  assert:
    - type: javascript
      value: file://assertions/fixbug.cjs:noInventedFileRefs
      metric: no_invented_file_refs
    - type: javascript
      value: file://assertions/fixbug.cjs:touchesRealFix
      metric: touches_real_fix
    - *root_cause_depth
    - *regression_proof
    - *proportionate_fix

