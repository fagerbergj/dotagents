# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: RFD authoring skill effectiveness

# Two arms over the same tasks. skill-next stays out until a SKILL.next.md
# exists, or it duplicates skill-current and dilutes the judge signal.
prompts:
  - id: file://prompts/arms.js:noSkill
    label: no-skill
  - id: file://prompts/arms.js:skillCurrent
    label: skill-current

providers:
  # Custom provider, not `openai:chat:*`: same OpenAI-compatible call, plus a
  # `load_resource` tool over the skill's own directory so the skill arm can
  # follow SKILL.md's instructions to read its bundled files. The tool exists
  # only when the prompt supplies `skillDir` (see prompts/arms.js), so the
  # baseline arm sends no `tools` key and is called exactly as before.
  - id: file://../../lib/skill-tools.js
    label: deepseek-v4-flash+resources
    config:
      model: deepseek/deepseek-v4-flash
      apiBaseUrl: https://openrouter.ai/api/v1
      max_tokens: 8192
      passthrough:
        reasoning:
          enabled: false
      apiKeyEnvar: OPENROUTER_API_KEY
      # One reference plus one example RFD, 5.4 KB together - the budget is a ceiling
      # on a runaway loop, not a rationing of two small files.
      maxToolCalls: 4
      maxResourceBytes: 8192

defaultTest:
  options:
    # The llm-swap gateway returns reasoning as message content; strip it so the
    # graders see the answer, not the leak. There is no fence to anchor on here,
    # only a preamble talking *about* the request is removed. Bare openers like
    # "Okay," are left alone: a review of a draft legitimately starts that way.
    transform: file://../../lib/strip-reasoning.js:stripReasoning
    # dotagents#64/#65 quote-verified judge, same as review-code's and
    # adr-authoring's: every judged metric in tests/cases.yaml is
    # `type: javascript` and calls assertions/rfd.cjs, which reads this
    # provider block itself (rfd.cjs's judgeProvider) rather than going
    # through promptfoo's own llm-rubric/g-eval. json_object here is inert for
    # those metrics - lib/quoted-items.js sends its own strict ITEMS_SCHEMA on
    # the actual call - but is kept so this provider still works if anything
    # else on the suite reaches for llm-rubric later.
    #
    # Settings are settled, not suite-tuned (evals/AGENTS.md, "Judge settings
    # are settled"): google/gemini-3.8-flash, temperature 0, reasoning enabled
    # under `passthrough` (a bare `reasoning: {enabled}` under `config` is
    # silently dropped). A judge from the reviewer's own family, or sampling
    # left at default, measurably raised run-to-run noise on review-code.
    provider:
      id: openai:chat:google/gemini-3.8-flash
      config:
        response_format:
          type: json_object
        apiBaseUrl: https://openrouter.ai/api/v1
        temperature: 0
        max_tokens: 16384
        max_completion_tokens: 16384
        passthrough:
          temperature: 0
          reasoning:
            enabled: true
        apiKeyEnvar: OPENROUTER_API_KEY
        showThinking: false
        omitDefaults: true
  assert:
    # Every substantive grader is per-case and lives in tests/cases.yaml: what
    # counts as right differs between an unresolved situation and one that is
    # already settled, so a negative control that correctly declines has no
    # framing to grade against a rubric written for an open document. The seven
    # exploratory cases share framing_quality and stays_open; the review cases
    # get finds_the_decision and their own framing_quality; the five negative
    # controls get control_quality.
    #
    # Unnamed, so it guards the run shape without being graded as quality
    # (review-code's review.test.cjs: "latency ... must stay an unnamed
    # run-shape guard, not a graded column"). Loading a SKILL.md costs tokens
    # and time; that overhead is part of what the arm comparison is measuring.
    - type: latency
      threshold: 120000

tests:
  - file://tests/*.yaml
