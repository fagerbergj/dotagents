      # RFD: where product search runs

      Status: Discussion

      ## Background

      Product search is a LIKE query against postgres. p95 is 1.4s on the catalogue table and it degrades every time the catalogue grows. Three teams have filed tickets about it this quarter.

      ## Directions

      ### Managed OpenSearch

      We ran a load test last week against a copy of the catalogue: p95 came back at 40ms at twice current query volume. Quoted at about $1,900/month at that shape. Operationally it is someone else's cluster, which is a plus, and also means we cannot tune it past what the service exposes.

      ### Postgres full-text search

      Stays in the database we already run and back up, so no new operational surface and no new bill. Whether tsvector holds up at our catalogue size is not something we have measured. Ranking quality is the other open question - nobody here has compared it against what we would get out of OpenSearch, and that comparison is a day's work if someone wants it.

      ### Self-hosted Typesense

      Small and fast by reputation, permissively licensed, and we would be the ones running it, which puts a new thing on someone's on-call. Untested here too; the memory footprint at our document count is the number we would need before this is a real option.

      ## Open questions

