- description: negative control - already decided, only needs recording
  vars:
    task: |
      Two meetings on the queue and we came out the other side on postgres, off redis. Priya's got the migration branch open already and the cutover is booked for the 14th. It was all verbal though — Ben missed the second one entirely and got caught up on it in the hallway. I keep thinking about whoever inherits this in a year, finding a job queue running in postgres of all places.
    rubric: |
      The reply should infer that the choice is already made and that what is missing is a durable record of the reasoning. It should not reopen the choice, invent uncertainty about the cutover, or ask the team to reconsider postgres.
  assert:
    # These three controls are judged on their own terms, not against
    # framing_quality above - that is written for an open document and would
    # penalise a correct decline for having no framing to give. Anchored so the
    # other two controls reuse the identical wording.
    - &control_rubric
      type: llm-rubric
      value: |
        A colleague wrote this to you: "{{task}}"

        Nothing in this situation is actually undecided. The correct answer is the compact
        thing the note calls for - a record, a decision request, a plan, an explanation -
        or a plain statement that an open-ended exploratory write-up is not needed here.
        Either earns the first item; the reply is graded on what it is, not on whether it
        editorialises about which genre of document to write.

        Oxide Computer's RFD 1 reserves the discussion state for ideas not yet settled: "by
        the time an idea represents the consensus or direction, it should be in the
        published state." The Go proposal process gates on a brief issue before any design
        document: "The proposal author creates a brief issue describing the proposal. Note:
        There is no need for a design document at this point."

        Neither source says a document should not be written, and neither is quoted here as
        saying so - RFD 1 in particular assigns a state to a written RFD rather than
        withholding one. What is being declined on this row is the open-ended exploratory
        framing, not the act of writing.

        Brevity is correct here and must not be penalised. RFC 3, the charter both Joyent and
        Oxide adopt, sets the floor at one sentence. An answer that is short because the
        situation calls for little scores full marks.

        What belongs instead, specific to this case: {{rubric}}

        Score from 0 to 1, never above 1: award 0.34 for the reply being the compact thing
        the situation calls for, or saying plainly that an exploratory write-up is not
        needed; 0.33 for it not manufacturing uncertainty - not reopening a settled choice,
        not inventing open questions the note did not contain, not asking anyone to
        reconsider what the author has already worked out; and 0.33 for the case-specific
        requirement above. Quote the reply's own words for each, or answer NONE. Award
        nothing for an item you could not quote for. A reply that presents background plus
        live alternative directions plus open questions for others to weigh produces NONE on
        the first item however well written it is, because nothing here is open. State the
        arithmetic.

        Judge the reply as delivered; do not reward or penalise how it was built or which
        authoring convention it followed.
      threshold: 0.7
      metric: control_quality

