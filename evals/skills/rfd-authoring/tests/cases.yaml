      # RFD: how we run schema migrations

      Status: Discussion

      ## Background

      Migrations run in a maintenance window at 2am Sunday. The last one on `orders` locked the table for twenty-six minutes and we burned the window twice because the first attempt timed out. We are doing roughly one of these a month now and the on-call rota has noticed.

      ## Directions

