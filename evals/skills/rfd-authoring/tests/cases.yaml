      # RFD: getting events out of the monolith

      Status: Discussion

      ## Background

      The monolith writes about 40k events an hour into a table that three consumers poll. During the March sale, polling lag peaked at 4 minutes. We ran a Kafka spike last month and it handled the peak rate comfortably.

      ## Directions

      1. Kafka. Proven at our volume, the spike is already running, good tooling story, the team has read about it.
      2. Keep polling, add indexes. Doesn't fix the underlying problem.
      3. Postgres LISTEN/NOTIFY. Nobody here has run it in anger.

      ## Open questions

      - Any objections?

      ## Next step

      Spike the Kafka consumer for the order service next sprint.
    tells: |
      1. Only Kafka carries evidence - the spike that "handled the peak rate comfortably".
         Neither alternative was tested.
      2. Kafka gets a list of merits; the other two get one clause each.
      3. Both alternatives are disposed of by assertion ("Doesn't fix the underlying
         problem", "Nobody here has run it in anger") with no test named that would settle
         either.
      4. The next step is "Spike the Kafka consumer for the order service" - implementation
         of the favourite, not work that would decide between the three.
      5. The only open question is "Any objections?", which asks for assent rather than for
         anything that could change the outcome.
  assert:
    # This draft is the hard end of the range: it carries all five tells at once.
    # The three that follow carry two or three each, so the metric can report a
    # degree rather than a single all-or-nothing row. The tells are a per-case var
    # because they differ per draft; the arithmetic divides by however many this
    # draft actually has.
    - &finds_decision
      type: llm-rubric
      value: |
        A colleague sent this draft for review: "{{task}}"

        The draft declares itself open but has already chosen. Oxide Computer's RFD 1 rules
        that the discussion state "shouldn't be used for ideas that have been committed to,
        organizationally or otherwise; by the time an idea represents the consensus or
        direction, it should be in the published state." What is wrong here is that the
        declared openness does not match the actual commitment.

        House reading, not Oxide's - RFD 1 says nothing about RFCs: a draft naming a
        direction is not itself the fault, because the difference between an RFD and an RFC
        is which state the document is in, not which artifact it is.

        A review that says only that the draft "reads as decided", or that suggests softer
        wording, has found nothing: hedging the language would not fix any of the tells
        below. Identifying a tell means naming the specific text in the draft that shows it,
        not restating the tell in the abstract.

        The tells this particular draft carries, and no others, are:

        {{tells}}

        For each tell listed above, quote the review's own words identifying it, or answer
        NONE.

        Score from 0 to 1, never above 1: the number of listed tells you answered with a
        quote, divided by the number of tells listed. Then subtract 0.2 for each system,
        number or team the review names that appears in neither the draft nor the
        colleague's message, floored at 0. A review confined to wording, tone or structure
        identifies no tells and scores 0. State the count, the divisor and the arithmetic.
      threshold: 0.6
      metric: finds_the_decision

