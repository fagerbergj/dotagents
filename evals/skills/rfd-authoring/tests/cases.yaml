# Each task is how a colleague would actually write it - partial context, facts
# out of order, an aside or two. No task names an artifact, a section, or a
# rule, and none of them enumerate the directions: working out what is even on
# the table is part of what is graded.
#
# Seven exploratory cases share one assertion block (anchored on the first).
# Five negative controls cover the boundary the description draws - a decision
# already made, a change too small to discuss, a proposal ready for sign-off, an
# explanation of how something already works, and a mandate with no discretion.
# Six review cases cover the description's "and review" half: five drafts that
# hide a settled preference, and one that is honestly open. Both control_quality
# and finds_the_decision used to ride on three cases and one respectively, where
# run-to-run noise exceeds any delta they could report.

- description: ill-defined problem - CI slowdown with competing theories
  vars:
    task: |
      ok so CI. it was 9 minutes when i joined, i timed one this morning, 25. ben swears it's the integration suite, chidi reckons it's the shared runners, and someone was on about docker layer caching in standup. we also build three packages now where we used to build one, which nobody has mentioned. anyway ben and chidi are both off poking at this separately and i'm fairly sure they haven't spoken. can we get everyone looking at the same thing before one of them burns a sprint on the wrong end of it
    rubric: |
      The slowdown, the competing theories, and the two uncoordinated investigations are all present and concrete. More than one explanation is still genuinely live at the end of the document - not one cause asserted with the others noted and dropped.
  assert: &exploratory
    # Both graders are llm-rubric. g-eval scores each criterion in isolation,
    # which cannot carry the "quote the supporting text or answer NONE"
    # discipline these need, and its verdict regex silently zeroes a
    # pretty-printed reply.
    - type: llm-rubric
      value: |
        Judge only what the document says, never how it is laid out or which headings it
        uses. A document that does these things in flowing prose scores exactly as well as
        one with sections.

        The Joyent/MNX RFD process (github.com/TritonDataCenter/rfd, "Contents of an RFD")
        tells an author what an initial RFD should address, and RFC 3 - quoted as the RFD
        charter by both Joyent and Oxide - holds that "explicit questions without any
        attempted answers are all acceptable". For each of the five below, quote the
        supporting text from the document, or answer NONE:

        - The problem stated so that it is not, in Joyent's words, "described in terms of
          the solution": a reader can restate what is wrong without naming a fix.
        - The principles and constraints that bound any solution - what must stay true
          whichever direction is taken.
        - Who is affected and how they would notice: operators, users, developers, or
          whoever is currently absorbing the problem.
        - At least two directions still live at the end, or an explicit statement that the
          direction is unknown. A direction disposed of in a single clause is not live.
        - At least one explicit question whose answer would change what happens next,
          specific enough that a named person could answer it.

        Score from 0 to 1, never above 1: the number of the five genuinely present and
        supported by the colleague's note, divided by five. Any figure,
        identifier, system name, team name, or measurement in the document that does not
        appear in the colleague's note is invented, and each invention cancels one
        satisfied criterion. Do not credit a document for a section named after a
        criterion that it leaves empty.

        The colleague's note: "{{task}}"
        Situation-specific facts this document must carry: {{rubric}}
      threshold: 0.7
      metric: framing_quality
    - type: llm-rubric
      value: |
        Oxide Computer's RFD 1 rules that the prediscussion and discussion states
        "shouldn't be used for ideas that have been committed to, organizationally or
        otherwise; by the time an idea represents the consensus or direction, it should be
        in the published state." The colleague's note - "{{task}}" - describes a situation
        where no direction has been settled. Apply Oxide's rule to the document below.

        Ignore hedging vocabulary entirely. "We might", "one option is", "leaning towards",
        "nothing is decided yet" and "thoughts?" are not evidence that a document is open;
        the arrangement of the material is. For each of these five tells, quote the text
        that shows it, or answer NONE:

        1. Asymmetric evidence: one direction arrives with a benchmark, a spike, a
           prototype, a cost or a track record, and the others arrive with none.
        2. Asymmetric weight: one direction gets sustained treatment and the rest get a
           clause each.
        3. Disposal rather than assessment: a direction is ruled out by assertion, with no
           test, measurement or missing fact named that would settle it.
        4. The next step is implementation work on one direction, rather than work that
           would tell the reader which direction to take.
        5. The questions ask for assent rather than for information that could change the
           outcome.

        A document may legitimately name a direction if the colleague's note gives it
        grounds to. Score the five tells on whether the material is arranged to foreclose
        discussion, not on whether a direction appears. A document that names a direction,
        says what evidence would overturn it, and gives the alternatives a fair test avoids
        tells 1, 3 and 5.

        Score from 0 to 1, never above 1: 0.2 for each of the five tells the document
        avoids. A document showing three or more has chosen, whatever it says about itself.
      threshold: 0.6
      metric: stays_open

