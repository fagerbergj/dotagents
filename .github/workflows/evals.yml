name: Evals

# This repo IS the harness, so it calls the reusable workflow with an empty
# `harness-repo`: a PR changing evals/lib must be evaluated by the harness in
# that PR, not by the copy on main. Another repo omits that input and gets the
# published harness checked out for it instead.
#
# Everything else - detection, the approval gate, the matrix, the three-arm
# comparison, the PR comments - lives in .github/workflows/eval-suite.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'skills/**'
      - 'evals/**'

jobs:
  evals:
    uses: ./.github/workflows/eval-suite.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      harness-repo: ''
      environment: eval-approval
      # Kept as it was: these markers are what minimizeComment matches on, and
      # changing the prefix would orphan every comment already on an open PR.
      comment-prefix: dotagents-evals
      subject-template: 'skills/{suite}/SKILL.md'
      suites-dir: 'skills/{suite}/evals'
      api-key-envar: 'OPENROUTER_API_KEY'
    secrets:
      gateway-key: ${{ secrets.OPENROUTER_API_KEY }}
