name: lint

on:
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.py"
      - "**/*.sh"
      - ".oxlintrc.json"
      - "ruff.toml"
      - "mypy.ini"
      - ".shellcheckrc"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint touched JS/TS lines with Oxlint
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/${BASE_REF}"
          else
            base="HEAD~1"
          fi
          node .github/scripts/oxlint-diff.js "$base"

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Lint and typecheck Python files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/${BASE_REF}"
            git rev-parse --verify -q "$base" >/dev/null \
              || { echo "::error::cannot resolve $base; refusing to pass on an empty file list" >&2; exit 1; }
            git diff -z --name-only --diff-filter=ACMR "$base...HEAD" -- '*.py' > /tmp/lint-py.z
          else
            git ls-files -z -- '*.py' > /tmp/lint-py.z
          fi
          mapfile -t -d '' files < /tmp/lint-py.z
          echo "linting ${#files[@]} Python file(s)"
          if [ "${#files[@]}" -gt 0 ]; then
            uvx ruff@0.17.6 check "${files[@]}"
            uvx mypy@2.4.1 "${files[@]}"
          fi

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Lint shell scripts with ShellCheck
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/${BASE_REF}"
            git rev-parse --verify -q "$base" >/dev/null \
              || { echo "::error::cannot resolve $base; refusing to pass on an empty file list" >&2; exit 1; }
            git diff -z --name-only --diff-filter=ACMR "$base...HEAD" -- '*.sh' > /tmp/lint-sh.z
          else
            git ls-files -z -- '*.sh' > /tmp/lint-sh.z
          fi
          mapfile -t -d '' files < /tmp/lint-sh.z
          echo "linting ${#files[@]} shell script(s)"
          if [ "${#files[@]}" -gt 0 ]; then
            uvx --from shellcheck-py==0.11.0.1 shellcheck "${files[@]}"
          fi
